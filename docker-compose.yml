# 로컬 개발용 시장 시계열 DB
#
# 담당: 재일 (리서치/퀀트)
# 근거: docs/database/README.md 2절(저장소 분리), 7절(적용 방법)
#       docs/01-product/HEDGE_FUND_CORE_PLAN.md 413행 "배포: Docker Compose, CI"
#
# ▶ 이 파일은 로컬 개발 전용이다. 나중에 VPS/AWS로 옮길 때 같은 파일을 그대로 쓰고
#   ports 바인딩과 비밀번호만 환경에 맞게 바꾼다.
#
# ▶ 같은 머신의 다른 프로젝트(Trading_bot: compose 프로젝트 `trading`, 컨테이너 10개)와
#   충돌하지 않도록 아래를 전부 분리했다. 두 프로젝트의 DB를 절대 공유하지 않는다 —
#   Canonical Migration 계열이 다르므로 같은 DB에 얹으면 계약이 깨진다.
#
#     프로젝트 이름  hedgefund          (trading 과 분리)
#     컨테이너      hedgefund-*         (trading-* 과 분리)
#     호스트 포트    5434               (trading-timescaledb 가 5432, trading-postgres 가 5433)
#     볼륨          hedgefund_tsdb_data (named volume)
#     네트워크      hedgefund_default   (compose 가 자동 생성)
#
# ▶ 볼륨은 반드시 named volume이다. bind mount로 이 저장소 경로에 두면 안 된다 —
#   저장소가 OneDrive 동기화 대상이라 Postgres 데이터 디렉터리가 동기화되면 손상된다.
#
# 사용법
#   docker compose up -d
#   docker compose logs -f timescaledb
#   docker compose down            # 컨테이너만 제거, 데이터는 볼륨에 남는다
#   docker compose down -v         # 데이터까지 삭제
#
# 마이그레이션 적용 (docs/database/README.md 7절)
#   docker compose exec -T timescaledb \
#     psql -U postgres -d market -v ON_ERROR_STOP=1 < timescaledb/migrations/001_initial_market_data.sql

name: hedgefund

services:
  timescaledb:
    image: timescale/timescaledb-ha:pg17
    container_name: hedgefund-timescaledb
    restart: unless-stopped

    environment:
      POSTGRES_DB: market
      POSTGRES_PASSWORD: ${HEDGEFUND_TSDB_PASSWORD:?.env 에 HEDGEFUND_TSDB_PASSWORD 를 설정할 것}

    ports:
      # 127.0.0.1 바인딩 — 외부 노출 금지. 원격 호스트로 옮길 때도 이 원칙을 유지하고
      # 방화벽/사설망으로만 접근을 허용한다.
      - "127.0.0.1:5434:5432"

    volumes:
      - tsdb_data:/home/postgres/pgdata/data

    # ── 자원 격리 ──────────────────────────────────────────────────────────
    # Docker Desktop(Windows)은 모든 컨테이너를 단일 WSL2 VM 안에서 돌린다.
    # 따라서 CPU/RAM은 기본적으로 한 풀을 공유하며, 격리는 cgroup 상한으로 만든다.
    # 아래 값은 "이 컨테이너가 다른 프로젝트를 굶기지 않는다"를 보장한다.
    # 역방향 보호(다른 프로젝트가 우리를 굶기지 않기)는 그쪽에도 상한이 있어야 한다.
    #
    # 서버로 옮길 때는 cpuset 을 지우고 호스트 코어 수에 맞춰 cpus 만 조정한다.
    mem_limit: 4g              # 하드 상한. 초과 시 이 컨테이너만 OOM
    mem_reservation: 1g        # 소프트 보장 — 메모리 압박 시 커널이 우선 유지
    cpus: 2.0                  # 24코어 중 2코어 상당으로 제한
    cpuset: "22,23"            # 마지막 2코어에 핀 고정 (0~23 중)
    pids_limit: 512
    shm_size: 256mb            # 병렬 쿼리용 공유 메모리 (기본 64MB는 부족)

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d market"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── 상주형 뉴스 수집 (재일님 지시 2026-07-31: 수집기 컨테이너로 DB 즉시 적재) ──
  # NAVER 폴링 -> NewsSink -> Supabase(research.documents). 적재 지연은
  # research.news_ingest_latency(_hourly) View 로 확인한다.
  news-watcher:
    build:
      context: departments/01-research
    container_name: hedgefund-news-watcher
    restart: unless-stopped

    # ▶ env_file 로 .env 전체를 넣지 않는다 - LS·OpenAI 등 이 컨테이너가 쓸 일
    #   없는 Credential 까지 흘러든다. 필요한 것만 명시 주입한다.
    #   ${...} 값은 compose 가 저장소 루트 .env 에서 읽는다.
    environment:
      DATABASE_URL: ${DATABASE_URL:?.env 에 DATABASE_URL 이 필요하다}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:?.env 에 NAVER_CLIENT_ID 가 필요하다}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:?.env 에 NAVER_CLIENT_SECRET 이 필요하다}
      # 감시 종목은 watchlist_builder.py --basket 이 만든 파일이 기준이다
      # (코스피200 + 코스닥150 구성종목 - LS t1444 를 지수 업종코드 101/405 로 열거,
      #  재일님 지시 2026-07-31). 갱신: 호스트에서 --basket 후 up -d. 임시로 몇
      # 종목만 보려면 .env 의 NEWS_WATCH_SYMBOLS 가 파일보다 우선한다.
      NEWS_WATCH_SYMBOLS: ${NEWS_WATCH_SYMBOLS:-}
      NEWS_WATCH_SYMBOLS_FILE: config/news_watchlist.txt
      # 350종목 × 57회/일 = 19,950 < 한도의 90%(22,500). 종목이 많아 간격이 길다 -
      # 간격을 줄이려면 종목을 줄여야 한다(뉴스 지연은 NAVER 색인이 지배하므로
      # 넓은 커버리지 쪽이 남는 장사라는 판단).
      NEWS_POLL_INTERVAL_SECONDS: ${NEWS_POLL_INTERVAL_SECONDS:-1500}

    volumes:
      - ./departments/01-research/config:/app/departments/01-research/config:ro

    # 뉴스 폴링은 가볍다 - TimescaleDB 와 달리 상한을 좁게 잡는다
    mem_limit: 384m
    mem_reservation: 64m
    cpus: 0.5
    pids_limit: 64

    # SIGTERM 후 Sink 꼬리 Flush 가 끝날 시간을 준다 (기본 10초로도 충분하지만
    # DB 재시도 백오프와 겹칠 때를 위해 여유를 둔다)
    stop_grace_period: 30s

  # ── 상주형 LS 실시간 시세 수집 (재일님 지시 2026-07-31: 호가·체결도 Docker 로) ──
  # 컨테이너는 24시간, 소켓은 세션 창(동시호가 35분 전~마감 +10분)에서만 연다.
  # 구독은 뉴스와 같은 바스켓(코스피200+코스닥150 = 700구독)을 소켓 4개로 샤딩
  # (재일님 지시 "바스켓 종목만 구독" - 대규모 동시 구독은 krx-tick-collector 실증).
  ls-realtime:
    build:
      context: departments/01-research
    container_name: hedgefund-ls-realtime
    restart: unless-stopped
    command: ["python", "collectors/ls_realtime_service.py"]

    depends_on:
      timescaledb:
        condition: service_healthy

    environment:
      # Reference(세션·종목)는 Supabase, 시세 적재는 같은 compose 의 TimescaleDB.
      # 호스트의 127.0.0.1:5434 는 컨테이너 안에서 안 통한다 - 서비스 이름으로 간다.
      DATABASE_URL: ${DATABASE_URL:?.env 에 DATABASE_URL 이 필요하다}
      TIMESCALE_DATABASE_URL: postgresql://postgres:${HEDGEFUND_TSDB_PASSWORD:?}@timescaledb:5432/market
      LS_ENV: ${LS_ENV:-PAPER}
      LS_APP_KEY: ${LS_APP_KEY:-}
      LS_APP_SECRET_KEY: ${LS_APP_SECRET_KEY:-}
      LS_APP_KEY_PAPER: ${LS_APP_KEY_PAPER:-}
      LS_APP_SECRET_KEY_PAPER: ${LS_APP_SECRET_KEY_PAPER:-}
      LS_REST_BASE_URL: ${LS_REST_BASE_URL:-}
      LS_REST_BASE_URL_PAPER: ${LS_REST_BASE_URL_PAPER:-}
      LS_WS_BASE_URL: ${LS_WS_BASE_URL:-}
      LS_WS_BASE_URL_PAPER: ${LS_WS_BASE_URL_PAPER:-}
      LS_WATCH_SYMBOLS_FILE: config/news_watchlist.txt

    volumes:
      - ./departments/01-research/config:/app/departments/01-research/config:ro

    # 장중 140구독 스트림 - 뉴스보다 처리량이 크다
    mem_limit: 768m
    mem_reservation: 128m
    cpus: 1.0
    pids_limit: 64

    stop_grace_period: 30s

  # ── 배치 수집기 스케줄러 (재일님 지시 2026-07-31: 나머지 수집기도 컨테이너로) ──
  # 공시(10분)·Breadth(10분, 세션은 수집기가 판정)·관측 Calendar·거시·재무·CA·
  # 기업개황(각 일 1회)을 한 컨테이너가 순차 실행한다. 전부 멱등 적재라 재시작
  # 후 재실행이 안전하다. 주기 근거는 TEAM_JAEIL 가이드 3.1 표.
  batch-collectors:
    build:
      context: departments/01-research
    container_name: hedgefund-batch-collectors
    restart: unless-stopped
    command: ["python", "collectors/collector_scheduler.py"]

    depends_on:
      timescaledb:
        condition: service_healthy

    environment:
      DATABASE_URL: ${DATABASE_URL:?.env 에 DATABASE_URL 이 필요하다}
      TIMESCALE_DATABASE_URL: postgresql://postgres:${HEDGEFUND_TSDB_PASSWORD:?}@timescaledb:5432/market
      OPEN_DART_API_KEY: ${OPEN_DART_API_KEY:-}
      ECOS_API_KEY: ${ECOS_API_KEY:-}
      FRED_API_KEY: ${FRED_API_KEY:-}
      KOSIS_API_KEY: ${KOSIS_API_KEY:-}
      # Breadth(t1511/t8424)와 관측 Calendar(t8410)가 LS REST 를 쓴다
      LS_ENV: ${LS_ENV:-PAPER}
      LS_APP_KEY: ${LS_APP_KEY:-}
      LS_APP_SECRET_KEY: ${LS_APP_SECRET_KEY:-}
      LS_APP_KEY_PAPER: ${LS_APP_KEY_PAPER:-}
      LS_APP_SECRET_KEY_PAPER: ${LS_APP_SECRET_KEY_PAPER:-}
      LS_REST_BASE_URL: ${LS_REST_BASE_URL:-}
      LS_REST_BASE_URL_PAPER: ${LS_REST_BASE_URL_PAPER:-}

    mem_limit: 512m
    mem_reservation: 64m
    cpus: 0.5
    pids_limit: 64

    # 진행 중 Job(최대 30분 timeout)을 마치게 두진 않는다 - 어차피 멱등이라
    # 다음 주기가 이어받는다. 짧게 정리하고 내린다.
    stop_grace_period: 20s

  # ── research-api: Evidence 읽기 전용 조회면 (에이전트 배선의 시작점) ──
  # PIT(as_of) 기본, DB 세션 자체가 read-only. 뉴스/공시/재무 Evidence 를
  # LangGraph 직원 tool 이 여기서 읽는다 (DB 직접 접근 금지 - CLAUDE.md 원칙 1).
  research-api:
    build:
      context: departments/01-research
    container_name: hedgefund-research-api
    restart: unless-stopped
    working_dir: /app/departments/01-research/api
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8035"]

    environment:
      DATABASE_URL: ${DATABASE_URL:?.env 에 DATABASE_URL 이 필요하다}

    ports:
      - "127.0.0.1:8035:8035"   # 로컬 전용 - 외부 노출 금지

    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64

volumes:
  tsdb_data:
