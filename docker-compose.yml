# 로컬 개발용 시장 시계열 DB
#
# 담당: 재일 (리서치/퀀트)
# 근거: docs/database/README.md 2절(저장소 분리), 7절(적용 방법)
#       docs/01-product/HEDGE_FUND_CORE_PLAN.md 413행 "배포: Docker Compose, CI"
#
# ▶ 이 파일은 로컬 개발 전용이다. 나중에 VPS/AWS로 옮길 때 같은 파일을 그대로 쓰고
#   ports 바인딩과 비밀번호만 환경에 맞게 바꾼다.
#
# ▶ 같은 머신의 다른 프로젝트(Trading_bot: compose 프로젝트 `trading`, 컨테이너 10개)와
#   충돌하지 않도록 아래를 전부 분리했다. 두 프로젝트의 DB를 절대 공유하지 않는다 —
#   Canonical Migration 계열이 다르므로 같은 DB에 얹으면 계약이 깨진다.
#
#     프로젝트 이름  hedgefund          (trading 과 분리)
#     컨테이너      hedgefund-*         (trading-* 과 분리)
#     호스트 포트    5434               (trading-timescaledb 가 5432, trading-postgres 가 5433)
#     볼륨          hedgefund_tsdb_data (named volume)
#     네트워크      hedgefund_default   (compose 가 자동 생성)
#
# ▶ 볼륨은 반드시 named volume이다. bind mount로 이 저장소 경로에 두면 안 된다 —
#   저장소가 OneDrive 동기화 대상이라 Postgres 데이터 디렉터리가 동기화되면 손상된다.
#
# 사용법
#   docker compose up -d
#   docker compose logs -f timescaledb
#   docker compose down            # 컨테이너만 제거, 데이터는 볼륨에 남는다
#   docker compose down -v         # 데이터까지 삭제
#
# 마이그레이션 적용 (docs/database/README.md 7절)
#   docker compose exec -T timescaledb \
#     psql -U postgres -d market -v ON_ERROR_STOP=1 < timescaledb/migrations/001_initial_market_data.sql

name: hedgefund

# ▶ Compose Fragment 분리(계획서 10절, 2026-08-03) - "본부가 자기 Compose Fragment를
#   소유하도록 한다"는 목표 구조의 첫 단계다. 지금은 영주 소유 2개 부서(CEO Office, Agent
#   Workforce)만 옮겼다 - 남의 본부 서비스를 대신 옮기지 않는다(CLAUDE.md 원칙). 나머지
#   6개 부서는 각 담당자가 같은 방식으로 옮기면 된다. `include`된 파일도 이 파일의
#   서비스(redis 등)와 하나의 병합된 모델을 공유하므로 depends_on 등 상호 참조가 그대로 된다.
include:
  - departments/00-ceo-office/compose.yaml
  - departments/02-trading/compose.yaml
  - departments/05-accounting-portfolio/compose.yaml
  - departments/07-agent-workforce/compose.yaml

services:
  # Portfolio advisory API and worker share only the durable queue volume.
  # The API never embeds a worker by default; the worker owns queue claims.
  portfolio-bff:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: hedgefund-portfolio-bff
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      PYTHONPATH: /app:/app/apps/api
      ENABLE_AGENT_ASK: "true"
      ENABLE_KANBAN_TASK_TRACKING: "1"
      HERMES_BIN: /usr/local/bin/hermes
      HERMES_HOME: /opt/hermes-cli
      HERMES_KANBAN_HOME: /opt/kanban
      HERMES_KANBAN_DB: /opt/kanban/kanban.db
      HERMES_CEO_API_URL: http://ceo-hermes:8642/v1
      HERMES_CEO_API_KEY: ${CEO_HERMES_API_KEY:-}
      # Canonical operational/control PostgreSQL connection only. Supabase Auth,
      # browser login, OAuth, user sessions, and bearer-user tokens are unsupported.
      DATABASE_URL: ${DATABASE_URL:?.env needs the private operational PostgreSQL DATABASE_URL}
      ACCOUNTING_DATABASE_POOL_MAX: ${ACCOUNTING_DATABASE_POOL_MAX:-8}
      MEMOHARNESS_D5_MODE: ${MEMOHARNESS_D5_MODE:-active}
      # D5 is a private operational experience bank, not Supabase Auth and
      # not the browser application's general DATABASE_URL.
      MEMOHARNESS_D5_DATABASE_URL: ${MEMOHARNESS_D5_DATABASE_URL:-postgresql://hgfinance_runtime:${HEDGEFUND_RUNTIME_DB_PASSWORD:?HEDGEFUND_RUNTIME_DB_PASSWORD is required}@timescaledb:5432/${HEDGEFUND_CONTROL_DB_NAME:-control}}
      MEMOHARNESS_D5_TOP_K: ${MEMOHARNESS_D5_TOP_K:-5}
      MEMOHARNESS_D5_STATEMENT_TIMEOUT_MS: ${MEMOHARNESS_D5_STATEMENT_TIMEOUT_MS:-1500}
      CONDITIONAL_RULE_DATABASE_URL: ${CONDITIONAL_RULE_DATABASE_URL:-${DATABASE_URL:-}}
      CONDITIONAL_RULE_DATABASE_ROLE: ${CONDITIONAL_RULE_DATABASE_ROLE:-svc_conditional_rule_orchestrator}
      PORTFOLIO_DATA_MODE: "test"
      # AI Office uses the fixed closed-network demo identity.
      APP_ENV: local
      PORTFOLIO_AUTH_MODE: fixture
      PORTFOLIO_AUTH_REQUIRED: "false"
      PORTFOLIO_LIVE_MODE: broker
      PORTFOLIO_FIXTURE_TRADING_BOOKS_JSON: ${PORTFOLIO_FIXTURE_TRADING_BOOKS_JSON:-[]}
      # Local mock-investment UI is read-only. No user-login or paper-order
      # workflow is enabled in this Compose profile.
      USER_PAPER_ORDER_WORKFLOW_ENABLED: "false"
      USER_PAPER_ORDER_DETERMINISTIC_FAST_PATH_ENABLED: "false"
      ACCOUNTING_MODE: OFFLINE
      PORTFOLIO_CORS_ALLOW_ORIGINS: ${PORTFOLIO_CORS_ALLOW_ORIGINS:-}
      PORTFOLIO_RUNTIME_STORE_PATH: /var/lib/portfolio/runtime.sqlite3
      PORTFOLIO_RUNTIME_EMBEDDED_WORKER: "false"
      PORTFOLIO_WORKER_RUNTIME: ${PORTFOLIO_WORKER_RUNTIME:-ollama}
      # Optional shared Qwen Worker model plane. When WORKER_MODEL_BASE_URL
      # is present, the Worker Model Gateway takes precedence over the local
      # Ollama fallback; Hermes remains the department-head boundary.
      WORKER_MODEL_BASE_URL: ${WORKER_MODEL_BASE_URL:-}
      WORKER_MODEL_EXECUTION_CONTEXT: container
      WORKER_MODEL_NAME: ${WORKER_MODEL_NAME:-qwen2.5-14b-instruct-awq}
      WORKER_MODEL_API_KEY: ${WORKER_MODEL_API_KEY:-vllm}
      WORKER_MODEL_TIMEOUT_SECONDS: ${WORKER_MODEL_TIMEOUT_SECONDS:-120}
      WORKER_MODEL_REGISTRY_PATH: ${WORKER_MODEL_REGISTRY_PATH:-/app/departments/01-research/config/worker_model_registry.json}
      # Optional metadata-only LangSmith root observation.  The BFF already
      # carries the SDK transitively through LangGraph; this wiring does not
      # change CEO/Kanban or execution control flow.
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-First}
      LANGSMITH_METRICS_PROJECT: ${LANGSMITH_METRICS_PROJECT:-HgFinance-Metrics}
      LANGSMITH_EVALS_PROJECT: ${LANGSMITH_EVALS_PROJECT:-HgFinance-Evals}
      # Feedback evaluation is background-only.  `shadow` publishes redacted
      # findings to Evals; only `active` permits QA-approved bounded hints to
      # reach a later CEO planning request.
      LANGSMITH_FEEDBACK_MODE: ${LANGSMITH_FEEDBACK_MODE:-shadow}
      LANGSMITH_FEEDBACK_STATE_PATH: /var/lib/portfolio/langsmith-feedback.sqlite3
      PORTFOLIO_GOVERNANCE_BINDING_ENABLED: ${PORTFOLIO_GOVERNANCE_BINDING_ENABLED:-false}
      # 기본값이 비어 있으면 온보딩 프록시(/ui/mandates, /ui/mandate-assistant/suggest
      # 등)가 전부 503 governance_api_unavailable 이 된다. governance-api 는 같은
      # compose 에 있으므로 서비스 이름을 기본값으로 준다.
      GOVERNANCE_API_URL: ${GOVERNANCE_API_URL:-http://governance-api:8000}
      GOVERNANCE_API_TIMEOUT_SECONDS: ${GOVERNANCE_API_TIMEOUT_SECONDS:-30}
      GOVERNANCE_API_AUTH_TOKEN: ${GOVERNANCE_API_AUTH_TOKEN:-}
      # InvestorProfile 프록시(/ui/investor-profiles)가 부르는 accounting-api.
      # 비어 있으면 503 portfolio_api_unavailable 이다(인메모리 후퇴 없음).
      PORTFOLIO_API_URL: ${PORTFOLIO_API_URL:-http://accounting-api:8000}
      # Browser user directives terminate here. Only a short payload-bound
      # proof is sent to trading-api; no browser login token exists or is relayed.
      TRADING_API_URL: ${TRADING_API_URL:-http://trading-api:8000}
      TRADING_SERVICE_AUTH_SECRET: ${TRADING_SERVICE_AUTH_SECRET:?A 32-byte trading service proof secret is required}
      TRADING_SERVICE_AUTH_ISSUER: ${TRADING_SERVICE_AUTH_ISSUER:-portfolio-bff}
      TRADING_SERVICE_AUTH_AUDIENCE: ${TRADING_SERVICE_AUTH_AUDIENCE:-trading-api}
      # CEO Web/Discord mirror uses the existing Redis service. Keep the
      # durable request/event store on the canonical production BFF.
      CEO_DISCORD_INGRESS_API_KEY: ${CEO_DISCORD_INGRESS_API_KEY:?CEO_DISCORD_INGRESS_API_KEY is required}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      UI_MIRROR_REDIS_URL: ${UI_MIRROR_REDIS_URL:-}
      UI_MIRROR_STREAM: ${UI_MIRROR_STREAM:-hf:ui-ceo-mirror:v1}
      UI_MIRROR_DEDUPE_TTL_SECONDS: ${UI_MIRROR_DEDUPE_TTL_SECONDS:-604800}
      UI_MIRROR_DEDUPE_WAIT_SECONDS: ${UI_MIRROR_DEDUPE_WAIT_SECONDS:-3}
      UI_MIRROR_SSE_SECONDS: ${UI_MIRROR_SSE_SECONDS:-25}
      # These are the internal read/proxy endpoints used by apps.api.main.
      # The production portfolio BFF stays on the pinned Hermes CLI/local
      # boundary above; it does not inherit ui-bff's Docker-exec transport.
      MARKET_API_URL: ${MARKET_API_URL:-http://market-api:8036}
      RESEARCH_API_URL: ${RESEARCH_API_URL:-http://research-api:8035}
      RISK_API_URL: ${RISK_API_URL:-http://risk-api:8000}
      # Inside the compose network, loopback points back to portfolio-bff.
      # Keep the host/local override separate so QA observability reaches the
      # canonical audit-api service in production.
      QA_API_URL: ${QA_API_INTERNAL_URL:-http://audit-api:8000}
      QA_API_AUTH_TOKEN: ${QA_API_AUTH_TOKEN:-}
      # HR 유휴 Worker 관측(GET /ui/workforce/idle-agents) 프록시 대상.
      # workforce.py 기본값(http://127.0.0.1:8044)은 호스트 2-프로세스 로컬
      # 구성 전용이다 - 이 컨테이너 안에서는 자기 자신을 가리켜 connection
      # refused 가 난다(risk-api/audit-api 와 같은 실수, 바로 위 주석 참고).
      # workforce-api 는 이 파일의 include(departments/07-agent-workforce/
      # compose.yaml)로 같은 네트워크에 있고, 컨테이너 내부 포트는 8000이다.
      WORKFORCE_API_URL: ${WORKFORCE_API_URL:-http://workforce-api:8000}
      # 페이퍼 전략 컨테이너 상태·전원. docker 소켓은 이 서비스가 아니라
      # `strategy-runtime-control` sidecar가 쥔다(그 서비스 정의 주석 참고).
      STRATEGY_RUNTIME_API_URL: ${STRATEGY_RUNTIME_API_URL:-http://strategy-runtime-control:8000}
      KANBAN_ATTACH_ROOT: /opt/kanban/kanban/attachments
      KANBAN_WORKSPACE_ROOT: /opt/kanban/kanban/workspaces
      # Discord 연동(2026-08-18). 셋 다 비어 있으면 관련 기능만 조용히 꺼지고
      # CEO 질의 자체는 그대로 동작한다 - Discord 장애/미설정이 질의 접수를
      # 막지 않는다는 정책(apps/api/discord_mirror.py 머리말).
      #   토큰: 읽기(apps/api/discord_read.py) + 미러 게시(discord_mirror.py) 공용.
      #         값은 .env에만 두고 이 파일·프론트 번들·이벤트 payload에 넣지 않는다.
      # 미러 게시 opt-in. 기본 꺼짐 - 토큰이 환경에 있다는 이유만으로 팀 채널에
      # 글을 쓰지 않는다(2026-08-18: 테스트가 실제 채널에 글을 쓴 사고).
      DISCORD_MIRROR_ENABLED: ${DISCORD_MIRROR_ENABLED:-false}
      DISCORD_BOT_TOKEN_CEO: ${DISCORD_BOT_TOKEN_CEO:-}
      # Department Agent Logs are read through this BFF as well.  Keep every
      # department bot token server-side; the browser receives normalized
      # messages only and never receives a token.
      DISCORD_BOT_TOKEN_HR: ${DISCORD_BOT_TOKEN_HR:-}
      DISCORD_BOT_TOKEN_RESEARCH: ${DISCORD_BOT_TOKEN_RESEARCH:-}
      DISCORD_BOT_TOKEN_QUANT: ${DISCORD_BOT_TOKEN_QUANT:-}
      DISCORD_BOT_TOKEN_ACCOUNTING: ${DISCORD_BOT_TOKEN_ACCOUNTING:-}
      DISCORD_BOT_TOKEN_TRADING: ${DISCORD_BOT_TOKEN_TRADING:-}
      DISCORD_BOT_TOKEN_RISK: ${DISCORD_BOT_TOKEN_RISK:-}
      DISCORD_BOT_TOKEN_QA: ${DISCORD_BOT_TOKEN_QA:-}
      DISCORD_CEO_CHANNEL_ID: ${DISCORD_CEO_CHANNEL_ID:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      DISCORD_ACTOR_MAP: ${DISCORD_ACTOR_MAP:-}
      # LS 브로커 조회 배선(2026-08-19). `.env`는 `.dockerignore`에 걸려 이미지에
      # 들어가지 않으므로 apps/api/main.py의 load_dotenv가 컨테이너 안에서는
      # 아무것도 읽지 못한다 - 여기 나열한 키만 프로세스에 도달한다.
      # 계좌 스트림은 ENABLE_LS_ORDER_EVENTS, 원장 REST 조회는
      # ENABLE_LS_ACCOUNT_DATA, 시장 순위 REST 조회는 ENABLE_LS_MARKET_DATA로
      # 각각 켠다. 모두 읽기 전용이며 주문은 나가지 않는다.
      ENABLE_LS_ORDER_EVENTS: "true"
      # Read-only broker account snapshot. Keep this independent from order
      # event ingestion so enabling a balance view never enables execution.
      ENABLE_BROKER_SNAPSHOT: "true"
      BROKER_SNAPSHOT_CACHE_SECONDS: ${BROKER_SNAPSHOT_CACHE_SECONDS:-10}
      ENABLE_LS_MARKET_DATA: "true"
      ENABLE_LS_ACCOUNT_DATA: "true"
      # portfolio-bff owns read-only market/account observations. PAPER order
      # execution is isolated behind Trading's separately authenticated lane.
      LS_ENV: PAPER
      LS_APP_KEY: ${LS_APP_KEY:-}
      LS_APP_SECRET_KEY: ${LS_APP_SECRET_KEY:-}
      LS_REST_BASE_URL: ${LS_REST_BASE_URL:-}
      LS_WS_BASE_URL: ${LS_WS_BASE_URL:-}
      LS_ACCOUNT_NO: ${LS_ACCOUNT_NO:-}
      LS_ACCOUNT_PWD: ${LS_ACCOUNT_PWD:-}
      LS_APP_KEY_PAPER: ${LS_APP_KEY_PAPER:-}
      LS_APP_SECRET_KEY_PAPER: ${LS_APP_SECRET_KEY_PAPER:-}
      LS_REST_BASE_URL_PAPER: ${LS_REST_BASE_URL_PAPER:-}
      LS_WS_BASE_URL_PAPER: ${LS_WS_BASE_URL_PAPER:-}
      LS_ACCOUNT_NO_PAPER: ${LS_ACCOUNT_NO_PAPER:-}
      LS_ACCOUNT_PWD_PAPER: ${LS_ACCOUNT_PWD_PAPER:-}
      LS_MAC_ADDRESS: ${LS_MAC_ADDRESS:-}
      LS_OAUTH_SCOPE: ${LS_OAUTH_SCOPE:-oob}
      # 회계 원장 durable 저장소. 체결일과 결제일(T+2) 사이에는 어떤 브로커
      # 조회로도 그 거래를 다시 못 가져오므로, 컨테이너와 함께 사라지지 않도록
      # 아래 portfolio_runtime_data 볼륨 안에 둔다(상대경로 금지).
      ACCOUNTING_LEDGER_DB: /var/lib/portfolio/accounting_ledger.sqlite3
      # Langfuse(2026-08-10 도입, 993682f). 이 컨테이너가 llm.performance.metric
      # 이벤트를 **쓰는** 쪽이다 - HR(workforce-api)이 같은 자격증명으로 읽는다.
      # `.env`는 .dockerignore에 걸려 이미지에 안 들어가므로 여기 나열한 키만
      # 프로세스에 도달한다. LANGFUSE_TRACING=false면 계측만 조용히 꺼지고
      # 파이프라인은 그대로 돈다(orchestration/llm_observability.py lazy import).
      LANGFUSE_TRACING: ${LANGFUSE_TRACING:-false}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
    volumes:
      - portfolio_runtime_data:/var/lib/portfolio
      # BFF uses Hermes CLI only for the repository-owned Kanban create
      # boundary. CEO profile/auth stays inside ceo-hermes and is never
      # mounted here; the BFF has no gateway command or full ~/.hermes view.
      - /home/ubuntu/.hermes/shared-kanban:/opt/kanban
    ports:
      - "${PORTFOLIO_BFF_PORT:-8001}:8000"
    # ai-office는 `depends_on: portfolio-bff: condition: service_healthy`로
    # 이 컨테이너가 실제로 요청을 받을 수 있을 때까지 기다린다. 여기 healthcheck가
    # 없으면 그 조건이 성립할 수 없어(2026-08-24) ai-office가 FastAPI 앱의
    # DB 연결이 끝나기 전에 붙어 `/bff/*` 프록시 요청이 순간적으로 500을 본다.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # The browser SSE endpoint remains a low-latency read path, but it is not
  # allowed to be the only producer of workflow events. This reconciler reads
  # the same Kanban board and writes through the same idempotent projection
  # function, so a disconnected browser cannot leave CEO_FINAL missing.
  ceo-mirror-projection-worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: hedgefund-ceo-mirror-projection-worker
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    user: "1000:1000"
    command: ["python", "-m", "apps.api.ceo_mirror_projection_worker"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      PYTHONPATH: /app:/app/apps/api
      HERMES_BIN: /usr/local/bin/hermes
      # Projection only reads the shared Kanban board. Keep it away from the
      # BFF's credential-bearing Hermes home; this also makes the non-root
      # reconciler independent of a root-owned .env file.
      HERMES_HOME: /tmp/hermes-cli
      HERMES_KANBAN_HOME: /opt/kanban
      HERMES_KANBAN_DB: /opt/kanban/kanban.db
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      UI_MIRROR_REDIS_URL: ${UI_MIRROR_REDIS_URL:-${REDIS_URL:-redis://redis:6379/0}}
      UI_MIRROR_STREAM: ${UI_MIRROR_STREAM:-hf:ui-ceo-mirror:v1}
      UI_MIRROR_PROJECTION_BATCH_SIZE: ${UI_MIRROR_PROJECTION_BATCH_SIZE:-2}
      UI_MIRROR_PROJECTION_POLL_SECONDS: ${UI_MIRROR_PROJECTION_POLL_SECONDS:-5}
    volumes:
      - /home/ubuntu/.hermes/shared-kanban:/opt/kanban
    healthcheck:
      test: ["CMD", "python", "-m", "apps.api.ceo_mirror_projection_worker", "--healthcheck"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 20s

  # Trusted, internal-only bridge from the Trading Hermes interpretation to
  # authenticated PAPER directive admission. Hermes receives only the MCP
  # bearer key; database and payload-proof credentials stay in this process.
  paper-order-orchestrator-mcp:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: hedgefund-paper-order-orchestrator-mcp
    restart: unless-stopped
    depends_on:
      trading-api:
        condition: service_healthy
    # Match the shared Kanban owner's uid. Even `kanban show` initializes WAL;
    # running it as root would strand root-owned sidecars for department agents.
    user: "1000:1000"
    command: ["python", "-m", "apps.api.paper_order_mcp"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      PYTHONPATH: /app:/app/apps/api
      APP_ENV: ${AI_OFFICE_APP_ENV:-local}
      PORTFOLIO_DATA_MODE: "production"
      PORTFOLIO_AUTH_MODE: fixture
      PORTFOLIO_FIXTURE_TRADING_BOOKS_JSON: ${PORTFOLIO_FIXTURE_TRADING_BOOKS_JSON:-[]}
      DATABASE_URL: ${DATABASE_URL:?.env needs the private operational PostgreSQL DATABASE_URL}
      ORDER_ORCHESTRATOR_DATABASE_ROLE: ${ORDER_ORCHESTRATOR_DATABASE_ROLE:-svc_order_orchestrator}
      CONDITIONAL_RULE_DATABASE_URL: ${CONDITIONAL_RULE_DATABASE_URL:-${DATABASE_URL:-}}
      CONDITIONAL_RULE_DATABASE_ROLE: ${CONDITIONAL_RULE_DATABASE_ROLE:-svc_conditional_rule_orchestrator}
      TRADING_API_URL: ${TRADING_API_URL:-http://trading-api:8000}
      TRADING_SERVICE_AUTH_SECRET: ${TRADING_SERVICE_AUTH_SECRET:?A 32-byte trading service proof secret is required}
      TRADING_SERVICE_AUTH_ISSUER: ${TRADING_SERVICE_AUTH_ISSUER:-portfolio-bff}
      TRADING_SERVICE_AUTH_AUDIENCE: ${TRADING_SERVICE_AUTH_AUDIENCE:-trading-api}
      MCP_TRADING_ORDER_API_KEY: ${MCP_TRADING_ORDER_API_KEY:?A generated 32-byte PAPER-order MCP key is required}
      HERMES_BIN: /usr/local/bin/hermes
      HERMES_HOME: /tmp/hermes-cli
      HERMES_KANBAN_HOME: /opt/kanban
      HERMES_KANBAN_DB: /opt/kanban/kanban.db
    volumes:
      # Application code exposes only `kanban show` for scope validation. The
      # pinned Hermes CLI nevertheless auto-runs init_db/WAL setup before every
      # subcommand, so the filesystem mount itself cannot be read-only.
      - /home/ubuntu/.hermes/shared-kanban:/opt/kanban
    expose:
      - "8046"
    healthcheck:
      test: ["CMD", "python", "-m", "apps.api.paper_order_mcp", "--healthcheck"]
      interval: 10s
      timeout: 8s
      retries: 5
      start_period: 20s
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 96

  # Confirmed conditional rules are evaluated outside Hermes and outside the
  # always-on research factory. The worker owns no browser token, broker key,
  # or USER_DIRECTIVE database privilege; it can only claim rule rows and call
  # Trading's separately authenticated conditional execution endpoint.
  conditional-rule-worker:
    build:
      context: .
      dockerfile: Dockerfile.conditional-rule-worker
    container_name: hedgefund-conditional-rule-worker
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
      trading-api:
        condition: service_healthy
      market-api:
        condition: service_started
    command: ["python", "-m", "apps.api.conditional_rule_worker"]
    environment:
      PYTHONPATH: /app:/app/apps/api
      APP_ENV: ${APP_ENV:-production}
      CONDITIONAL_RULE_DATABASE_URL: ${CONDITIONAL_RULE_DATABASE_URL:-${DATABASE_URL:-}}
      CONDITIONAL_RULE_WORKER_DATABASE_ROLE: ${CONDITIONAL_RULE_WORKER_DATABASE_ROLE:-svc_conditional_rule_worker}
      TRADING_API_URL: ${TRADING_API_URL:-http://trading-api:8000}
      MARKET_API_URL: ${MARKET_API_URL:-http://market-api:8036}
      # ls-realtime owns the single LS WebSocket and writes canonical ticks to
      # TimescaleDB.  The conditional worker reads that shared stream by
      # instrument_id; it does not open one broker connection per rule.
      CONDITIONAL_RULE_MARKET_DATABASE_URL: ${CONDITIONAL_RULE_MARKET_DATABASE_URL:-postgresql://postgres:${HEDGEFUND_TSDB_PASSWORD:?HEDGEFUND_TSDB_PASSWORD is required}@timescaledb:5432/market}
      CONDITIONAL_RULE_MARKET_CONNECT_TIMEOUT_SECONDS: ${CONDITIONAL_RULE_MARKET_CONNECT_TIMEOUT_SECONDS:-2}
      CONDITIONAL_RULE_MARKET_STATEMENT_TIMEOUT_MS: ${CONDITIONAL_RULE_MARKET_STATEMENT_TIMEOUT_MS:-1500}
      CONDITIONAL_RULE_MARKET_MAX_CONNECTIONS: ${CONDITIONAL_RULE_MARKET_MAX_CONNECTIONS:-8}
      TRADING_INTERNAL_SERVICE_AUTH_SECRET: ${TRADING_INTERNAL_SERVICE_AUTH_SECRET:?A separate 32-byte internal Trading auth secret is required}
      TRADING_INTERNAL_SERVICE_AUTH_ISSUER: ${TRADING_INTERNAL_SERVICE_AUTH_ISSUER:-hedgefund-service-issuer}
      TRADING_INTERNAL_SERVICE_AUTH_AUDIENCE: ${TRADING_INTERNAL_SERVICE_AUTH_AUDIENCE:-trading-api}
      CONDITIONAL_RULE_WORKER_POLL_SECONDS: ${CONDITIONAL_RULE_WORKER_POLL_SECONDS:-1.0}
      CONDITIONAL_RULE_WORKER_BATCH_SIZE: ${CONDITIONAL_RULE_WORKER_BATCH_SIZE:-100}
      CONDITIONAL_RULE_WORKER_MAX_WORKERS: ${CONDITIONAL_RULE_WORKER_MAX_WORKERS:-8}
      CONDITIONAL_RULE_HTTP_TIMEOUT_SECONDS: ${CONDITIONAL_RULE_HTTP_TIMEOUT_SECONDS:-8}
      # Conditional price reads are PAPER-only and use the existing LS
      # read-only t1102 adapter. Missing credentials fail closed per rule.
      LS_ENV: PAPER
      LS_APP_KEY_PAPER: ${LS_APP_KEY_PAPER:-}
      LS_APP_SECRET_KEY_PAPER: ${LS_APP_SECRET_KEY_PAPER:-}
      LS_REST_BASE_URL_PAPER: ${LS_REST_BASE_URL_PAPER:-}
      LS_REST_BASE_URL: ${LS_REST_BASE_URL:-}
    healthcheck:
      test: ["CMD", "python", "-m", "apps.api.conditional_rule_worker", "--healthcheck"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 20s
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 96

  # Transactional conditional-rule events are published only after the rule
  # state transition commits. Redis is the delivery stream; event_id is the
  # consumer idempotency key, so a crash between Redis and PostgreSQL commits
  # remains at-least-once rather than silently losing an audit event.
  conditional-rule-outbox-relay:
    build:
      context: .
      dockerfile: Dockerfile.conditional-rule-worker
    container_name: hedgefund-conditional-rule-outbox-relay
    restart: unless-stopped
    init: true
    depends_on:
      redis:
        condition: service_healthy
    command: ["python", "-m", "apps.api.conditional_rule_outbox_relay"]
    environment:
      PYTHONPATH: /app
      APP_ENV: ${APP_ENV:-production}
      CONDITIONAL_RULE_DATABASE_URL: ${CONDITIONAL_RULE_OUTBOX_DATABASE_URL:-${CONDITIONAL_RULE_DATABASE_URL:-${DATABASE_URL:-}}}
      CONDITIONAL_RULE_WORKER_DATABASE_ROLE: ${CONDITIONAL_RULE_WORKER_DATABASE_ROLE:-svc_conditional_rule_worker}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CONDITIONAL_RULE_EVENT_STREAM: ${CONDITIONAL_RULE_EVENT_STREAM:-hf:conditional-rule-events:v1}
      CONDITIONAL_RULE_EVENT_STREAM_MAXLEN: ${CONDITIONAL_RULE_EVENT_STREAM_MAXLEN:-10000}
      CONDITIONAL_RULE_OUTBOX_POLL_SECONDS: ${CONDITIONAL_RULE_OUTBOX_POLL_SECONDS:-1}
      CONDITIONAL_RULE_OUTBOX_BATCH_SIZE: ${CONDITIONAL_RULE_OUTBOX_BATCH_SIZE:-100}
    healthcheck:
      test: ["CMD", "python", "-m", "apps.api.conditional_rule_outbox_relay", "--healthcheck"]
      interval: 15s
      # The small image is CPU-capped and imports the shared deterministic
      # rule package before the check runs; eight seconds made a healthy DB
      # boundary report unhealthy during cold-start.
      timeout: 30s
      retries: 5
      start_period: 30s
    mem_limit: 128m
    mem_reservation: 32m
    cpus: 0.1

  # Missing adapter only: consumes the existing conditional outbox stream,
  # re-reads the existing Trading directive API, and calls the existing
  # Discord/Kanban/Notion projection owners. It owns no bot or execution state.
  conditional-rule-notification-consumer:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: hedgefund-conditional-rule-notification-consumer
    restart: unless-stopped
    init: true
    user: "1000:1000"
    depends_on:
      redis:
        condition: service_healthy
      trading-api:
        condition: service_healthy
    command: ["python", "-m", "apps.api.conditional_rule_notification_consumer"]
    environment:
      PYTHONPATH: /app:/app/apps/api
      APP_ENV: ${APP_ENV:-production}
      PORTFOLIO_AUTH_MODE: ${PORTFOLIO_AUTH_MODE:-fixture}
      PORTFOLIO_AUTH_REQUIRED: ${PORTFOLIO_AUTH_REQUIRED:-false}
      PORTFOLIO_FIXTURE_TRADING_BOOKS_JSON: ${PORTFOLIO_FIXTURE_TRADING_BOOKS_JSON:-[]}
      DATABASE_URL: ${DATABASE_URL:-}
      ORDER_ORCHESTRATOR_DATABASE_URL: ${ORDER_ORCHESTRATOR_DATABASE_URL:-${DATABASE_URL:-}}
      ORDER_ORCHESTRATOR_DATABASE_ROLE: ${ORDER_ORCHESTRATOR_DATABASE_ROLE:-svc_order_orchestrator}
      CONDITIONAL_RULE_DATABASE_URL: ${CONDITIONAL_RULE_NOTIFICATION_DATABASE_URL:-${CONDITIONAL_RULE_WORKER_DATABASE_URL:-${CONDITIONAL_RULE_DATABASE_URL:-${DATABASE_URL:-}}}}
      CONDITIONAL_RULE_WORKER_DATABASE_ROLE: ${CONDITIONAL_RULE_WORKER_DATABASE_ROLE:-svc_conditional_rule_worker}
      TRADING_API_URL: ${TRADING_API_URL:-http://trading-api:8000}
      TRADING_SERVICE_AUTH_SECRET: ${TRADING_SERVICE_AUTH_SECRET:?A 32-byte trading service proof secret is required}
      TRADING_SERVICE_AUTH_ISSUER: ${TRADING_SERVICE_AUTH_ISSUER:-portfolio-bff}
      TRADING_SERVICE_AUTH_AUDIENCE: ${TRADING_SERVICE_AUTH_AUDIENCE:-trading-api}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CONDITIONAL_RULE_EVENT_STREAM: ${CONDITIONAL_RULE_EVENT_STREAM:-hf:conditional-rule-events:v1}
      CONDITIONAL_RULE_NOTIFICATION_GROUP: ${CONDITIONAL_RULE_NOTIFICATION_GROUP:-conditional-paper-reporting-v1}
      CONDITIONAL_RULE_PROJECTION_GROUP: ${CONDITIONAL_RULE_PROJECTION_GROUP:-conditional-paper-projection-v1}
      CONDITIONAL_RULE_NOTIFICATION_RETRY_MS: ${CONDITIONAL_RULE_NOTIFICATION_RETRY_MS:-2000}
      HERMES_BIN: /usr/local/bin/hermes
      HERMES_HOME: /opt/data
      HERMES_KANBAN_HOME: /opt/kanban
      HERMES_KANBAN_DB: /opt/kanban/kanban.db
      NOTION_TOKEN: ${NOTION_TOKEN:-}
      NOTION_CEO_DB: ${NOTION_CEO_DB:-}
      NOTION_TRADING_DB: ${NOTION_TRADING_DB:-}
      # Reuse the existing redacted workflow trace and feedback projects. The
      # consumer emits only bounded semantic-QA metadata, never answer text.
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-First}
      LANGSMITH_METRICS_PROJECT: ${LANGSMITH_METRICS_PROJECT:-HgFinance-Metrics}
      LANGSMITH_EVALS_PROJECT: ${LANGSMITH_EVALS_PROJECT:-HgFinance-Evals}
    volumes:
      - /home/ubuntu/.hermes:/opt/data
      - /home/ubuntu/.hermes/shared-kanban:/opt/kanban
    healthcheck:
      test: ["CMD", "python", "-m", "apps.api.conditional_rule_notification_health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: 256m
    mem_reservation: 64m
    cpus: 0.25
    pids_limit: 96

  # Conditional-rule retention is isolated from the hot evaluator.  It only
  # deletes terminal audit detail after the configured grace periods; active
  # rules and executions linked to PAPER directives are never touched.
  conditional-rule-retention-worker:
    build:
      context: .
      dockerfile: Dockerfile.conditional-rule-worker
    container_name: hedgefund-conditional-rule-retention-worker
    restart: unless-stopped
    init: true
    depends_on:
      timescaledb:
        condition: service_healthy
    command: ["python", "-m", "apps.api.conditional_rule_retention"]
    environment:
      PYTHONPATH: /app
      APP_ENV: ${APP_ENV:-production}
      CONDITIONAL_RULE_RETENTION_DATABASE_URL: ${CONDITIONAL_RULE_RETENTION_DATABASE_URL:-${CONDITIONAL_RULE_DATABASE_URL:-${DATABASE_URL:-}}}
      CONDITIONAL_RULE_RETENTION_DATABASE_ROLE: svc_conditional_rule_worker
      CONDITIONAL_RULE_RETENTION_ENABLED: ${CONDITIONAL_RULE_RETENTION_ENABLED:-true}
      CONDITIONAL_RULE_RETENTION_INTERVAL_SECONDS: ${CONDITIONAL_RULE_RETENTION_INTERVAL_SECONDS:-86400}
      CONDITIONAL_RULE_RETENTION_BATCH_SIZE: ${CONDITIONAL_RULE_RETENTION_BATCH_SIZE:-500}
      CONDITIONAL_RULE_EVALUATION_RETENTION_DAYS: ${CONDITIONAL_RULE_EVALUATION_RETENTION_DAYS:-30}
      CONDITIONAL_RULE_DETAIL_RETENTION_DAYS: ${CONDITIONAL_RULE_DETAIL_RETENTION_DAYS:-90}
      CONDITIONAL_RULE_OUTBOX_RETENTION_DAYS: ${CONDITIONAL_RULE_OUTBOX_RETENTION_DAYS:-7}
      CONDITIONAL_RULE_RETENTION_STATEMENT_TIMEOUT_MS: ${CONDITIONAL_RULE_RETENTION_STATEMENT_TIMEOUT_MS:-1500}
    healthcheck:
      test: ["CMD", "python", "-m", "apps.api.conditional_rule_retention", "--healthcheck"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 30s
    mem_limit: 128m
    mem_reservation: 32m
    cpus: 0.1
    pids_limit: 32

  portfolio-worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: hedgefund-portfolio-worker
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: ["python", "apps/api/portfolio_worker.py"]
    environment:
      PYTHONPATH: /app:/app/apps/api
      # The worker loads the governed portfolio catalog itself. Omitting this
      # DSN must not make the production worker fall back to test fixtures.
      DATABASE_URL: ${DATABASE_URL:?.env needs the private operational PostgreSQL DATABASE_URL}
      MEMOHARNESS_D5_MODE: ${MEMOHARNESS_D5_MODE:-active}
      MEMOHARNESS_D5_DATABASE_URL: ${MEMOHARNESS_D5_DATABASE_URL:-postgresql://hgfinance_runtime:${HEDGEFUND_RUNTIME_DB_PASSWORD:?HEDGEFUND_RUNTIME_DB_PASSWORD is required}@timescaledb:5432/${HEDGEFUND_CONTROL_DB_NAME:-control}}
      MEMOHARNESS_D5_TOP_K: ${MEMOHARNESS_D5_TOP_K:-5}
      MEMOHARNESS_D5_STATEMENT_TIMEOUT_MS: ${MEMOHARNESS_D5_STATEMENT_TIMEOUT_MS:-1500}
      PORTFOLIO_DATA_MODE: "production"
      PORTFOLIO_RUNTIME_STORE_PATH: /var/lib/portfolio/runtime.sqlite3
      PORTFOLIO_RUNTIME_EMBEDDED_WORKER: "false"
      PORTFOLIO_WORKER_LEASE_SECONDS: ${PORTFOLIO_WORKER_LEASE_SECONDS:-60}
      PORTFOLIO_WORKER_POLL_SECONDS: ${PORTFOLIO_WORKER_POLL_SECONDS:-0.5}
      # Use the shared vLLM/Qwen plane when configured; otherwise the Gateway
      # deliberately retains its existing Ollama development fallback.
      WORKER_MODEL_BASE_URL: ${WORKER_MODEL_BASE_URL:-}
      WORKER_MODEL_EXECUTION_CONTEXT: container
      WORKER_MODEL_NAME: ${WORKER_MODEL_NAME:-qwen2.5-14b-instruct-awq}
      WORKER_MODEL_API_KEY: ${WORKER_MODEL_API_KEY:-vllm}
      WORKER_MODEL_TIMEOUT_SECONDS: ${WORKER_MODEL_TIMEOUT_SECONDS:-120}
      WORKER_MODEL_REGISTRY_PATH: ${WORKER_MODEL_REGISTRY_PATH:-/app/departments/01-research/config/worker_model_registry.json}
      # The queued worker is an existing LangSmith metric producer through
      # orchestration/workflows/portfolio_recommendation.py. Keep its
      # workflow traces and high-frequency metric runs in separate projects.
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-First}
      LANGSMITH_METRICS_PROJECT: ${LANGSMITH_METRICS_PROJECT:-HgFinance-Metrics}
      LANGSMITH_EVALS_PROJECT: ${LANGSMITH_EVALS_PROJECT:-HgFinance-Evals}
      LANGSMITH_FEEDBACK_MODE: ${LANGSMITH_FEEDBACK_MODE:-shadow}
      LANGSMITH_FEEDBACK_STATE_PATH: /var/lib/portfolio/langsmith-feedback.sqlite3
      LANGSMITH_FEEDBACK_POLL_SECONDS: ${LANGSMITH_FEEDBACK_POLL_SECONDS:-30}
      LANGSMITH_FEEDBACK_LOOKBACK_SECONDS: ${LANGSMITH_FEEDBACK_LOOKBACK_SECONDS:-900}
      LANGSMITH_FEEDBACK_BATCH_SIZE: ${LANGSMITH_FEEDBACK_BATCH_SIZE:-25}
      LANGSMITH_FEEDBACK_MAX_PENDING: ${LANGSMITH_FEEDBACK_MAX_PENDING:-500}
      LANGSMITH_FEEDBACK_RETENTION_DAYS: ${LANGSMITH_FEEDBACK_RETENTION_DAYS:-30}
      LANGSMITH_FEEDBACK_LATENCY_WARN_MS: ${LANGSMITH_FEEDBACK_LATENCY_WARN_MS:-60000}
      LANGSMITH_FEEDBACK_MAX_ITEMS: ${LANGSMITH_FEEDBACK_MAX_ITEMS:-3}
      LANGSMITH_FEEDBACK_MAX_CHARS: ${LANGSMITH_FEEDBACK_MAX_CHARS:-1200}
      LANGSMITH_FEEDBACK_METRICS_WINDOW_SECONDS: ${LANGSMITH_FEEDBACK_METRICS_WINDOW_SECONDS:-300}
      LANGSMITH_FEEDBACK_METRICS_MAX_RUNS: ${LANGSMITH_FEEDBACK_METRICS_MAX_RUNS:-100}
      # Redacted deterministic Research/Quant findings become durable skill
      # occurrences. The proposal worker shares this host path; canonical
      # skills remain a separate read-only mount.
      EVOLUTION_SKILLS_HOME: /var/lib/evolution-skills
      # Internal QA-only notification. The existing QA bot posts one redacted
      # card and the qa-hermes gateway consumes its exact signed marker.
      QA_DISCORD_CHANNEL_ID: ${QA_DISCORD_CHANNEL_ID:-1541636723006775477}
      DISCORD_BOT_TOKEN_QA: ${DISCORD_BOT_TOKEN_QA:-}
      # Langfuse(2026-08-10 도입, 993682f). 이 컨테이너가 llm.performance.metric
      # 이벤트를 **쓰는** 쪽이다 - HR(workforce-api)이 같은 자격증명으로 읽는다.
      # `.env`는 .dockerignore에 걸려 이미지에 안 들어가므로 여기 나열한 키만
      # 프로세스에 도달한다. LANGFUSE_TRACING=false면 계측만 조용히 꺼지고
      # 파이프라인은 그대로 돈다(orchestration/llm_observability.py lazy import).
      LANGFUSE_TRACING: ${LANGFUSE_TRACING:-false}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
    volumes:
      - portfolio_runtime_data:/var/lib/portfolio
      - ${EVOLUTION_SKILLS_HOST_DIR:-/home/ubuntu/.hermes/evolution-skills}:/var/lib/evolution-skills

  timescaledb:
    # A mutable pg17 tag caused an unrelated application deployment to pull a
    # new 800MB database image and attempt an implicit database replacement.
    # Database upgrades are explicit maintenance, never a side effect of an API deploy.
    image: timescale/timescaledb-ha@sha256:eaaab826932c579d5d4e3a3479446da931cabb8703cf7caf1038eb14d40754fa
    container_name: hedgefund-timescaledb
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    environment:
      POSTGRES_DB: market
      POSTGRES_PASSWORD: ${HEDGEFUND_TSDB_PASSWORD:?.env 에 HEDGEFUND_TSDB_PASSWORD 를 설정할 것}

    ports:
      # ▶ 팀원 조회 개방 (재일님 결정 2026-07-31, VPS 이전 전까지의 임시 체제)
      #   0.0.0.0 바인딩이지만 **공유기 NAT 뒤라 인터넷에는 노출되지 않는다.**
      #   절대 공유기 포트포워딩을 하지 않는다 - 팀원 접근은 Tailscale(사설망)
      #   IP 로만 한다. 팀원에게 주는 계정은 hedgefund_ro (읽기 전용, market
      #   스키마 SELECT 만 - INSERT 거부 검증됨). 관리자 계정은 리서치·퀀트만
      #   갖는다는 경계는 유지된다. VPS 이전 시 이 주석과 함께 재검토.
      - "0.0.0.0:5434:5432"

    volumes:
      - tsdb_data:/home/postgres/pgdata/data

    # ── 자원 격리 ──────────────────────────────────────────────────────────
    # Docker Desktop(Windows)은 모든 컨테이너를 단일 WSL2 VM 안에서 돌린다.
    # 따라서 CPU/RAM은 기본적으로 한 풀을 공유하며, 격리는 cgroup 상한으로 만든다.
    # 아래 값은 "이 컨테이너가 다른 프로젝트를 굶기지 않는다"를 보장한다.
    # 역방향 보호(다른 프로젝트가 우리를 굶기지 않기)는 그쪽에도 상한이 있어야 한다.
    #
    # cpus 는 호스트 코어 번호와 무관한 이식 가능한 상한이다. 과거의
    # cpuset=22,23은 8코어 호스트에서 재배포 자체를 막았으므로 사용하지 않는다.
    mem_limit: 4g              # 하드 상한. 초과 시 이 컨테이너만 OOM
    mem_reservation: 1g        # 소프트 보장 — 메모리 압박 시 커널이 우선 유지
    cpus: 2.0                  # 24코어 중 2코어 상당으로 제한
    pids_limit: 512
    shm_size: 256mb            # 병렬 쿼리용 공유 메모리 (기본 64MB는 부족)

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d market"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── 상주형 LS 실시간 시세 수집 (재일님 지시 2026-07-31: 호가·체결도 Docker 로) ──
  # 컨테이너는 24시간, 소켓은 세션 창(동시호가 35분 전~마감 +10분)에서만 연다.
  # 구독은 뉴스와 같은 바스켓(코스피200+코스닥150 = 700구독)을 소켓 4개로 샤딩
  # (재일님 지시 "바스켓 종목만 구독" - 대규모 동시 구독은 krx-tick-collector 실증).
  ls-realtime:
    build:
      context: departments/01-research
    container_name: hedgefund-ls-realtime
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: ["python", "collectors/ls_realtime_service.py"]

    depends_on:
      timescaledb:
        condition: service_healthy

    environment:
      # Reference(세션·종목)의 운영 authority는 같은 PostgreSQL 인스턴스의
      # control DB다. 범용 DATABASE_URL이 빈 Supabase DB로 바뀌어도 실시간
      # 수집기를 0종목으로 재시작하지 않도록 전용 URL 경계를 둔다.
      DATABASE_URL: ${REFERENCE_DATABASE_URL:-postgresql://postgres:${HEDGEFUND_TSDB_PASSWORD:?}@timescaledb:5432/control}
      TIMESCALE_DATABASE_URL: postgresql://postgres:${HEDGEFUND_TSDB_PASSWORD:?}@timescaledb:5432/market
      # REST 토큰과 WebSocket 모두 같은 LS_ENV를 사용한다.
      LS_ENV: ${LS_ENV:-LIVE}
      LS_APP_KEY: ${LS_APP_KEY:-}
      LS_APP_SECRET_KEY: ${LS_APP_SECRET_KEY:-}
      LS_APP_KEY_PAPER: ${LS_APP_KEY_PAPER:-}
      LS_APP_SECRET_KEY_PAPER: ${LS_APP_SECRET_KEY_PAPER:-}
      LS_REST_BASE_URL: ${LS_REST_BASE_URL:-}
      LS_REST_BASE_URL_PAPER: ${LS_REST_BASE_URL_PAPER:-}
      LS_WS_BASE_URL: ${LS_WS_BASE_URL:-}
      LS_WS_BASE_URL_PAPER: ${LS_WS_BASE_URL_PAPER:-}
      # LS는 앱키당 활성 토큰 하나를 유지한다. Trading PAPER 주문기와 같은
      # 기존 파일 캐시 규격을 공유해 별도 발급이 서로를 무효화하지 않게 한다.
      LS_TOKEN_CACHE_DIR: /var/lib/ls-token-cache
      # ▶ 전종목 구독 (2026-08-03, 재일님 지시)
      #   ETF·ETN 은 instrument_type 이 달라 애초에 안 들어온다(STOCK 만).
      #   거래정지·관리종목 등 제한 171 을 뺀 2,595종목 = 5,190구독 =
      #   소켓 26개(소켓당 200). 실계좌 웹소켓 세션 한도는 미확인이라
      #   전환 후 소켓 수와 유입을 반드시 확인한다. 거절되면 서비스가 실패하도록
      #   두고, 검토된 시장 종목 파일을 LS_WATCH_SYMBOLS_FILE로 명시한다.
      LS_WATCH_SYMBOLS_FILE: config/full_universe.txt
      # 장중 두 권위 스트림이 이 시간보다 오래 멈추면 컨테이너를 unhealthy로 표시한다.
      LS_HEALTH_MAX_DATA_AGE_SECONDS: ${LS_HEALTH_MAX_DATA_AGE_SECONDS:-180}

    volumes:
      - ./departments/01-research/config:/app/departments/01-research/config:ro
      - ls_token_cache:/var/lib/ls-token-cache

    # 장중 140구독 스트림 - 뉴스보다 처리량이 크다
    mem_limit: 768m
    mem_reservation: 128m
    cpus: 1.0
    pids_limit: 64

    healthcheck:
      test: ["CMD", "python", "collectors/ls_realtime_service.py", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

    stop_grace_period: 30s

  # ── 시세 전용 배치 스케줄러 ──
  # 가격·호가·체결과 직접 파생되는 시장 관측만 순차 실행한다. 뉴스·공시·재무·
  # 거시·소셜 데이터는 저장하지 않고 research MCP가 필요할 때 조회한다.
  batch-collectors:
    # Always-on market-data lane only. Literature, news, filings, financials,
    # macro and social inputs are queried on demand through MCP and are never
    # persisted by this service.
    build:
      context: departments/01-research
    container_name: hedgefund-batch-collectors
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # --serve 가 필수다(2026-08-02). 인자가 없으면 자체 점검만 하고 끝난다 -
    # "python <파일> = 자체 점검"이라는 저장소 관례를 이 파일만 어겨서,
    # 전 모듈 점검 루프가 돌 때마다 상주 스케줄러가 조용히 떴다(4회).
    command: ["python", "collectors/collector_scheduler.py", "--serve"]

    depends_on:
      timescaledb:
        condition: service_healthy

    environment:
      DATABASE_URL: ${REFERENCE_DATABASE_URL:-postgresql://postgres:${HEDGEFUND_TSDB_PASSWORD:?}@timescaledb:5432/control}
      TIMESCALE_DATABASE_URL: postgresql://postgres:${HEDGEFUND_TSDB_PASSWORD:?}@timescaledb:5432/market
      # Breadth(t1511/t8424)와 관측 Calendar(t8410)가 LS REST 를 쓴다
      LS_ENV: ${LS_ENV:-LIVE}
      LS_APP_KEY: ${LS_APP_KEY:-}
      LS_APP_SECRET_KEY: ${LS_APP_SECRET_KEY:-}
      LS_APP_KEY_PAPER: ${LS_APP_KEY_PAPER:-}
      LS_APP_SECRET_KEY_PAPER: ${LS_APP_SECRET_KEY_PAPER:-}
      LS_REST_BASE_URL: ${LS_REST_BASE_URL:-}
      LS_REST_BASE_URL_PAPER: ${LS_REST_BASE_URL_PAPER:-}
      # label-snapshot Job 이 가격 기반 레짐 라벨을 계산하려면 시장 조회면이 필요하다.
      # 2026-08-02 실측: 기본값이 127.0.0.1 이라 컨테이너 안에서 Connection
      # refused 가 났다 - 같은 compose 네트워크의 서비스 이름으로 준다.
      MARKET_API_URL: http://market-api:8036

    # 시장 유니버스·지수 정의는 코드 배포 없이 조정할 수 있게 읽기 전용으로 건다.
    volumes:
      - ./departments/01-research/config:/app/departments/01-research/config:ro
      # ▶ **Parquet 아카이브는 호스트에 남아야 한다** (2026-08-12 실측)
      #   `market_archive_exporter.ARCHIVE_ROOT` 는 `parents[3]/market-archive`
      #   라는 상대 경로다. 호스트에서 돌리면 저장소 안에 쌓이지만, 이 컨테이너
      #   에서 돌면 `/app/market-archive` 인데 **마운트가 없었다.** 그래서
      #   호가·체결 아카이브 3.2GB(parquet 6개)가 컨테이너 쓰기 레이어에만
      #   있었고, `docker compose up --force-recreate` 한 번이면 사라지는
      #   상태였다. `archive_exports` 원장은 `verified=t` 라고 적혀 있었으므로
      #   **원장만 보면 안전해 보였다.**
      #
      #   TimescaleDB 는 호가를 나흘, 체결을 6주만 들고 있다(청크 실측).
      #   장기 표본은 전적으로 이 Parquet 이므로 마이크로구조 연구의 유일한
      #   근거가 컨테이너 수명에 걸려 있었던 셈이다.
      #
      #   ⚠ 이미 컨테이너 안에만 있는 파일이 있다면 **먼저 `docker cp` 로 빼낸
      #     다음** 이 마운트를 붙인다. 순서를 바꾸면 빈 호스트 디렉터리가
      #     컨테이너 안 파일을 가려서 그대로 잃는다.
      - ./market-archive:/app/market-archive

    mem_limit: 512m
    mem_reservation: 64m
    cpus: 0.5
    pids_limit: 64

    # 진행 중 Job(최대 30분 timeout)을 마치게 두진 않는다 - 어차피 멱등이라
    # 다음 주기가 이어받는다. 짧게 정리하고 내린다.
    stop_grace_period: 20s

  # Independent, lease-fenced re-execution of accepted forward PASS evidence.
  # This process has neither svc_quant nor transport-worker privileges. Its
  # market connection is forced read-only and every scientific mismatch is an
  # immutable QA result with promotion_authority=false.
  qa-reproduction-worker:
    build:
      context: .
      dockerfile: departments/06-ai-qa-audit/Dockerfile
    container_name: hedgefund-qa-reproduction-worker
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: ["python", "qa_events/reproduction_worker.py"]
    working_dir: /app/departments/06-ai-qa-audit
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      # Prefer a true session endpoint. The broad credential is only a login
      # transport; SET ROLE must persist and the DB health probe fails closed
      # when that login cannot assume svc_qa_reproducer.
      DATABASE_URL: ${RISK_QA_DATABASE_URL:-${DATABASE_URL:-}}
      DATABASE_SESSION_URL: ${RISK_QA_DATABASE_SESSION_URL:-}
      DATABASE_RUNTIME_ROLE: ${QA_REPRODUCER_DATABASE_RUNTIME_ROLE:-svc_qa_reproducer}
      QA_REPRODUCTION_TIMESCALE_DATABASE_URL: ${QA_REPRODUCTION_TIMESCALE_DATABASE_URL:-postgresql://postgres:${HEDGEFUND_TSDB_PASSWORD:?}@timescaledb:5432/market}
      QA_REPRODUCTION_LEASE_SECONDS: ${QA_REPRODUCTION_LEASE_SECONDS:-7200}
      QA_REPRODUCTION_HEARTBEAT_SECONDS: ${QA_REPRODUCTION_HEARTBEAT_SECONDS:-60}
      QA_REPRODUCTION_POLL_SECONDS: ${QA_REPRODUCTION_POLL_SECONDS:-15}
      QA_REPRODUCTION_CONNECT_TIMEOUT_SECONDS: ${QA_REPRODUCTION_CONNECT_TIMEOUT_SECONDS:-10}
      QA_REPRODUCTION_METADATA_STATEMENT_TIMEOUT_MS: ${QA_REPRODUCTION_METADATA_STATEMENT_TIMEOUT_MS:-30000}
      QA_REPRODUCTION_METADATA_LOCK_TIMEOUT_MS: ${QA_REPRODUCTION_METADATA_LOCK_TIMEOUT_MS:-5000}
      QA_REPRODUCTION_MARKET_STATEMENT_TIMEOUT_MS: ${QA_REPRODUCTION_MARKET_STATEMENT_TIMEOUT_MS:-300000}
      QA_REPRODUCTION_MARKET_LOCK_TIMEOUT_MS: ${QA_REPRODUCTION_MARKET_LOCK_TIMEOUT_MS:-5000}
    healthcheck:
      # Executes the scoped claim API inside ROLLBACK and proves that the raw
      # market connection is read-only. A missing session credential/SET ROLE
      # grant therefore fails closed instead of reporting process-only health.
      test: ["CMD", "python", "qa_events/reproduction_worker.py", "--healthcheck"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s
    mem_limit: 2g
    cpus: 1.0
    pids_limit: 128
    stop_grace_period: 30s

  # ── quant-api: 실험 제출·조회면 (전략 공장의 주문 창구) ──────────────────
  # Factory operations submit through this boundary; Hermes never receives a
  # DB secret or a write-capable MCP surface.
  # QUANT_DATABASE_URL may point at the least-privilege svc_quant role; the
  # shared URL remains a migration fallback until that role is configured.
  quant-api:
    build:
      context: .
      dockerfile: departments/04-quant-backtest/Dockerfile
    container_name: hedgefund-quant-api
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      # Inject exactly one selected DSN.  Supplying the scoped role must not
      # leave the broader fallback credential readable in the API process.
      DATABASE_URL: ${QUANT_DATABASE_URL:-${DATABASE_URL:?.env 에 DATABASE_URL 이 필요하다}}
      DATABASE_SESSION_URL: ${QUANT_DATABASE_SESSION_URL:-}
      DATABASE_RUNTIME_ROLE: ${QUANT_DATABASE_RUNTIME_ROLE:-svc_quant}
      MCP_RESEARCH_API_KEY: ${MCP_RESEARCH_API_KEY:-}
    ports:
      - "127.0.0.1:8037:8037"
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64

  # ── market-api: 시세 읽기 전용 조회면 (F03 "DB 없이 Snapshot API" + 통합계획 6.2) ──
  # 트레이딩·리스크·팀원은 TSDB Credential 없이 이 API 로 Snapshot/Bar/Breadth/DQ 조회.
  market-api:
    build:
      context: departments/01-research
    container_name: hedgefund-market-api
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    working_dir: /app/departments/01-research/api
    command: ["uvicorn", "market_api:app", "--host", "0.0.0.0", "--port", "8036"]
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?}   # 심볼<->instrument 매핑(기동 시 1회)
      TIMESCALE_DATABASE_URL: postgresql://postgres:${HEDGEFUND_TSDB_PASSWORD:?}@timescaledb:5432/market
    ports:
      - "0.0.0.0:8036:8036"   # 팀원 조회용 - Tailscale/사설망 전제, 포트포워딩 금지
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64

  # ── research-api: Evidence 읽기 전용 조회면 (에이전트 배선의 시작점) ──
  # PIT(as_of) 기본, DB 세션 자체가 read-only. 뉴스/공시/재무 Evidence 를
  # LangGraph 직원 tool 이 여기서 읽는다 (DB 직접 접근 금지 - CLAUDE.md 원칙 1).
  research-api:
    build:
      context: departments/01-research
    container_name: hedgefund-research-api
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    working_dir: /app/departments/01-research/api
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8035"]

    environment:
      DATABASE_URL: ${DATABASE_URL:?.env 에 DATABASE_URL 이 필요하다}
      # /evidence/search 질의 임베딩(bge-m3)용. Ollama 는 호스트 프로세스라
      # 컨테이너 안의 127.0.0.1(기본값)로는 못 간다 - host.docker.internal 이
      # 컨테이너에서 호스트 Ollama 에 도달하는 유일한 경로다.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-First}
      # Tool Gateway 강제 모드. 기본은 관측(위반을 헤더·로그로만 드러냄) -
      # 기존 호출자(분석가 코드)가 아직 X-Agent-Persona 를 안 붙이므로 강제부터
      # 켜면 파이프라인이 통째로 멈춘다. 호출자를 다 고친 뒤 true 로 올린다.
      TOOL_GATEWAY_ENFORCE: ${TOOL_GATEWAY_ENFORCE:-false}

    # Docker Desktop(Windows/Mac)은 host.docker.internal 을 자동 제공하지만
    # 리눅스 엔진은 아니다 - host-gateway 매핑을 명시해 VPS 이전 시에도
    # 같은 compose 파일이 그대로 동작하게 한다(파일 상단 이전 원칙).
    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      # Tool Gateway 가 허용목록을 읽는다. **단일 출처는 config.yaml 이므로**
      # API 쪽에 목록을 복제하지 않고 파일을 그대로 마운트한다 - 복제하면
      # 둘이 어긋나고 어긋난 쪽이 조용히 이긴다. 읽기 전용.
      - ./departments/01-research/hermes:/app/departments/01-research/hermes:ro

    ports:
      - "127.0.0.1:8035:8035"   # 로컬 전용 - 외부 노출 금지

    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64

  # ── Hermes Agent Runtime (부서 Supervisor 계층) ────────────────────────────
  # 재일님 지시 2026-08-02 "팀원들이랑 도커로 관리하기로 했다".
  # 근거: DEPARTMENT_BACKEND_INTEGRATION_DOCKER_PLAN.md 3.1 - Hermes 는 Python
  #       Version·Tool 권한·Memory 가 달라 **Department Backend Image 에 설치하지
  #       않는다.** 공식 Image 를 별도 Container 로 띄운다.
  #
  # ── research-mcp: 부서 도구 면 (Hermes ↔ LangGraph 파이프라인의 다리) ──
  # 헤르메스는 부서 인터페이스·기억·위임 계층이고 분석 실체는 LangGraph 다
  # (TECH_STACK_DECISIONS 2절). 둘을 잇는 것이 도구 호출인데 그게 비어 있어서
  # 지금까지 헤르메스가 '대화만 되는 껍데기'로 보였다. 이 서비스가 그 다리다.
  #
  # 포트를 호스트에 게시하지 않는다 - 헤르메스 컨테이너가 같은 compose 네트워크
  # 에서 서비스 이름으로 부른다(research-mcp:8037). 밖에서 부를 이유가 없다.
  research-mcp:
    build:
      context: .
      dockerfile: departments/01-research/Dockerfile.mcp
    container_name: hedgefund-research-mcp
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    working_dir: /app/departments/01-research
    command: ["python", "api/mcp_server.py", "--serve"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?.env 에 DATABASE_URL 이 필요하다}
      # 도구 면 인증(2026-08-02). 비면 무인증으로 열리고 기동 로그에 경고가
      # 찍힌다 - '잊은 것'과 '일부러 연 것'을 구분되게 한다.
      MCP_RESEARCH_API_KEY: ${MCP_RESEARCH_API_KEY:-}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-First}
      LANGSMITH_METRICS_PROJECT: ${LANGSMITH_METRICS_PROJECT:-HgFinance-Metrics}
      LANGSMITH_EVALS_PROJECT: ${LANGSMITH_EVALS_PROJECT:-HgFinance-Evals}
      # Langfuse(2026-08-20). 본부장이 이 컨테이너 안에서 Worker(MCP 도구 경로 포함)를
      # 직접 돌리는 실행이 있다 - portfolio-bff/worker 계측만으로는 이 경로가 안 잡혀
      # HR 리포트에서 실제로 일한 Worker 가 UNOBSERVED 로 보였다. `.env`는
      # .dockerignore 라 컨테이너 안 load_dotenv 가 못 읽으므로 여기 명시한다.
      LANGFUSE_TRACING: ${LANGFUSE_TRACING:-false}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      # 파이프라인이 부르는 조회면·로컬 모델. Ollama 는 호스트 프로세스다.
      MARKET_API_URL: http://market-api:8036
      RESEARCH_API_URL: http://research-api:8035
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      # ▶ 외부 정보원 질의 도구 (external_sources.py, 요청형 MCP 전용)
      #   정성 데이터 상주 수집기는 이 키를 받지 않는다. 소스별 일일 상한이
      #   반복 에이전트 호출로 외부 계정 한도가 소진되는 것을 막는다.
      #   응답은 저장하지 않고 요청별 인용 해시만 계산한다.
      OPEN_DART_API_KEY: ${OPEN_DART_API_KEY:-}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      ECOS_API_KEY: ${ECOS_API_KEY:-}
      FRED_API_KEY: ${FRED_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      MCP_DART_DAILY_CAP: ${MCP_DART_DAILY_CAP:-2000}
      MCP_NAVER_DAILY_CAP: ${MCP_NAVER_DAILY_CAP:-5000}
      MCP_ECOS_DAILY_CAP: ${MCP_ECOS_DAILY_CAP:-2000}
      MCP_FRED_DAILY_CAP: ${MCP_FRED_DAILY_CAP:-2000}
      # ▶ LS 자격을 뺐다 (2026-08-02). 예전에는 파이프라인 첫 노드
      #   (universe_manager)가 거래가능 여부를 LS REST 로 직접 물어 이 컨테이너에
      #   LS 키가 필요했다. 이제 universe_restriction_collector(수집기)가 제한
      #   목록을 DB 에 남기고 research-api /universe/restrictions 가 서빙하므로
      #   **판정하는 쪽은 자격이 필요 없다**(통합계획 6.2).
      #   자격이 퍼지는 것 자체가 위험이므로 옮기지 않고 없앴다.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./departments/01-research/config:/app/departments/01-research/config:ro
      # 총괄 노드(draft_packet)가 research-supervisor 페르소나 원문을 여기서 읽는다
      # - 2026-08-02 실측: 없으면 분석가 6인을 다 돌린 뒤 마지막에 실패한다.
      # COPY 대신 마운트인 이유: 페르소나를 고칠 때마다 이미지를 다시 굽지 않는다.
      - ./departments/01-research/hermes:/app/departments/01-research/hermes:ro
      # Worker 실행기는 부서 공용 코드다. 기본(로컬 Ollama)과 AWS vLLM 모두
      # 같은 파일을 써야 하므로 모델 오버레이가 아니라 control plane에 둔다.
      # 이 마운트가 빠지면 경쟁설 검토 job이 ModuleNotFoundError로 끝나고,
      # 독립 회의론자 서명을 만들 수 없어 기획안 접수가 영구 차단된다.
      - ./departments/employee_worker_runtime.py:/app/departments/employee_worker_runtime.py:ro
      - ./departments/worker_model_gateway.py:/app/departments/worker_model_gateway.py:ro
      - ./departments/01-research/employee_workers.py:/app/departments/01-research/employee_workers.py:ro
      # employee_worker_runtime의 LLM 호출 계측(record_llm_call)
      - ./orchestration:/app/orchestration:ro
      # 과거 Packet 감사 자료는 읽을 수만 있다. 현재 MCP는 외부 응답이나 Packet을
      # 이 경로에 쓰지 않는다.
      - ./departments/01-research/reports:/app/departments/01-research/reports:ro
    # 파이프라인이 분석가 6인 x LLM 이라 오래 돈다 - 넉넉히 준다
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 256
    stop_grace_period: 30s

  # ── research-liaison-mcp: 리서치 응대 창구(도서관) 도구 면 (2026-08-13) ──
  # 같은 이미지·같은 코드가 RESEARCH_MCP_SURFACE=liaison 으로 뜬다 - 파이프라인
  # Worker 실행·factory 쓰기 도구(run_research_workers·factory_submit_*)가 **등록에서
  # 빠진** 조회 전용 면이다(도서관/연구소 분리). 사용자 질의 파생 카드를 받는
  # research-liaison·quant-liaison 프로필만 이 서버를 물고, 부서 본체 프로필은
  # 위 research-mcp(full)를 그대로 쓴다. 창구가 쓰기 손을 못 갖는 것은 프롬프트
  # 지시가 아니라 capability 절단이다 - 서버가 제거를 검증 못 하면 기동을 거부한다.
  # 포트는 호스트에 게시하지 않는다(research-liaison-mcp:8037, compose 안 전용).
  # ▶ OpenBB Platform MCP (2026-08-13, 재일 결정 "쓸만한 MCP 싹다") - 기성 채용.
  #   대형 OSS 공식 확장(도구 200+, 옵션체인·ETF·채권·매크로). 무료 프로바이더
  #   (yfinance 등)만 쓰므로 우리 키가 서드파티 코드를 통과하지 않는다.
  #   도구 과부하는 자체 --tool-discovery 가 푼다. 호스트 미게시(내부 8039).
  openbb-mcp:
    build:
      context: .
      dockerfile: Dockerfile.openbb-mcp
    container_name: hedgefund-openbb-mcp
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    stop_grace_period: 15s

  # ▶ LS 증권 OpenAPI MCP (2026-08-13, 재일 결정 "TR 목록을 정제해서 질문에 답하게")
  #   research-mcp 와 **다른 컨테이너**인 이유: 2026-08-02 결정(LS 자격은 퍼뜨리지
  #   않는다)을 유지한다 - 키는 여기에만 있고 에이전트는 도구만 받는다.
  #   도구 2층: ls_tr_catalog(정제 색인 365 TR 검색) + 큐레이션 실행(수급 t1717 부터).
  #   포트는 호스트에 게시하지 않는다(ls-mcp:8038, compose 안 전용).
  ls-mcp:
    build:
      context: departments/01-research
    container_name: hedgefund-ls-mcp
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    working_dir: /app/departments/01-research
    command: ["python", "api/ls_mcp_server.py", "--serve"]
    environment:
      MCP_RESEARCH_API_KEY: ${MCP_RESEARCH_API_KEY:-}
      # LS 자격 - 수집기와 같은 단일 LS_ENV를 사용한다.
      LS_ENV: ${LS_ENV:-LIVE}
      LS_APP_KEY: ${LS_APP_KEY:-}
      LS_APP_SECRET_KEY: ${LS_APP_SECRET_KEY:-}
      LS_APP_KEY_PAPER: ${LS_APP_KEY_PAPER:-}
      LS_APP_SECRET_KEY_PAPER: ${LS_APP_SECRET_KEY_PAPER:-}
      LS_REST_BASE_URL: ${LS_REST_BASE_URL:-}
      LS_REST_BASE_URL_PAPER: ${LS_REST_BASE_URL_PAPER:-}
      # 종목명 해석은 DART corp 색인 재사용(external_sources._resolve)
      OPEN_DART_API_KEY: ${OPEN_DART_API_KEY:-}
      MCP_LS_DAILY_CAP: ${MCP_LS_DAILY_CAP:-2000}
    volumes:
      - ./departments/01-research/config:/app/departments/01-research/config:ro
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    stop_grace_period: 15s

  research-liaison-mcp:
    build:
      context: .
      dockerfile: departments/01-research/Dockerfile.mcp
    container_name: hedgefund-research-liaison-mcp
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    working_dir: /app/departments/01-research
    command: ["python", "api/mcp_server.py", "--serve"]
    environment:
      RESEARCH_MCP_SURFACE: liaison
      DATABASE_URL: ${DATABASE_URL:?.env 에 DATABASE_URL 이 필요하다}
      MCP_RESEARCH_API_KEY: ${MCP_RESEARCH_API_KEY:-}
      MARKET_API_URL: http://market-api:8036
      RESEARCH_API_URL: http://research-api:8035
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      # 외부 정보원 도구는 읽기 전용이라 창구에도 남는다(external_sources.py).
      OPEN_DART_API_KEY: ${OPEN_DART_API_KEY:-}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      ECOS_API_KEY: ${ECOS_API_KEY:-}
      FRED_API_KEY: ${FRED_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      MCP_DART_DAILY_CAP: ${MCP_DART_DAILY_CAP:-2000}
      MCP_NAVER_DAILY_CAP: ${MCP_NAVER_DAILY_CAP:-5000}
      MCP_ECOS_DAILY_CAP: ${MCP_ECOS_DAILY_CAP:-2000}
      MCP_FRED_DAILY_CAP: ${MCP_FRED_DAILY_CAP:-2000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./departments/01-research/config:/app/departments/01-research/config:ro
      - ./departments/01-research/hermes:/app/departments/01-research/hermes:ro
      # 창구는 산출물(Packet 리포트)을 **읽기 전용**으로만 본다 - 도서관은
      # 카탈로그를 읽지, 만들지 않는다
      - ./departments/01-research/reports:/app/departments/01-research/reports:ro
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    stop_grace_period: 30s

  # ▶ **부서별 컨테이너 1개 = 부서별 데이터 디렉터리 1개** (계획서 3.1~3.2)
  #   Credential·Memory Namespace 분리는 이름이 아니라 저장소 분리다.
  #   컨테이너만 쪼개고 /opt/data 를 공유하면 한 부서의 세션·기억·자격이 옆
  #   부서에서 그대로 보인다 - 분리된 척이 된다. 그래서 각 컨테이너는
  #   `/home/ubuntu/.hermes/profiles/<부서>` 를 따로 마운트하고, 그 안에는
  #   자기 Profile 하나만 둔다. HERMES_HOME=/opt/data 는 이미지 기본값이라
  #   마운트만 갈면 분리가 끝난다.
  #
  # ▶ 8개 본부 모두 이 파일(research/quant/risk/qa) 또는 `include:`된
  #   부서 Compose Fragment(ceo/trading/accounting/hr)에 이미 컨테이너가
  #   있다(2026-08-10 기준). 담당자 표는 CLAUDE.md - 남의 본부 컨테이너를
  #   대신 고치지 않는다.
  #
  # ▶ 데이터 경로 함정 (2026-08-02 실측, 로컬 개발 한정)
  #   Windows 네이티브 설치본은 %LOCALAPPDATA%\hermes 를 쓰지만 컨테이너는
  #   `~/.hermes/profiles/<부서>` 를 마운트한다 - **서로 다른 디렉터리다.**
  #   섞으면 "분명 profile 을 만들었는데 목록에 없다"가 된다. AWS는 이 함정이
  #   없다(컨테이너가 EC2 위의 `/home/ubuntu/.hermes/profiles/<부서>` 하나만
  #   본다). 로컬 동기화 절차는 `scripts/sync_hermes_profiles.sh`.
  #
  # ▶ 부서 간 호출(계획서 3.3 "본부 간 호출은 HTTP")은 `hermes serve` 가
  #   담당한다. 다만 2026-06 하드닝 이후 **비-loopback 바인딩은 인증 없이는
  #   열리지 않는다**(--insecure 는 no-op 이 됐다). 컨테이너 간 통신은
  #   0.0.0.0 바인딩이 필요하므로 인증 설정이 선행 조건이다 - 이는 제약이
  #   아니라 권한 경계를 인증으로 강제하는 것이라 그대로 따른다.
  #   절차는 docs/02-engineering/HERMES_DOCKER_RUNBOOK.md 4절.
  # ▶ 공용 Kanban board(CEO 중심 동적 Task Graph): /home/ubuntu/.hermes/shared-kanban 는
  #   profiles/<부서>와 분리된 전용 디렉터리다(각 컨테이너 /opt/kanban에 마운트) - 8개
  #   본부가 이 하나의 kanban.db를 공유하면서도 서로의 profiles/<부서> auth/config/
  #   memory는 여전히 못 본다. 최초 기동 전 호스트에 `mkdir -p ~/.hermes/shared-kanban`을
  #   먼저 해둬야 한다 - 없는 상태로 Docker가 파일 하나만 마운트하면 디렉터리로 잘못
  #   만들어진다.
  #
  # ▶ HERMES_KANBAN_DISPATCH_IN_GATEWAY: "false" - 이 8개 컨테이너의 embedded dispatcher는
  #   끈다(공식 env override, kanban 설정 자체를 건드리지 않음). 이유는 lock 경합이 아니라
  #   원천적으로 spawn이 불가능해서다: Hermes dispatcher가 worker를 띄울 때
  #   `$HERMES_HOME/profiles/<assignee>`를 찾는데(hermes_cli/profiles.py get_profile_dir),
  #   이 8개 컨테이너는 /opt/data 가 "그 부서 profile 내용 그 자체"라 profiles/ 서브
  #   디렉터리가 없다 - 그래서 켜놔도 자기 자신에게 할당된 task조차 spawn 못 하고
  #   skipped_nonspawnable 로 매번 건너뛴다. 그래서 dispatch는 아래 kanban-dispatcher
  #   전용 컨테이너 하나가 전담한다(8개 profiles/ 전체를 보는 유일한 컨테이너) - 이 8개는
  #   여전히 kanban_show/list/comment/complete 같은 조회·자기보고 tool만 쓴다.
  research-hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hedgefund-research-hermes
    restart: unless-stopped
    command: ["sleep", "infinity"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - /home/ubuntu/.hermes/profiles/research-department:/opt/data
      # 저장소 skills/ **전체**를 건다. finance 만 걸면 다른 범주의 스킬을
      # 요구한 카드가 'Unknown skill(s)' 로 65초 만에 죽는다(2026-08-14 실측:
      # wiring-audit·dataset-engineering 요구 카드 3장). 저장소에는 스킬이
      # 10 갈래인데 마운트는 한 갈래뿐이었다. 노출 != 배정이다 -
      # 어느 프로필이 무엇을 쓸 수 있는지는 orchestration/skill_contract.py 가 정한다.
      - ./skills:/opt/shared-skills:ro
      - /home/ubuntu/.hermes/shared-kanban:/opt/kanban
    environment:
      HERMES_UID: 1000
      HERMES_GID: 1000
      HERMES_HOME: /opt/data
      HERMES_PROFILE: research-department
      HERMES_KANBAN_HOME: /opt/kanban
      HERMES_KANBAN_DB: /opt/kanban/kanban.db
      HERMES_KANBAN_DISPATCH_IN_GATEWAY: "false"
      # LLM Provider(Codex/Claude)는 하드코딩하지 않는다 - /opt/data/config.yaml의
      # provider: 와 auth.json이 실제 Provider를 결정한다(docker-compose.claude.yml 참고).
      # 이 값은 Provider 키가 아니라 Profile의 mcp_servers.research.headers가 싣는
      # MCP 서버 자체 인증이라 그대로 둔다.
      MCP_RESEARCH_API_KEY: ${MCP_RESEARCH_API_KEY:-}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-First}
    mem_limit: 1g
    mem_reservation: 192m
    cpus: 1.0
    pids_limit: 256
    stop_grace_period: 20s

  quant-hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hedgefund-quant-hermes
    restart: unless-stopped
    command: ["sleep", "infinity"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - /home/ubuntu/.hermes/profiles/quant-backtest-department:/opt/data
      # 저장소 skills/ **전체**를 건다. finance 만 걸면 다른 범주의 스킬을
      # 요구한 카드가 'Unknown skill(s)' 로 65초 만에 죽는다(2026-08-14 실측:
      # wiring-audit·dataset-engineering 요구 카드 3장). 저장소에는 스킬이
      # 10 갈래인데 마운트는 한 갈래뿐이었다. 노출 != 배정이다 -
      # 어느 프로필이 무엇을 쓸 수 있는지는 orchestration/skill_contract.py 가 정한다.
      - ./skills:/opt/shared-skills:ro
      - /home/ubuntu/.hermes/shared-kanban:/opt/kanban
    environment:
      HERMES_UID: 1000
      HERMES_GID: 1000
      HERMES_HOME: /opt/data
      HERMES_PROFILE: quant-backtest-department
      HERMES_KANBAN_HOME: /opt/kanban
      HERMES_KANBAN_DB: /opt/kanban/kanban.db
      HERMES_KANBAN_DISPATCH_IN_GATEWAY: "false"
      # Profile MCP headers expand this token for the read-only research
      # liaison.  Job mutation stays on quant-api/factory workers; Hermes gets
      # neither a database credential nor an implied write-capable MCP tool.
      MCP_RESEARCH_API_KEY: ${MCP_RESEARCH_API_KEY:-}
    mem_limit: 1g
    mem_reservation: 192m
    cpus: 1.0
    pids_limit: 256
    stop_grace_period: 20s

  # ── 리스크·AI QA/감사본부 (동규 소유) ───────────────────────────────────────
  # 근거: DEPARTMENT_BACKEND_INTEGRATION_DOCKER_PLAN.md 6.4·6.7절
  # departments/03-risk/Dockerfile, departments/06-ai-qa-audit/Dockerfile 참고.
  #
  # ▶ redis: Risk↔QA Event Stream(risk_events/qa_events)이 쓰는 공통 Core 인프라다.
  #   특정 부서 소유가 아니다(계획서 5절 "공통 Platform Container") - 다른 부서도
  #   Redis Streams가 필요해지면 이 서비스를 재사용하면 된다. P0 로컬용 최소 구성이라
  #   Redis Stream은 AOF(everysec)와 명명 volume으로 영속화한다.
  redis:
    image: redis:7-alpine
    container_name: hedgefund-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # risk-api: Pre-trade Risk Check, Trading State, Compliance(agentic-rag) 조회면.
  # Build Context가 저장소 루트인 이유는 departments/03-risk/Dockerfile 상단 주석 참고.
  risk-api:
    build:
      context: .
      dockerfile: departments/03-risk/Dockerfile
    container_name: hedgefund-risk-api
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      REDIS_URL: redis://redis:6379/0
      RISK_QA_EVENT_REDIS_URL: redis://redis:6379/0
      RISK_QA_RUNTIME: ${RISK_QA_RUNTIME:-}
      RISK_QA_PRODUCTION_ENABLED: ${RISK_QA_PRODUCTION_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # All advisory Worker calls use the same Gateway contract. Empty base URL
      # intentionally keeps the local Ollama fallback for development only.
      WORKER_MODEL_BASE_URL: ${WORKER_MODEL_BASE_URL:-}
      WORKER_MODEL_EXECUTION_CONTEXT: container
      WORKER_MODEL_NAME: ${WORKER_MODEL_NAME:-qwen2.5-14b-instruct-awq}
      WORKER_MODEL_API_KEY: ${WORKER_MODEL_API_KEY:-vllm}
      WORKER_MODEL_TIMEOUT_SECONDS: ${WORKER_MODEL_TIMEOUT_SECONDS:-120}
      WORKER_MODEL_REGISTRY_PATH: ${WORKER_MODEL_REGISTRY_PATH:-/app/departments/01-research/config/worker_model_registry.json}
      OLLAMA_BASE_URL: ${OLLAMA_DOCKER_BASE_URL:-http://host.docker.internal:11434/v1}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3:1.7b}
      # Langfuse(2026-08-20). 본부장이 이 컨테이너 안에서 Worker(MCP 도구 경로 포함)를
      # 직접 돌리는 실행이 있다 - portfolio-bff/worker 계측만으로는 이 경로가 안 잡혀
      # HR 리포트에서 실제로 일한 Worker 가 UNOBSERVED 로 보였다. `.env`는
      # .dockerignore 라 컨테이너 안 load_dotenv 가 못 읽으므로 여기 명시한다.
      LANGFUSE_TRACING: ${LANGFUSE_TRACING:-false}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      # Risk's independent Qwen compliance worker emits its LangGraph worker
      # trace here; the shared project keeps it attached to the request tree.
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-First}
      LANGSMITH_METRICS_PROJECT: ${LANGSMITH_METRICS_PROJECT:-HgFinance-Metrics}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-8}
      RISK_SERVICE_AUTH_SECRET: ${RISK_SERVICE_AUTH_SECRET:-}
      RISK_SERVICE_AUTH_ISSUER: ${RISK_SERVICE_AUTH_ISSUER:-}
      RISK_SERVICE_AUTH_AUDIENCE: ${RISK_SERVICE_AUTH_AUDIENCE:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8041:8000"   # 로컬 전용 - 외부 노출 금지 (research-api와 같은 정책)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/risk/v1/observability/runtime', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64

  # audit-api: Evidence QA, Trace, Tool Permission, Finding, Incident 조회면.
  audit-api:
    build:
      context: .
      dockerfile: departments/06-ai-qa-audit/Dockerfile
    container_name: hedgefund-audit-api
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${RISK_QA_DATABASE_URL:-${DATABASE_URL:-}}
      DATABASE_SESSION_URL: ${RISK_QA_DATABASE_SESSION_URL:-}
      DATABASE_RUNTIME_ROLE: ${AUDIT_API_DATABASE_RUNTIME_ROLE:-svc_audit_api}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-First}
      LANGSMITH_METRICS_PROJECT: ${LANGSMITH_METRICS_PROJECT:-HgFinance-Metrics}
      LANGSMITH_EVALS_PROJECT: ${LANGSMITH_EVALS_PROJECT:-HgFinance-Evals}
      LANGSMITH_FEEDBACK_MODE: ${LANGSMITH_FEEDBACK_MODE:-shadow}
      LANGSMITH_FEEDBACK_STATE_PATH: /var/lib/portfolio/langsmith-feedback.sqlite3
      REDIS_URL: redis://redis:6379/0
      RISK_QA_EVENT_REDIS_URL: redis://redis:6379/0
      RISK_QA_RUNTIME: ${RISK_QA_RUNTIME:-}
      RISK_QA_PRODUCTION_ENABLED: ${RISK_QA_PRODUCTION_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      WORKER_MODEL_BASE_URL: ${WORKER_MODEL_BASE_URL:-}
      WORKER_MODEL_EXECUTION_CONTEXT: container
      WORKER_MODEL_NAME: ${WORKER_MODEL_NAME:-qwen2.5-14b-instruct-awq}
      WORKER_MODEL_API_KEY: ${WORKER_MODEL_API_KEY:-vllm}
      WORKER_MODEL_TIMEOUT_SECONDS: ${WORKER_MODEL_TIMEOUT_SECONDS:-120}
      WORKER_MODEL_REGISTRY_PATH: ${WORKER_MODEL_REGISTRY_PATH:-/app/departments/01-research/config/worker_model_registry.json}
      OLLAMA_BASE_URL: ${OLLAMA_DOCKER_BASE_URL:-http://host.docker.internal:11434/v1}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3:1.7b}
      # Langfuse(2026-08-20). 본부장이 이 컨테이너 안에서 Worker(MCP 도구 경로 포함)를
      # 직접 돌리는 실행이 있다 - portfolio-bff/worker 계측만으로는 이 경로가 안 잡혀
      # HR 리포트에서 실제로 일한 Worker 가 UNOBSERVED 로 보였다. `.env`는
      # .dockerignore 라 컨테이너 안 load_dotenv 가 못 읽으므로 여기 명시한다.
      LANGFUSE_TRACING: ${LANGFUSE_TRACING:-false}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-8}
      QA_SERVICE_AUTH_SECRET: ${QA_SERVICE_AUTH_SECRET:-}
      QA_SERVICE_AUTH_ISSUER: ${QA_SERVICE_AUTH_ISSUER:-}
      QA_SERVICE_AUTH_AUDIENCE: ${QA_SERVICE_AUTH_AUDIENCE:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - portfolio_runtime_data:/var/lib/portfolio
    ports:
      - "127.0.0.1:8042:8000"   # 로컬 전용 - 외부 노출 금지
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64

  # Canonical AI Office frontend.  This is separate from the Hermes dashboard:
  # it serves the read-only operator UI and sends browser calls through its
  # same-origin /bff proxy to portfolio-bff.  No Hermes credentials or Docker
  # socket are exposed to this container.
  ai-office:
    build:
      context: .
      dockerfile: ai-office/Dockerfile
      args:
        # This is a non-secret Discord→public UUID fixture binding used by the
        # existing closed-network UI contract; secrets are never build args.
        DISCORD_ACTOR_MAP: ${DISCORD_ACTOR_MAP:-}
    container_name: hedgefund-ai-office
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      portfolio-bff:
        condition: service_healthy
    environment:
      BFF_ORIGIN: ${AI_OFFICE_BFF_ORIGIN:-http://portfolio-bff:8000}
    ports:
      - "127.0.0.1:${AI_OFFICE_PORT:-3004}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 768m
    mem_reservation: 256m
    cpus: 1.0
    pids_limit: 128

  # qa-worker: Risk Decision Stream을 QA Audit 수신 이력으로 적재한다(qa_events/worker.py).
  # audit-api와 같은 Image, command만 다르다(계획서 3.1). REDIS_URL 없으면 즉시 종료하는
  # 프로세스라 여기서는 `:?`로 필수 처리한다(다른 서비스는 REDIS_URL이 선택值).
  qa-worker:
    build:
      context: .
      dockerfile: departments/06-ai-qa-audit/Dockerfile
    container_name: hedgefund-qa-worker
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: ["python", "qa_events/worker.py"]
    working_dir: /app/departments/06-ai-qa-audit
    depends_on:
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${RISK_QA_DATABASE_URL:-${DATABASE_URL:-}}
      DATABASE_SESSION_URL: ${RISK_QA_DATABASE_SESSION_URL:-}
      DATABASE_RUNTIME_ROLE: ${QA_WORKER_DATABASE_RUNTIME_ROLE:-svc_qa_worker}
      QA_FORWARD_ACCEPTANCE_RETRY_SECONDS: ${QA_FORWARD_ACCEPTANCE_RETRY_SECONDS:-30}
      RISK_QA_EVENT_REDIS_URL: ${RISK_QA_EVENT_REDIS_URL:-redis://redis:6379/0}
      QA_EVENT_POLL_INTERVAL_SECONDS: ${QA_EVENT_POLL_INTERVAL_SECONDS:-1}
      QA_WORKER_HEALTH_CONNECT_TIMEOUT_SECONDS: ${QA_WORKER_HEALTH_CONNECT_TIMEOUT_SECONDS:-3}
    healthcheck:
      test: ["CMD", "python", "qa_events/worker.py", "--healthcheck"]
      interval: 10s
      timeout: 8s
      retries: 5
      start_period: 10s
    mem_limit: 256m
    cpus: 0.3
    pids_limit: 64
    stop_grace_period: 20s

  # risk-hermes / qa-hermes: research-hermes/quant-hermes와 같은 패턴 - Hermes는 Backend
  # Image에 안 넣고 공식 Image를 별도 Container로 띄운다(계획서 3.1). Provider는 하드코딩
  # 하지 않는다 - /opt/data/config.yaml(provider:)과 auth.json이 결정한다(Risk/QA 둘 다
  # Codex 배정, 2026-08-10 확정 매핑).
  risk-hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hedgefund-risk-hermes
    restart: unless-stopped
    command: ["sleep", "infinity"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - /home/ubuntu/.hermes/profiles/risk-management:/opt/data
      # 저장소 skills/ **전체**를 건다. finance 만 걸면 다른 범주의 스킬을
      # 요구한 카드가 'Unknown skill(s)' 로 65초 만에 죽는다(2026-08-14 실측:
      # wiring-audit·dataset-engineering 요구 카드 3장). 저장소에는 스킬이
      # 10 갈래인데 마운트는 한 갈래뿐이었다. 노출 != 배정이다 -
      # 어느 프로필이 무엇을 쓸 수 있는지는 orchestration/skill_contract.py 가 정한다.
      - ./skills:/opt/shared-skills:ro
      - /home/ubuntu/.hermes/shared-kanban:/opt/kanban
    environment:
      HERMES_UID: 1000
      HERMES_GID: 1000
      HERMES_HOME: /opt/data
      HERMES_PROFILE: risk-management
      HERMES_KANBAN_HOME: /opt/kanban
      HERMES_KANBAN_DB: /opt/kanban/kanban.db
      HERMES_KANBAN_DISPATCH_IN_GATEWAY: "false"
    mem_limit: 1g
    mem_reservation: 192m
    cpus: 1.0
    pids_limit: 256
    stop_grace_period: 20s

  qa-hermes:
    build:
      context: .
      dockerfile: Dockerfile.hermes-discord
    image: hedgefund-hermes-discord:qa-feedback-v1
    container_name: hedgefund-qa-hermes
    restart: unless-stopped
    command: ["sleep", "infinity"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - /home/ubuntu/.hermes/profiles/qa-department:/opt/data
      # 저장소 skills/ **전체**를 건다. finance 만 걸면 다른 범주의 스킬을
      # 요구한 카드가 'Unknown skill(s)' 로 65초 만에 죽는다(2026-08-14 실측:
      # wiring-audit·dataset-engineering 요구 카드 3장). 저장소에는 스킬이
      # 10 갈래인데 마운트는 한 갈래뿐이었다. 노출 != 배정이다 -
      # 어느 프로필이 무엇을 쓸 수 있는지는 orchestration/skill_contract.py 가 정한다.
      - ./skills:/opt/shared-skills:ro
      - /home/ubuntu/.hermes/shared-kanban:/opt/kanban
      # QA-only worker boundary: preserve Hermes behavior while converting a
      # clean exit without a Kanban terminal marker into the existing block
      # handoff. The shared dispatcher selects this wrapper for worker
      # subprocesses and its profile gate keeps other profiles unchanged.
      - ./scripts:/opt/hgfinance/scripts:ro
    environment:
      HERMES_UID: 1000
      HERMES_GID: 1000
      HERMES_HOME: /opt/data
      HERMES_PROFILE: qa-department
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-First}
      HERMES_KANBAN_HOME: /opt/kanban
      HERMES_KANBAN_DB: /opt/kanban/kanban.db
      HERMES_KANBAN_DISPATCH_IN_GATEWAY: "false"
      HERMES_BIN: /opt/hgfinance/scripts/qa_hermes_worker.py
      QA_DISCORD_CHANNEL_ID: ${QA_DISCORD_CHANNEL_ID:-1541636723006775477}
      # This is the dedicated QA room. It lets the exact self-authored
      # observability marker reach Hermes without creating an extra bot.
      DISCORD_FREE_RESPONSE_CHANNELS: ${QA_DISCORD_FREE_RESPONSE_CHANNELS:-1541636723006775477}
      QA_DISCORD_APPROVER_USER_IDS: ${QA_DISCORD_APPROVER_USER_IDS:-}
      QA_DISCORD_APPROVER_ROLE_IDS: ${QA_DISCORD_APPROVER_ROLE_IDS:-}
      QA_FEEDBACK_API_URL: http://audit-api:8000
      QA_API_AUTH_TOKEN: ${QA_API_AUTH_TOKEN:-}
    # Check the same uid/HOME as the gateway. Root and hermes can have separate
    # provider auth caches, so a root-only healthcheck can report a false ready.
    healthcheck:
      test: ["CMD-SHELL", "setpriv --reuid=1000 --regid=1000 --clear-groups env HOME=/opt/data /opt/hermes/.venv/bin/hermes auth status openai-codex 2>&1 | grep -q 'logged in'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    mem_limit: 1g
    mem_reservation: 192m
    cpus: 1.0
    pids_limit: 256
    stop_grace_period: 20s

  # CEO Office·Agent Workforce 인사팀(영주 소유) 서비스는 각자 Compose Fragment로 옮겼다 -
  # departments/00-ceo-office/compose.yaml, departments/07-agent-workforce/compose.yaml
  # (governance-api, notification-worker, ceo-hermes, workforce-api, improvement-worker,
  # workforce-hermes). 이 파일 상단 `include:` 참고.

  # 트레이딩·회계/포트폴리오본부(도현 소유) 서비스도 각자 Compose Fragment로 옮겼다 -
  # departments/02-trading/compose.yaml, departments/05-accounting-portfolio/compose.yaml
  # (trading-hermes, accounting-hermes). 이 파일 상단 `include:` 참고.

  # 부서가 실제로 어떻게 도는지 보는 창. 127.0.0.1 전용 - 외부 노출 금지.
  #
  # ▶ **기본 기동에서 제외했다**(profiles: [dashboard]). 실측 2026-08-02:
  #   대시보드는 0.0.0.0 바인딩 시 인증 없이는 기동을 거부하고 재시작 루프에
  #   빠진다(--insecure 로도 안 된다). Docker 는 컨테이너 안 127.0.0.1 을
  #   호스트로 게시할 수 없으므로 0.0.0.0 바인딩이 강제되고, 따라서 **인증
  #   설정이 선행 조건**이다. 비밀번호는 각자 정하는 값이라 저장소에 넣지 않는다.
  #
  #   쓰려면 둘 중 하나를 먼저 하고 `docker compose --profile dashboard up -d`:
  #     1) Basic Auth - 해시를 만들어 ~/.hermes/config.yaml 의
  #        dashboard.basic_auth.{username,password_hash} 에 넣는다.
  #        docker exec hedgefund-hermes python -c \
  #          "from plugins.dashboard_auth.basic import hash_password; \
  #           print(hash_password('<사용할 비밀번호>'))"
  #     2) Nous Portal OAuth - docker exec -it hedgefund-hermes hermes dashboard register
  #
  #   게시는 127.0.0.1 로 묶고 팀원 접근은 Tailscale 사설망으로만 한다
  #   (공유기 포트포워딩 금지 - 저장소 전역 규칙).
  hermes-dashboard:
    image: nousresearch/hermes-agent:latest
    container_name: hedgefund-hermes-dashboard
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    profiles: ["dashboard"]
    command: ["dashboard", "--host", "0.0.0.0", "--port", "9119", "--no-open"]
    # 대시보드는 4명 팀원이 함께 쓰는 **공용 운영/관리 콘솔**이다(2026-08-10) - CEO가
    # 사용자 질의마다 동적으로 만드는 Task Graph/Kanban(고정 파이프라인이 아니라
    # 그때그때 필요한 부서만 골라 병렬/순차 배치한 결과)의 상태·담당을 부서 경계
    # 없이 한 화면에서 보고 관리한다. 그래서 8개 profiles/ 전체와 공용 Kanban 상태가
    # 있는 공용 Hermes Home(~/.hermes) 전체를 마운트한다 - research-department 하나만
    # 보던 예전 구조에서 바뀌었다. 특정 부서에 종속되지 않으므로 depends_on도 두지
    # 않는다.
    #
    # ▶ 이건 **8개 실행 서비스(research-hermes 등)의 분리 원칙과는 다른 얘기다.**
    #   실행 서비스는 여전히 각자 /home/ubuntu/.hermes/profiles/<department> 하나만
    #   마운트해서 auth/config/memory/runtime을 독립 유지한다(위 "부서별 컨테이너
    #   1개 = 부서별 데이터 디렉터리 1개" 원칙 그대로) - 실행 격리를 없애는 게 아니다.
    #
    # ▶ **읽기 전용이 아니다.** 대시보드 화면 자체에 Profile CREATE, Config, Keys,
    #   Skills 편집 등이 있고 ~/.hermes를 RW로 마운트한다 - profile/config/shared
    #   상태를 조회할 뿐 아니라 그 화면에서 직접 바꾼다. 그래서 팀원 접근을
    #   127.0.0.1 + Tailscale 사설망 + 대시보드 자체 인증(위 안내)으로 제한한다.
    volumes:
      - /home/ubuntu/.hermes:/opt/data
    environment:
      HERMES_UID: 1000
      HERMES_GID: 1000
      HERMES_DASHBOARD_HOST: 0.0.0.0
      # Dashboard Chat의 /api/pty WebSocket(TUI)이 rebuild 경로에서 TUI 디렉터리를
      # 못 찾아 실패하는 upstream 이슈 대응 - 경로를 명시로 고정한다.
      HERMES_TUI_DIR: /opt/hermes/ui-tui
      # 대시보드 자체 HERMES_HOME은 /opt/data(=~/.hermes 전체)라 안 정하면
      # kanban_home()이 기본으로 /opt/data/kanban.db(=~/.hermes/kanban.db)를 본다 -
      # 8개 부서 컨테이너가 실제로 쓰는 보드(~/.hermes/shared-kanban/kanban.db, 위
      # research-hermes 주석 참고)와 다른 파일이라 이걸 명시로 맞춰야 같은 보드를 본다.
      HERMES_KANBAN_HOME: /opt/data/shared-kanban
      HERMES_KANBAN_DB: /opt/data/shared-kanban/kanban.db
    ports:
      - "127.0.0.1:9119:9119"   # 팀원 접근은 Tailscale 사설망 - 포트포워딩 금지
    mem_limit: 1536m
    cpus: 0.5
    pids_limit: 128

  # kanban-dispatcher: 8개 부서의 Kanban embedded dispatcher(위 HERMES_KANBAN_DISPATCH_IN_GATEWAY
  # 참고)를 대신하는 중앙 dispatcher 전용 컨테이너 - 유일하게 dispatch가 켜진 Gateway다.
  #
  # ▶ 왜 필요한가: Hermes dispatcher는 task를 spawn할 때 worker subprocess를
  #   `$HERMES_HOME/profiles/<assignee>`에서 찾는다(hermes_cli/profiles.py get_profile_dir).
  #   8개 부서 컨테이너는 /opt/data가 "그 부서 profile 내용 자체"라 profiles/ 서브
  #   디렉터리가 없어서 embedded dispatcher를 켜놔도 자기 자신에게 할당된 task조차
  #   spawn하지 못하고 skipped_nonspawnable로 건너뛴다. 그래서 8개 profiles/ 전체를
  #   볼 수 있는 컨테이너 하나가 전담한다.
  #
  # ▶ /home/ubuntu/.hermes 전체를 RW로 마운트한다(read-only 아님) - spawn된 worker가 해당
  #   profile 디렉터리를 자기 HERMES_HOME으로 그대로 써서 session/memory/log/state를
  #   기록하기 때문이다. 첫 기동 전 호스트에 `mkdir -p ~/.hermes/shared-kanban`이
  #   먼저 있어야 한다(위 research-hermes 주석 참고 - 없으면 Docker가 디렉터리 대신
  #   빈 파일을 만든다).
  #
  # ▶ 고권한 Infrastructure Component다 - 침해 시 8개 profile의 auth.json/memory/session에
  #   모두 접근 가능하다. 그래서 ports:를 절대 열지 않는다(외부/호스트에서 직접 접근할
  #   이유가 없다). security_opt(no-new-privileges) 등 추가 하드닝은 E2E 성공 후
  #   최소 변경 원칙에 따라 별도로 검토한다.
  #
  # ▶ 레인 예산 - 공장이 슬롯을 독점해 사용자 질의가 굶는 것을 막는다 (2026-08-14)
  #   dispatcher 의 HERMES_HOME config.yaml 에 아래를 둔다(런타임 설정이라 저장소에는
  #   값이 아니라 근거만 남긴다):
  #       kanban:
  #         max_in_progress: 3              # 보드 전체 동시 실행
  #         max_in_progress_per_profile: 1  # 한 부서가 슬롯을 다 먹지 못하게
  #   실측 근거: 공장 카드가 running 3 개를 전부 물어 CEO 질의 카드가 6 분 넘게
  #   ready 에 앉았다. 초과분은 skipped_per_profile_capped 로 분류돼 보인다.
  #
  #   현재 Hermes의 `run_daemon`은 매 tick `kanban.max_in_progress`를 다시 읽어
  #   board-wide 상한을 `dispatch_once`에 전달한다(2026-08-25 런타임 소스 확인).
  #   과거 버전은 이 상한을 누락했으므로 이미지 업그레이드 때 계약 테스트와 함께
  #   재확인한다. `max_in_progress_per_profile`은 standalone daemon 인자에 아직
  #   전달되지 않으므로, 사용자 보드의 최종 안전 상한은 board-wide 3이다.
  #
  #   최종 형태는 보드 분리다: 공장 전용 board + 전용 dispatcher 컨테이너
  #   (`hermes kanban --board <slug>`; 보드마다 DB·workspace·dispatcher 루프가 독립).
  #   그때 이 상한은 공장 쪽만 낮추면 된다.
  kanban-dispatcher:
    image: nousresearch/hermes-agent:latest
    container_name: hedgefund-kanban-dispatcher
    restart: unless-stopped
    depends_on:
      paper-order-orchestrator-mcp:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Hermes image의 공식 wrapped-runtime 경로를 사용한다. `init: true`가
    # 없으면 entrypoint가 PID 1이 되어 s6 `/init`와
    # `02-reconcile-profiles`가 모든 profiles/* gateway를 다시 시작한다.
    init: true
    # DEPRECATED standalone escape hatch. 이 컨테이너는 gateway가 아니라
    # Kanban dispatcher만 실행하므로 per-profile gateway를 supervise하지 않는다.
    command:
      ["/bin/sh", "-c", "python3 /app/repo/deploy/hermes-dispatch-guard/check_guard.py && exec hermes kanban daemon --force --interval \"$${KANBAN_DISPATCH_INTERVAL:-1}\" --pidfile /opt/data/shared-kanban/dispatcher.pid --verbose"]
    # Hermes 최신 s6 이미지에서는 Docker `user:` 고정을 사용하지 않는다.
    # 컨테이너는 root로 bootstrap한 뒤 HERMES_UID/HERMES_GID=1000으로
    # runtime user와 /opt/data 소유권을 host UID/GID에 맞춘다.
    volumes:
      - /home/ubuntu/.hermes:/opt/data
      # 저장소 skills/ **전체**를 건다. finance 만 걸면 다른 범주의 스킬을
      # 요구한 카드가 'Unknown skill(s)' 로 65초 만에 죽는다(2026-08-14 실측:
      # wiring-audit·dataset-engineering 요구 카드 3장). 저장소에는 스킬이
      # 10 갈래인데 마운트는 한 갈래뿐이었다. 노출 != 배정이다 -
      # 어느 프로필이 무엇을 쓸 수 있는지는 orchestration/skill_contract.py 가 정한다.
      - ./skills:/opt/shared-skills:ro
      # ▶ **에이전트는 여기서 뜬다 - 저장소가 보여야 한다** (2026-08-12 실측)
      #   이 두 줄이 override 에만 있어서 로컬에서만 보이고 AWS 에서는 안 보였다.
      #   그러면 같은 카드가 환경에 따라 다른 판정을 낸다 - 실제로 에이전트가
      #   `source_registry.py: ABSENT` 로 `BLOCKED` 를 냈고 리스크 게이트가 그걸
      #   받아 `NOT_RUNNABLE` 을 냈다. 파일은 있었다.
      #
      #   `/app/repo` 는 **읽기 전용**(진단·탐색), `/app/departments/04-quant-backtest`
      #   는 쓰기(퀀트가 고쳐도 되는 코드). 역할이 다르므로 경로도 다르다.
      - .:/app/repo:ro
      - ./departments/04-quant-backtest:/app/departments/04-quant-backtest
      - ./quant-data:/app/quant-data
    environment:
      PYTHONPATH: /app/repo/deploy/hermes-dispatch-guard
      HGFINANCE_DISPATCH_GUARD: "1"
      HERMES_HOME: /opt/data
      HERMES_UID: 1000
      HERMES_GID: 1000
      HERMES_KANBAN_HOME: /opt/data/shared-kanban
      HERMES_KANBAN_DB: /opt/data/shared-kanban/kanban.db
      HERMES_KANBAN_DISPATCH_IN_GATEWAY: "false"
      HERMES_BIN: /app/repo/scripts/qa_hermes_worker.py
      # The live board has operated at a one-second tick without queue buildup;
      # keep that latency behavior on fresh deployments too. Hermes still
      # enforces the board-wide max_in_progress cap on every daemon tick.
      KANBAN_DISPATCH_INTERVAL: ${KANBAN_DISPATCH_INTERVAL:-1}
      # Fast user-facing control-plane tasks only; standard analysis and
      # experiments keep profile budgets. The wrapper preserves explicit
      # per-task overrides and clamps these defaults to bounded ranges.
      HGFINANCE_FAST_ADVISORY_MAX_TURNS: ${HGFINANCE_FAST_ADVISORY_MAX_TURNS:-12}
      HGFINANCE_USER_RESPONSE_MAX_TURNS: ${HGFINANCE_USER_RESPONSE_MAX_TURNS:-12}
      HGFINANCE_USER_RESPONSE_REASONING: ${HGFINANCE_USER_RESPONSE_REASONING:-medium}
      # The dispatcher spawns the department workers, so MCP profile headers are
      # expanded from this process environment rather than a gateway container.
      MCP_RESEARCH_API_KEY: ${MCP_RESEARCH_API_KEY:-}
      MCP_TRADING_ORDER_API_KEY: ${MCP_TRADING_ORDER_API_KEY:?A generated 32-byte PAPER-order MCP key is required}
      # ▶ 에이전트는 이 컨테이너 **안에서** 뜨므로 자격도 여기 있어야 한다
      #   (2026-08-14 실측). 프로필 config 의 `env:` 에 ANTHROPIC_API_KEY 가 적혀
      #   있어도 hermes 는 그것으로 자격을 만들지 않는다 - 프로세스 환경변수를 본다.
      #   이 줄이 없으면 spawn 된 에이전트가 첫 호출에서 "No Anthropic credentials
      #   found" 로 즉사하고, 카드는 "worker exited cleanly without calling
      #   kanban_complete" 로 blocked 에 굳는다 - 원인이 카드 오류에 안 드러나는
      #   유형이라 컨테이너 재생성 후 한참 헤맸다.
      #   값 자체는 프록시가 무시한다(과금 경로는 base_url 의 호스트 프록시다).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    mem_limit: 1g
    mem_reservation: 192m
    cpus: 1.0
    pids_limit: 256
    stop_grace_period: 20s

  # Alpha factory queue is physically isolated from the user/CEO queue.
  # It has its own persistent SQLite DB, workspace tree, dispatcher process,
  # and cgroup.  The factory dispatcher mounts only profile state from the
  # shared Hermes home, so it cannot open the user board DB even accidentally.
  factory-kanban-init:
    image: nousresearch/hermes-agent:latest
    container_name: hedgefund-factory-kanban-init
    user: "0:0"
    restart: "no"
    network_mode: none
    entrypoint: ["/bin/sh", "-c"]
    command: ["install -d -o 1000 -g 1000 -m 0750 /opt/factory-kanban && chown -R 1000:1000 /opt/factory-kanban"]
    volumes:
      - factory_kanban_data:/opt/factory-kanban

  factory-kanban-dispatcher:
    image: nousresearch/hermes-agent:latest
    container_name: hedgefund-factory-kanban-dispatcher
    restart: unless-stopped
    depends_on:
      factory-kanban-init:
        condition: service_completed_successfully
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    init: true
    command:
      ["/bin/sh", "-c", "set -eu; python3 /app/repo/deploy/hermes-dispatch-guard/check_guard.py; if [ ! -f /opt/factory-kanban/kanban/boards/alpha-factory/board.json ]; then hermes kanban boards create alpha-factory --name 'Alpha Factory' --description 'Isolated continuous alpha discovery queue'; fi; hermes kanban --board alpha-factory init; exec hermes kanban --board alpha-factory daemon --force --interval \"$${FACTORY_KANBAN_DISPATCH_INTERVAL:-5}\" --max \"$${FACTORY_KANBAN_MAX_SPAWN_PER_TICK:-2}\" --pidfile /opt/factory-kanban/alpha-factory-dispatcher.pid --verbose"]
    volumes:
      - /home/ubuntu/.hermes/profiles:/opt/data/profiles
      - factory_kanban_data:/opt/factory-kanban
      - ./skills:/opt/shared-skills:ro
      - .:/app/repo:ro
      - ./departments/04-quant-backtest:/app/departments/04-quant-backtest
      - ./quant-data:/app/quant-data
    environment:
      PYTHONPATH: /app/repo/deploy/hermes-dispatch-guard
      HGFINANCE_DISPATCH_GUARD: "1"
      HERMES_HOME: /opt/data
      HERMES_UID: 1000
      HERMES_GID: 1000
      HERMES_KANBAN_HOME: /opt/factory-kanban
      HERMES_KANBAN_BOARD: alpha-factory
      HERMES_KANBAN_DISPATCH_IN_GATEWAY: "false"
      FACTORY_KANBAN_DISPATCH_INTERVAL: ${FACTORY_KANBAN_DISPATCH_INTERVAL:-5}
      FACTORY_KANBAN_MAX_SPAWN_PER_TICK: ${FACTORY_KANBAN_MAX_SPAWN_PER_TICK:-2}
      MCP_RESEARCH_API_KEY: ${MCP_RESEARCH_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "test -s /opt/factory-kanban/kanban/boards/alpha-factory/kanban.db"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    mem_limit: 8g
    mem_reservation: 192m
    cpus: 4.0
    pids_limit: 256
    stop_grace_period: 20s

  ceo-kanban-supervisor:
    build:
      context: .
      dockerfile: Dockerfile.ceo-supervisor
    image: hedgefund-ceo-supervisor:latest
    container_name: hedgefund-ceo-kanban-supervisor
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    init: true
    command: ["python3", "/opt/hgfinance/scripts/run_ceo_supervisor.py", "--interval", "1"]
    volumes:
      - /home/ubuntu/.hermes:/opt/data
      - .:/opt/hgfinance:ro
    environment:
      HERMES_HOME: /opt/data
      HERMES_UID: 1000
      HERMES_GID: 1000
      HERMES_KANBAN_HOME: /opt/data/shared-kanban
      HERMES_KANBAN_DB: /opt/data/shared-kanban/kanban.db
      # Read the existing durable event cursor in-process. The Hermes CLI
      # subprocess remains the code-level fallback when this is unset.
      CEO_SUPERVISOR_WATCH_SOURCE: sqlite
      HERMES_KANBAN_DISPATCH_IN_GATEWAY: "false"
      # Deferred Research -> Trading PAPER workflows bind the existing order
      # authority from the supervisor before the Trading card is unblocked.
      # Keep the isolated order login explicit; an empty value fails closed.
      ORDER_ORCHESTRATOR_DATABASE_URL: ${ORDER_ORCHESTRATOR_DATABASE_URL:-}
      ORDER_ORCHESTRATOR_DATABASE_ROLE: ${ORDER_ORCHESTRATOR_DATABASE_ROLE:-svc_order_orchestrator}
      PYTHONPATH: /opt/hgfinance
      # Langfuse(2026-08-20). Discord/웹 사용자 질의는 BFF 가 부서장을 직접 부르지
      # 않고 카드로 넘긴다 - 그 카드가 끝나는 것을 보는 유일한 프로세스가 여기다.
      # 이 키가 없으면 사용자 요청에서 비롯된 부서장 활동이 하나도 관측되지 않는다.
      LANGFUSE_TRACING: ${LANGFUSE_TRACING:-false}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      # Optional metadata-only LangSmith root lifecycle close. This is
      # fail-open and does not participate in Supervisor decisions.
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-First}
      MEMOHARNESS_D5_MODE: ${MEMOHARNESS_D5_MODE:-active}
      MEMOHARNESS_D5_DATABASE_URL: ${MEMOHARNESS_D5_DATABASE_URL:-postgresql://hgfinance_runtime:${HEDGEFUND_RUNTIME_DB_PASSWORD:?HEDGEFUND_RUNTIME_DB_PASSWORD is required}@timescaledb:5432/${HEDGEFUND_CONTROL_DB_NAME:-control}}
      MEMOHARNESS_D5_TOP_K: ${MEMOHARNESS_D5_TOP_K:-5}
      MEMOHARNESS_D5_STATEMENT_TIMEOUT_MS: ${MEMOHARNESS_D5_STATEMENT_TIMEOUT_MS:-1500}
      NOTION_TOKEN: ${NOTION_TOKEN:-}
      NOTION_CEO_DB: ${NOTION_CEO_DB:-}
      NOTION_RESEARCH_DB: ${NOTION_RESEARCH_DB:-}
      NOTION_RISK_DB: ${NOTION_RISK_DB:-}
      NOTION_QUANT_BACKTEST_DB: ${NOTION_QUANT_BACKTEST_DB:-}
      NOTION_TRADING_DB: ${NOTION_TRADING_DB:-}
      NOTION_ACCOUNTING_DB: ${NOTION_ACCOUNTING_DB:-}
      NOTION_QA_DB: ${NOTION_QA_DB:-}
      NOTION_HR_DB: ${NOTION_HR_DB:-}
      DATABASE_URL: ${DATABASE_URL:-}
      RISK_QA_DATABASE_URL: ${RISK_QA_DATABASE_URL:-}
      ACCOUNTING_API_URL: ${ACCOUNTING_API_URL:-http://accounting-api:8000}
      # Accounting/Portfolio primary tasks get a read-only snapshot attached
      # to their task body (orchestration/accounting_advisory_context.py) -
      # that profile has no shell tool, so this is its only path to confirmed
      # NAV/PnL/cash figures. Same canonical demo PAPER fund the reconciler
      # and dashboard already use.
      ACCOUNTING_ADVISORY_FUND_ID: ${ACCOUNTING_ADVISORY_FUND_ID:-3838f7d6-0c7c-4e54-85f3-316a451e7eeb}
      PORTFOLIO_BFF_INTERNAL_URL: ${PORTFOLIO_BFF_INTERNAL_URL:-http://portfolio-bff:8000}
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 0.5
    pids_limit: 128
    stop_grace_period: 20s

  # Retention is deliberately a separate maintenance lane. It performs the
  # expensive authoritative workflow reconstruction and owns no supervisor
  # event/watch loop, so active request latency is not coupled to cleanup.
  kanban-retention-worker:
    build:
      context: .
      dockerfile: Dockerfile.ceo-supervisor
    image: hedgefund-ceo-supervisor:latest
    container_name: hedgefund-kanban-retention-worker
    restart: unless-stopped
    init: true
    # Purge is enabled only through the worker's audit + 7-day age gate. The
    # root mutation remains bounded so one maintenance pass cannot drain the
    # historical board or compete with the supervisor for a long interval.
    command: ["python3", "/opt/hgfinance/orchestration/kanban_retention.py", "--interval", "${KANBAN_RETENTION_INTERVAL_SECONDS:-900}", "--max-archive-roots", "${KANBAN_RETENTION_MAX_ARCHIVE_ROOTS:-5}"]
    volumes:
      - /home/ubuntu/.hermes:/opt/data
      - .:/opt/hgfinance:ro
    environment:
      HERMES_HOME: /opt/data
      HERMES_UID: 1000
      HERMES_GID: 1000
      HERMES_KANBAN_HOME: /opt/data/shared-kanban
      HERMES_KANBAN_DB: /opt/data/shared-kanban/kanban.db
      HERMES_KANBAN_RETENTION_LOCK: /opt/data/shared-kanban/retention.lock
      HERMES_KANBAN_RETENTION_AUDIT_DB: /opt/data/shared-kanban/retention-audit.db
      HERMES_KANBAN_DISPATCH_IN_GATEWAY: "false"
      PYTHONPATH: /opt/hgfinance
      KANBAN_RETENTION_INTERVAL_SECONDS: ${KANBAN_RETENTION_INTERVAL_SECONDS:-900}
      KANBAN_RETENTION_ROOT_WORKERS: ${KANBAN_RETENTION_ROOT_WORKERS:-2}
      KANBAN_CLI_TIMEOUT_SECONDS: ${KANBAN_CLI_TIMEOUT_SECONDS:-30}
      # Retention reconstructs authoritative workflows in a long-lived
      # maintenance process. Do not retain full show payloads in the shared
      # read cache; this lane must stay bounded under the 256MB limit.
      KANBAN_READ_CACHE_TTL_SECONDS: "0"
      KANBAN_DONE_CACHE_TTL_SECONDS: "0"
      CEO_KANBAN_FETCH_WORKERS: "1"
    mem_limit: 256m
    mem_reservation: 64m
    cpus: 0.25
    pids_limit: 64
    stop_grace_period: 20s

  # MemoHarness D5 owns a separate Postgres relation from Kanban's SQLite
  # retention lane. Keep cleanup isolated from request/supervisor latency and
  # limit it to the Experience Bank table.
  memo-harness-retention-worker:
    build:
      context: .
      dockerfile: Dockerfile.ceo-supervisor
    image: hedgefund-ceo-supervisor:latest
    container_name: hedgefund-memo-harness-retention-worker
    restart: unless-stopped
    init: true
    command: ["python3", "/opt/hgfinance/orchestration/experience_retention.py", "--interval", "${MEMOHARNESS_D5_RETENTION_INTERVAL_SECONDS:-86400}"]
    volumes:
      - .:/opt/hgfinance:ro
    environment:
      PYTHONPATH: /opt/hgfinance
      # D5 is part of the private operational/control plane. Do not let a
      # stale hosted-Supabase D5 override point the maintenance worker at a
      # database that does not contain the Experience Bank relation.
      MEMOHARNESS_D5_DATABASE_URL: ${MEMOHARNESS_D5_DATABASE_URL:-postgresql://hgfinance_runtime:${HEDGEFUND_RUNTIME_DB_PASSWORD:?HEDGEFUND_RUNTIME_DB_PASSWORD is required}@timescaledb:5432/${HEDGEFUND_CONTROL_DB_NAME:-control}}
      MEMOHARNESS_D5_RETENTION_ENABLED: ${MEMOHARNESS_D5_RETENTION_ENABLED:-true}
      MEMOHARNESS_D5_RETENTION_INTERVAL_SECONDS: ${MEMOHARNESS_D5_RETENTION_INTERVAL_SECONDS:-86400}
      MEMOHARNESS_D5_RETENTION_BATCH_SIZE: ${MEMOHARNESS_D5_RETENTION_BATCH_SIZE:-500}
      MEMOHARNESS_D5_RETENTION_MAX_PRESSURE_BATCHES: ${MEMOHARNESS_D5_RETENTION_MAX_PRESSURE_BATCHES:-10}
      MEMOHARNESS_D5_RETENTION_VACUUM_ANALYZE: ${MEMOHARNESS_D5_RETENTION_VACUUM_ANALYZE:-true}
      MEMOHARNESS_D5_STATEMENT_TIMEOUT_MS: ${MEMOHARNESS_D5_STATEMENT_TIMEOUT_MS:-1500}
    mem_limit: 128m
    mem_reservation: 32m
    cpus: 0.1
    pids_limit: 32
    stop_grace_period: 20s

  # Notion is a projection sink, not a source of truth.  Keep its free-tier
  # workspace bounded in a separate maintenance lane; this worker archives
  # pages through the API after seven days and removes exact replay records.
  notion-retention-worker:
    build:
      context: .
      dockerfile: Dockerfile.ceo-supervisor
    image: hedgefund-ceo-supervisor:latest
    container_name: hedgefund-notion-retention-worker
    restart: unless-stopped
    init: true
    command: ["python3", "/opt/hgfinance/orchestration/adapters/notion_retention.py", "--interval", "${NOTION_RETENTION_INTERVAL_SECONDS:-86400}"]
    volumes:
      - .:/opt/hgfinance:ro
    environment:
      PYTHONPATH: /opt/hgfinance
      NOTION_TOKEN: ${NOTION_TOKEN:-}
      NOTION_CEO_DB: ${NOTION_CEO_DB:-}
      NOTION_BRIEFING_DB: ${NOTION_BRIEFING_DB:-}
      NOTION_RESEARCH_DB: ${NOTION_RESEARCH_DB:-}
      NOTION_TRADING_DB: ${NOTION_TRADING_DB:-}
      NOTION_RISK_DB: ${NOTION_RISK_DB:-}
      NOTION_QUANT_BACKTEST_DB: ${NOTION_QUANT_BACKTEST_DB:-}
      NOTION_ACCOUNTING_DB: ${NOTION_ACCOUNTING_DB:-}
      NOTION_QA_DB: ${NOTION_QA_DB:-}
      NOTION_HR_DB: ${NOTION_HR_DB:-}
      NOTION_RETENTION_ENABLED: ${NOTION_RETENTION_ENABLED:-true}
      NOTION_RETENTION_DAYS: ${NOTION_RETENTION_DAYS:-7}
      NOTION_RETENTION_DEDUPE_EXACT: ${NOTION_RETENTION_DEDUPE_EXACT:-true}
      NOTION_RETENTION_BATCH_SIZE: ${NOTION_RETENTION_BATCH_SIZE:-250}
      NOTION_RETENTION_INTERVAL_SECONDS: ${NOTION_RETENTION_INTERVAL_SECONDS:-86400}
    mem_limit: 128m
    mem_reservation: 32m
    cpus: 0.1
    pids_limit: 32
    stop_grace_period: 20s

  # Discord cleanup is likewise isolated from ingress and mirror projection.
  # The scheduled path has a seven-day age gate; current incident cleanup is
  # an explicit one-shot command and is never enabled by this service default.
  discord-retention-worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: hedgefund-portfolio-bff:latest
    container_name: hedgefund-discord-retention-worker
    restart: unless-stopped
    init: true
    depends_on:
      redis:
        condition: service_healthy
    command: ["python", "/app/orchestration/discord_retention.py", "--interval", "${DISCORD_RETENTION_INTERVAL_SECONDS:-86400}"]
    volumes:
      - /home/ubuntu/.hermes:/opt/data:ro
      - ./orchestration/discord_retention.py:/app/orchestration/discord_retention.py:ro
    environment:
      PYTHONPATH: /app:/app/apps/api
      HERMES_HOME: /opt/data
      HERMES_PROFILE: ceo-agent
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      UI_MIRROR_REDIS_URL: ${UI_MIRROR_REDIS_URL:-${REDIS_URL:-redis://redis:6379/0}}
      UI_MIRROR_STREAM: ${UI_MIRROR_STREAM:-hf:ui-ceo-mirror:v1}
      DISCORD_BOT_TOKEN_CEO: ${DISCORD_BOT_TOKEN_CEO:-}
      DISCORD_CEO_CHANNEL_ID: ${DISCORD_CEO_CHANNEL_ID:-}
      DISCORD_RETENTION_CHANNEL_IDS: ${DISCORD_RETENTION_CHANNEL_IDS:-}
      DISCORD_RETENTION_ENABLED: ${DISCORD_RETENTION_ENABLED:-true}
      DISCORD_RETENTION_DAYS: ${DISCORD_RETENTION_DAYS:-7}
      DISCORD_RETENTION_MAX_MESSAGES: ${DISCORD_RETENTION_MAX_MESSAGES:-500}
      DISCORD_RETENTION_MAX_REQUESTS: ${DISCORD_RETENTION_MAX_REQUESTS:-500}
      DISCORD_RETENTION_INTERVAL_SECONDS: ${DISCORD_RETENTION_INTERVAL_SECONDS:-86400}
    mem_limit: 128m
    mem_reservation: 32m
    cpus: 0.1
    pids_limit: 64
    stop_grace_period: 20s

  # ── 방법론 스카우트 도구 면 (2026-08-10, 재일) ─────────────────────────────
  # **기본 `docker compose up` 에서는 뜨지 않는다.** profiles 로 묶어 두었으니
  # `docker compose --profile research-skills up -d` 로만 기동한다 - 검증 전
  # 서비스가 기존 스택 기동을 깨뜨리지 않게 하려는 것이다.
  #
  # 둘 다 **API 키가 필요 없다**(키가 필요한 OpenAlex 커넥터는 쓰지 않는다).
  # 최초 기동 후 `hermes -p research-department mcp test paper-search` 로 계약을
  # 확인하고 나서 프로필 config 의 enabled 를 true 로 올린다.
  paper-search-mcp:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    container_name: hedgefund-paper-search-mcp
    profiles: ["research-skills"]
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: ["uvx", "paper-search-mcp", "--transport", "http", "--port", "8041"]
    environment:
      # Unpaywall 만 연락처 이메일을 요구한다(키가 아니다). 없으면 그 소스만 빠진다.
      UNPAYWALL_EMAIL: ${UNPAYWALL_EMAIL:-}

  youtube-transcript-mcp:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    container_name: hedgefund-youtube-transcript-mcp
    profiles: ["research-skills"]
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: ["uvx", "--from", "mcp-youtube-transcript", "mcp-youtube-transcript",
              "--transport", "http", "--port", "8042"]

  # ──────────────────────────────────────────────────────────────────────────
  # 공장 상주 3종 (재일님 결정 2026-08-12)
  #
  # 셋 다 호스트 셸 프로세스였다. 세션이 끊기거나 Docker 를 재기동하면 **공장이
  # 조용히 멈추고 아무도 안 알려줬다** - 실측으로 새벽 3시대에 죽은 것을 다섯
  # 시간 뒤에 발견했다. `restart: unless-stopped` 가 그것을 없앤다.
  #
  # 셋이 같은 이미지를 쓴다(Dockerfile.factory). 저장소 코드가 같으므로 이미지를
  # 나누면 배포마다 버전이 어긋난다.
  #
  # ▶ docker 소켓을 물리는 이유
  #   칸반 보드는 Windows 바인드 마운트 위의 SQLite 다. 컨테이너 밖에서 그 파일을
  #   직접 열면 `-shm` 매핑이 생겨 **부서 컨테이너의 보드 쓰기가 전부 죽는다**.
  #   그래서 보드 접근은 `docker exec <부서 컨테이너>` 로만 한다. 데몬이 아니라
  #   클라이언트만 이미지에 있다(docker-outside-of-docker).
  # ──────────────────────────────────────────────────────────────────────────
  factory-autopilot:
    build:
      context: .
      dockerfile: Dockerfile.factory
    image: hedgefund-factory:latest
    container_name: hedgefund-factory-autopilot
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: ["python", "departments/01-research/factory/factory_autopilot.py",
              "--loop", "--interval-min", "15"]
    depends_on:
      timescaledb:
        condition: service_healthy
      factory-kanban-dispatcher:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?.env 에 DATABASE_URL 이 필요하다}
      TIMESCALE_DATABASE_URL: postgresql://postgres:${HEDGEFUND_TSDB_PASSWORD:?}@timescaledb:5432/market
      # 카드 생성·보드 조회를 돌릴 컨테이너. 부서에 매이지 않는 kanban 명령용이다.
      # Never route factory reads/writes through the user/CEO dispatcher.
      KANBAN_CLI_CONTAINER: hedgefund-factory-kanban-dispatcher
      KANBAN_READER_CONTAINER: hedgefund-factory-kanban-dispatcher
      FACTORY_KANBAN_BOARD: alpha-factory
      KANBAN_ATTACH_ROOT: /opt/factory-kanban/kanban/boards/alpha-factory/attachments
      KANBAN_WORKSPACE_ROOT: /opt/factory-kanban/kanban/boards/alpha-factory/workspaces
      KANBAN_ACCESS_MODE: docker
      HERMES_EXEC_MODE: docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # 수확 멱등 표식·반려 이력이 재시작을 넘어 남아야 한다. 컨테이너가
      # 지워지면 같은 카드를 다시 수확하고 같은 반려를 다시 싣는다.
      - factory_state:/root
      - factory_kanban_data:/opt/factory-kanban:ro
      # ▶ 자동 조종이 하루 한 번 파티션을 다시 굳힌다(0.7단계). 이게 없으면
      #   컨테이너 안에만 쓰고 사라져, 워커가 읽을 때는 파일이 없다 -
      #   "게이트는 통과했는데 로드에서 죽는" 상태가 매일 재생산된다.
      - ./quant-data:/app/quant-data

  factory-experiment-worker:
    image: hedgefund-factory:latest
    container_name: hedgefund-experiment-worker
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: ["python", "departments/04-quant-backtest/pipeline/experiment_worker.py",
              "--serve"]
    depends_on:
      factory-autopilot:
        # The worker must not consume hypotheses from a factory whose AST
        # registry or execution files differ from the sealed image contract.
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    environment:
      DATABASE_URL: ${QUANT_DATABASE_URL:-${DATABASE_URL:?}}
      # SET ROLE is session state, so db_writer uses this explicit session DSN
      # or upgrades the standard Supavisor 6543 endpoint to session port 5432.
      DATABASE_SESSION_URL: ${QUANT_DATABASE_SESSION_URL:-}
      DATABASE_RUNTIME_ROLE: ${QUANT_DATABASE_RUNTIME_ROLE:-svc_quant}
      # 백테스트가 커버리지를 **실제로 재려면** 이게 있어야 한다. 없으면
      # NOT_RUNNABLE 로 막히는데, 로그만 보면 데이터가 모자란 것처럼 보인다.
      TIMESCALE_DATABASE_URL: postgresql://postgres:${HEDGEFUND_TSDB_PASSWORD:?}@timescaledb:5432/market
    volumes:
      # ▶ 파티션 실물 (2026-08-12). 매니페스트는 DB 에 있지만 **행 데이터는
      #   파일**이다(pit_dataset.py 머리말: "행 데이터 = quant-data/…csv.gz").
      #   backtest_runner 가 파티션마다 content_hash 를 재검증하므로 이게 없으면
      #   게이트를 통과한 실험이 로드 단계에서 죽는다. 실험이 전부 NOT_RUNNABLE
      #   이던 동안에는 로드까지 가지 못해 이 구멍이 드러나지 않았다.
      #   pit_dataset.DATA_ROOT 가 `parents[3]/quant-data` = /app/quant-data 다.
      - ./quant-data:/app/quant-data
      # Keep the rebuildable evolutionary-screen cache off the host OneDrive
      # bind while retaining governed datasets on the canonical quant-data path.
      - intraday_sample_cache:/app/quant-data/intraday-discovery-cache

  card-watchdog:
    image: hedgefund-factory:latest
    container_name: hedgefund-card-watchdog
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: ["python", "apps/api/card_watchdog.py", "--loop", "--interval-min", "3"]
    depends_on:
      factory-autopilot:
        condition: service_started
    environment:
      KANBAN_CLI_CONTAINER: ${KANBAN_CLI_CONTAINER:-hedgefund-qa-hermes}
      KANBAN_READER_CONTAINER: ${KANBAN_READER_CONTAINER:-hedgefund-qa-hermes}
      KANBAN_ACCESS_MODE: docker
      HERMES_EXEC_MODE: docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # 페이퍼 전략 컨테이너(mlpipe-paper) 상태·전원 제어. `portfolio-bff`가 이
  # 저장소에서 유일하게 외부에 노출되는 서비스라 거기에 docker 소켓을 직접
  # 물리지 않는다(`ui-bff`의 "Docker-exec transport"를 물려받지 않기로 한
  # 결정과 같은 이유, 아래 ui-bff 주석 참고) - card-watchdog과 같은
  # docker-outside-of-docker 선례를 그대로 따른다. host 포트를 publish하지
  # 않는다 - `portfolio-bff`만 내부 네트워크로 부른다
  # (`STRATEGY_RUNTIME_API_URL`).
  strategy-runtime-control:
    image: hedgefund-factory:latest
    container_name: hedgefund-strategy-runtime-control
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: ["python", "-m", "uvicorn", "strategy_runtime_server:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      PYTHONPATH: /app:/app/apps/api
      MLPIPE_PAPER_HOME: /mlpipe-paper
      # 기본은 꺼져 있다 - 운영자가 명시적으로 켜야 전원 조작이 된다
      # (`apps/api/strategy_runtime.py` 머리말의 기본값 정책).
      ENABLE_STRATEGY_CONTAINER_CONTROL: ${ENABLE_STRATEGY_CONTAINER_CONTROL:-false}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # 읽기 전용 - 이 서비스는 원장·팩 파일을 읽기만 한다. 쓰기는 컨테이너
      # 자신(mlpipe-paper)만 한다.
      - /home/ubuntu/mlpipe-paper:/mlpipe-paper:ro

  # BFF (apps/api). 프런트(ai-office)가 붙는 유일한 관문이다.
  # 이것도 호스트 셸 프로세스였다 - 프런트가 "BFF 연결 대기 중" 만 띄우고
  # 아무도 왜인지 몰랐다. 공장 상주와 같은 이유로 컨테이너에 올린다.
  ui-bff:
    # Legacy duplicate of apps.api.main:app. The canonical production ingress
    # is portfolio-bff above; keep this profile only for explicit rollback or
    # comparison and never enable it in the default Compose stack.
    profiles: ["legacy-ui-bff"]
    image: hedgefund-factory:latest
    container_name: hedgefund-ui-bff
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: ["python", "-m", "uvicorn", "apps.api.main:app",
              "--host", "0.0.0.0", "--port", "8001"]
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?}
      # Web/Discord CEO 미러링은 기존 Compose Redis를 request/event dedup 저장소로 사용한다.
      # [local/test] Redis가 없으면 테스트에서 InMemoryMirrorStore를 명시적으로 주입한다.
      # [production] AWS에서는 이 값을 비우지 않는다. 저장소 장애 시 CEO 요청을 503으로 차단한다.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      UI_MIRROR_REDIS_URL: ${UI_MIRROR_REDIS_URL:-}
      UI_MIRROR_STREAM: ${UI_MIRROR_STREAM:-hf:ui-ceo-mirror:v1}
      UI_MIRROR_DEDUPE_TTL_SECONDS: ${UI_MIRROR_DEDUPE_TTL_SECONDS:-604800}
      TIMESCALE_DATABASE_URL: postgresql://postgres:${HEDGEFUND_TSDB_PASSWORD:?}@timescaledb:5432/market
      # 부서 호출·카드 생성이 전부 docker exec 로 나간다.
      HERMES_EXEC_MODE: docker
      KANBAN_ACCESS_MODE: docker
      KANBAN_CLI_CONTAINER: ${KANBAN_CLI_CONTAINER:-hedgefund-qa-hermes}
      KANBAN_READER_CONTAINER: ${KANBAN_READER_CONTAINER:-hedgefund-qa-hermes}
      # CEO 질의를 CLI 로 돌린다(API 키 없이). 2026-08-11 결정.
      CEO_TRANSPORT: ${CEO_TRANSPORT:-cli}
      ENABLE_CEO_CLI: ${ENABLE_CEO_CLI:-true}
      MARKET_API_URL: http://market-api:8036
      RESEARCH_API_URL: http://research-api:8035
      # ▶ 부서 API 주소. **컨테이너 DNS 이름**이어야 한다.
      #   risk.py 의 기본값은 `http://127.0.0.1:8041`(호스트 포트 매핑)이라
      #   컨테이너 안에서는 자기 자신을 가리켜 connection refused 가 된다.
      #   qa.py·governance_client.py 의 기본값은 빈 문자열이라 각각 503 /
      #   NOT_CONFIGURED 로 조용히 죽는다 - 2026-08-12 기동 시 실제로 셋 다
      #   그 상태였다(/health/ready 가 governance NOT_CONFIGURED 로 보고).
      #   부서 API 의 컨테이너 내부 포트는 전부 8000 이다(통합 계획 10.3절).
      RISK_API_URL: ${RISK_API_URL:-http://risk-api:8000}
      QA_API_URL: ${QA_API_URL:-http://audit-api:8000}
      GOVERNANCE_API_URL: ${GOVERNANCE_API_URL:-http://governance-api:8000}
      WORKFORCE_API_URL: ${WORKFORCE_API_URL:-http://workforce-api:8000}
      # ▶ 포트폴리오 파이프라인 Worker 런타임.
      #   이 둘이 없으면 `_configured_worker_runtime()` 이 `deterministic_test`
      #   로 떨어져 **부서 Worker 응답이 전부 TEST 고정문자열**이 된다. 컨테이너로
      #   옮기면서 빠져 있었다. risk-api/audit-api 와 같은 host ollama 를 쓴다.
      OLLAMA_BASE_URL: ${OLLAMA_DOCKER_BASE_URL:-http://host.docker.internal:11434/v1}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3:1.7b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-8}
      PORTFOLIO_WORKER_RUNTIME: ${PORTFOLIO_WORKER_RUNTIME:-ollama}
      # ▶ CEO 종합이 부서 산출물을 읽는 경로 (2026-08-12)
      #   apps/api/ceo.py 의 `_artifact_text()` 는 완료 카드의 **첨부·작업공간
      #   파일**을 읽는다. `result` 만 보면 부서가 몇 분씩 일한 결과가 통째로
      #   비어 보이기 때문이다(그 파일 주석의 2026-08-11 실측).
      #   그런데 이 컨테이너에 칸반이 안 물려 있어서 기본값
      #   `~/.hermes-shared-kanban/...` 가 **존재하지 않는 경로**였고, 결국
      #   모든 부서 카드의 산출물이 빈 문자열로 읽혔다. 호스트에는 첨부 35개·
      #   작업공간 18개가 실제로 쌓여 있었다.
      KANBAN_ATTACH_ROOT: /opt/kanban/kanban/attachments
      KANBAN_WORKSPACE_ROOT: /opt/kanban/kanban/workspaces
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # 읽기 전용이다 - BFF 는 산출물을 **읽기만** 한다. 카드 생성·전이는
      # `docker exec` 로 hermes CLI 를 통해 나간다(KANBAN_ACCESS_MODE=docker).
      - /home/ubuntu/.hermes/shared-kanban:/opt/kanban:ro

volumes:
  redis_data:
  tsdb_data:
  ls_token_cache:
  portfolio_runtime_data:
  factory_state:
  factory_kanban_data:
  intraday_sample_cache:
