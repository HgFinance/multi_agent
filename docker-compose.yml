# 로컬 개발용 시장 시계열 DB
#
# 담당: 재일 (리서치/퀀트)
# 근거: docs/database/README.md 2절(저장소 분리), 7절(적용 방법)
#       docs/01-product/HEDGE_FUND_CORE_PLAN.md 413행 "배포: Docker Compose, CI"
#
# ▶ 이 파일은 로컬 개발 전용이다. 나중에 VPS/AWS로 옮길 때 같은 파일을 그대로 쓰고
#   ports 바인딩과 비밀번호만 환경에 맞게 바꾼다.
#
# ▶ 같은 머신의 다른 프로젝트(Trading_bot: compose 프로젝트 `trading`, 컨테이너 10개)와
#   충돌하지 않도록 아래를 전부 분리했다. 두 프로젝트의 DB를 절대 공유하지 않는다 —
#   Canonical Migration 계열이 다르므로 같은 DB에 얹으면 계약이 깨진다.
#
#     프로젝트 이름  hedgefund          (trading 과 분리)
#     컨테이너      hedgefund-*         (trading-* 과 분리)
#     호스트 포트    5434               (trading-timescaledb 가 5432, trading-postgres 가 5433)
#     볼륨          hedgefund_tsdb_data (named volume)
#     네트워크      hedgefund_default   (compose 가 자동 생성)
#
# ▶ 볼륨은 반드시 named volume이다. bind mount로 이 저장소 경로에 두면 안 된다 —
#   저장소가 OneDrive 동기화 대상이라 Postgres 데이터 디렉터리가 동기화되면 손상된다.
#
# 사용법
#   docker compose up -d
#   docker compose logs -f timescaledb
#   docker compose down            # 컨테이너만 제거, 데이터는 볼륨에 남는다
#   docker compose down -v         # 데이터까지 삭제
#
# 마이그레이션 적용 (docs/database/README.md 7절)
#   docker compose exec -T timescaledb \
#     psql -U postgres -d market -v ON_ERROR_STOP=1 < timescaledb/migrations/001_initial_market_data.sql

name: hedgefund

# ▶ Compose Fragment 분리(계획서 10절, 2026-08-03) - "본부가 자기 Compose Fragment를
#   소유하도록 한다"는 목표 구조의 첫 단계다. 지금은 영주 소유 2개 부서(CEO Office, Agent
#   Workforce)만 옮겼다 - 남의 본부 서비스를 대신 옮기지 않는다(CLAUDE.md 원칙). 나머지
#   6개 부서는 각 담당자가 같은 방식으로 옮기면 된다. `include`된 파일도 이 파일의
#   서비스(redis 등)와 하나의 병합된 모델을 공유하므로 depends_on 등 상호 참조가 그대로 된다.
include:
  - departments/00-ceo-office/compose.yaml
  - departments/02-trading/compose.yaml
  - departments/05-accounting-portfolio/compose.yaml
  - departments/07-agent-workforce/compose.yaml

services:
  # Portfolio advisory API and worker share only the durable queue volume.
  # The API never embeds a worker by default; the worker owns queue claims.
  portfolio-bff:
    profiles: ["portfolio"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: hedgefund-portfolio-bff
    restart: unless-stopped
    environment:
      PYTHONPATH: /app:/app/apps/api
      ENABLE_AGENT_ASK: "true"
      ENABLE_KANBAN_TASK_TRACKING: "1"
      HERMES_BIN: /usr/local/bin/hermes
      HERMES_HOME: /opt/hermes-cli
      HERMES_KANBAN_HOME: /opt/kanban
      HERMES_CEO_API_URL: http://ceo-hermes:8642/v1
      HERMES_CEO_API_KEY: ${CEO_HERMES_API_KEY:-}
      PORTFOLIO_RUNTIME_STORE_PATH: /var/lib/portfolio/runtime.sqlite3
      PORTFOLIO_RUNTIME_EMBEDDED_WORKER: "false"
      PORTFOLIO_GOVERNANCE_BINDING_ENABLED: ${PORTFOLIO_GOVERNANCE_BINDING_ENABLED:-false}
      GOVERNANCE_API_URL: ${GOVERNANCE_API_URL:-}
      GOVERNANCE_API_AUTH_TOKEN: ${GOVERNANCE_API_AUTH_TOKEN:-}
    volumes:
      - portfolio_runtime_data:/var/lib/portfolio
      # BFF uses Hermes CLI only for the repository-owned Kanban create
      # boundary. CEO profile/auth stays inside ceo-hermes and is never
      # mounted here; the BFF has no gateway command or full ~/.hermes view.
      - /home/ubuntu/.hermes/shared-kanban:/opt/kanban
    ports:
      - "${PORTFOLIO_BFF_PORT:-8001}:8000"

  portfolio-worker:
    profiles: ["portfolio"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: hedgefund-portfolio-worker
    restart: unless-stopped
    command: ["python", "apps/api/portfolio_worker.py"]
    environment:
      PYTHONPATH: /app:/app/apps/api
      PORTFOLIO_RUNTIME_STORE_PATH: /var/lib/portfolio/runtime.sqlite3
      PORTFOLIO_RUNTIME_EMBEDDED_WORKER: "false"
      PORTFOLIO_WORKER_LEASE_SECONDS: ${PORTFOLIO_WORKER_LEASE_SECONDS:-60}
      PORTFOLIO_WORKER_POLL_SECONDS: ${PORTFOLIO_WORKER_POLL_SECONDS:-0.5}
    volumes:
      - portfolio_runtime_data:/var/lib/portfolio

  timescaledb:
    image: timescale/timescaledb-ha:pg17
    container_name: hedgefund-timescaledb
    restart: unless-stopped

    environment:
      POSTGRES_DB: market
      POSTGRES_PASSWORD: ${HEDGEFUND_TSDB_PASSWORD:?.env 에 HEDGEFUND_TSDB_PASSWORD 를 설정할 것}

    ports:
      # ▶ 팀원 조회 개방 (재일님 결정 2026-07-31, VPS 이전 전까지의 임시 체제)
      #   0.0.0.0 바인딩이지만 **공유기 NAT 뒤라 인터넷에는 노출되지 않는다.**
      #   절대 공유기 포트포워딩을 하지 않는다 - 팀원 접근은 Tailscale(사설망)
      #   IP 로만 한다. 팀원에게 주는 계정은 hedgefund_ro (읽기 전용, market
      #   스키마 SELECT 만 - INSERT 거부 검증됨). 관리자 계정은 리서치·퀀트만
      #   갖는다는 경계는 유지된다. VPS 이전 시 이 주석과 함께 재검토.
      - "0.0.0.0:5434:5432"

    volumes:
      - tsdb_data:/home/postgres/pgdata/data

    # ── 자원 격리 ──────────────────────────────────────────────────────────
    # Docker Desktop(Windows)은 모든 컨테이너를 단일 WSL2 VM 안에서 돌린다.
    # 따라서 CPU/RAM은 기본적으로 한 풀을 공유하며, 격리는 cgroup 상한으로 만든다.
    # 아래 값은 "이 컨테이너가 다른 프로젝트를 굶기지 않는다"를 보장한다.
    # 역방향 보호(다른 프로젝트가 우리를 굶기지 않기)는 그쪽에도 상한이 있어야 한다.
    #
    # 서버로 옮길 때는 cpuset 을 지우고 호스트 코어 수에 맞춰 cpus 만 조정한다.
    mem_limit: 4g              # 하드 상한. 초과 시 이 컨테이너만 OOM
    mem_reservation: 1g        # 소프트 보장 — 메모리 압박 시 커널이 우선 유지
    cpus: 2.0                  # 24코어 중 2코어 상당으로 제한
    cpuset: "22,23"            # 마지막 2코어에 핀 고정 (0~23 중)
    pids_limit: 512
    shm_size: 256mb            # 병렬 쿼리용 공유 메모리 (기본 64MB는 부족)

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d market"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── 상주형 뉴스 수집 (재일님 지시 2026-07-31: 수집기 컨테이너로 DB 즉시 적재) ──
  # NAVER 폴링 -> NewsSink -> Supabase(research.documents). 적재 지연은
  # research.news_ingest_latency(_hourly) View 로 확인한다.
  news-watcher:
    build:
      context: departments/01-research
    container_name: hedgefund-news-watcher
    restart: unless-stopped

    # ▶ env_file 로 .env 전체를 넣지 않는다 - LS·OpenAI 등 이 컨테이너가 쓸 일
    #   없는 Credential 까지 흘러든다. 필요한 것만 명시 주입한다.
    #   ${...} 값은 compose 가 저장소 루트 .env 에서 읽는다.
    environment:
      DATABASE_URL: ${DATABASE_URL:?.env 에 DATABASE_URL 이 필요하다}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:?.env 에 NAVER_CLIENT_ID 가 필요하다}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:?.env 에 NAVER_CLIENT_SECRET 이 필요하다}
      # 감시 종목은 watchlist_builder.py --basket 이 만든 파일이 기준이다
      # (코스피200 + 코스닥150 구성종목 - LS t1444 를 지수 업종코드 101/405 로 열거,
      #  재일님 지시 2026-07-31). 갱신: 호스트에서 --basket 후 up -d. 임시로 몇
      # 종목만 보려면 .env 의 NEWS_WATCH_SYMBOLS 가 파일보다 우선한다.
      NEWS_WATCH_SYMBOLS: ${NEWS_WATCH_SYMBOLS:-}
      NEWS_WATCH_SYMBOLS_FILE: config/news_watchlist.txt
      # ▶ 2계층 (재일님 지시 2026-08-03 "2계층으로 가자")
      #   Tier1 = 위 핵심 바스켓 350종목, 매 sweep. 속보는 여기서 잡는다.
      #   Tier2 = 코스피+코스닥 개별주 전종목 2,595, 남는 한도로 순회.
      #   전종목을 같은 빈도로 돌면 간격이 185분이 되어 속보성이 사라진다.
      NEWS_TIER2_SYMBOLS_FILE: config/full_universe.txt
      # 실측 2026-08-03 (한도 25,000, 상한 90% = 22,500):
      #   1500초 -> Tier1 만으로 21,000회, Tier2 는 sweep 당 1종목 = 사실상 안 돈다
      #   1800초 -> Tier1 16,800 + Tier2 sweep 당 118종목, 한 바퀴 10시간,
      #             합계 22,193회/일 (여유 307)
      # 5분을 양보하고 전종목을 하루 2.4회 훑는 쪽을 택했다.
      NEWS_POLL_INTERVAL_SECONDS: ${NEWS_POLL_INTERVAL_SECONDS:-1800}

    volumes:
      - ./departments/01-research/config:/app/departments/01-research/config:ro

    # 뉴스 폴링은 가볍다 - TimescaleDB 와 달리 상한을 좁게 잡는다
    mem_limit: 384m
    mem_reservation: 64m
    cpus: 0.5
    pids_limit: 64

    # SIGTERM 후 Sink 꼬리 Flush 가 끝날 시간을 준다 (기본 10초로도 충분하지만
    # DB 재시도 백오프와 겹칠 때를 위해 여유를 둔다)
    stop_grace_period: 30s

  # ── 상주형 LS 실시간 시세 수집 (재일님 지시 2026-07-31: 호가·체결도 Docker 로) ──
  # 컨테이너는 24시간, 소켓은 세션 창(동시호가 35분 전~마감 +10분)에서만 연다.
  # 구독은 뉴스와 같은 바스켓(코스피200+코스닥150 = 700구독)을 소켓 4개로 샤딩
  # (재일님 지시 "바스켓 종목만 구독" - 대규모 동시 구독은 krx-tick-collector 실증).
  ls-realtime:
    build:
      context: departments/01-research
    container_name: hedgefund-ls-realtime
    restart: unless-stopped
    command: ["python", "collectors/ls_realtime_service.py"]

    depends_on:
      timescaledb:
        condition: service_healthy

    environment:
      # Reference(세션·종목)는 Supabase, 시세 적재는 같은 compose 의 TimescaleDB.
      # 호스트의 127.0.0.1:5434 는 컨테이너 안에서 안 통한다 - 서비스 이름으로 간다.
      DATABASE_URL: ${DATABASE_URL:?.env 에 DATABASE_URL 이 필요하다}
      TIMESCALE_DATABASE_URL: postgresql://postgres:${HEDGEFUND_TSDB_PASSWORD:?}@timescaledb:5432/market
      LS_ENV: ${LS_ENV:-PAPER}
      LS_APP_KEY: ${LS_APP_KEY:-}
      LS_APP_SECRET_KEY: ${LS_APP_SECRET_KEY:-}
      LS_APP_KEY_PAPER: ${LS_APP_KEY_PAPER:-}
      LS_APP_SECRET_KEY_PAPER: ${LS_APP_SECRET_KEY_PAPER:-}
      LS_REST_BASE_URL: ${LS_REST_BASE_URL:-}
      LS_REST_BASE_URL_PAPER: ${LS_REST_BASE_URL_PAPER:-}
      LS_WS_BASE_URL: ${LS_WS_BASE_URL:-}
      LS_WS_BASE_URL_PAPER: ${LS_WS_BASE_URL_PAPER:-}
      # ▶ 전종목 구독 (2026-08-03, 재일님 지시)
      #   ETF·ETN 은 instrument_type 이 달라 애초에 안 들어온다(STOCK 만).
      #   거래정지·관리종목 등 제한 171 을 뺀 2,595종목 = 5,190구독 =
      #   소켓 26개(소켓당 200). 실계좌 웹소켓 세션 한도는 미확인이라
      #   전환 후 소켓 수와 유입을 반드시 확인한다 - 거절되면 즉시
      #   news_watchlist.txt(350종목)로 되돌린다.
      LS_WATCH_SYMBOLS_FILE: config/full_universe.txt

    volumes:
      - ./departments/01-research/config:/app/departments/01-research/config:ro

    # 장중 140구독 스트림 - 뉴스보다 처리량이 크다
    mem_limit: 768m
    mem_reservation: 128m
    cpus: 1.0
    pids_limit: 64

    stop_grace_period: 30s

  # ── 배치 수집기 스케줄러 (재일님 지시 2026-07-31: 나머지 수집기도 컨테이너로) ──
  # 공시(10분)·Breadth(10분, 세션은 수집기가 판정)·관측 Calendar·거시·재무·CA·
  # 기업개황(각 일 1회)을 한 컨테이너가 순차 실행한다. 전부 멱등 적재라 재시작
  # 후 재실행이 안전하다. 주기 근거는 TEAM_JAEIL 가이드 3.1 표.
  batch-collectors:
    build:
      context: departments/01-research
    container_name: hedgefund-batch-collectors
    restart: unless-stopped
    # --serve 가 필수다(2026-08-02). 인자가 없으면 자체 점검만 하고 끝난다 -
    # "python <파일> = 자체 점검"이라는 저장소 관례를 이 파일만 어겨서,
    # 전 모듈 점검 루프가 돌 때마다 상주 스케줄러가 조용히 떴다(4회).
    command: ["python", "collectors/collector_scheduler.py", "--serve"]

    depends_on:
      timescaledb:
        condition: service_healthy

    environment:
      DATABASE_URL: ${DATABASE_URL:?.env 에 DATABASE_URL 이 필요하다}
      TIMESCALE_DATABASE_URL: postgresql://postgres:${HEDGEFUND_TSDB_PASSWORD:?}@timescaledb:5432/market
      OPEN_DART_API_KEY: ${OPEN_DART_API_KEY:-}
      ECOS_API_KEY: ${ECOS_API_KEY:-}
      FRED_API_KEY: ${FRED_API_KEY:-}
      KOSIS_API_KEY: ${KOSIS_API_KEY:-}
      # 20:00 document-archive 가 공시 원문 ZIP 을 Storage 에 올린다 - 이 두 개가
      # 빠지면 upload() 가 KeyError 로 전건 실패한다 (2026-07-31 실측 597건)
      SUPABASE_URL: ${SUPABASE_URL:?.env 에 SUPABASE_URL 이 필요하다}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?.env 에 SUPABASE_SERVICE_ROLE_KEY 가 필요하다}
      # Breadth(t1511/t8424)와 관측 Calendar(t8410)가 LS REST 를 쓴다
      LS_ENV: ${LS_ENV:-PAPER}
      LS_APP_KEY: ${LS_APP_KEY:-}
      LS_APP_SECRET_KEY: ${LS_APP_SECRET_KEY:-}
      LS_APP_KEY_PAPER: ${LS_APP_KEY_PAPER:-}
      LS_APP_SECRET_KEY_PAPER: ${LS_APP_SECRET_KEY_PAPER:-}
      LS_REST_BASE_URL: ${LS_REST_BASE_URL:-}
      LS_REST_BASE_URL_PAPER: ${LS_REST_BASE_URL_PAPER:-}
      # label-snapshot Job 이 레짐·지정학 라벨을 계산하려면 부서 조회면이 필요하다.
      # 2026-08-02 실측: 기본값이 127.0.0.1 이라 컨테이너 안에서 Connection
      # refused 가 났다 - 같은 compose 네트워크의 서비스 이름으로 준다.
      MARKET_API_URL: http://market-api:8036
      RESEARCH_API_URL: http://research-api:8035

    # ▶ 2026-08-02 실측 사고: Dockerfile 이 config 를 COPY 하지 않아 이 컨테이너
    #   에는 config 디렉터리 자체가 없었다. 그래서 새로 넣은 Job 두 개가 조용히
    #   죽고 있었다 - geopolitical 은 FileNotFoundError(geopolitical_themes.txt),
    #   bluesky-watch 도 같은 이유. 스케줄러는 exit≠0 을 로그에 남기지만 **아무도
    #   안 보면 없는 것과 같다**(그래서 실패 알림이 백로그로 남는다).
    #   news-watcher·ls-realtime 은 이미 같은 마운트를 쓰고 있었다 - 이 컨테이너만
    #   빠져 있었다. COPY 대신 마운트로 맞추는 이유: 워치리스트·테마 파일은 코드
    #   배포 없이 고치라고 만든 것이라 이미지에 굽으면 그 목적이 사라진다.
    volumes:
      - ./departments/01-research/config:/app/departments/01-research/config:ro

    mem_limit: 512m
    mem_reservation: 64m
    cpus: 0.5
    pids_limit: 64

    # 진행 중 Job(최대 30분 timeout)을 마치게 두진 않는다 - 어차피 멱등이라
    # 다음 주기가 이어받는다. 짧게 정리하고 내린다.
    stop_grace_period: 20s

  # ── LS 실시간 뉴스 (NWS push - NAVER 와 병행 실측 중, 재일님 방침 2026-07-31) ──
  # 진짜 push 라 폴링 주기·일 한도가 없고 종목코드가 패킷에 붙어 온다.
  # 본문(t3102)은 약관 확인 전까지 저장하지 않는다 - 제목·메타만 적재.
  ls-news:
    build:
      context: departments/01-research
    container_name: hedgefund-ls-news
    restart: unless-stopped
    command: ["python", "collectors/ls_news_collector.py", "--run"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?.env 에 DATABASE_URL 이 필요하다}
      LS_ENV: ${LS_ENV:-PAPER}
      LS_APP_KEY: ${LS_APP_KEY:-}
      LS_APP_SECRET_KEY: ${LS_APP_SECRET_KEY:-}
      LS_APP_KEY_PAPER: ${LS_APP_KEY_PAPER:-}
      LS_APP_SECRET_KEY_PAPER: ${LS_APP_SECRET_KEY_PAPER:-}
      LS_REST_BASE_URL: ${LS_REST_BASE_URL:-}
      LS_WS_BASE_URL: ${LS_WS_BASE_URL:-}
      LS_WS_BASE_URL_PAPER: ${LS_WS_BASE_URL_PAPER:-}
    mem_limit: 256m
    cpus: 0.3
    pids_limit: 64
    stop_grace_period: 20s

  # ── market-api: 시세 읽기 전용 조회면 (F03 "DB 없이 Snapshot API" + 통합계획 6.2) ──
  # 트레이딩·리스크·팀원은 TSDB Credential 없이 이 API 로 Snapshot/Bar/Breadth/DQ 조회.
  market-api:
    build:
      context: departments/01-research
    container_name: hedgefund-market-api
    restart: unless-stopped
    working_dir: /app/departments/01-research/api
    command: ["uvicorn", "market_api:app", "--host", "0.0.0.0", "--port", "8036"]
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?}   # 심볼<->instrument 매핑(기동 시 1회)
      TIMESCALE_DATABASE_URL: postgresql://postgres:${HEDGEFUND_TSDB_PASSWORD:?}@timescaledb:5432/market
    ports:
      - "0.0.0.0:8036:8036"   # 팀원 조회용 - Tailscale/사설망 전제, 포트포워딩 금지
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64

  # ── research-api: Evidence 읽기 전용 조회면 (에이전트 배선의 시작점) ──
  # PIT(as_of) 기본, DB 세션 자체가 read-only. 뉴스/공시/재무 Evidence 를
  # LangGraph 직원 tool 이 여기서 읽는다 (DB 직접 접근 금지 - CLAUDE.md 원칙 1).
  research-api:
    build:
      context: departments/01-research
    container_name: hedgefund-research-api
    restart: unless-stopped
    working_dir: /app/departments/01-research/api
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8035"]

    environment:
      DATABASE_URL: ${DATABASE_URL:?.env 에 DATABASE_URL 이 필요하다}
      # /evidence/search 질의 임베딩(bge-m3)용. Ollama 는 호스트 프로세스라
      # 컨테이너 안의 127.0.0.1(기본값)로는 못 간다 - host.docker.internal 이
      # 컨테이너에서 호스트 Ollama 에 도달하는 유일한 경로다.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      # Tool Gateway 강제 모드. 기본은 관측(위반을 헤더·로그로만 드러냄) -
      # 기존 호출자(분석가 코드)가 아직 X-Agent-Persona 를 안 붙이므로 강제부터
      # 켜면 파이프라인이 통째로 멈춘다. 호출자를 다 고친 뒤 true 로 올린다.
      TOOL_GATEWAY_ENFORCE: ${TOOL_GATEWAY_ENFORCE:-false}

    # Docker Desktop(Windows/Mac)은 host.docker.internal 을 자동 제공하지만
    # 리눅스 엔진은 아니다 - host-gateway 매핑을 명시해 VPS 이전 시에도
    # 같은 compose 파일이 그대로 동작하게 한다(파일 상단 이전 원칙).
    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      # Tool Gateway 가 허용목록을 읽는다. **단일 출처는 config.yaml 이므로**
      # API 쪽에 목록을 복제하지 않고 파일을 그대로 마운트한다 - 복제하면
      # 둘이 어긋나고 어긋난 쪽이 조용히 이긴다. 읽기 전용.
      - ./departments/01-research/hermes:/app/departments/01-research/hermes:ro

    ports:
      - "127.0.0.1:8035:8035"   # 로컬 전용 - 외부 노출 금지

    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64

  # ── Hermes Agent Runtime (부서 Supervisor 계층) ────────────────────────────
  # 재일님 지시 2026-08-02 "팀원들이랑 도커로 관리하기로 했다".
  # 근거: DEPARTMENT_BACKEND_INTEGRATION_DOCKER_PLAN.md 3.1 - Hermes 는 Python
  #       Version·Tool 권한·Memory 가 달라 **Department Backend Image 에 설치하지
  #       않는다.** 공식 Image 를 별도 Container 로 띄운다.
  #
  # ── research-mcp: 부서 도구 면 (Hermes ↔ LangGraph 파이프라인의 다리) ──
  # 헤르메스는 부서 인터페이스·기억·위임 계층이고 분석 실체는 LangGraph 다
  # (TECH_STACK_DECISIONS 2절). 둘을 잇는 것이 도구 호출인데 그게 비어 있어서
  # 지금까지 헤르메스가 '대화만 되는 껍데기'로 보였다. 이 서비스가 그 다리다.
  #
  # 포트를 호스트에 게시하지 않는다 - 헤르메스 컨테이너가 같은 compose 네트워크
  # 에서 서비스 이름으로 부른다(research-mcp:8037). 밖에서 부를 이유가 없다.
  research-mcp:
    build:
      context: departments/01-research
    container_name: hedgefund-research-mcp
    restart: unless-stopped
    working_dir: /app/departments/01-research
    command: ["python", "api/mcp_server.py", "--serve"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?.env 에 DATABASE_URL 이 필요하다}
      # 도구 면 인증(2026-08-02). 비면 무인증으로 열리고 기동 로그에 경고가
      # 찍힌다 - '잊은 것'과 '일부러 연 것'을 구분되게 한다.
      MCP_RESEARCH_API_KEY: ${MCP_RESEARCH_API_KEY:-}
      # 파이프라인이 부르는 조회면·로컬 모델. Ollama 는 호스트 프로세스다.
      MARKET_API_URL: http://market-api:8036
      RESEARCH_API_URL: http://research-api:8035
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      # ▶ LS 자격을 뺐다 (2026-08-02). 예전에는 파이프라인 첫 노드
      #   (universe_manager)가 거래가능 여부를 LS REST 로 직접 물어 이 컨테이너에
      #   LS 키가 필요했다. 이제 universe_restriction_collector(수집기)가 제한
      #   목록을 DB 에 남기고 research-api /universe/restrictions 가 서빙하므로
      #   **판정하는 쪽은 자격이 필요 없다**(통합계획 6.2).
      #   자격이 퍼지는 것 자체가 위험이므로 옮기지 않고 없앴다.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./departments/01-research/config:/app/departments/01-research/config:ro
      # 총괄 노드(draft_packet)가 research-supervisor 페르소나 원문을 여기서 읽는다
      # - 2026-08-02 실측: 없으면 분석가 6인을 다 돌린 뒤 마지막에 실패한다.
      # COPY 대신 마운트인 이유: 페르소나를 고칠 때마다 이미지를 다시 굽지 않는다.
      - ./departments/01-research/hermes:/app/departments/01-research/hermes:ro
      # Packet MD 리포트를 호스트에서 바로 열어보기 위해 (읽기 전용 아님 - 쓴다)
      - ./departments/01-research/reports:/app/departments/01-research/reports
    # 파이프라인이 분석가 6인 x LLM 이라 오래 돈다 - 넉넉히 준다
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 256
    stop_grace_period: 30s

  # ▶ **부서별 컨테이너 1개 = 부서별 데이터 디렉터리 1개** (계획서 3.1~3.2)
  #   Credential·Memory Namespace 분리는 이름이 아니라 저장소 분리다.
  #   컨테이너만 쪼개고 /opt/data 를 공유하면 한 부서의 세션·기억·자격이 옆
  #   부서에서 그대로 보인다 - 분리된 척이 된다. 그래서 각 컨테이너는
  #   `/home/ubuntu/.hermes/profiles/<부서>` 를 따로 마운트하고, 그 안에는
  #   자기 Profile 하나만 둔다. HERMES_HOME=/opt/data 는 이미지 기본값이라
  #   마운트만 갈면 분리가 끝난다.
  #
  # ▶ 8개 본부 모두 이 파일(research/quant/risk/qa) 또는 `include:`된
  #   부서 Compose Fragment(ceo/trading/accounting/hr)에 이미 컨테이너가
  #   있다(2026-08-10 기준). 담당자 표는 CLAUDE.md - 남의 본부 컨테이너를
  #   대신 고치지 않는다.
  #
  # ▶ 데이터 경로 함정 (2026-08-02 실측, 로컬 개발 한정)
  #   Windows 네이티브 설치본은 %LOCALAPPDATA%\hermes 를 쓰지만 컨테이너는
  #   `~/.hermes/profiles/<부서>` 를 마운트한다 - **서로 다른 디렉터리다.**
  #   섞으면 "분명 profile 을 만들었는데 목록에 없다"가 된다. AWS는 이 함정이
  #   없다(컨테이너가 EC2 위의 `/home/ubuntu/.hermes/profiles/<부서>` 하나만
  #   본다). 로컬 동기화 절차는 `scripts/sync_hermes_profiles.sh`.
  #
  # ▶ 부서 간 호출(계획서 3.3 "본부 간 호출은 HTTP")은 `hermes serve` 가
  #   담당한다. 다만 2026-06 하드닝 이후 **비-loopback 바인딩은 인증 없이는
  #   열리지 않는다**(--insecure 는 no-op 이 됐다). 컨테이너 간 통신은
  #   0.0.0.0 바인딩이 필요하므로 인증 설정이 선행 조건이다 - 이는 제약이
  #   아니라 권한 경계를 인증으로 강제하는 것이라 그대로 따른다.
  #   절차는 docs/02-engineering/HERMES_DOCKER_RUNBOOK.md 4절.
  # ▶ 공용 Kanban board(CEO 중심 동적 Task Graph): /home/ubuntu/.hermes/shared-kanban 는
  #   profiles/<부서>와 분리된 전용 디렉터리다(각 컨테이너 /opt/kanban에 마운트) - 8개
  #   본부가 이 하나의 kanban.db를 공유하면서도 서로의 profiles/<부서> auth/config/
  #   memory는 여전히 못 본다. 최초 기동 전 호스트에 `mkdir -p ~/.hermes/shared-kanban`을
  #   먼저 해둬야 한다 - 없는 상태로 Docker가 파일 하나만 마운트하면 디렉터리로 잘못
  #   만들어진다.
  #
  # ▶ HERMES_KANBAN_DISPATCH_IN_GATEWAY: "false" - 이 8개 컨테이너의 embedded dispatcher는
  #   끈다(공식 env override, kanban 설정 자체를 건드리지 않음). 이유는 lock 경합이 아니라
  #   원천적으로 spawn이 불가능해서다: Hermes dispatcher가 worker를 띄울 때
  #   `$HERMES_HOME/profiles/<assignee>`를 찾는데(hermes_cli/profiles.py get_profile_dir),
  #   이 8개 컨테이너는 /opt/data 가 "그 부서 profile 내용 그 자체"라 profiles/ 서브
  #   디렉터리가 없다 - 그래서 켜놔도 자기 자신에게 할당된 task조차 spawn 못 하고
  #   skipped_nonspawnable 로 매번 건너뛴다. 그래서 dispatch는 아래 kanban-dispatcher
  #   전용 컨테이너 하나가 전담한다(8개 profiles/ 전체를 보는 유일한 컨테이너) - 이 8개는
  #   여전히 kanban_show/list/comment/complete 같은 조회·자기보고 tool만 쓴다.
  research-hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hedgefund-research-hermes
    restart: unless-stopped
    command: ["gateway", "run"]
    volumes:
      - /home/ubuntu/.hermes/profiles/research-department:/opt/data
      - ./skills/finance:/opt/shared-skills/finance:ro
      - /home/ubuntu/.hermes/shared-kanban:/opt/kanban
    environment:
      HERMES_UID: 1000
      HERMES_GID: 1000
      HERMES_KANBAN_HOME: /opt/kanban
      HERMES_KANBAN_DISPATCH_IN_GATEWAY: "false"
      # LLM Provider(Codex/Claude)는 하드코딩하지 않는다 - /opt/data/config.yaml의
      # provider: 와 auth.json이 실제 Provider를 결정한다(docker-compose.claude.yml 참고).
      # 이 값은 Provider 키가 아니라 Profile의 mcp_servers.research.headers가 싣는
      # MCP 서버 자체 인증이라 그대로 둔다.
      MCP_RESEARCH_API_KEY: ${MCP_RESEARCH_API_KEY:-}
    mem_limit: 1g
    mem_reservation: 192m
    cpus: 1.0
    pids_limit: 256
    stop_grace_period: 20s

  quant-hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hedgefund-quant-hermes
    restart: unless-stopped
    command: ["gateway", "run"]
    volumes:
      - /home/ubuntu/.hermes/profiles/quant-backtest-department:/opt/data
      - ./skills/finance:/opt/shared-skills/finance:ro
      - /home/ubuntu/.hermes/shared-kanban:/opt/kanban
    environment:
      HERMES_UID: 1000
      HERMES_GID: 1000
      HERMES_KANBAN_HOME: /opt/kanban
      HERMES_KANBAN_DISPATCH_IN_GATEWAY: "false"
    mem_limit: 1g
    mem_reservation: 192m
    cpus: 1.0
    pids_limit: 256
    stop_grace_period: 20s

  # ── 리스크·AI QA/감사본부 (동규 소유) ───────────────────────────────────────
  # 근거: DEPARTMENT_BACKEND_INTEGRATION_DOCKER_PLAN.md 6.4·6.7절
  # departments/03-risk/Dockerfile, departments/06-ai-qa-audit/Dockerfile 참고.
  #
  # ▶ redis: Risk↔QA Event Stream(risk_events/qa_events)이 쓰는 공통 Core 인프라다.
  #   특정 부서 소유가 아니다(계획서 5절 "공통 Platform Container") - 다른 부서도
  #   Redis Streams가 필요해지면 이 서비스를 재사용하면 된다. P0 로컬용 최소 구성이라
  #   영속화(AOF)는 아직 안 켰다 - 재시작 시 Stream 유실 감수.
  redis:
    image: redis:7-alpine
    container_name: hedgefund-redis
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # risk-api: Pre-trade Risk Check, Trading State, Compliance(agentic-rag) 조회면.
  # Build Context가 저장소 루트인 이유는 departments/03-risk/Dockerfile 상단 주석 참고.
  risk-api:
    build:
      context: .
      dockerfile: departments/03-risk/Dockerfile
    container_name: hedgefund-risk-api
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      REDIS_URL: redis://redis:6379/0
      RISK_QA_EVENT_REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_DOCKER_BASE_URL:-http://host.docker.internal:11434/v1}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3:1.7b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-8}
      RISK_SERVICE_AUTH_SECRET: ${RISK_SERVICE_AUTH_SECRET:-}
      RISK_SERVICE_AUTH_ISSUER: ${RISK_SERVICE_AUTH_ISSUER:-}
      RISK_SERVICE_AUTH_AUDIENCE: ${RISK_SERVICE_AUTH_AUDIENCE:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8041:8000"   # 로컬 전용 - 외부 노출 금지 (research-api와 같은 정책)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/risk/v1/observability/runtime', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64

  # audit-api: Evidence QA, Trace, Tool Permission, Finding, Incident 조회면.
  audit-api:
    build:
      context: .
      dockerfile: departments/06-ai-qa-audit/Dockerfile
    container_name: hedgefund-audit-api
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      REDIS_URL: redis://redis:6379/0
      RISK_QA_EVENT_REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_DOCKER_BASE_URL:-http://host.docker.internal:11434/v1}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3:1.7b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-8}
      QA_SERVICE_AUTH_SECRET: ${QA_SERVICE_AUTH_SECRET:-}
      QA_SERVICE_AUTH_ISSUER: ${QA_SERVICE_AUTH_ISSUER:-}
      QA_SERVICE_AUTH_AUDIENCE: ${QA_SERVICE_AUTH_AUDIENCE:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8042:8000"   # 로컬 전용 - 외부 노출 금지
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/qa/v1/observability/runtime', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64

  # qa-worker: Risk Decision Stream을 QA Audit 수신 이력으로 적재한다(qa_events/worker.py).
  # audit-api와 같은 Image, command만 다르다(계획서 3.1). REDIS_URL 없으면 즉시 종료하는
  # 프로세스라 여기서는 `:?`로 필수 처리한다(다른 서비스는 REDIS_URL이 선택值).
  qa-worker:
    build:
      context: .
      dockerfile: departments/06-ai-qa-audit/Dockerfile
    container_name: hedgefund-qa-worker
    restart: unless-stopped
    command: ["python", "qa_events/worker.py"]
    working_dir: /app/departments/06-ai-qa-audit
    depends_on:
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      RISK_QA_EVENT_REDIS_URL: ${RISK_QA_EVENT_REDIS_URL:-redis://redis:6379/0}
      QA_EVENT_POLL_INTERVAL_SECONDS: ${QA_EVENT_POLL_INTERVAL_SECONDS:-1}
    healthcheck:
      test: ["CMD", "python", "-c", "import os, redis; assert b'qa_events/worker.py' in open('/proc/1/cmdline', 'rb').read(); redis.Redis.from_url(os.environ['RISK_QA_EVENT_REDIS_URL'], socket_connect_timeout=2).ping()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    mem_limit: 256m
    cpus: 0.3
    pids_limit: 64
    stop_grace_period: 20s

  # risk-hermes / qa-hermes: research-hermes/quant-hermes와 같은 패턴 - Hermes는 Backend
  # Image에 안 넣고 공식 Image를 별도 Container로 띄운다(계획서 3.1). Provider는 하드코딩
  # 하지 않는다 - /opt/data/config.yaml(provider:)과 auth.json이 결정한다(Risk/QA 둘 다
  # Codex 배정, 2026-08-10 확정 매핑).
  risk-hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hedgefund-risk-hermes
    restart: unless-stopped
    command: ["gateway", "run"]
    volumes:
      - /home/ubuntu/.hermes/profiles/risk-management:/opt/data
      - ./skills/finance:/opt/shared-skills/finance:ro
      - /home/ubuntu/.hermes/shared-kanban:/opt/kanban
    environment:
      HERMES_UID: 1000
      HERMES_GID: 1000
      HERMES_KANBAN_HOME: /opt/kanban
      HERMES_KANBAN_DISPATCH_IN_GATEWAY: "false"
    mem_limit: 1g
    mem_reservation: 192m
    cpus: 1.0
    pids_limit: 256
    stop_grace_period: 20s

  qa-hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hedgefund-qa-hermes
    restart: unless-stopped
    command: ["gateway", "run"]
    volumes:
      - /home/ubuntu/.hermes/profiles/qa-department:/opt/data
      - ./skills/finance:/opt/shared-skills/finance:ro
      - /home/ubuntu/.hermes/shared-kanban:/opt/kanban
    environment:
      HERMES_UID: 1000
      HERMES_GID: 1000
      HERMES_KANBAN_HOME: /opt/kanban
      HERMES_KANBAN_DISPATCH_IN_GATEWAY: "false"
    mem_limit: 1g
    mem_reservation: 192m
    cpus: 1.0
    pids_limit: 256
    stop_grace_period: 20s

  # CEO Office·Agent Workforce 인사팀(영주 소유) 서비스는 각자 Compose Fragment로 옮겼다 -
  # departments/00-ceo-office/compose.yaml, departments/07-agent-workforce/compose.yaml
  # (governance-api, notification-worker, ceo-hermes, workforce-api, improvement-worker,
  # workforce-hermes). 이 파일 상단 `include:` 참고.

  # 트레이딩·회계/포트폴리오본부(도현 소유) 서비스도 각자 Compose Fragment로 옮겼다 -
  # departments/02-trading/compose.yaml, departments/05-accounting-portfolio/compose.yaml
  # (trading-hermes, accounting-hermes). 이 파일 상단 `include:` 참고.

  # 부서가 실제로 어떻게 도는지 보는 창. 127.0.0.1 전용 - 외부 노출 금지.
  #
  # ▶ **기본 기동에서 제외했다**(profiles: [dashboard]). 실측 2026-08-02:
  #   대시보드는 0.0.0.0 바인딩 시 인증 없이는 기동을 거부하고 재시작 루프에
  #   빠진다(--insecure 로도 안 된다). Docker 는 컨테이너 안 127.0.0.1 을
  #   호스트로 게시할 수 없으므로 0.0.0.0 바인딩이 강제되고, 따라서 **인증
  #   설정이 선행 조건**이다. 비밀번호는 각자 정하는 값이라 저장소에 넣지 않는다.
  #
  #   쓰려면 둘 중 하나를 먼저 하고 `docker compose --profile dashboard up -d`:
  #     1) Basic Auth - 해시를 만들어 ~/.hermes/config.yaml 의
  #        dashboard.basic_auth.{username,password_hash} 에 넣는다.
  #        docker exec hedgefund-hermes python -c \
  #          "from plugins.dashboard_auth.basic import hash_password; \
  #           print(hash_password('<사용할 비밀번호>'))"
  #     2) Nous Portal OAuth - docker exec -it hedgefund-hermes hermes dashboard register
  #
  #   게시는 127.0.0.1 로 묶고 팀원 접근은 Tailscale 사설망으로만 한다
  #   (공유기 포트포워딩 금지 - 저장소 전역 규칙).
  hermes-dashboard:
    image: nousresearch/hermes-agent:latest
    container_name: hedgefund-hermes-dashboard
    restart: unless-stopped
    profiles: ["dashboard"]
    command: ["dashboard", "--host", "0.0.0.0", "--port", "9119", "--no-open"]
    # 대시보드는 4명 팀원이 함께 쓰는 **공용 운영/관리 콘솔**이다(2026-08-10) - CEO가
    # 사용자 질의마다 동적으로 만드는 Task Graph/Kanban(고정 파이프라인이 아니라
    # 그때그때 필요한 부서만 골라 병렬/순차 배치한 결과)의 상태·담당을 부서 경계
    # 없이 한 화면에서 보고 관리한다. 그래서 8개 profiles/ 전체와 공용 Kanban 상태가
    # 있는 공용 Hermes Home(~/.hermes) 전체를 마운트한다 - research-department 하나만
    # 보던 예전 구조에서 바뀌었다. 특정 부서에 종속되지 않으므로 depends_on도 두지
    # 않는다.
    #
    # ▶ 이건 **8개 실행 서비스(research-hermes 등)의 분리 원칙과는 다른 얘기다.**
    #   실행 서비스는 여전히 각자 /home/ubuntu/.hermes/profiles/<department> 하나만
    #   마운트해서 auth/config/memory/runtime을 독립 유지한다(위 "부서별 컨테이너
    #   1개 = 부서별 데이터 디렉터리 1개" 원칙 그대로) - 실행 격리를 없애는 게 아니다.
    #
    # ▶ **읽기 전용이 아니다.** 대시보드 화면 자체에 Profile CREATE, Config, Keys,
    #   Skills 편집 등이 있고 ~/.hermes를 RW로 마운트한다 - profile/config/shared
    #   상태를 조회할 뿐 아니라 그 화면에서 직접 바꾼다. 그래서 팀원 접근을
    #   127.0.0.1 + Tailscale 사설망 + 대시보드 자체 인증(위 안내)으로 제한한다.
    volumes:
      - /home/ubuntu/.hermes:/opt/data
    environment:
      HERMES_UID: 1000
      HERMES_GID: 1000
      HERMES_DASHBOARD_HOST: 0.0.0.0
      # Dashboard Chat의 /api/pty WebSocket(TUI)이 rebuild 경로에서 TUI 디렉터리를
      # 못 찾아 실패하는 upstream 이슈 대응 - 경로를 명시로 고정한다.
      HERMES_TUI_DIR: /opt/hermes/ui-tui
      # 대시보드 자체 HERMES_HOME은 /opt/data(=~/.hermes 전체)라 안 정하면
      # kanban_home()이 기본으로 /opt/data/kanban.db(=~/.hermes/kanban.db)를 본다 -
      # 8개 부서 컨테이너가 실제로 쓰는 보드(~/.hermes/shared-kanban/kanban.db, 위
      # research-hermes 주석 참고)와 다른 파일이라 이걸 명시로 맞춰야 같은 보드를 본다.
      HERMES_KANBAN_HOME: /opt/data/shared-kanban
    ports:
      - "127.0.0.1:9119:9119"   # 팀원 접근은 Tailscale 사설망 - 포트포워딩 금지
    mem_limit: 1536m
    cpus: 0.5
    pids_limit: 128

  # kanban-dispatcher: 8개 부서의 Kanban embedded dispatcher(위 HERMES_KANBAN_DISPATCH_IN_GATEWAY
  # 참고)를 대신하는 중앙 dispatcher 전용 컨테이너 - 유일하게 dispatch가 켜진 Gateway다.
  #
  # ▶ 왜 필요한가: Hermes dispatcher는 task를 spawn할 때 worker subprocess를
  #   `$HERMES_HOME/profiles/<assignee>`에서 찾는다(hermes_cli/profiles.py get_profile_dir).
  #   8개 부서 컨테이너는 /opt/data가 "그 부서 profile 내용 자체"라 profiles/ 서브
  #   디렉터리가 없어서 embedded dispatcher를 켜놔도 자기 자신에게 할당된 task조차
  #   spawn하지 못하고 skipped_nonspawnable로 건너뛴다. 그래서 8개 profiles/ 전체를
  #   볼 수 있는 컨테이너 하나가 전담한다.
  #
  # ▶ /home/ubuntu/.hermes 전체를 RW로 마운트한다(read-only 아님) - spawn된 worker가 해당
  #   profile 디렉터리를 자기 HERMES_HOME으로 그대로 써서 session/memory/log/state를
  #   기록하기 때문이다. 첫 기동 전 호스트에 `mkdir -p ~/.hermes/shared-kanban`이
  #   먼저 있어야 한다(위 research-hermes 주석 참고 - 없으면 Docker가 디렉터리 대신
  #   빈 파일을 만든다).
  #
  # ▶ 고권한 Infrastructure Component다 - 침해 시 8개 profile의 auth.json/memory/session에
  #   모두 접근 가능하다. 그래서 ports:를 절대 열지 않는다(외부/호스트에서 직접 접근할
  #   이유가 없다). security_opt(no-new-privileges) 등 추가 하드닝은 E2E 성공 후
  #   최소 변경 원칙에 따라 별도로 검토한다.
  kanban-dispatcher:
    image: nousresearch/hermes-agent:latest
    container_name: hedgefund-kanban-dispatcher
    restart: unless-stopped
    # Hermes image의 공식 wrapped-runtime 경로를 사용한다. `init: true`가
    # 없으면 entrypoint가 PID 1이 되어 s6 `/init`와
    # `02-reconcile-profiles`가 모든 profiles/* gateway를 다시 시작한다.
    init: true
    # DEPRECATED standalone escape hatch. 이 컨테이너는 gateway가 아니라
    # Kanban dispatcher만 실행하므로 per-profile gateway를 supervise하지 않는다.
    command:
      ["kanban", "daemon", "--force", "--interval", "60", "--pidfile", "/opt/data/shared-kanban/dispatcher.pid", "--verbose"]
    volumes:
      - /home/ubuntu/.hermes:/opt/data
      - ./skills/finance:/opt/shared-skills/finance:ro
    environment:
      HERMES_HOME: /opt/data
      HERMES_UID: 1000
      HERMES_GID: 1000
      HERMES_KANBAN_HOME: /opt/data/shared-kanban
      HERMES_KANBAN_DISPATCH_IN_GATEWAY: "false"
    mem_limit: 1g
    mem_reservation: 192m
    cpus: 1.0
    pids_limit: 256
    stop_grace_period: 20s

  ceo-kanban-supervisor:
    image: nousresearch/hermes-agent:latest
    container_name: hedgefund-ceo-kanban-supervisor
    restart: unless-stopped
    init: true
    command: ["python3", "/opt/hgfinance/scripts/run_ceo_supervisor.py", "--interval", "1"]
    volumes:
      - /home/ubuntu/.hermes:/opt/data
      - .:/opt/hgfinance:ro
    environment:
      HERMES_HOME: /opt/data
      HERMES_UID: 1000
      HERMES_GID: 1000
      HERMES_KANBAN_HOME: /opt/data/shared-kanban
      HERMES_KANBAN_DISPATCH_IN_GATEWAY: "false"
      PYTHONPATH: /opt/hgfinance
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 0.5
    pids_limit: 128
    stop_grace_period: 20s

  # ── 방법론 스카우트 도구 면 (2026-08-10, 재일) ─────────────────────────────
  # **기본 `docker compose up` 에서는 뜨지 않는다.** profiles 로 묶어 두었으니
  # `docker compose --profile research-skills up -d` 로만 기동한다 - 검증 전
  # 서비스가 기존 스택 기동을 깨뜨리지 않게 하려는 것이다.
  #
  # 둘 다 **API 키가 필요 없다**(키가 필요한 OpenAlex 커넥터는 쓰지 않는다).
  # 최초 기동 후 `hermes -p research-department mcp test paper-search` 로 계약을
  # 확인하고 나서 프로필 config 의 enabled 를 true 로 올린다.
  paper-search-mcp:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    container_name: hedgefund-paper-search-mcp
    profiles: ["research-skills"]
    restart: unless-stopped
    command: ["uvx", "paper-search-mcp", "--transport", "http", "--port", "8041"]
    environment:
      # Unpaywall 만 연락처 이메일을 요구한다(키가 아니다). 없으면 그 소스만 빠진다.
      UNPAYWALL_EMAIL: ${UNPAYWALL_EMAIL:-}

  youtube-transcript-mcp:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    container_name: hedgefund-youtube-transcript-mcp
    profiles: ["research-skills"]
    restart: unless-stopped
    command: ["uvx", "--from", "mcp-youtube-transcript", "mcp-youtube-transcript",
              "--transport", "http", "--port", "8042"]

volumes:
  tsdb_data:
  portfolio_runtime_data:
