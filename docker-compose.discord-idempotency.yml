# Optional defense-in-depth override.
#
# The default Docker-only production path intentionally uses the upstream
# Hermes image from docker-compose.yml.  Apply this file only when a
# single-owner deployment still demonstrates duplicate delivery after the
# gateway canary, and keep the same file in every subsequent compose command.
services:
  ceo-hermes:
    build:
      context: .
      dockerfile: Dockerfile.hermes-discord
    image: ${HERMES_GATEWAY_IMAGE:-hgfinance/hermes-discord:discord-idempotency-v1}
  workforce-hermes:
    build:
      context: .
      dockerfile: Dockerfile.hermes-discord
    image: ${HERMES_GATEWAY_IMAGE:-hgfinance/hermes-discord:discord-idempotency-v1}
