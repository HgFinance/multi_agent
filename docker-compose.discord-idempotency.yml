# Historical bulk migration override.
#
# The current base Compose explicitly builds the patched image for
# ceo-hermes, qa-hermes, and workforce-hermes. Use this file only when
# migrating one of the remaining upstream Gateway profiles; keep the same
# file in every subsequent compose command for that migration.
services:
  ceo-hermes:
    build:
      context: .
      dockerfile: Dockerfile.hermes-discord
    image: ${HERMES_GATEWAY_IMAGE:-hgfinance/hermes-discord:discord-idempotency-v1}
