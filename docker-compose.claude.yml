# Claude Head Provider override.
#
# 기본 docker-compose.yml은 provider-neutral하다 - Codex/Claude 중 무엇을 쓰는지는
# 오직 각 부서 /opt/data/config.yaml(provider:)과 auth.json이 결정한다. 지금 8개 프로필
# 모두 provider: openai-codex(gpt-5.6-luna)라 이 파일 없이 `docker compose up -d`만
# 돌리면 된다.
#
# 이 파일은 Research/Quant(재일 소유, 2026-08-10 확정 매핑)가 나중에 Claude로 전환될 때만
# 얹는 override다. 전환 절차:
#   1) HERMES_HOME=/home/ubuntu/.hermes/profiles/research-department hermes model   (Claude/Anthropic 선택 + 로그인)
#   2) 위 1)을 quant-backtest-department에도 반복
#   3) docker compose -f docker-compose.yml -f docker-compose.claude.yml up -d research-hermes quant-hermes
#
# ▶ Claude Code CLI 프록시 경로다(hermes 컨테이너 -> host.docker.internal:8787 ->
#   `claude -p` -> Claude Code 플랜 한도). 선행 조건: 호스트에서
#   `python scripts/claude_code_proxy.py --serve` 가 떠 있어야 한다. 안 떠 있으면 이 부서
#   Agent 질의는 5xx로 실패한다(실패를 성공으로 위장하지 않는다).
#
# ▶ ANTHROPIC_API_KEY는 일부러 넣지 않는다. Hermes의 anthropic provider 자격 해석 순서가
#   ANTHROPIC_API_KEY -> ANTHROPIC_TOKEN -> CLAUDE_CODE_OAUTH_TOKEN이라, API 키를 넣으면
#   Claude Code 플랜 한도가 아니라 종량 과금(api.anthropic.com 직접 호출, extra usage)으로
#   샌다(2026-08-03 실측 HTTP 400). CLAUDE_CODE_OAUTH_TOKEN 자리표시자는 진짜 구독 토큰을
#   컨테이너에 넣지 않으면서, BASE_URL이 실수로 빠지면 조용히 과금되는 대신 인증 실패로
#   막히게 한다.
#
# ▶ extra_hosts: Docker Desktop(Mac)은 host.docker.internal을 자동 제공하지만 AWS의 리눅스
#   엔진은 아니다 - 매핑을 명시해야 프록시가 붙는다.
services:
  research-hermes:
    environment:
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-proxy-placeholder-not-a-credential}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-http://host.docker.internal:8787}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  quant-hermes:
    environment:
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-proxy-placeholder-not-a-credential}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-http://host.docker.internal:8787}
    extra_hosts:
      - "host.docker.internal:host-gateway"
