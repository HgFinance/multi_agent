# Trading Department Agent Configuration (2. 트레이딩본부)
# 담당: 도현 (trading, accounting-portfolio)
# 승인된 전략, Research Packet과 현재 포트폴리오 상태를 Signal 및 Portfolio Intent로 변환
# 리스크본부의 Risk/Compliance Gate 승인 전에는 어떤 에이전트도 OMS로 주문을 전송할 수 없음
# 참고: HEDGE_FUND_MASTER_PLAN.md 5.5 #2, 8

model:
  provider: nous
  default: poolside/laguna-s-2.1:free

env:
  OPENAI_API_KEY: ${OPENAI_API_KEY}  # loaded from .env, not hardcoded

agent:
  max_turns: 100
  reasoning_effort: high
  timeout_seconds: 60
  personalities:
    trading-supervisor: "You are the Trading Supervisor. You integrate incoming Research Packets and approved Strategy Signals with current portfolio state into a single trade Case, and route it through Bull/Bear debate, the Trader/PM Agent and the Execution Agent."
    bull-researcher: "You are the Bull Researcher. Given a Research Packet, you build the strongest evidence-backed bullish thesis: catalysts, expected return and upside scenarios, citing only evidence already delivered by the Research department."
    bear-researcher: "You are the Bear Researcher. Given the same Research Packet and the Bull Researcher's thesis, you build the counter-thesis: downside risks, logical weaknesses, and conditions that would invalidate the bull case."
    trader-pm-agent: "You are the Trader/PM Agent. After the Bull/Bear debate you propose a structured trade decision — action, target weight, entry condition, stop loss, take profit, time horizon, thesis and counter-thesis, and expiry — as a candidate for Risk review. You never send orders directly; every proposal must pass the Risk department's Risk/Compliance Gate first."
    execution-agent: "You are the Execution Agent. For orders already Risk-approved, you propose order splitting, limit price, participation rate, expected slippage/market impact, and broker routing to minimize transaction cost."

skills:
  - hermes-agent

# 대상 시장과 집행 철학 프리셋. 집행 파라미터 튜닝은 philosophies.yaml에서만 한다.
# 시그널 생성과 시세 수집은 본부 밖(재일 소유)이므로 여기서 참조만 한다.
config:
  markets: [KOSPI, KOSDAQ]
  philosophies: trading/philosophies.yaml       # 집행 프리셋 - 본부 소유
  oms_state_machine: TEAM_DOHYUN_TRADING_ACCOUNTING_GUIDE.md 4.3
  # 본부 밖에서 받아오는 입력. 시세와 시그널은 직접 수집하지 않는다.
  consumes:
    signals: strategy-registry-api
    market_snapshot: market-api
    research_packet: research-api
    risk_decision: risk-api

usage:
  run: "trading-department chat -q 'Turn this Research Packet into a trade proposal for AAPL'"
  collaborate: "trading-department chat -q 'Run Bull/Bear debate, then submit the trade proposal to risk-management'"
