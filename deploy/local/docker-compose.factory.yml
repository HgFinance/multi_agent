# Windows Docker Desktop overlay for the isolated alpha-factory queue.
#
# Use after docker-compose.yml and the existing local override.  This keeps the
# factory board and dispatcher outside the user/CEO Kanban volume while mapping
# the two local Hermes profile stores that carry pooled OAuth credentials.
services:
  factory-kanban-init:
    command:
      - >-
        install -d -o 1000 -g 1000 -m 0750 /opt/factory-kanban /opt/data &&
        chown -R 1000:1000 /opt/factory-kanban /opt/data
    volumes:
      - factory_kanban_data:/opt/factory-kanban
      - factory_dispatcher_home:/opt/data

  factory-kanban-dispatcher:
    entrypoint: ["/bin/sh", "-c"]
    user: "1000:1000"
    command:
      - |
        set -eu
        python3 /app/repo/deploy/hermes-dispatch-guard/check_guard.py
        if [ ! -f /opt/factory-kanban/kanban/boards/alpha-factory/board.json ]; then
          hermes kanban boards create alpha-factory --name 'Alpha Factory' --description 'Isolated continuous alpha discovery queue'
        fi
        hermes kanban --board alpha-factory init
        exec hermes kanban --board alpha-factory daemon --force --interval "$${FACTORY_KANBAN_DISPATCH_INTERVAL:-5}" --max "$${FACTORY_KANBAN_MAX_SPAWN_PER_TICK:-2}" --pidfile /opt/factory-kanban/alpha-factory-dispatcher.pid --verbose
    volumes:
      - factory_dispatcher_home:/opt/data
      - factory_profiles_root:/opt/data/profiles
      - ${USERPROFILE}/.hermes-research-department:/opt/data/profiles/research-department
      - ${USERPROFILE}/.hermes-quant-backtest-department:/opt/data/profiles/quant-backtest-department
      - factory_kanban_data:/opt/factory-kanban
      - ./skills:/opt/shared-skills:ro
      - .:/app/repo:ro
      - ${FACTORY_QUANT_CODE_PATH:-./departments/04-quant-backtest}:/app/departments/04-quant-backtest
      - ${FACTORY_QUANT_DATA_PATH:-./quant-data}:/app/quant-data

volumes:
  factory_dispatcher_home:
  factory_profiles_root:
