      LS_MAC_ADDRESS: ${LS_MAC_ADDRESS:?LS MAC address is required}
      LS_OAUTH_SCOPE: ${LS_OAUTH_SCOPE:-oob}
      LS_PAPER_ORDER_TIMEOUT_SECONDS: ${LS_PAPER_ORDER_TIMEOUT_SECONDS:-8}

