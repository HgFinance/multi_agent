# AWS EC2 release overlay for the canonical PAPER-order stack.
#
# Apply after the repository root compose file:
#   docker compose --project-name hedgefund --env-file <runtime.env> \
#     -f docker-compose.yml -f deploy/aws/docker-compose.paper-order.yml ...
#
# This overlay is retained for database/runtime reference only. User login and
# hosted identity are not part of the supported mock-investment application.

x-admin-control-database-url: &admin-control-database-url "postgresql://postgres:${HEDGEFUND_TSDB_PASSWORD:?HEDGEFUND_TSDB_PASSWORD is required}@timescaledb:5432/${HEDGEFUND_CONTROL_DB_NAME:-control}"
x-admin-market-database-url: &admin-market-database-url "postgresql://postgres:${HEDGEFUND_TSDB_PASSWORD:?HEDGEFUND_TSDB_PASSWORD is required}@timescaledb:5432/market"
x-control-database-url: &control-database-url "postgresql://hgfinance_runtime:${HEDGEFUND_RUNTIME_DB_PASSWORD:?HEDGEFUND_RUNTIME_DB_PASSWORD is required}@timescaledb:5432/${HEDGEFUND_CONTROL_DB_NAME:-control}"
x-market-database-url: &market-database-url "postgresql://hgfinance_runtime:${HEDGEFUND_RUNTIME_DB_PASSWORD:?HEDGEFUND_RUNTIME_DB_PASSWORD is required}@timescaledb:5432/market"
x-order-database-url: &order-database-url "postgresql://hgfinance_order_runtime:${HEDGEFUND_ORDER_DB_PASSWORD:?HEDGEFUND_ORDER_DB_PASSWORD is required}@timescaledb:5432/${HEDGEFUND_CONTROL_DB_NAME:-control}"
x-trading-database-url: &trading-database-url "postgresql://hgfinance_trading_runtime:${HEDGEFUND_TRADING_DB_PASSWORD:?HEDGEFUND_TRADING_DB_PASSWORD is required}@timescaledb:5432/${HEDGEFUND_CONTROL_DB_NAME:-control}?options=-c%20role%3Dsvc_trading_api"
x-accounting-database-url: &accounting-database-url "postgresql://hgfinance_accounting_runtime:${HEDGEFUND_ACCOUNTING_DB_PASSWORD:?HEDGEFUND_ACCOUNTING_DB_PASSWORD is required}@timescaledb:5432/${HEDGEFUND_CONTROL_DB_NAME:-control}?options=-c%20role%3Dsvc_accounting_ledger"
x-conditional-orchestrator-database-url: &conditional-orchestrator-database-url "postgresql://hgfinance_conditional_orchestrator:${HEDGEFUND_CONDITIONAL_ORCHESTRATOR_DB_PASSWORD:?HEDGEFUND_CONDITIONAL_ORCHESTRATOR_DB_PASSWORD is required}@timescaledb:5432/${HEDGEFUND_CONTROL_DB_NAME:-control}?options=-c%20role%3Dsvc_conditional_rule_orchestrator"
x-conditional-worker-database-url: &conditional-worker-database-url "postgresql://hgfinance_conditional_worker:${HEDGEFUND_CONDITIONAL_WORKER_DB_PASSWORD:?HEDGEFUND_CONDITIONAL_WORKER_DB_PASSWORD is required}@timescaledb:5432/${HEDGEFUND_CONTROL_DB_NAME:-control}?options=-c%20role%3Dsvc_conditional_rule_worker"
x-control-environment: &control-environment
  DATABASE_URL: *control-database-url
x-control-session-environment: &control-session-environment
  DATABASE_URL: *control-database-url
  DATABASE_SESSION_URL: *control-database-url
x-control-and-market-environment: &control-and-market-environment
  DATABASE_URL: *control-database-url
  TIMESCALE_DATABASE_URL: *market-database-url
x-control-dependency: &control-dependency
  timescaledb:
    condition: service_healthy

services:
  # The root development compose pins cores 22/23.  EC2 instance shapes do not
  # have that topology; an empty value explicitly removes the pin while keeping
  # the root CPU quota.
  timescaledb:
    image: ${HEDGEFUND_TIMESCALE_IMAGE:-timescale/timescaledb-ha@sha256:eaaab826932c579d5d4e3a3479446da931cabb8703cf7caf1038eb14d40754fa}
    cpuset: ""
    # The development file publishes 0.0.0.0:5434.  AWS keeps both databases
    # private on the Compose network; administration uses docker exec/SSM.
    ports: !override []

  # Explicit deployment job.  It is never part of normal `up`; the release
  # script runs it after the DB is healthy and before replacing applications.
  database-bootstrap:
    profiles: ["deployment"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: "no"
    depends_on: *control-dependency
    command:
      - python
      - scripts/aws_database_bootstrap.py
      - --seed-paper-principal
    environment:
      CONTROL_DATABASE_URL: *admin-control-database-url
      MARKET_DATABASE_URL: *admin-market-database-url
      HEDGEFUND_RUNTIME_DB_PASSWORD: ${HEDGEFUND_RUNTIME_DB_PASSWORD:?HEDGEFUND_RUNTIME_DB_PASSWORD is required}
      HEDGEFUND_ORDER_DB_PASSWORD: ${HEDGEFUND_ORDER_DB_PASSWORD:?HEDGEFUND_ORDER_DB_PASSWORD is required}
      HEDGEFUND_TRADING_DB_PASSWORD: ${HEDGEFUND_TRADING_DB_PASSWORD:?HEDGEFUND_TRADING_DB_PASSWORD is required}
      HEDGEFUND_ACCOUNTING_DB_PASSWORD: ${HEDGEFUND_ACCOUNTING_DB_PASSWORD:?HEDGEFUND_ACCOUNTING_DB_PASSWORD is required}
      HEDGEFUND_CONDITIONAL_ORCHESTRATOR_DB_PASSWORD: ${HEDGEFUND_CONDITIONAL_ORCHESTRATOR_DB_PASSWORD:?HEDGEFUND_CONDITIONAL_ORCHESTRATOR_DB_PASSWORD is required}
      HEDGEFUND_CONDITIONAL_WORKER_DB_PASSWORD: ${HEDGEFUND_CONDITIONAL_WORKER_DB_PASSWORD:?HEDGEFUND_CONDITIONAL_WORKER_DB_PASSWORD is required}
      HEDGEFUND_CONTROL_DB_NAME: ${HEDGEFUND_CONTROL_DB_NAME:-control}
      HGFINANCE_MIGRATION_TIMEOUT_SECONDS: ${HGFINANCE_MIGRATION_TIMEOUT_SECONDS:-1800}
      HGFINANCE_MIGRATION_LOCK_TIMEOUT_SECONDS: ${HGFINANCE_MIGRATION_LOCK_TIMEOUT_SECONDS:-120}
      PAPER_SEED_USER_ID: ${PAPER_SEED_USER_ID:-00000000-0000-4000-8000-00000000cec0}
      PAPER_SEED_FUND_ID: ${PAPER_SEED_FUND_ID:-5c26db42-ce83-4daf-b1dc-c81680c13a6c}
      PAPER_SEED_BOOK_ID: ${PAPER_SEED_BOOK_ID:-07d913de-9a5b-4cf5-b893-31a625445761}
      PAPER_SEED_CASH_KRW: ${PAPER_SEED_CASH_KRW:-1000000000}
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256

  # Read-only LS REST calls provision the KRX instrument master and verify the
  # reviewed calendar against observed daily bars.  This job has no broker
  # credentials, adapter or order endpoint and runs only during deployment.
  reference-bootstrap:
    profiles: ["deployment"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: "no"
    depends_on: *control-dependency
    command: ["python", "scripts/aws_reference_bootstrap.py"]
    environment:
      DATABASE_URL: *admin-control-database-url
      CONTROL_DATABASE_URL: *admin-control-database-url
      MARKET_DATABASE_URL: *admin-market-database-url
      HEDGEFUND_CONTROL_DB_NAME: ${HEDGEFUND_CONTROL_DB_NAME:-control}
      PAPER_SEED_USER_ID: ${PAPER_SEED_USER_ID:-00000000-0000-4000-8000-00000000cec0}
      PAPER_SEED_FUND_ID: ${PAPER_SEED_FUND_ID:-5c26db42-ce83-4daf-b1dc-c81680c13a6c}
      PAPER_SEED_BOOK_ID: ${PAPER_SEED_BOOK_ID:-07d913de-9a5b-4cf5-b893-31a625445761}
      AWS_REFERENCE_MIN_ACTIVE_KRX_STOCKS: ${AWS_REFERENCE_MIN_ACTIVE_KRX_STOCKS:-1000}
      # Instrument master/calendar lookup is market-data-only.  LIVE here does
      # not authorize or select a live broker adapter; Trading stays hard PAPER.
      LS_ENV: ${LS_REFERENCE_ENV:-LIVE}
      LS_APP_KEY: ${LS_APP_KEY:-}
      LS_APP_SECRET_KEY: ${LS_APP_SECRET_KEY:-}
      LS_APP_KEY_PAPER: ${LS_APP_KEY_PAPER:-}
      LS_APP_SECRET_KEY_PAPER: ${LS_APP_SECRET_KEY_PAPER:-}
      LS_REST_BASE_URL: ${LS_REST_BASE_URL:-}
      LS_REST_BASE_URL_PAPER: ${LS_REST_BASE_URL_PAPER:-}
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256

  portfolio-bff:
    depends_on: *control-dependency
    environment:
      <<: *control-environment
      CONTROL_DATABASE_URL: *control-database-url
      MEMOHARNESS_D5_MODE: ${MEMOHARNESS_D5_MODE:-off}
      MEMOHARNESS_D5_TOP_K: ${MEMOHARNESS_D5_TOP_K:-5}
      MEMOHARNESS_D5_STATEMENT_TIMEOUT_MS: ${MEMOHARNESS_D5_STATEMENT_TIMEOUT_MS:-1500}
      ORDER_ORCHESTRATOR_DATABASE_URL: *order-database-url
      CONDITIONAL_RULE_DATABASE_URL: *conditional-orchestrator-database-url
      CONDITIONAL_RULE_DATABASE_ROLE: svc_conditional_rule_orchestrator
      APP_ENV: production
      PORTFOLIO_DATA_MODE: production
      PORTFOLIO_AUTH_MODE: fixture
      PORTFOLIO_AUTH_REQUIRED: "false"
      USER_PAPER_ORDER_WORKFLOW_ENABLED: "true"
      USER_PAPER_ORDER_DETERMINISTIC_FAST_PATH_ENABLED: "true"
      PORTFOLIO_FIXTURE_TRADING_BOOKS_JSON: "[]"
      CEO_DISCORD_INGRESS_API_KEY: ${CEO_DISCORD_INGRESS_API_KEY:?CEO_DISCORD_INGRESS_API_KEY is required}
      DISCORD_ACTOR_MAP: ${DISCORD_ACTOR_MAP:?DISCORD_ACTOR_MAP is required}
      # Empty is deliberate for this backend-only deployment: Starlette emits
      # no allow-origin header and rejects browser preflights.  If a UI is
      # deployed later, only its exact HTTPS origin(s) may be supplied.
      PORTFOLIO_CORS_ALLOW_ORIGINS: ${PORTFOLIO_CORS_ALLOW_ORIGINS:-}

  ceo-hermes:
    environment:
      HERMES_KANBAN_DISPATCH_IN_GATEWAY: "false"
      CEO_DISCORD_INGRESS_API_KEY: ${CEO_DISCORD_INGRESS_API_KEY:?CEO_DISCORD_INGRESS_API_KEY is required}
      HGFINANCE_DISCORD_INGRESS_URL: http://portfolio-bff:8000/ui/ceo/ingress

  trading-hermes:
    environment:
      CEO_DISCORD_INGRESS_API_KEY: ${CEO_DISCORD_INGRESS_API_KEY:?CEO_DISCORD_INGRESS_API_KEY is required}
      HGFINANCE_DISCORD_INGRESS_URL: http://portfolio-bff:8000/ui/ceo/ingress

  paper-order-orchestrator-mcp:
    depends_on:
      timescaledb:
        condition: service_healthy
      trading-api:
        condition: service_healthy
    environment:
      <<: *control-environment
      CONTROL_DATABASE_URL: *control-database-url
      ORDER_ORCHESTRATOR_DATABASE_URL: *order-database-url
      ORDER_ORCHESTRATOR_DATABASE_ROLE: svc_order_orchestrator
      CONDITIONAL_RULE_DATABASE_URL: *conditional-orchestrator-database-url
      CONDITIONAL_RULE_DATABASE_ROLE: svc_conditional_rule_orchestrator
      APP_ENV: production
      PORTFOLIO_DATA_MODE: production
      PORTFOLIO_AUTH_MODE: fixture

  conditional-rule-worker:
    depends_on:
      timescaledb:
        condition: service_healthy
      trading-api:
        condition: service_healthy
      market-api:
        condition: service_started
    environment:
      APP_ENV: production
      DATABASE_URL: *conditional-worker-database-url
      CONDITIONAL_RULE_DATABASE_URL: *conditional-worker-database-url
      CONDITIONAL_RULE_MARKET_DATABASE_URL: *market-database-url
      CONDITIONAL_RULE_MARKET_CONNECT_TIMEOUT_SECONDS: ${CONDITIONAL_RULE_MARKET_CONNECT_TIMEOUT_SECONDS:-2}
      CONDITIONAL_RULE_MARKET_STATEMENT_TIMEOUT_MS: ${CONDITIONAL_RULE_MARKET_STATEMENT_TIMEOUT_MS:-1500}
      CONDITIONAL_RULE_MARKET_MAX_CONNECTIONS: ${CONDITIONAL_RULE_MARKET_MAX_CONNECTIONS:-8}
      CONDITIONAL_RULE_WORKER_DATABASE_ROLE: svc_conditional_rule_worker
      CONDITIONAL_RULE_WORKER_MAX_WORKERS: ${CONDITIONAL_RULE_WORKER_MAX_WORKERS:-8}
      TRADING_API_URL: http://trading-api:8000
      MARKET_API_URL: http://market-api:8036
      TRADING_INTERNAL_SERVICE_AUTH_SECRET: ${TRADING_INTERNAL_SERVICE_AUTH_SECRET:?A separate 32-byte internal Trading auth secret is required}
      TRADING_INTERNAL_SERVICE_AUTH_ISSUER: ${TRADING_INTERNAL_SERVICE_AUTH_ISSUER:-hedgefund-service-issuer}
      TRADING_INTERNAL_SERVICE_AUTH_AUDIENCE: ${TRADING_INTERNAL_SERVICE_AUTH_AUDIENCE:-trading-api}
      LS_ENV: PAPER
      LS_APP_KEY_PAPER: ${LS_APP_KEY_PAPER:?LS PAPER AppKey is required for conditional price reads}
      LS_APP_SECRET_KEY_PAPER: ${LS_APP_SECRET_KEY_PAPER:?LS PAPER AppSecret is required for conditional price reads}
      LS_REST_BASE_URL_PAPER: ${LS_REST_BASE_URL_PAPER:-}
      LS_REST_BASE_URL: ${LS_REST_BASE_URL:-}

  conditional-rule-retention-worker:
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: *conditional-worker-database-url
      CONDITIONAL_RULE_RETENTION_DATABASE_URL: *conditional-worker-database-url
      CONDITIONAL_RULE_RETENTION_DATABASE_ROLE: svc_conditional_rule_worker
      CONDITIONAL_RULE_RETENTION_ENABLED: ${CONDITIONAL_RULE_RETENTION_ENABLED:-true}
      CONDITIONAL_RULE_RETENTION_INTERVAL_SECONDS: ${CONDITIONAL_RULE_RETENTION_INTERVAL_SECONDS:-86400}
      CONDITIONAL_RULE_RETENTION_BATCH_SIZE: ${CONDITIONAL_RULE_RETENTION_BATCH_SIZE:-500}
      CONDITIONAL_RULE_EVALUATION_RETENTION_DAYS: ${CONDITIONAL_RULE_EVALUATION_RETENTION_DAYS:-30}
      CONDITIONAL_RULE_DETAIL_RETENTION_DAYS: ${CONDITIONAL_RULE_DETAIL_RETENTION_DAYS:-90}
      CONDITIONAL_RULE_OUTBOX_RETENTION_DAYS: ${CONDITIONAL_RULE_OUTBOX_RETENTION_DAYS:-7}
      CONDITIONAL_RULE_RETENTION_STATEMENT_TIMEOUT_MS: ${CONDITIONAL_RULE_RETENTION_STATEMENT_TIMEOUT_MS:-1500}

  conditional-rule-outbox-relay:
    depends_on:
      <<: *control-dependency
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: *conditional-worker-database-url
      CONDITIONAL_RULE_DATABASE_URL: *conditional-worker-database-url
      CONDITIONAL_RULE_WORKER_DATABASE_ROLE: svc_conditional_rule_worker
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CONDITIONAL_RULE_EVENT_STREAM: ${CONDITIONAL_RULE_EVENT_STREAM:-hf:conditional-rule-events:v1}
      CONDITIONAL_RULE_EVENT_STREAM_MAXLEN: ${CONDITIONAL_RULE_EVENT_STREAM_MAXLEN:-10000}
      CONDITIONAL_RULE_OUTBOX_POLL_SECONDS: ${CONDITIONAL_RULE_OUTBOX_POLL_SECONDS:-1}
      CONDITIONAL_RULE_OUTBOX_BATCH_SIZE: ${CONDITIONAL_RULE_OUTBOX_BATCH_SIZE:-100}

  conditional-rule-notification-consumer:
    depends_on:
      <<: *control-dependency
      redis:
        condition: service_healthy
      trading-api:
        condition: service_healthy
    environment:
      APP_ENV: production
      PORTFOLIO_AUTH_MODE: fixture
      PORTFOLIO_AUTH_REQUIRED: "false"
      DATABASE_URL: *control-database-url
      ORDER_ORCHESTRATOR_DATABASE_URL: *order-database-url
      ORDER_ORCHESTRATOR_DATABASE_ROLE: svc_order_orchestrator
      CONDITIONAL_RULE_DATABASE_URL: *conditional-worker-database-url
      CONDITIONAL_RULE_WORKER_DATABASE_ROLE: svc_conditional_rule_worker
      TRADING_API_URL: http://trading-api:8000
      TRADING_SERVICE_AUTH_SECRET: ${TRADING_SERVICE_AUTH_SECRET:?A 32-byte trading service proof secret is required}
      TRADING_SERVICE_AUTH_ISSUER: ${TRADING_SERVICE_AUTH_ISSUER:-portfolio-bff}
      TRADING_SERVICE_AUTH_AUDIENCE: ${TRADING_SERVICE_AUTH_AUDIENCE:-trading-api}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CONDITIONAL_RULE_EVENT_STREAM: ${CONDITIONAL_RULE_EVENT_STREAM:-hf:conditional-rule-events:v1}
      CONDITIONAL_RULE_NOTIFICATION_GROUP: ${CONDITIONAL_RULE_NOTIFICATION_GROUP:-conditional-paper-reporting-v1}
      CONDITIONAL_RULE_NOTIFICATION_RETRY_MS: ${CONDITIONAL_RULE_NOTIFICATION_RETRY_MS:-2000}
      NOTION_TOKEN: ${NOTION_TOKEN:-}
      NOTION_CEO_DB: ${NOTION_CEO_DB:-}
      NOTION_TRADING_DB: ${NOTION_TRADING_DB:-}

  portfolio-worker:
    depends_on: *control-dependency
    environment:
      <<: *control-environment
      MEMOHARNESS_D5_MODE: ${MEMOHARNESS_D5_MODE:-off}
      MEMOHARNESS_D5_TOP_K: ${MEMOHARNESS_D5_TOP_K:-5}
      MEMOHARNESS_D5_STATEMENT_TIMEOUT_MS: ${MEMOHARNESS_D5_STATEMENT_TIMEOUT_MS:-1500}

  ls-realtime:
    environment: *control-and-market-environment

  batch-collectors:
    environment: *control-and-market-environment

  qa-reproduction-worker:
    environment:
      <<: *control-session-environment
      RISK_QA_DATABASE_URL: *control-database-url
      QA_REPRODUCTION_TIMESCALE_DATABASE_URL: *market-database-url

  quant-api:
    depends_on: *control-dependency
    environment:
      <<: *control-session-environment
      QUANT_DATABASE_URL: *control-database-url

  market-api:
    environment: *control-and-market-environment

  research-api:
    depends_on: *control-dependency
    environment: *control-environment

  factory-kanban-dispatcher:
    # 실행면 이미지(quant-py·agent-reach 포함). 카드를 도는 에이전트가
    # 이 컨테이너 안에서 뜨므로 작업면은 여기 있어야 한다
    # (Dockerfile.agent-runtime 머리말 참고, 2026-08-23 배선).
    image: hedgefund-agent-runtime:latest
    environment:
      # 퀀트 프로필 config.yaml 의 ${QUANT_DATABASE_URL} 이 여기서 풀린다.
      # RLS: quant.hypotheses/experiments 정책은 svc_quant 전용이라
      # runtime 롤 그대로면 오류 없이 0행이 보인다(2026-08-23 실측).
      # trading 과 같은 SET ROLE 패턴을 쓴다 - runtime 은 이미 멤버다.
      QUANT_DATABASE_URL: "postgresql://hgfinance_runtime:${HEDGEFUND_RUNTIME_DB_PASSWORD}@timescaledb:5432/${HEDGEFUND_CONTROL_DB_NAME:-control}?options=-c%20role%3Dsvc_quant"
      # 퀀트 프로필의 TIMESCALE_DATABASE_URL 이 이 변수를 **전체-값**으로
      # 치환한다. hermes 프로필 env 는 문자열 중간 ${VAR} 를 치환하지
      # 않는다(2026-08-24 실측) - 완성 URL 을 여기서 내린다.
      HEDGEFUND_TSDB_PASSWORD: ${HEDGEFUND_TSDB_PASSWORD:?}
      # The dispatcher only needs market reads. Keep the deployment runtime
      # on the least-privilege market login; admin-market is bootstrap-only.
      TIMESCALE_DATABASE_URL: *market-database-url

  research-mcp:
    depends_on: *control-dependency
    environment:
      <<: *control-environment
      # Worker 모델 좌표(2026-08-23): 모델 오버레이를 빠뜨린 재생성이
      # 회의론자 워커를 부재한 Ollama 로 폴백시켰다. AWS 배포는 이
      # 오버레이를 항상 타므로 좌표를 여기 둔다.
      WORKER_MODEL_BASE_URL: ${WORKER_MODEL_BASE_URL:-http://vllm:8000/v1}
      WORKER_MODEL_NAME: ${WORKER_MODEL_NAME:-qwen2.5-14b-instruct-awq}
      WORKER_MODEL_API_KEY: ${WORKER_MODEL_API_KEY:-vllm}
      WORKER_MODEL_TIMEOUT_SECONDS: ${WORKER_MODEL_TIMEOUT_SECONDS:-120}
      WORKER_MODEL_REGISTRY_PATH: /app/departments/01-research/config/worker_model_registry.json

  research-liaison-mcp:
    depends_on: *control-dependency
    environment: *control-environment

  risk-api:
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *control-environment
      RISK_QA_DATABASE_URL: *control-database-url
      # Risk compliance-policy-worker uses the shared Qwen14B model plane.
      # The Risk Hermes head remains a separate supervisor process.
      WORKER_MODEL_BASE_URL: ${WORKER_MODEL_BASE_URL:-http://vllm:8000/v1}
      WORKER_MODEL_NAME: ${WORKER_MODEL_NAME:-Qwen2.5-14B-Instruct-AWQ}
      WORKER_MODEL_API_KEY: ${WORKER_MODEL_API_KEY:-vllm}
      WORKER_MODEL_TIMEOUT_SECONDS: ${WORKER_MODEL_TIMEOUT_SECONDS:-120}

  audit-api:
    environment:
      <<: *control-session-environment
      RISK_QA_DATABASE_URL: *control-database-url

  qa-worker:
    environment:
      <<: *control-session-environment
      RISK_QA_DATABASE_URL: *control-database-url

  ceo-kanban-supervisor:
    depends_on: *control-dependency
    environment:
      <<: *control-environment
      RISK_QA_DATABASE_URL: *control-database-url
      # The supervisor binds the already-admitted PAPER request before it
      # releases the deferred Trading card. Use the isolated order role.
      ORDER_ORCHESTRATOR_DATABASE_URL: *order-database-url
      ORDER_ORCHESTRATOR_DATABASE_ROLE: svc_order_orchestrator

  # MemoHarness retention must use the same private control database as the
  # BFF and supervisor.
  memo-harness-retention-worker:
    depends_on: *control-dependency
    environment:
      DATABASE_URL: *control-database-url
      MEMOHARNESS_D5_DATABASE_URL: *control-database-url
      MEMOHARNESS_D5_RETENTION_VACUUM_ANALYZE: "false"

  factory-autopilot:
    environment:
      <<: *control-and-market-environment
      QUANT_DATABASE_URL: *control-database-url
      DATABASE_SESSION_URL: *control-database-url

  factory-experiment-worker:
    environment:
      <<: *control-session-environment
      QUANT_DATABASE_URL: *control-database-url
      TIMESCALE_DATABASE_URL: *market-database-url
      # 63세션 틱 리플레이는 30분을 넘긴다 - 일하는 중인 실험을 좀비로
      # 몰아 죽이지 않도록 실측 전까지 넉넉히 둔다(2026-08-24 실측: 두 건이
      # 정확히 30:00 에 CANCELLED 로 닫혔다).
      HYPOTHESIS_STALL_MIN: ${HYPOTHESIS_STALL_MIN:-180}
    volumes:
      # ▶ 코드를 마운트한다 (2026-08-24 실측)
      #   이 컨테이너는 코드가 이미지에 구워져 있어 저장소 수정이 닿지 않았다.
      #   HYPOTHESIS_STALL_MIN 을 env 로 열어 놓고 180 을 줬는데도 워커는
      #   이미지 안의 옛 상수 30 을 계속 썼고, 33분째 일하던 실험을 죽였다.
      #   디스패처는 이미 같은 방식으로 저장소를 마운트한다 - 관례를 맞춘다.
      - ./departments/04-quant-backtest:/app/departments/04-quant-backtest:ro
      - ./departments/01-research:/app/departments/01-research:ro

