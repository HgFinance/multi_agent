      LS_APP_KEY_PAPER: ${LS_APP_KEY_PAPER:?LS PAPER AppKey is required}
      LS_APP_SECRET_KEY_PAPER: ${LS_APP_SECRET_KEY_PAPER:?LS PAPER SecretKey is required}
