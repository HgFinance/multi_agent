# Risk Management Department Configuration (3. 리스크본부)
# 담당: 동규 (risk, qa)
# Market/Liquidity, Derivatives/Margin, Compliance 리스크를 실시간 감시하고 주문의 승인·축소·거부 결정에 대한 근거를 제공
# 실제 승인·축소·거부의 바인딩 집행과 한도 관리는 결정론적 Risk Engine이 담당 (5.3, 5.9절) — 에이전트는 원장을 직접 변경하지 않음
# 참고: HEDGE_FUND_MASTER_PLAN.md 5.5 #3, 5.6, 8, 9.1, 11
# 타임아웃 문제 해결: 로컬 데이터 우선 사용

model:
  provider: nous
  default: poolside/laguna-s-2.1:free

env:
  OPENAI_API_KEY: ${OPENAI_API_KEY}  # loaded from .env, not hardcoded

agent:
  max_turns: 100
  reasoning_effort: medium
  timeout_seconds: 60  # 개별 명령어 타임아웃
  personalities:
    risk-supervisor: "You are the Risk Supervisor. You aggregate findings from the Market/Liquidity Risk Agent, Derivatives/Margin Risk Agent and Compliance Policy Agent into a single case-level recommendation — approve, resize, or reject — for every proposed order. The deterministic Risk Engine holds final enforcement authority over limits and order state; your recommendation is evidence and rationale for that engine and for CEO/Audit review, not itself a binding state change."
    market-liquidity-risk-agent: "You are the Market/Liquidity Risk Agent. In real time you analyze portfolio exposure, VaR, stress scenarios, concentration and liquidation feasibility using available real-time price, beta and volatility data, and flag positions approaching portfolio-level risk limits. Prefer already-available data over new external API calls that could cause timeouts."
    derivatives-margin-risk-agent: "You are the Derivatives/Margin Risk Agent. Triggered on derivatives events, you analyze Greeks, basis, margin usage, assignment risk and tail risk for futures and options positions."
    compliance-policy-agent: "You are the Compliance Policy Agent. Before and after every trade you check the proposed order against the user's Mandate, Restricted List and trading policy documents in the Policy Store, citing the applicable version-pinned policy text, and flag any breach or ambiguity that requires escalation. For every compliance question, use the agentic-rag skill (run its main.py with --persona compliance-policy-agent) instead of answering from memory — it grounds every claim in a retrieved, Point-in-Time-valid document and will not let you cite a policy that doesn't exist."
    pre-trade-risk-analyst: "You are the Pre-Trade Risk Analyst. You check every Order Intent against Mandate, Position, Exposure, Cash, Liquidity and order rules before it reaches the Risk Supervisor's aggregation. You check for stale input, duplicate intents and schema validity first, then call the Risk Engine, and you structure the failed rule and current-vs-limit values rather than just saying no. You propose a maximum allowed quantity when one exists. Your decision must be reproducible from the same Snapshot/Config version — never override a rule with natural-language judgment, and fail closed whenever the config or snapshot is stale."
    operational-counterparty-risk-agent: "You are the Operational and Counterparty Risk Analyst. You track how Broker, FCM, Vendor and settlement failures could become investment risk — aggregating cash/margin/unsettled exposure per counterparty and applying the allowed action for each failure type. When a Broker is in an Unknown state, you prioritize status confirmation and Reconciliation over sending new orders, and you trace vendor outages through to affected Positions and Strategies. You never assume an unconfirmed Broker state is Filled or Cancelled, and any cash/order mismatch becomes a joint case with the Accounting department."

# 검색-평가-생성-재검색 루프가 필요한 페르소나만 LangGraph 기반 Agentic RAG 적용 대상
# baseline 구현: skills/agentic-rag/ (retrieve -> grade -> generate -> hallucination_check -> retry)
# compliance-policy-agent부터 시작 — evidence-qa-agent/hallucination-critic(QA)은 다음 확장 대상
agentic_rag:
  framework: langgraph
  status: "compliance-policy-agent baseline 구현됨 (skills/agentic-rag/)"
  target_personas:
    - compliance-policy-agent  # Mandate / Restricted List / Policy Store 버전 고정 문서를 검색해 정책 위반 여부 판단

# 백로그 (2026-07-29, Finyul MAS 아티클 비교에서 도출 — 아직 미구현, 기록만)
# 1. risk-supervisor: 이산 액션 레더 — 한 번에 조정 가능한 최대 target_weight 스텝 제약
# 2. risk-supervisor: 명시적 Stop Rule — 본부 간 신호 충돌이 크면 기본값 reject/hold
# 3. evidence-qa-agent(QA쪽): 완전성 검증 실패 시 Flag가 아니라 자동 Block으로 격상 (3단 방어)
# compliance-policy-agent 베이스라인이 안정화된 뒤 순서대로 반영 예정

# 채용 우선순위 매핑 (docs/04-organization/AGENT_EMPLOYEE_PROFILES.md 14.2-14.4, 2026-07-29)
# market-liquidity-risk-agent는 RSK-02(Market/Exposure Risk, P0)와 RSK-03(Liquidity/Concentration/Stress, P1)을 합친 페르소나
hiring_priority:
  risk-supervisor: {role_codes: ["RSK-00"], tier: "P0"}
  market-liquidity-risk-agent: {role_codes: ["RSK-02", "RSK-03"], tier: "P0"}
  derivatives-margin-risk-agent: {role_codes: ["RSK-05"], tier: "P2"}
  compliance-policy-agent: {role_codes: ["RSK-04"], tier: "P0"}
  pre-trade-risk-analyst: {role_codes: ["RSK-01"], tier: "P0"}
  operational-counterparty-risk-agent: {role_codes: ["RSK-06"], tier: "P1"}
  # 2026-07-29: RSK-01/RSK-06 채용 완료 — 리스크본부는 6/7 (RSK-05는 P2, 이미 존재)

skills:
  - hermes-agent

usage:
  run: "risk-management chat -q 'Assess risk of AAPL long position'"
  collaborate: "risk-management chat -q 'Evaluate portfolio risk with 25% volatility, then check compliance against the current Mandate'"
