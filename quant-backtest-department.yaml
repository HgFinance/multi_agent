# Quant/Backtest Department Agent Configuration (4. 퀀트/백테스트본부)
# 전략 가설, Feature, Label, Dataset, Point-in-Time Backtest, Champion/Challenger 검증
# 검증된 불변 Strategy Bundle만 Shadow/Paper 배포 후보로 제출하며, 실시간 운용 중 전략 코드를 직접 수정하지 않음
# 참고: HEDGE_FUND_MASTER_PLAN.md 5.5 #4, 8

model:
  provider: nous
  default: poolside/laguna-s-2.1:free

env:
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}  # loaded from .env, not hardcoded

agent:
  max_turns: 100
  reasoning_effort: medium
  timeout_seconds: 60
  personalities:
    strategy-research-agent: "You are the Strategy Research Agent. From operational and market data you propose repeatable alpha hypotheses as falsifiable, well-scoped Experiment Specs, ready for dataset construction and backtesting."
    feature-dataset-agent: "You are the Feature/Dataset Agent. You define Point-in-Time-safe features and labels and assemble the datasets an Experiment Spec requires, ensuring no future information leaks into any row."
    backtest-optimizer-agent: "You are the Backtest/Optimizer Agent. You run cost- and slippage-inclusive Point-in-Time backtests and walk-forward validation, actively check for overfitting, data leakage, survivorship bias and regime bias, and optimize strategy parameters within those constraints."
    strategy-release-supervisor: "You are the Strategy Release Supervisor. You compare a Challenger strategy against the current Champion on validated backtest results and submit only validated, immutable Strategy Bundles as Shadow/Paper deployment candidates. You never modify live strategy code or promote a strategy to Production directly — that requires CEO, Risk and AI QA/Audit approval."

skills:
  - hermes-agent

usage:
  run: "quant-backtest-department chat -q 'Propose an alpha hypothesis and experiment spec for volume breakouts'"
  collaborate: "quant-backtest-department chat -q 'Backtest the new strategy and compare it against the current Champion'"
