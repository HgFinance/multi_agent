name: strategy-research
version: strategy-research-v2
kind: strategy-research
description: 전략 공장 루프 - 방법론 수집·실험 기획 -> 사전등록·실험 -> 재현 검증 -> 승격 판단 -> 결과 환류
boundary_rules:
  - 가설은 리서치본부가 만들고 퀀트본부가 검증한다. 낸 부서가 검증하지 않는다.
  - Point-in-Time Dataset과 재현 가능한 Strategy Candidate만 다음 단계로 전달한다.
  - Quant는 Production 승격을 수행하지 않는다.
  - QA 재현 검증과 승격 승인 전에는 Trading으로 Strategy Bundle을 전달하지 않는다.
  - 승격의 최종 서명은 사람이 한다. 막는 판정(HOLD·거부·킬)은 결정론 코드가 단독 발동한다.
  - 실험 결과는 성공·기각을 가리지 않고 환류한다. 환류 적재가 실험 종결의 전제 조건이다.
steps:
  - id: research-proposal
    sequence: 1
    department: research-department
    owner: research
    task: 방법론 수집(렌즈 4)·기각 이력 대조·경쟁 설명 확보 후 ExperimentProposalV1 발행
    input_contract: scout_cycle
    output_contract: experiment_proposal
    timeout_seconds: 120
    retry: {max_attempts: 2}
    failure_action: NO_SUBMIT
    forbidden_actions: [production_promotion, order_submission, direction_forecast]
  - id: quant-backtest
    sequence: 2
    department: quant-backtest-department
    owner: quant
    task: Gate 0 접수 검사 후 사전등록, PIT Dataset·Backtest·Walk-forward·DSR·PBO·국면 분해로 ExperimentCardV1 생성
    input_contract: experiment_proposal
    output_contract: strategy_candidate
    timeout_seconds: 90
    retry: {max_attempts: 3}
    failure_action: NO_SUBMIT
    forbidden_actions: [production_promotion, order_submission, hypothesis_generation]
  - id: qa-release-review
    sequence: 3
    department: qa-department
    owner: qa
    task: 동일 lineage 재현 재실행과 Model Risk 독립 검증
    input_contract: strategy_candidate
    output_contract: strategy_qa_assessment
    timeout_seconds: 60
    retry: {max_attempts: 3}
    failure_action: REJECT_PROMOTION
    forbidden_actions: [production_promotion, order_submission]
  - id: ceo-promotion-review
    sequence: 4
    department: ceo-agent
    owner: ceo
    task: Card·QA·Risk 세 입력을 확인하고 Shadow/Paper 승격 여부만 결정(최종 서명은 사람)
    input_contract: strategy_qa_assessment
    output_contract: promotion_decision
    timeout_seconds: 30
    retry: {max_attempts: 2}
    failure_action: REJECT_PROMOTION
    forbidden_actions: [order_submission, risk_approval]
  - id: quant-outcome-feedback
    sequence: 5
    department: quant-backtest-department
    owner: quant
    task: 종결 사유를 통제 어휘 lesson_codes로 사상해 ExperimentOutcomeV1 적재(리서치 Gate 0 재조회용)
    input_contract: promotion_decision
    output_contract: experiment_outcome
    timeout_seconds: 60
    retry: {max_attempts: 3}
    # 환류 적재가 실패하면 실험을 종결로 넘기지 않는다 - ESCALATE 로 사람에게 올린다.
    # 조용히 지나가면 그 교훈은 영영 Gate 0 에 닿지 않고 같은 실험을 다시 사게 된다.
    failure_action: ESCALATE
    forbidden_actions: [production_promotion, order_submission, outcome_deletion]
