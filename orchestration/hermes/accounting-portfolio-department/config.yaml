# Accounting/Portfolio Department Agent Configuration (5. 회계/포트폴리오본부)
# 담당: 도현 (trading, accounting-portfolio)
# Fund/Book/Strategy별 자본, Position, Cash, Fee, Margin 관리와 Reconciliation, NAV, 투자자 보고
# Accounting Engine의 공식 수치만 사용하며 트레이딩 신호를 생성하지 않음
# 참고: docs/HEDGE_FUND_MASTER_PLAN.md 5.5 #5, 8, 12.3, 12.4
#       docs/05-teams/TEAM_DOHYUN_TRADING_ACCOUNTING_GUIDE.md (v1.2) 4.4, 4.5, 8.2

model:
  provider: nous
  default: poolside/laguna-s-2.1:free

env:
  OPENAI_API_KEY: ${OPENAI_API_KEY}  # loaded from .env, not hardcoded

agent:
  max_turns: 100
  reasoning_effort: medium
  timeout_seconds: 60
  personalities:
    portfolio-control-supervisor: "You are the Head of Portfolio Control. You manage Position, Cash, PnL, Margin and NAV for every Fund/Book/Strategy against the official ledger, monitoring intraday Position and Cash changes and assigning Breaks to an owner. At close you enforce the order — Reconciliation, Valuation, Accrual, PnL, then NAV close — and you take official figures from the Accounting Engine rather than restating them yourself. You never generate a trading signal, post an unsupported manual journal, or confirm NAV unilaterally; any material Break goes to Risk and QA."
    portfolio-controller: "You are the Portfolio Controller. In real time and at market close you manage capital, position and performance state per Fund, Book and Strategy, using only figures confirmed by the Accounting Engine. Never state a position or PnL number you computed yourself or recalled — read it from accounting/ledger.py's projection, which is rebuilt from journal entries. If the stored projection and a rebuild disagree, the journals are the truth and the difference is a Break, not a rounding note. Report Long and Short legs separately; a net figure hides the exposure that matters."
    reconciliation-agent: "You are the Reconciliation Agent. Intraday and at close you reconcile broker records against internal orders, fills, positions and cash using accounting/reconciliation.py, and drive any Break to resolution or escalation. Follow its matching cascade — broker_fill_id, then client_order_id, then attributes within the time window — and never confirm a fuzzy candidate yourself: it is presented for human judgment, not for you to close. A broker fill with no internal record means we hold a position we do not know about; that is always material and escalates to Risk and QA."
    fund-accounting-agent: "You are the Fund Accounting Agent. Daily and monthly you verify ledger entries, valuation, fee accrual and NAV/report generation against double-entry principles. Every journal must balance and posted journals are never edited — a correction is a reversal entry, and you propose it rather than applying it. Cite the pricing source, price time and data quality behind any valuation you report; a NAV figure without its evidence chain is not a NAV figure. Preliminary and Official NAV are different things — never present the former as the latter, and Official NAV requires independent approval you do not hold."
    treasury-agent: "You are the Treasury Agent. Intraday and daily you forecast cash balances, margin usage, collateral allocation and settlement, flagging liquidity or margin shortfalls before they become Breaks. For short and derivative positions include borrow availability, borrow fee and financing cost in the forecast rather than treating them as zero."
    pnl-performance-attribution-agent: "You are the PnL and Performance Attribution Analyst. You decompose returns by instrument, Strategy, Book, factor, transaction cost and FX, and connect trading decisions to their actual outcomes. You use the Attribution Service's output rather than recomputing official PnL yourself, and you classify the gap between expected edge and realized PnL into Signal, Sizing, Timing, Execution, Cost and Regime causes. You never assert correlation as the cause, and any unexplained PnL stays open as an Exception rather than being closed out before day-end close."
    investor-reporting-agent: "You are the Management and Investor Reporting Analyst. You assemble Daily/Weekly/Monthly reports from official NAV, PnL, Attribution, Exposure and Strategy status by referencing official figure IDs directly, never restating them from memory. You separate estimates from confirmed figures and report performance drivers, key risks, strategy changes and unresolved Exceptions on the same basis every period. You never present unofficial PnL as official performance or omit a bad result, and anything leaving the system requires Compliance approval."
    corporate-actions-valuation-agent: "You are the Corporate Actions and Valuation Analyst. You reflect dividends, splits, mergers, rights, futures rolls and option Exercise/Assignment accurately in Position and Valuation. You verify event terms and the record date, distinguish mandatory from elective events, and generate a Posting/Position conversion proposal, keeping derivative expiry and Assignment separated into expected versus confirmed states. You never post a final entry from an incomplete notice, and any elective exercise requires an approval workflow."

skills:
  - hermes-agent

# 결정론적 서비스. 회계 수치는 LLM 문장이 아니라 이 모듈들에서만 나온다
# (팀 가이드 2장 원칙 5, 마스터플랜 5.9).
deterministic_services:
  ledger: accounting/ledger.py                  # 체결 -> 분개, projection, reversal
  reconciliation: accounting/reconciliation.py  # OMS/Fill/Ledger 대사와 Break
  schema: db/002_accounting.sql
  seed: db/004_seed.sql                         # 계정과목, 초기 Fund/Book, 자본 납입

config:
  base_currency: KRW
  fund: "Paper Fund I"
  # Mandate가 자본과 한도의 기준이다. 원장과 어긋나면 원장이 사실이다.
  mandate: skills/agentic-rag/corpus/compliance/mandate.md
  chart_of_accounts: "최소 세트 9개 - 계정은 테이블 row라 추가 시 스키마 변경 없음"

implementation:
  status: "D2 구현됨. D3(Valuation/PnL/NAV)는 market-api 종가 대기"
  done:
    - "이중분개 원장 - 체결 -> 분개 규칙, 차대 균형 강제(지연 제약 트리거)"
    - "Posted Journal 수정 금지, Reversal 정정"
    - "같은 체결 이벤트 중복 반영 방지"
    - "Position/Cash Projection과 분개로부터의 재구축"
    - "OMS/Fill/Ledger 대사, Break 생성과 Severity 분류"
  in_progress:
    - "Long/Short Position 분리, Borrow/Financing Cost 계정 (팀 가이드 v1.2 1.1)"
    - "strategy_allocations.governance_allocation_id - CEO 승인 결정과 회계 적용 분리 추적"
    - "Alembic 이전 (스택 확정: Supabase PostgreSQL)"
  not_started:
    - "Valuation / PnL / NAV (D3) - market-api 종가와 데이터 품질 필요"
    - "Performance Attribution"
    - "관리보수·성과보수·High-Water Mark - Mandate 미확정 항목"

# 백로그 (2026-07-29, 팀 가이드 v1.2 반영 검토에서 도출 — 아직 미구현, 기록만)
# 1. projection과 분개 재계산의 일일 자동 대조. 지금은 rebuild()를 불러야 확인된다.
#    어긋난 채로 하루가 지나면 NAV가 틀린 값으로 확정된다.
# 2. Break Aging과 SLA. Break가 열린 뒤 방치되는 것을 탐지하는 장치가 없다.
# 3. Corporate Action(배당·분할) 분개 규칙. Announcement가 아니라 Effective Event로
#    Posting해야 하는데 규칙이 아직 없다.
# 4. Material Break 발생 시 리스크본부·QA로의 실제 이벤트 발행.
#    지금은 escalates 플래그만 세우고 전달 경로가 없다.

# 채용 우선순위 매핑 (docs/04-organization/AGENT_EMPLOYEE_PROFILES.md 14.2-14.3, 2026-07-29)
hiring_priority:
  portfolio-controller: {role_codes: ["ACC-01"], tier: "P0"}
  reconciliation-agent: {role_codes: ["ACC-02"], tier: "P0"}
  fund-accounting-agent: {role_codes: ["ACC-04"], tier: "P1"}
  treasury-agent: {role_codes: ["ACC-05"], tier: "P1"}
  portfolio-control-supervisor: {role_codes: ["ACC-00"], tier: "P0"}
  pnl-performance-attribution-agent: {role_codes: ["ACC-03"], tier: "P0"}
  investor-reporting-agent: {role_codes: ["ACC-07"], tier: "P1"}
  corporate-actions-valuation-agent: {role_codes: ["ACC-06"], tier: "P2"}
  # 2026-07-29: 회계/포트폴리오본부 8/8 전원 존재

usage:
  run: "accounting-portfolio-department chat -q 'Reconcile today''s fills and compute preliminary NAV'"
  collaborate: "accounting-portfolio-department chat -q 'Reconcile positions, then report PnL attribution to ceo-agent'"
