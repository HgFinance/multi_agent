# Worker Model Plane 오버레이 - Control Plane compose 위에 얹는다.
#
# 소유: 재일 (리서치본부 첫 적용)
# 근거: docs/02-engineering/FINAL_RUNTIME_ARCHITECTURE.md §3.2(worker-model-gateway),
#       §7.2(Multi-LoRA), §8.4(EBS=Runtime Cache), §12 Phase 4.
#
# ▶ 쓰는 법 (AWS EC2, GPU 필수)
#     scripts/model_plane/vllm_runtime.sh up
#     scripts/model_plane/vllm_runtime.sh check
#   vLLM은 반드시 위 래퍼를 통해서만 관리한다. 원시 docker run/compose 명령은
#   이미지 pin·Compose ownership·네트워크 alias 검사를 우회하므로 운영 절차가 아니다.
#   모델 파일은 먼저 EBS 에 있어야 한다:
#     scripts/model_plane/fetch_base_model.sh   (HF → EBS 최초 1회)
#   S3 가 Source of Truth, EBS(/opt/hgfinance/models)는 Runtime Cache 다(§8.3-8.4).
#
# ▶ 이 파일이 기본 compose 에 안 들어가는 이유
#   Control Plane(EC2 CPU)과 Model Plane(GPU)은 수명이 다르다. GPU 가 없는
#   개발자 로컬·EB 배포가 vllm 서비스 정의 때문에 깨지면 안 된다 - 오버레이를
#   명시적으로 -f 로 얹은 곳에서만 존재한다.
#
# ▶ 보안 경계 (§11)
#   vLLM 은 compose 네트워크 안에서 vllm:8000 으로만 불린다. 호스트 게시는
#   127.0.0.1 한정 - EC2 보안그룹과 무관하게 외부 노출이 없다.

x-worker-model-environment: &worker-model-environment
  WORKER_MODEL_BASE_URL: ${WORKER_MODEL_BASE_URL:-http://vllm:8000/v1}
  WORKER_MODEL_EXECUTION_CONTEXT: container
  WORKER_MODEL_NAME: ${WORKER_MODEL_NAME:-qwen2.5-14b-instruct-awq}
  WORKER_MODEL_PROFILE: ${WORKER_MODEL_PROFILE:-qwen-awq-v1}
  WORKER_MODEL_API_KEY: ${WORKER_MODEL_API_KEY:-vllm}
  WORKER_MODEL_TIMEOUT_SECONDS: ${WORKER_MODEL_TIMEOUT_SECONDS:-120}
  WORKER_MODEL_REGISTRY_PATH: ${WORKER_MODEL_REGISTRY_PATH:-/app/departments/01-research/config/worker_model_registry.json}
  WORKER_LORA_ADAPTER_NAME: ${WORKER_LORA_ADAPTER_NAME:-hgfinance-awq-arithmetic-2epoch}
  WORKER_LORA_ADAPTER_VERSION: ${WORKER_LORA_ADAPTER_VERSION:-arithmetic-2epoch}

services:
  vllm:
    # Never use a mutable tag for the serving plane. The wrapper exports this
    # same digest and refuses containers that drift from it.
    # Deliberately literal: a .env override must not turn the serving plane
    # back into a mutable :latest or an unreviewed image.
    image: vllm/vllm-openai@sha256:0a51ea5b4ae2dc5d81890e5173f54203d2a3ae0cfffe51b8fd2afd4391bfd967
    container_name: hedgefund-vllm
    labels:
      com.hgfinance.runtime.owner: compose
      com.hgfinance.runtime.profile: qwen-awq-v1
      com.hgfinance.runtime.launcher: scripts/model_plane/vllm_runtime.sh
      com.hgfinance.runtime.image_digest: sha256:0a51ea5b4ae2dc5d81890e5173f54203d2a3ae0cfffe51b8fd2afd4391bfd967
    # Must share the control-plane network so Worker containers can resolve
    # the stable `vllm` service name instead of falling back to host/bridge DNS.
    networks:
      - default
    restart: unless-stopped
    # PyTorch 공유 메모리 - 없으면 tensor 로딩이 죽는다
    ipc: host
    ports:
      - "127.0.0.1:8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      # EBS 캐시에서만 읽는다 - 부팅 때 HF 네트워크에 나가지 않는다.
      # 모델이 없으면 즉시 실패해야 한다(조용히 28GB 를 받기 시작하면 안 된다).
      HF_HOME: /models/hf-cache
      HF_HUB_OFFLINE: "1"
      # LoRA 를 재시작 없이 /v1/load_lora_adapter 로 올릴 수 있게 한다
      VLLM_ALLOW_RUNTIME_LORA_UPDATING: "True"
    volumes:
      # EBS Runtime Cache (§8.4). adapters/ 하위는 LoRA 승격 시 쓴다.
      - ${HGF_MODEL_DIR:-/opt/hgfinance/models}:/models
      # Approved AWQ v1 arithmetic adapter for this AWS runtime profile.
      - ${WORKER_LORA_ADAPTER_DIR:-/tmp/hgfinance-awq-specialists-v1/arithmetic/adapter-2epoch}:/tmp/adapter:ro
      # Persist vLLM/Torch compile artifacts across restarts. Without this,
      # a cold restart repeats the highest-RAM compile path on an L4 host.
      - ${VLLM_CACHE_DIR:-/tmp/hgfinance-runtime-vllm-cache}:/root/.cache
    command:
      - --model
      - /models/${WORKER_BASE_MODEL_DIRNAME:-Qwen2.5-14B-Instruct-AWQ}
      # 계약 문자열 - tests/contracts/test_unified_api_contract.py 와
      # departments/01-research/config/worker_model_registry.json 이 같은 이름을 쓴다
      - --served-model-name
      - ${WORKER_MODEL_NAME:-qwen2.5-14b-instruct-awq}
      # Compatibility alias for existing callers of the v1 runtime.
      - Qwen2.5-14B-Instruct-AWQ
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      # L4 24GB 기준 보수값. g6e(L40S 48GB)면 32768 로 올린다.
      - --max-model-len
      - ${VLLM_MAX_MODEL_LEN:-8192}
      - --gpu-memory-utilization
      - ${VLLM_GPU_MEMORY_UTILIZATION:-0.85}
      # KV 를 FP8 로 - 24GB 에서 동시성 여유가 이걸로 벌어진다
      - --kv-cache-dtype
      - ${VLLM_KV_CACHE_DTYPE:-fp8}
      - --enable-prefix-caching
      # Multi-LoRA 준비 - adapter 가 아직 없어도 켜 둔다. 승인된 LoRA 는
      # /v1/load_lora_adapter 로 올리고 worker_model_registry.json 에 적는다.
      - --enable-lora
      - --lora-modules
      - ${WORKER_LORA_ADAPTER_NAME:-hgfinance-awq-arithmetic-2epoch}=/tmp/adapter
      - --max-loras
      - "4"
      - --max-lora-rank
      - "32"
      - --max-cpu-loras
      - "8"
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 30
      # 14B 로딩 + CUDA 그래프 캡처가 수 분 걸린다
      start_period: 600s
    stop_grace_period: 60s

  # ── research-mcp 에 Worker 모델 좌표만 주입한다 ──────────────────────────
  # 공용 Worker 소스 마운트는 기본 compose에 있다. 그래야 이 오버레이가 없는
  # 로컬 Ollama 경로도 독립 회의론자 Worker를 똑같이 실행할 수 있다.
  research-mcp:
    environment:
      <<: *worker-model-environment

  # Portfolio recommendation Workers use the same shared model plane. The
  # BFF entry is included for the explicitly supported embedded-worker mode;
  # production normally executes through portfolio-worker.
  portfolio-bff:
    environment:
      <<: *worker-model-environment
    volumes:
      - ./departments/01-research/config:/app/departments/01-research/config:ro

  portfolio-worker:
    environment:
      <<: *worker-model-environment
    volumes:
      - ./departments/01-research/config:/app/departments/01-research/config:ro

  # Risk compliance-policy-worker uses the same shared Qwen14B model plane.
  # Hermes remains the Risk department head; this only changes the independent
  # employee Worker model boundary.
  risk-api:
    environment:
      <<: *worker-model-environment
    volumes:
      - ./departments/01-research/config:/app/departments/01-research/config:ro

  # QA's independent employee Workers use the same gateway. qa-worker and
  # qa-reproduction-worker stay deterministic/event-driven and intentionally
  # do not receive model credentials.
  audit-api:
    environment:
      <<: *worker-model-environment
    volumes:
      - ./departments/01-research/config:/app/departments/01-research/config:ro

  # The CEO supervisor may execute the employee briefing Worker through the
  # paper pipeline. Hermes itself remains the department-head boundary.
  ceo-kanban-supervisor:
    environment:
      <<: *worker-model-environment
