name: Runtime and AWS Contract

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  linux-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run repository contract suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q tests

  elastic-beanstalk-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Elastic Beanstalk Compose
        run: docker compose -f deploy/eb/docker-compose.yml config --quiet
      - name: Build and inspect Elastic Beanstalk source bundle
        shell: pwsh
        run: ./scripts/package_eb_bundle.ps1 -OutFile "${{ runner.temp }}/eb-bundle.zip"
