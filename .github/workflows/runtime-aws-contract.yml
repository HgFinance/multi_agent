name: Runtime and AWS Contract

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  linux-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked runtime and test dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Install pinned Python dependency auditor
        run: python -m pip install --disable-pip-version-check pip-audit==2.10.1
      - name: Audit locked Python dependencies and emit CVE report
        run: >-
          pip-audit --disable-pip --require-hashes
          -r requirements.lock
          --format json
          --output "${{ runner.temp }}/python-cve-audit.json"
          --progress-spinner off
      - name: Emit CycloneDX Python SBOM
        run: >-
          pip-audit --disable-pip --require-hashes
          -r requirements.lock
          --format cyclonedx-json
          --output "${{ runner.temp }}/python-sbom.cdx.json"
          --progress-spinner off
      - name: Upload dependency security evidence
        uses: actions/upload-artifact@v4
        with:
          name: python-dependency-security
          path: |
            ${{ runner.temp }}/python-cve-audit.json
            ${{ runner.temp }}/python-sbom.cdx.json
      - name: Run deployment-blocking contract suite explicitly
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q tests/contracts
      - name: Run repository contract suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q tests
      - name: Run QA transport and reproduction suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q departments/06-ai-qa-audit/tests

  elastic-beanstalk-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Elastic Beanstalk Compose
        env:
          CONTROL_DATABASE_URL: postgresql://contract:contract@db.invalid/control
          PORTFOLIO_CORS_ALLOW_ORIGINS: https://portfolio.example.invalid
          TRADING_SERVICE_AUTH_SECRET: contract-service-proof-secret-0123456789
          TRADING_INTERNAL_SERVICE_AUTH_SECRET: contract-internal-proof-secret-0123456
          MARKET_API_URL: https://market.example.invalid
        run: docker compose -f deploy/eb/docker-compose.yml config --quiet
      - name: Build and inspect Elastic Beanstalk source bundle
        shell: pwsh
        run: ./scripts/package_eb_bundle.ps1 -OutFile "${{ runner.temp }}/eb-bundle.zip"
