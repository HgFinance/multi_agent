name: Portfolio Live Advisory E2E

on:
  workflow_dispatch:
    inputs:
      frontend_url:
        description: Deployed AI Office URL
        required: true
        type: string
      bff_url:
        description: Authenticated BFF URL reachable by the runner
        required: true
        type: string

permissions:
  contents: read

jobs:
  live-advisory-read-only:
    runs-on: ubuntu-latest
    env:
      PORTFOLIO_LIVE_E2E: "1"
      AI_OFFICE_BASE_URL: ${{ inputs.frontend_url }}
      NEXT_PUBLIC_BFF_URL: ${{ inputs.bff_url }}
      PORTFOLIO_LIVE_USER_ID: ${{ secrets.PORTFOLIO_LIVE_USER_ID }}
      PORTFOLIO_LIVE_AUTH_TOKEN: ${{ secrets.PORTFOLIO_LIVE_AUTH_TOKEN }}
      PORTFOLIO_LIVE_MANDATE_ID: ${{ secrets.PORTFOLIO_LIVE_MANDATE_ID }}
      PORTFOLIO_LIVE_RECOMMENDATION_INPUT: ${{ secrets.PORTFOLIO_LIVE_RECOMMENDATION_INPUT }}
    defaults:
      run:
        working-directory: ai-office
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ai-office/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/portfolio-advisory-live.spec.mjs
      - name: Run deterministic advisory failure matrix
        run: npx playwright test e2e/portfolio-advisory.spec.mjs
        env:
          PORTFOLIO_LIVE_E2E: ""
          NEXT_PUBLIC_BFF_URL: ""
          AI_OFFICE_BASE_URL: ""
