name: Schema Contract

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "timescaledb/migrations/**"
      - "tests/schema/**"
      - "docs/database/**"
      - ".github/workflows/schema-contract.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - "timescaledb/migrations/**"
      - "tests/schema/**"

permissions:
  contents: read

jobs:
  contract-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate schema contracts
        run: python -m unittest discover -s tests/schema -p "test_*.py" -v
