name: AI Office Browser E2E

on:
  pull_request:
    paths:
      - "ai-office/**"
      - ".github/workflows/ai-office-e2e.yml"
  push:
    branches:
      - main
    paths:
      - "ai-office/**"
      - ".github/workflows/ai-office-e2e.yml"

permissions:
  contents: read

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-office
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ai-office/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
