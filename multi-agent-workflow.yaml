# Cross-department workflow registry.
# Detailed contracts live under orchestration/workflows/.
version: multi-agent-workflow-v2
description: "HgFinance 5개 분리 Workflow와 동적 Event Routing registry"
canonical_workflow_index: orchestration/workflows/index.yaml

# 실행 계층 계약: 실제 Head 모델은 각 departments/<n>/hermes/config.yaml에서 선택한다.
runtime_layers:
  department_head:
    runtime: hermes
    model_choices: [openai-codex, anthropic-claude-code]
    active_profile_models:
      ceo-agent: openai-codex/gpt-5.6-luna
      hr-department: openai-codex/gpt-5.6-luna
      research-department: openai-codex/gpt-5.6-luna
      trading-department: openai-codex/gpt-5.6-luna
      risk-management: openai-codex/gpt-5.6-luna
      quant-backtest-department: openai-codex/gpt-5.6-luna
      accounting-portfolio-department: openai-codex/gpt-5.6-luna
      qa-department: openai-codex/gpt-5.6-luna
    alternative_provider: anthropic-claude-code
    responsibility: department_synthesis_and_escalation
  department_employee:
    runtime: langgraph
    provider: ollama
    model: qwen3:1.7b
    model_selection: fixed_until_model_eval_approved
    discovery_command: ollama list
    worker_counts:
      ceo-agent: 1  # LLM Worker only; deterministic ceo-runner is separate
      hr-department: 0   # 직원 LLM 계층 없음 - 부서장 + 결정론 함수
      research-department: 6
      trading-department: 2  # LLM Worker only; deterministic desk-runner is separate
      risk-management: 4
      quant-backtest-department: 7
      accounting-portfolio-department: 1  # LLM Worker only; deterministic back-office-runner is separate
      qa-department: 5
    output: non_binding_worker_context
    retry: {max_retries: 2, max_attempts: 3}
  binding_gates:
    risk: departments/03-risk/engine/risk_engine.py
    qa: departments/06-ai-qa-audit/evidence/evidence_qa_engine.py
  failure_action: fail_closed_hold_reject_escalate_rollback

model:
  provider: openai-codex
  name: "gpt-5.6-luna"
  note: "Hermes Profile의 모델 설정은 각 departments/<n>/hermes/config.yaml을 따른다."

workflow:
  name: "AI 트레이딩 신호 검증 및 집행 프로세스"
  manifest: orchestration/workflows/investment-case.yaml
  order: [research, trading, risk, qa, oms-fill-gate, accounting, ceo]
  timeout_seconds: 450

portfolio_recommendation_cycle:
  manifest: orchestration/workflows/portfolio-recommendation.yaml
  order: [profile-suitability, research, trading, risk, qa, accounting, ceo]
  timeout_seconds: 300
  mode: test
  external_writes: false

strategy_research_cycle:
  manifest: orchestration/workflows/strategy-research.yaml
  order: [quant-backtest, qa-release-review, ceo-promotion-review]
  timeout_seconds: 180

workforce_management_cycle:
  manifest: orchestration/workflows/workforce-management.yaml
  order: [hr-profile, hr-candidate-eval, qa-permission-review, ceo-org-approval, hr-lifecycle]
  timeout_seconds: 300

agent_evolution_cycle:
  manifest: orchestration/workflows/agent-evolution.yaml
  order: [hr-improvement-signal, hr-profile-revision, qa-revision-review, ceo-revision-approval, hr-shadow-rollback]
  timeout_seconds: 300

event_routing:
  manifest: orchestration/workflows/event-routing.yaml
  order: dynamic
  default_action: ENTRY_BLOCKED

usage:
  single_department:
    research: "research-department chat -q 'Build a Research Packet for [종목]'"
    trading: "trading-department chat -q 'Propose a trade for [종목]'"
    risk: "risk-management chat -q 'Assess risk: [포지션 정보]'"
    qa: "qa-department chat -q 'Validate: [AI 신호 내용]'"
    quant: "quant-backtest-department chat -q 'Backtest [전략 가설]'"
    accounting: "accounting-portfolio-department chat -q 'Reconcile fills and compute PnL'"
    ceo: "ceo-agent chat -q 'Summarize current portfolio decisions and open risks'"
    hr: "hr-department chat -q 'Build the weekly workforce plan from department Queue/SLA/cost signals'"
  boundary_validation:
    all: "python -m orchestration.workflows.runner --workflow investment-case --mode dry-run --json"
    strategy: "python -m orchestration.workflows.runner --workflow strategy-research --mode dry-run --json"
    paper_e2e: "python -m orchestration.workflows.runner --workflow investment-case --mode paper-e2e --symbol AAPL --quantity 100 --limit-price 200.00 --json"

files:
  workflow_index: orchestration/workflows/index.yaml
  ceo_agent: departments/00-ceo-office/hermes/config.yaml
  hr_department: departments/07-agent-workforce/hermes/config.yaml
  research_department: departments/01-research/hermes/config.yaml
  trading_department: departments/02-trading/hermes/config.yaml
  risk_management: departments/03-risk/hermes/config.yaml
  quant_backtest_department: departments/04-quant-backtest/hermes/config.yaml
  accounting_portfolio_department: departments/05-accounting-portfolio/hermes/config.yaml
  qa_department: departments/06-ai-qa-audit/hermes/config.yaml
  news_script: departments/01-research/collectors/news.py
