# Trading Department Compose Fragment (도현 소유).
#
# 근거: docs/02-engineering/DEPARTMENT_BACKEND_INTEGRATION_DOCKER_PLAN.md 10절(Docker Compose
#       구조 - "본부가 자기 Compose Fragment를 소유하도록 한다"), 6.3절(트레이딩본부 Container 목록),
#       3.1절(Hermes는 Backend Image에 설치하지 않고 공식 Image를 별도 Container로 띄운다),
#       docs/02-engineering/HERMES_DOCKER_RUNBOOK.md 4-2절(다른 본부를 추가하는 법)
#
# 루트 docker-compose.yml이 `include:`로 이 파일을 끌어온다. include된 파일도 루트 파일과
# 하나의 병합된 모델을 공유하므로 redis 같은 공통 Platform Container를 서비스 이름으로
# 참조할 수 있다(계획서 5절 - 공통 인프라는 루트가 소유한다).
#
# ▶ 계획서 6.3의 oms-worker / broker-adapter는 아직 없다 - 코드가 없다.
#   코드 없는 역할을 컨테이너부터 만들지 않는다(departments/03-risk/Dockerfile 상단 주석과
#   같은 원칙). trading-api는 2026-08-03에 api/app.py가 생기면서 추가했다.
services:
  # trading-api: OrderIntent 심사, Broker Order 상태 머신, Paper 체결의 조회·명령면.
  # 계약은 docs/02-engineering/TRADING_DOMAIN_API_SPEC.md.
  #
  # ▶ DATABASE_URL을 주지 않는다. 빠뜨린 게 아니라 **아직 안 쓰기 때문**이다 -
  #   OrderStore가 프로세스 메모리라 재시작하면 주문이 사라진다(설계서 4절).
  #   execution.* 테이블은 Supabase에 이미 있고 행이 0이며, psycopg OrderStore는
  #   팀장 확인 대기 항목이다. 그때 여기에 DATABASE_URL을 추가한다.
  #   자격증명을 "언젠가 쓸 것"이라고 미리 주입하지 않는다 - 안 쓰는 자격이 퍼지는
  #   것 자체가 위험이다(01-research의 research-mcp에서 LS 자격을 뺀 것과 같은 이유).
  #
  # ▶ 상태가 프로세스 메모리라 **복제하면 안 된다.** 지금 replica를 늘리면 주문이
  #   컨테이너별로 갈라진다. DB store가 들어오기 전까지 단일 인스턴스로 둔다.
  trading-api:
    build:
      context: .
    container_name: hedgefund-trading-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8045:8000"   # 로컬 전용 - 외부 노출 금지 (risk-api 8041 이하 같은 정책)
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64

  # ▶ 볼륨 디렉터리 이름은 Profile 이름과 정확히 같아야 한다 - scripts/sync_hermes_profiles.sh가
  #   `~/.hermes-<profile>` 규칙으로 경로를 찾는다. 부서 폴더명(02-trading)이 아니다.
  #
  # ▶ 부서별 컨테이너 1개 = 부서별 데이터 디렉터리 1개(계획서 3.1~3.2). 컨테이너만 쪼개고
  #   /opt/data를 공유하면 한 부서의 세션·기억·자격이 옆 부서에서 그대로 보인다 - 분리된
  #   척이 된다. HERMES_HOME=/opt/data가 이미지 기본값이라 마운트만 갈면 분리가 끝난다.
  #
  # ▶ env는 CLAUDE.md 배정표대로 OPENAI_API_KEY만 준다(hermes/config.yaml의 env: 블록이
  #   참조하는 키). 아무 키나 넣지 않는다.
  trading-hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hedgefund-trading-hermes
    restart: unless-stopped
    command: ["gateway", "run"]
    volumes:
      - ${USERPROFILE}/.hermes-trading-department:/opt/data
    environment:
      HERMES_UID: 10000
      HERMES_GID: 10000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # ▶ Claude 구독 한도로 Sonnet 사용 (2026-08-03, 팀 합의)
      #   research-hermes/quant-hermes와 같은 배선이다(재일님 2026-08-03).
      #   근거: api.anthropic.com 직접 호출은 '서드파티'라 플랜 한도가 아니라
      #   extra usage에서 차감된다(실측 HTTP 400). CLI로 부르면 Claude Code
      #   자신이라 플랜 한도가 적용되므로 호스트 프록시를 거친다.
      #     hermes(컨테이너) -> host.docker.internal:8787 -> claude -p -> 플랜 한도
      #   프록시 기동: python scripts/claude_code_proxy.py --serve
      #
      #   ⚠ ANTHROPIC_API_KEY는 주지 않는다. .env에 sk-ant- 키가 있지만 그건
      #   구독과 별개인 종량 과금이고, 자격 해석 순서가 ANTHROPIC_API_KEY 우선이라
      #   넣으면 플랜이 아니라 그쪽으로 샐 여지가 생긴다.
      #
      #   ⚠ 프록시가 안 떠 있으면 이 부서 Agent 질의가 실패한다. 프록시는
      #   실패를 성공으로 위장하지 않고 5xx를 낸다(호출부가 폴백하도록).
      #   무료 모델로 되돌리려면 hermes/config.yaml의 model 블록만 바꾼다.
      #
      # ▶ 기본값이 자리표시자인 이유 (2026-08-03 실측)
      #   Hermes는 자격이 **비어 있으면 호출 자체를 안 한다**("No Anthropic
      #   credentials found"). 그런데 프록시는 이 값을 아예 읽지 않는다 -
      #   가짜 토큰으로 실제 Sonnet 응답이 오는 것을 확인했다. 인증은 호스트
      #   CLI 자신의 로그인으로 이뤄지기 때문이다.
      #   그래서 **진짜 구독 토큰을 컨테이너에 넣지 않는다.** 안 쓰는 자격이
      #   퍼지는 것 자체가 위험이고(Dockerfile 주석과 같은 원칙), 이 자리표시자는
      #   ANTHROPIC_BASE_URL이 실수로 빠지면 조용히 과금되는 대신 인증 실패로
      #   **막히는** 쪽으로 동작한다. 진짜 토큰을 쓰고 싶으면 .env에 넣으면 된다.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-proxy-placeholder-not-a-credential}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-http://host.docker.internal:8787}

    # Docker Desktop(Windows/Mac)은 host.docker.internal을 자동 제공하지만 리눅스
    # 엔진은 아니다 - VPS 이전 시에도 같은 파일이 동작하게 매핑을 명시한다
    # (루트 compose의 research-api가 같은 이유로 이걸 갖고 있다).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 1g
    mem_reservation: 192m
    cpus: 1.0
    pids_limit: 256
    stop_grace_period: 20s
