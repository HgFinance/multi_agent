# Trading Department Agent Configuration (2. 트레이딩본부)
# 담당: 도현 (trading, accounting-portfolio)
# 승인된 전략, Research Packet과 현재 포트폴리오 상태를 Signal 및 Portfolio Intent로 변환
# 리스크본부의 Risk/Compliance Gate 승인 전에는 어떤 에이전트도 OMS로 주문을 전송할 수 없음
# 참고: docs/HEDGE_FUND_MASTER_PLAN.md 5.5 #2, 8, 19.8
#       docs/05-teams/TEAM_DOHYUN_TRADING_ACCOUNTING_GUIDE.md (v1.2) 1.1, 4.2, 4.3

# 2026-08-03 팀 합의대로 Sonnet 을 쓴다. 경로가 셋인데 **셋 다 과금처가 다르다.**
#   1) provider: nous + anthropic/claude-sonnet-5
#      -> Nous 크레딧 필요. 계정 잔액이 없어 전부 404(실측 "requires available credits")
#   2) provider: anthropic + ANTHROPIC_API_KEY(sk-ant-)
#      -> 구독과 별개인 종량 과금. 키는 .env 에 있지만 이걸 쓰면 플랜이 아니다
#   3) provider: anthropic + ANTHROPIC_BASE_URL -> 호스트 프록시 -> claude -p   ← 이것
#      -> Claude Code CLI 가 부르는 것이라 **구독 플랜 한도**가 적용된다
# api.anthropic.com 직접 호출이 서드파티로 잡혀 extra usage 에서 차감되는 문제를
# 재일님이 2026-08-03 에 실측하고 scripts/claude_code_proxy.py 로 우회했다.
# 배선은 compose.yaml 의 ANTHROPIC_BASE_URL 주석 참고.
#
# `sonnet` 은 프록시 MODEL_ALIASES 가 정확히 아는 이름이다. 모르는 이름을 주면
# 조용히 DEFAULT_ALIAS(sonnet)로 떨어지므로, 오타가 있어도 안 드러난다 -
# 그래서 별칭표에 있는 값을 그대로 쓴다.
#
# ⚠ 선행 조건 두 개. 없으면 이 부서 Agent 질의가 5xx 다.
#   - 호스트에서 python scripts/claude_code_proxy.py --serve
#   - .env 의 CLAUDE_CODE_OAUTH_TOKEN (claude setup-token 으로 발급)
# 무료 모델로 되돌리려면 이 블록만 poolside/laguna-s-2.1:free 로 바꾼다.
# Current Head runtime (2026-08-03): openai-codex/gpt-5.6-luna.
# The Nous/Claude pricing notes above and Laguna fallback note below are historical options only.
model:
 provider: openai-codex
 default: gpt-5.6-luna
 base_url: https://chatgpt.com/backend-api/codex

env:
  OPENAI_API_KEY: ${OPENAI_API_KEY}  # loaded from .env, not hardcoded

agent:
  head_persona: trading-supervisor
  runtime_personalities_source: workers
  legacy_personalities_are_aliases: true
  # 2026-08-06 tool 강등. LLM 직원은 Bull/Bear 둘뿐이고 나머지 5명은 결정론
  # desk-runner 하나로 합쳐졌다 — 아래 deterministic_workers 참고.
  runtime_personalities: [bull-thesis-worker, bear-thesis-worker]
  max_turns: 100
  reasoning_effort: high
  timeout_seconds: 60
  personalities:
    trading-supervisor: "You are the Trading Supervisor. You integrate incoming Research Packets and approved Strategy Signals with current portfolio state into a single trade Case, and route it through Bull/Bear debate, the Trader/PM Agent and the Execution Agent. A Case may cover one symbol or several (Pair, Basket, Hedge) — carry every leg on the same trade_case_id and intent_group_id so atomicity and failure policy stay explicit. Before opening a Case, confirm the Strategy Version has an execution and accounting Capability Profile; a signal without one is blocked at intake even if Risk would approve it."
    bull-researcher: "You are the Bull Researcher (TRD-01). Given a Research Packet, you build the strongest evidence-backed bullish case that the Packet actually supports: link every core claim to the claim id it came from, keep the Base Scenario separate from the Upside Scenario, explain when each catalyst lands and how that differs from market expectation, and submit the conditions under which your own bull case would be invalid. You run independently and in parallel with the Bear Researcher and never see the Bear output before producing yours — do not speculate about it, reference it, or pre-empt it. Cite only evidence already delivered by the Research department; optimism added without evidence is a defect, not a stronger case. You never decide quantity, side or order type."
    bear-researcher: "You are the Bear Researcher (TRD-02), an independent critic. You receive the same original Research Packet as the Bull Researcher and never receive the Bull output — you run independently and in parallel with it, so never quote, reconstruct or assume a bull thesis. Decompose the Packet thesis into individual claims and search for contrary evidence and alternative explanations for each. Write downside scenarios with an explicit trigger, expected impact and any obstacle to exiting the position. Record insufficient evidence itself as a separate objection instead of filling the gap. Do not object reflexively and do not assert an extreme scenario without a probability. Compliance or Risk signals are forwarded to those departments, not judged here. You never decide quantity, side or order type."
    trader-pm-agent: "You are the Trader/PM Agent. After the Bull/Bear debate you propose a structured trade decision — action, target weight, entry condition, stop loss, take profit, time horizon, thesis and counter-thesis, and expiry — as a candidate for Risk review. State strategy_family, directionality and position_effect explicitly; do not leave direction implied. You produce an OrderIntent and nothing further: call trading.propose_order_intent, never oms.submit_order or a broker. Quantities and prices are validated against Lot and Tick Size by departments/02-trading/contracts/contracts.py before they reach the database — do not compute or assert order validity from memory, let the contract reject it."
    execution-agent: "You are the Execution Agent. For Risk-approved orders you propose order splitting, limit price, participation rate, expected slippage/market impact and broker routing to minimize transaction cost. Read the execution parameters from departments/02-trading/contracts/philosophies.yaml for the Case's philosophy rather than inventing them, and stay inside its slippage budget — leaving quantity unfilled is cheaper than breaching the budget. You manage execution quality, not investment direction (마스터플랜 19.8). Broker Order state belongs to the deterministic OMS: when a broker response is missing or ambiguous, report it as UNKNOWN and never infer FILLED or CANCELLED. On partial fills of a multi-leg group, apply the group's failure_policy — do not silently leave the group half-executed."
    derivatives-trader: "You are the Derivatives Trader. Within expiry, Greeks and margin constraints, you design directional, hedge and volatility intents using futures and options. You first define why a derivative is needed over the equivalent cash position, then propose expiry, strike and leg relationships — Scenario Greeks and margin are calculated by the Analytics Service, not by you. Your output always includes an Exercise/Assignment and Roll plan. You never build a naked or multi-leg position without approval, and you block the order if the option chain is stale, margin is unclear, or leg atomicity isn't supported."

skills:
  - hermes-agent

# 대상 시장과 집행 철학 프리셋. 집행 파라미터 튜닝은 philosophies.yaml에서만 한다.
# 시그널 생성과 시세 수집은 본부 밖(재일 소유)이므로 여기서 참조만 한다.
config:
  markets: [KOSPI, KOSDAQ]
  # Research Packet 신선도 한도(분). 이 시간을 넘긴 Packet 으로 연 토론은 stale 로 표시하고
  # escalate 한다 — 마스터플랜 9.3 Point-in-Time, 개발 원칙 9번(실패 시 진입 차단 방향).
  # 튜닝 대상 숫자이므로 코드가 아니라 여기 둔다. 근거 없는 초기 가정치이며 실측 후 재보정한다.
  packet_max_age_minutes: 120
  # Bull/Bear 토론 튜닝. 라운드 수는 배선(scripts.py)이 정하고 여기서는 사고 깊이만 정한다.
  debate:
    # 한 라운드에서 답하기 전에 혼자 생각할 수 있는 최대 횟수. 상한이 필요한 이유는
    # 비용이 아니라 종료다 — need_more_thought 를 모델이 정하므로 상한이 없으면
    # "더 생각하겠다"를 반복하는 실행이 나온다. 근거 없는 초기 가정치이며 실측 후 재보정한다.
    max_thinking_passes: 2
  philosophies: departments/02-trading/contracts/philosophies.yaml  # 집행 프리셋 - 본부 소유
  state_machine: docs/05-teams/TEAM_DOHYUN_TRADING_ACCOUNTING_GUIDE.md 4.3
  # 본부 밖에서 받아오는 입력. 시세와 시그널은 직접 수집하지 않는다.
  consumes:
    signals: strategy-registry-api
    market_snapshot: market-api
    research_packet: research-api
    risk_decision: risk-api

# 결정론적 서비스. 에이전트는 이 계층을 우회할 수 없고, 규칙 검사는 코드가 한다
# (마스터플랜 5.9). Agent Tool에 oms.submit_order를 노출하지 않는다.
deterministic_services:
  contracts: departments/02-trading/contracts/contracts.py  # OrderIntent / RiskDecision / EventEnvelope 검증
  oms: departments/02-trading/oms/oms.py                    # 상태 전이, 멱등성, Risk Gate
  paper_broker: departments/02-trading/broker/paper_broker.py
  multileg: departments/02-trading/multileg/intent_group.py   # F30 Leg 관계, 부분 체결 복구 판정
  capability: departments/02-trading/capability/derivatives.py  # F31 파생 계약 모델, 접수 차단 게이트
  # 2026-08-05: 집행 계층. 브로커 초당 한도를 넘는 분할 설계는 서술로 통과할 수 없다 -
  # check_plan_feasible()이 LLM 앞에서 결정론으로 거부한다(정정·취소 3/s, 계좌 조회 1~2/s).
  broker_rules: departments/02-trading/execution/broker_rules.py
  # TCA 환류는 **제안만** 만든다. 한도 반영은 리스크본부, 전략 승격은 퀀트본부 권한이다.
  tca_memory: departments/02-trading/execution/tca_memory.py
  # 2026-08-05 직원 Skill/RAG 경계(ADR 0005). 판정은 하지 않고 근거만 만든다.
  worker_skills: departments/02-trading/skills/          # rag_router / trigger_payload / worker_evidence / citations

implementation:
  status: "D0-D2 구현됨. 팀 가이드 v1.2 반영 재작업 진행 중"
  done:
    - "OrderIntent 계약과 신뢰 경계 검증 (Decimal, 데이터 품질 게이트)"
    - "Risk 미승인 Submit 차단, idempotency_key 중복 주문 방지"
    - "브로커 이벤트 재수신 시 중복 체결 방지, 초과 체결 거부"
    - "이벤트에서 주문 상태 재구축"
    - "Paper Broker 모의 체결 (KRX 호가 단위, 참여율 상한, 매도 거래세)"
    - "F30 Multi-leg - Leg 관계, Atomicity/Failure Policy, 부분 체결 복구 판정과 FAILED_SAFE"
    - "F31 Derivatives Capability - 파생 계약 모델, 승수 반영 명목금액, 접수 차단 게이트, Roll, 행사/배정"
  in_progress:
    # 팀 가이드 v1.2에서 단일 상태 머신이 OrderIntent와 Broker Order로 분리됐다.
    - "상태 머신 분리 (CREATED / CANCEL_PENDING / BROKER_STATE_AMBIGUOUS 신설)"
    - "Multi-Strategy 확장 (intent_groups, trade_case_instruments, position_effect)"
    - "Mandate 초과 주문의 USER_PENDING -> USER_APPROVED 흐름"
    - "Alembic 이전 (스택 확정: Supabase PostgreSQL)"
  not_started:
    - "Execution Plan -> Child Order 분할 실행 (D4)"
    - "TCA 계산과 집행 파라미터 환류 (D4)"
    - "Borrow 가용성/수수료/Recall 모의 - 실제 공매도는 Certification 후"

# Agent Profile 변경 이력 (agent_evolution_cycle 대상 — CLAUDE.md "프롬프트 한 줄을 고치는 것도
# Agent Profile Version을 올리는 변경이다")
# 2026-08-03: bull-researcher / bear-researcher 페르소나를 AGENT_EMPLOYEE_PROFILES.md
#   TRD-01/TRD-02 원문에 맞춰 교정했다. 종전 bear 프롬프트는 "Given the same Research Packet
#   and the Bull Researcher's thesis"라 Bull 출력을 입력으로 받는 순차 구조였고, 이는 조직도의
#   "동일 Evidence에서 찬반 논거를 독립 생성 / LangGraph Parallel Nodes"(200행), TRD-01 "Bear
#   결과는 생성 전 보지 않는다", TRD-02 KPI "Bull 문장 복제 0"과 정면으로 어긋났다.
#   교정 내용: 양측 모두 병렬·독립 명시, Bull에 Base/Upside 분리·Claim ID 연결·Bull Invalidation
#   추가, Bear에 Trigger/영향/Exit 장애·근거부족 별도 반론 추가, 양측 모두 수량·주문유형 결정 금지.
#   ⚠ 미완: 이 변경은 QA 독립검증과 CEO 승인을 아직 받지 않았다. Profile Version 등재와
#   승인 절차는 07-agent-workforce(HR-02 Agent Profile Read API) 가동 후 소급한다.
#   구현: departments/02-trading/scripts.py (bull/bear 병렬 LangGraph, 배선 독립성 자체 점검 포함)

# 백로그 (2026-07-29, 팀 가이드 v1.2 반영 검토에서 도출 — 아직 미구현, 기록만)
# 1. execution-agent: 슬리피지 예산 초과 시 잔량 자동 취소를 코드로 강제.
#    지금은 프롬프트 지시뿐이라 에이전트가 어길 수 있다.
# 2. (2026-07-31 해소) Capability Profile 차단이 intake 코드로 옮겨졌고 OMS에 배선됐다.
#    OMS.register_intent()가 게이트를 호출하며, Profile 선언이 없으면 현물만 통과한다.
# 3. philosophies.yaml의 집행 파라미터는 TCA 실측이 쌓인 뒤 재보정 (D4 이후).
#    지금 값은 근거 없는 초기 가정치다.
# 4. (2026-07-31 부분 해소) IntentGroup이 OMS에 배선됐다 — register_group/link_leg로
#    Leg <-> BrokerOrder를 연결하고 evaluate_group()이 실제 주문 상태에서 판정한다.
#    남은 것: 판정 결과(cancel/unwind/retry)를 받아 실제 주문을 내는 실행기.
#    지금은 판정까지만이고 그 뒤는 호출자가 OMS API로 직접 해야 한다.
# 5. 파생 Certification 절차 자체가 없다. certified_by를 누가 어떤 근거로 채우는지가
#    미정이며, 지금은 코드가 서명 유무만 확인한다.
# 6. Capability 게이트가 asset_class를 호출자에게서 받는다. instrument_id로
#    reference-api를 조회해 스스로 판정해야 하는데 그 경로가 아직 없다 -
#    지금은 호출자가 "EQUITY"라고 우기면 그대로 통과한다.

# 채용 우선순위 매핑 (docs/04-organization/AGENT_EMPLOYEE_PROFILES.md 14.2-14.4, 2026-07-29)
# trader-pm-agent는 TRD-03(Signal Synthesis/PM)과 TRD-04(Portfolio Construction/Equity Trader)를 합친 페르소나 — 둘 다 P0라 격차 없음
hiring_priority:
  trading-supervisor: {role_codes: ["TRD-00"], tier: "P0"}
  bull-researcher: {role_codes: ["TRD-01"], tier: "P0"}
  bear-researcher: {role_codes: ["TRD-02"], tier: "P0"}
  trader-pm-agent: {role_codes: ["TRD-03", "TRD-04"], tier: "P0"}
  execution-agent: {role_codes: ["TRD-06"], tier: "P1"}
  derivatives-trader: {role_codes: ["TRD-05"], tier: "P2"}
  # 2026-07-29: TRD-05 채용 완료 — 트레이딩본부는 7/7 전원 존재

usage:
  run: "trading-department chat -q 'Turn this Research Packet into an OrderIntent for 005930'"
  collaborate: "trading-department chat -q 'Run Bull/Bear debate, then submit the OrderIntent to risk-management'"

# ── 도구 허용목록 (2026-08-03) ────────────────────────────────────────────────
# ⚠ 이 키는 tool_allowlist 와 다르다. **Hermes 가 실제로 읽고 강제한다**
#   (`hermes tools list` 결과가 이 목록과 일치한다). 01-research/hermes/config.yaml
#   38-44행이 경고하듯 tool_allowlist 는 우리 저장소 계약 문서일 뿐 런타임 강제가
#   아니지만, platform_toolsets 는 런타임 자체의 허용목록이다.
#
# 기본값 문제: Portal 로그인이 free tool pool 을 켜면서 web·browser·terminal·
# file·code_execution·computer_use 가 전부 enabled 로 들어왔다(2026-08-03 실측).
# HERMES_DOCKER_RUNBOOK.md 7절은 "에이전트에게 셸을 주지 않는 현재 구성"이라고
# 적고 있었지만 실제 런타임은 그 반대였다.
#
# 남기는 기준: Hermes 는 부서 인터페이스·기억·위임 계층이고 분석 실체는
# LangGraph 다(TECH_STACK_DECISIONS 2절, 같은 runbook 6절). 오케스트레이션에
# 필요한 것만 남기고 실행 능력은 전부 뺀다.
#   - 뺀 것: web·browser(시세·뉴스 원본 수집은 리서치본부 영역 - CLAUDE.local.md
#     "만들지 않는 것"), terminal·file·code_execution·computer_use(셸이 있으면
#     Agent 가 우리 OMS·원장 코드를 직접 실행할 수 있다 - 원칙 1 위반 경로),
#     vision·image_gen·bfl·tts(거래·회계 업무와 무관)
#   - 도메인 데이터는 나중에 MCP Server 로 붙인다. builtin toolset 과 별개다.
platform_toolsets:
  cli: [clarify, cronjob, delegation, kanban, memory, session_search, skills, todo]

# ⚠ 아래 목록이 없으면 위 허용목록이 조용히 새어나간다. Hermes 는
#   known_builtin_toolsets 에 **없는** toolset 을 "새로 생긴 것"으로 보고 자동
#   활성화한다. sync push 가 이 파일을 통째로 덮으므로, 이 키를 빼두면 push 할
#   때마다 platform_toolsets 에 없는 도구가 다시 켜진다(2026-08-03 실측: bfl 이
#   그렇게 살아남았다 - 목록에 없는데 enabled 였다).
#   Hermes 가 새 toolset 을 추가하면 여기서도 빠져 자동 활성화되므로, `hermes
#   tools list` 결과가 platform_toolsets 와 다르면 이 목록을 갱신한다.
known_builtin_toolsets:
  cli: [bfl, browser, clarify, code_execution, computer_use, context_engine, cronjob,
        delegation, discord, discord_admin, file, homeassistant, image_gen, memory,
        session_search, skills, spotify, stt, terminal, todo, tts, video, video_gen,
        vision, web, x_search, yuanbao]
known_plugin_toolsets:
 cli: [spotify]

# Employee runtime v2: every listed employee is an independent LangGraph
# Worker.  Hermes remains the department-head runtime and has no order submit
# authority.
head_runtime:
  runtime: hermes
  role: department_head
  provider_choices: [openai-codex, anthropic-claude-code]
  active_provider: openai-codex
  active_model: gpt-5.6-luna
  model_source: model
  responsibility: synthesize_worker_context_and_escalate
  binding_decision: false
  # 2026-08-06: 부서장이 Bull/Bear 토론의 사회를 본다(scripts.supervise_round2 /
  # supervisor_review). **권한은 안전한 방향으로만 열려 있다** — 초점을 Claim 색인
  # 안에서 좁히고, 라운드를 닫고, escalate 를 켤 수 있다. 색인 밖 Claim 을 만들거나,
  # 깨진 1라운드 위에 2라운드를 열거나, grounded 를 바꾸거나, escalate 를 끄지는 못한다.
  debate_moderator: true
  moderator_persona: trading-supervisor
  moderator_can: [narrow_round2_focus, close_round, raise_escalation, write_closing_note]
  moderator_cannot: [invent_claims, reopen_failed_round, change_grounded, clear_escalation,
                     set_direction_or_quantity]

staff_registry:
  head_count: 1
  # 2026-08-05: market-thesis-worker 를 bull/bear 두 직원으로 분리해 6 -> 7.
  #   하나가 양쪽 논지를 다 만들면 그게 확증편향이다 (ADR 0005).
  # 2026-08-06: tool 강등으로 7 -> 2. worker_count 는 **LLM 직원 수**다 -
  #   결정론 desk-runner 는 deterministic_workers 로 따로 센다(조직 인원은 3명).
  #   강등 기준: 같은 입력에서 다른 출력이 나오는 것이 산출물인가, 결정론 모듈이
  #   이미 그 답을 만들고 있지 않은가. 둘 다 아니면 에이전트가 아니라 함수다.
  worker_count: 2
  default_execution_count: 2
  max_execution_count: 2
  active_worker_count: 2
  conditional_worker_count: 0
  deterministic_worker_count: 1
  headcount_total: 3          # 부서장 제외 - Bull / Bear / desk-runner
  runtime_personality_source: workers
  legacy_personas_are_aliases: true
  runtime_personalities: [bull-thesis-worker, bear-thesis-worker]
  legacy_personas:
    source: agent.personalities
    runtime: compatibility_only
    excluded_from_worker_count: true

employee_runtime:
  executor: langgraph
  topology: async_fan_out_fan_in_independent_graphs
  worker_graph_module: departments/02-trading/employee_workers.py
  provider: ollama
  model_env: OLLAMA_CHAT_MODEL
  model_default: qwen3:1.7b
  base_url_env: OLLAMA_BASE_URL
  model_selection:
    active_model: qwen3:1.7b
    candidate_source: ollama list
    selection_policy: fixed_until_worker_benchmark_approved
    matrix_document: docs/02-engineering/WORKER_MODEL_MATRIX.md
    # 프로덕션 목표(2026-08-06 팀장 확인). **아직 active_model 이 아니다** —
    # 교체는 WORKER_MODEL_MATRIX 절차(benchmark -> HR 제안 -> QA 검증 -> CEO 승인)를
    # 거쳐야 하므로 여기 기록만 하고 위 active_model 은 그대로 둔다.
    production_target:
      model: qwen2.5:14b
      adaptation: fine-tuned
      quantization: FP8
      host: aws
      vram_gb: 24
      # ⚠ 용량 제약이 직원 수 상한을 만든다. FP8 14B 가중치가 ~15GB 라 24GB 카드에
      # 남는 것은 KV 캐시 몫 몇 GB뿐이다. 우리 토론은 Bull/Bear 가 **병렬**이라
      # 케이스당 동시 요청이 2 다 - 이 정도는 여유 있게 들어간다. 강등 전처럼 직원
      # 7명을 병렬로 띄웠다면 같은 카드에서 KV 캐시가 서로를 밀어내 지연이 튄다.
      # 직원을 늘리려면 모델 크기가 아니라 **동시 요청 수**부터 계산한다.
      peak_concurrent_requests_per_case: 2
      # 케이스당 호출 수는 scripts._llm_call_summary 가 실행마다 기록한다
      # (실측 기준값: employee 8 / supervisor 2). 처리량 산정은 그 값을 쓴다.
      calls_per_case_baseline: {employee: 8, supervisor: 2}
  output_contract: trading.worker-context.v1
  max_retries: 2
  max_attempts: 3
  binding_decision_owner: trading-department-head
  failure_action: HOLD

# 직원별 RAG 경로는 departments/02-trading/skills/rag_router.py 가 소유한다.
# **LLM 직원 2명 전원 forced_route** 라 payload 로 경로를 바꿀 수 없다. 아래 rag_route 는
# 그 정책의 사본 표기이며 런타임 판정은 rag_router.py 가 한다.
#
# ⚠ 이 블록은 **LLM 직원 레지스트리**다(employee_workers.WORKER_SPECS 와 1:1).
#   결정론 직원은 아래 deterministic_workers 에 따로 있다 - 섞으면
#   "workers 에 있다 = 모델을 태운다"가 깨져서 비용·감사 판단이 흐려진다.
workers:
  # 2026-08-05: market-thesis-worker 를 둘로 분리했다(ADR 0005). 하나가 양쪽 논지를
  # 다 만들면 확증편향이다. 두 직원은 scripts.py 의 bull_researcher/bear_researcher 와
  # 1:1 대응하고 TRD-01/TRD-02 페르소나 원문을 공유하며, **서로의 출력을 절대 입력으로
  # 받지 않는다** — worker_evidence 가 상대 원문을 evidence 에서 제외한다.
  #
  # 2026-08-06: 두 직원은 라운드마다 답하기 전에 혼자 사고한다(scripts._think).
  # 사고는 자기 답변 프롬프트에만 붙고 인용·독립성 측정 대상이 아니며 상대에게
  # 넘어가지 않는다. 깊이는 config.debate.max_thinking_passes 가 정한다.
  bull-thesis-worker:
    role: Independent bull-case thesis analyst
    status: active
    trigger: always
    tools: [trading.research_packet.read]
    persona_alias: bull-researcher
    rag_route: NO_RAG
  bear-thesis-worker:
    role: Independent bear-case thesis analyst
    status: active
    trigger: always
    tools: [trading.research_packet.read]
    persona_alias: bear-researcher
    rag_route: NO_RAG

# 결정론 직원. **모델을 부르지 않으므로 workers 가 아니다.**
# 2026-08-06 tool 강등으로 조건부 직원 4명 + 제안 직원 1명이 여기로 합쳐졌다. 다섯 다
# 답이 하나로 정해지는 일이었고, 그 답은 이미 결정론 모듈이 만들고 있었다 - 위에
# qwen3:1.7b 를 얹는 것은 나온 답을 한국어로 다시 쓰는 계층일 뿐이고, 그 과정에서
# 집행·회계 수치가 LLM 문장을 거치는 경로만 생긴다(CLAUDE.local.md 원칙 5).
deterministic_workers:
  desk-runner:
    role: Trading desk runner — 결정론 잡무(제약 매핑·집행 실현가능성·비용·인증 조회)
    status: active
    trigger: always
    llm: false
    absorbed:            # 강등된 직원과 그 답을 원래 만들던 모듈
      trade-proposal-worker: departments/02-trading/scripts.py (propose_intent -> intent_builder)
      order-constraint-worker: departments/02-trading/contracts/contracts.py (INTENT/BROKER 전이표)
      execution-planning-worker: departments/02-trading/execution/broker_rules.py (check_plan_feasible)
      venue-cost-worker: departments/02-trading/execution/tca_memory.py (propose_adjustments)
      derivatives-structure-worker: departments/02-trading/capability/derivatives.py (서명 조회)
    tools: [trading.portfolio_state.read, trading.risk_decision.read,
            trading.execution_constraints.read, trading.venue_cost.read,
            trading.derivatives.read]
    # rag_router 정책표에 항목이 없다. 라우터는 *LLM 이 무엇을 볼 수 있나*를 제한하는
    # 장치인데 이 직원은 서술을 만들지 않는다. 항목이 없으면
    # rag_policy_for_worker() 가 ValueError 를 내는데 그게 옳은 fail-closed 다 -
    # 나중에 누가 이 직원을 LLM 경로에 물리면 조용히 열리는 대신 즉시 죽는다.
    rag_route: null
