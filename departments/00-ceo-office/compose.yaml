# CEO Office Compose Fragment (영주 소유).
#
# 근거: docs/02-engineering/DEPARTMENT_BACKEND_INTEGRATION_DOCKER_PLAN.md 10절(Docker Compose
#       구조 - "Docker Compose 2.20.3 이상의 include를 사용해 본부가 자기 Compose Fragment를
#       소유하도록 한다"), 6.1절(CEO Office Container 목록).
#
# 루트 docker-compose.yml이 `include:`로 이 파일을 끌어온다. `redis`는 여기 없다 -
# 공통 Platform Container(계획서 5절)라 루트 파일이 소유하고, 여기서는 서비스 이름으로만
# 참조한다(depends_on: redis - include된 파일도 루트 파일과 하나의 병합된 모델을 공유하므로
# 가능하다). build.context는 이 파일 자신의 디렉터리 기준 상대 경로다("." = departments/00-ceo-office).
services:
  governance-api:
    build:
      context: ../..
      dockerfile: departments/00-ceo-office/Dockerfile
    container_name: hedgefund-governance-api
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      DATABASE_URL: ${GOVERNANCE_WORKFORCE_DATABASE_URL:-${DATABASE_URL:-}}
    ports:
      - "127.0.0.1:8043:8000"   # 로컬 전용 - 외부 노출 금지 (risk-api/audit-api와 같은 정책)
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64

  # notification-worker: governance-api와 같은 Image, command만 다르다(qa-worker와 같은 패턴).
  # hf:governance Stream을 소비해 risk.breach.v1/qa.finding.v1/incident.opened.v1/
  # governance.escalation.v1/report.ready.v1을 알림으로 바꾼다(governance_events/worker.py).
  # governance.mandate.changed.v1 등 다른 Consumer Group용 Event는 조용히 넘긴다.
  notification-worker:
    build:
      context: ../..
      dockerfile: departments/00-ceo-office/Dockerfile
    container_name: hedgefund-notification-worker
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: ["python", "governance_events/worker.py"]
    working_dir: /app/departments/00-ceo-office
    depends_on:
      - redis
    environment:
      DATABASE_URL: ${GOVERNANCE_WORKFORCE_DATABASE_URL:-${DATABASE_URL:-}}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      GOVERNANCE_EVENT_POLL_INTERVAL_SECONDS: ${GOVERNANCE_EVENT_POLL_INTERVAL_SECONDS:-1}
    mem_limit: 256m
    cpus: 0.3
    pids_limit: 64
    stop_grace_period: 20s

  # ceo-hermes: research-hermes/risk-hermes와 같은 패턴 - Hermes는 Backend Image에 안 넣고
  # 공식 Image를 별도 Container로 띄운다(계획서 3.1). Provider는 하드코딩하지 않는다 -
  # /opt/data/config.yaml(provider:)과 auth.json이 결정한다(CEO는 Codex 배정, 2026-08-10
  # 확정 매핑). 프로필 디렉터리 이름은 scripts/sync_hermes_profiles.sh의 매핑("ceo-agent")과
  # 일치해야 한다 - 다른 부서(예: research-department)와 달리 CEO는 CLI 명령 이름과
  # 프로필 이름이 같다.
  ceo-hermes:
    build:
      context: ../..
      dockerfile: Dockerfile.ceo-hermes
    image: hedgefund-ceo-hermes:primary-idempotency-v1
    container_name: hedgefund-ceo-hermes
    restart: unless-stopped
    command: ["sleep", "infinity"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - /home/ubuntu/.hermes/profiles/ceo-agent:/opt/data
      - ../../skills/finance:/opt/shared-skills/finance:ro
      - /home/ubuntu/.hermes/shared-kanban:/opt/kanban   # 공용 Kanban board, root docker-compose.yml research-hermes 주석 참고
    environment:
      HERMES_UID: 1000
      HERMES_GID: 1000
      HERMES_HOME: /opt/data
      HERMES_PROFILE: ceo-agent
      HERMES_KANBAN_HOME: /opt/kanban
      HERMES_KANBAN_DB: /opt/kanban/kanban.db
      HERMES_KANBAN_DISPATCH_IN_GATEWAY: "false"
      # Reuse this existing CEO gateway as the authenticated internal API
      # runtime. No second CEO gateway is started in portfolio-bff.
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${CEO_HERMES_API_KEY:-}
    mem_limit: 1g
    mem_reservation: 192m
    cpus: 1.0
    pids_limit: 256
    stop_grace_period: 20s
