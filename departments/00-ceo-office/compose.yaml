# CEO Office Compose Fragment (영주 소유).
#
# 근거: docs/02-engineering/DEPARTMENT_BACKEND_INTEGRATION_DOCKER_PLAN.md 10절(Docker Compose
#       구조 - "Docker Compose 2.20.3 이상의 include를 사용해 본부가 자기 Compose Fragment를
#       소유하도록 한다"), 6.1절(CEO Office Container 목록).
#
# 루트 docker-compose.yml이 `include:`로 이 파일을 끌어온다. `redis`는 여기 없다 -
# 공통 Platform Container(계획서 5절)라 루트 파일이 소유하고, 여기서는 서비스 이름으로만
# 참조한다(depends_on: redis - include된 파일도 루트 파일과 하나의 병합된 모델을 공유하므로
# 가능하다). build.context는 이 파일 자신의 디렉터리 기준 상대 경로다("." = departments/00-ceo-office).
services:
  governance-api:
    build:
      context: ../..
      dockerfile: departments/00-ceo-office/Dockerfile
    container_name: hedgefund-governance-api
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      DATABASE_URL: ${GOVERNANCE_WORKFORCE_DATABASE_URL:-${DATABASE_URL:-}}
    ports:
      - "127.0.0.1:8043:8000"   # 로컬 전용 - 외부 노출 금지 (risk-api/audit-api와 같은 정책)
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; payload=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)); assert payload.get('status') == 'ready' and payload.get('authoritative') is True"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64

  # ceo-hermes: research-hermes/risk-hermes와 같은 패턴 - Hermes는 Backend Image에 안 넣고
  # 공식 Image를 별도 Container로 띄운다(계획서 3.1). Provider는 하드코딩하지 않는다 -
  # /opt/data/config.yaml(provider:)과 auth.json이 결정한다(CEO는 Codex 배정, 2026-08-10
  # 확정 매핑). 프로필 디렉터리 이름은 scripts/sync_hermes_profiles.sh의 매핑("ceo-agent")과
  # 일치해야 한다 - 다른 부서(예: research-department)와 달리 CEO는 CLI 명령 이름과
  # 프로필 이름이 같다.
  ceo-hermes:
    build:
      context: ../..
      dockerfile: Dockerfile.ceo-hermes
    image: hedgefund-ceo-hermes:primary-idempotency-v1
    container_name: hedgefund-ceo-hermes
    restart: unless-stopped
    # Reuse portfolio-bff's existing /health/ready contract. This gates only
    # initial CEO gateway admission; runtime BFF failures remain fail-closed in
    # gateway_patch.py and do not trigger a direct Hermes fallback.
    depends_on:
      portfolio-bff:
        condition: service_healthy
    command: ["sleep", "infinity"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - /home/ubuntu/.hermes/profiles/ceo-agent:/opt/data
      - ../../skills/finance:/opt/shared-skills/finance:ro
      # The active CEO evolution skill is delivered from its one canonical
      # repository source. Keep this read-only and do not mirror it into the
      # profile, otherwise Hermes can load two copies of the same skill.
      - ../../skills/evolved:/opt/shared-skills/evolved:ro
      - /home/ubuntu/.hermes/shared-kanban:/opt/kanban   # 공용 Kanban board, root docker-compose.yml research-hermes 주석 참고
    environment:
      HERMES_UID: 1000
      HERMES_GID: 1000
      HERMES_HOME: /opt/data
      HERMES_PROFILE: ceo-agent
      # Explicitly set both names: Hermes/LangChain extensions may otherwise
      # choose LangSmith's implicit `default` project when tracing is enabled.
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-First}
      LANGCHAIN_PROJECT: ${LANGSMITH_PROJECT:-First}
      HERMES_KANBAN_HOME: /opt/kanban
      HERMES_KANBAN_DB: /opt/kanban/kanban.db
      HERMES_KANBAN_DISPATCH_IN_GATEWAY: "false"
      # Every Discord gateway uses one shared inbound claim ledger. The
      # allowlist is evaluated before Hermes admission, including messages
      # without a mention.
      DISCORD_IDEMPOTENCY_HOME: /opt/kanban
      DISCORD_IDEMPOTENCY_SCOPE: global
      # Slash-command registration is not part of the message ingress path.
      # A single Discord application can be mounted by several gateways, so
      # repeated startup syncs only create rate-limit latency.
      DISCORD_COMMAND_SYNC_POLICY: ${DISCORD_COMMAND_SYNC_POLICY:-off}
      # Keep the gateway admission channel aligned with DISCORD_CEO_CHANNEL_ID.
      # The CEO BFF, Discord reader, and mirror all use the shared CEO channel.
      DISCORD_ALLOWED_CHANNELS: ${DISCORD_CEO_ALLOWED_CHANNELS:-1536997434507657261}
      DISCORD_FREE_RESPONSE_CHANNELS: ${DISCORD_CEO_FREE_RESPONSE_CHANNELS:-1536997434507657261}
      # Discord 메시지는 반드시 BFF canonical ingress를 거쳐 웹 질의와 같은
      # root 카드/권한 경계를 사용한다. 전용 bearer 값이 없으면 Compose가
      # fail-closed 하며, 값 자체는 이미지나 프로필에 저장하지 않는다.
      HGFINANCE_DISCORD_INGRESS_URL: http://portfolio-bff:8000/ui/ceo/ingress
      CEO_DISCORD_INGRESS_API_KEY: ${CEO_DISCORD_INGRESS_API_KEY:?CEO_DISCORD_INGRESS_API_KEY is required}
      HGFINANCE_DISCORD_INGRESS_MAX_CONCURRENCY: ${HGFINANCE_DISCORD_INGRESS_MAX_CONCURRENCY:-8}
      # Optional operations-only alert sink for failed_closed events. It is
      # separate from the user-facing mirror webhook and sent asynchronously.
      CEO_INGRESS_ALERT_WEBHOOK_URL: ${CEO_INGRESS_ALERT_WEBHOOK_URL:-}
      CEO_INGRESS_ALERT_COOLDOWN_SECONDS: ${CEO_INGRESS_ALERT_COOLDOWN_SECONDS:-60}
      # Reuse this existing CEO gateway as the authenticated internal API
      # runtime. No second CEO gateway is started in portfolio-bff.
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${CEO_HERMES_API_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 && test -r /opt/data/config.yaml && test -d /opt/kanban && test -r /opt/kanban/kanban.db"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 1g
    mem_reservation: 192m
    cpus: 1.0
    pids_limit: 256
    stop_grace_period: 20s
