# 회계/포트폴리오본부 - 운영 튜닝값
# 소유: 도현 (trading, accounting-portfolio)
# 참고: HEDGE_FUND_MASTER_PLAN.md 12.3, 12.4(NAV Close), 5.9(결정론 계층)
#       TEAM_DOHYUN_TRADING_ACCOUNTING_GUIDE.md 4.4, 4.5, 8.2
#
# 코드가 아니라 여기에 두는 이유: 전부 실측 후 재보정할 숫자다.
# **여기 있는 어떤 값도 회계 수치가 아니다.** NAV·PnL·Position 은 원장에서만 나온다.

# 1) Break Triage - 대사 Break 의 원인 후보 검색과 Aging/SLA
#    판정(Break 생성·Severity)은 reconciliation.py 가 하고 이 블록은 건드리지 않는다.
break_triage:
  # 유사 사례 검색 상한. 후보를 더 준다고 원인이 더 잘 나오지 않는다.
  max_cases: 5
  # 이보다 유사도가 낮은 과거 사례는 제시하지 않는다 - 억지 유사는 오답 유도다.
  min_similarity: 1.0
  # 해소 이력이 이만큼 쌓이기 전에는 "사례 기반"이라고 말하지 않는다.
  min_corpus_for_case_based: 3

  # Severity 별 해소 기한(시간). 넘으면 OVERDUE.
  # 근거 없는 초기 가정치다 - 실제 마감 운영 데이터로 재보정한다.
  sla_hours:
    material: 4
    high: 24
    medium: 72
    low: 168
  # 기한의 이 비율을 지나면 DUE_SOON 으로 미리 표시한다.
  due_soon_ratio: 0.75

  # 원인 후보 분류표. 과거 해소 이력이 0건일 때의 Cold Start 근거이며,
  # 이력이 쌓이면 이력이 우선한다(사례가 분류표를 이긴다).
  # kind 는 reconciliation.py 가 만드는 Break kind 와 같은 문자열이어야 한다.
  cause_taxonomy:
    external_only_fill:
      - id: cause:manual_broker_trade
        cause: 브로커 단말에서 직접 낸 수동 주문이 내부 OMS 를 거치지 않았다
        check: 해당 시간대 브로커 주문 원장과 OMS order_events 대조
      - id: cause:fill_event_lost
        cause: 체결 이벤트 수신이 유실돼 내부 Fill 이 적재되지 않았다
        check: order_events 시퀀스 공백과 수신 로그 확인
      - id: cause:account_scope_mismatch
        cause: 다른 계좌·Book 의 체결을 같은 Fund 로 대사했다
        check: 대사 입력의 fund_id / 계좌번호 매핑 확인
    internal_only_fill:
      - id: cause:phantom_internal_fill
        cause: Paper 체결이 실계좌 대사에 섞였다
        check: 해당 order 의 broker_adapter 확인
      - id: cause:statement_lag
        cause: 브로커 명세서가 아직 해당 체결을 반영하지 않았다(T+0 지연)
        check: 다음 명세서 배치에서 재대사
    price_mismatch:
      - id: cause:average_vs_line_price
        cause: 브로커가 평균단가로, 내부가 라인별 체결가로 기록했다
        check: 같은 주문의 부분체결 여러 건을 합산해 재비교
      - id: cause:currency_or_rounding
        cause: 통화 정밀도·호가 반올림 규칙이 서로 다르다
        check: tick size 와 소수점 자리수 규칙 대조
    cost_mismatch:
      - id: cause:fee_schedule_stale
        cause: 내부 수수료·세율 가정이 실제 요율과 다르다
        check: philosophies.yaml market.fee_bps / sell_tax_bps 대 실제 청구 대조
      - id: cause:tax_timing
        cause: 세금이 체결일이 아니라 결제일 기준으로 청구됐다
        check: settlement_date 기준으로 재집계
    fuzzy_match:
      - id: cause:partial_fill_aggregation
        cause: 브로커가 부분체결을 합쳐 한 건으로 보고했다
        check: 수량 합계가 일치하는 조합이 있는지 탐색
      - id: cause:duplicate_broker_line
        cause: 명세서에 같은 체결이 두 번 실렸다
        check: broker_fill_id 중복 여부 확인
    position_mismatch:
      - id: cause:corporate_action_unapplied
        cause: 배당·분할·병합이 내부에 아직 반영되지 않았다
        check: corporate_actions.py 미처리 이벤트 확인
      - id: cause:settlement_timing
        cause: 미결제 수량을 한쪽만 포지션에 반영했다
        check: T+2 결제일 기준 포지션으로 재대사
    cash_mismatch:
      - id: cause:unposted_fee_or_tax
        cause: 수수료·세금 분개가 아직 posting 되지 않았다
        check: 해당 기간 journal_lines 에 비용 계정 존재 확인
      - id: cause:deposit_withdrawal_gap
        cause: 입출금이 원장에 반영되지 않았다
        check: 계좌 입출금 내역과 cash_balances 대조

# 1-b) 미설명 손익 원인 분류표 - Break 과 다른 축이다
#
# Break 은 "내부와 외부가 안 맞는다"이고 이쪽은 "내부끼리 항등식이 안 맞는다"다.
#   NAV 변화 = 총손익 - 비용 + 자본 유출입   (reporting/daily_report.py)
# 잔차가 `DailyReport.unexplained_pnl` 이며 **0 으로 반올림하지 않는다**(SOUL 27행).
# 그래서 잔차가 0 이 아닐 때 조사할 후보가 필요하고, 없으면 직원이 지어낸다.
#
# 마스터플랜 19.12 "Agent 는 예외 조사와 설명을 담당한다" 의 조사 대상이다.
# SOUL #6 의 Signal/Sizing/Timing/Execution/Cost/Regime 은 **기대 대비 실현** 갭의
# 분류이고 여기 항등식 잔차와 다른 것이다 - 섞지 않는다.
pnl_exception:
  # 잔차가 이 금액 이하면 조사 대상으로 올리지 않는다. 통화 최소단위 기준이며
  # 근거 없는 초기 가정치다 - 실제 마감 운영 데이터로 재보정한다.
  # **0 으로 반올림하는 것과 다르다.** 값은 그대로 보고되고 조사만 생략된다.
  residual_tolerance: 1
  cause_candidates:
    - id: cause:unposted_journal
      cause: 체결·비용 분개가 아직 posting 되지 않아 손익에 안 잡혔다
      check: execution.fills 대 accounting.journals 건수 대조 (ledger/fill_consumer.py)
    - id: cause:valuation_asof_gap
      cause: NAV 기초·기말의 Mark as_of 가 서로 다른 시점이다
      check: portfolio/portfolio.py 의 MarkPrice.as_of 를 기초·기말 각각 확인
    - id: cause:capital_flow_missing
      cause: 입출금·자본 유출입이 capital_flow 에 반영되지 않았다
      check: _capital_flow() 가 집계한 계정과 실제 입출금 내역 대조
    - id: cause:corporate_action_unapplied
      cause: 배당·분할이 Position 에만 반영되고 손익에는 안 잡혔다
      check: corporate_actions.py 미처리 EFFECTIVE 이벤트 확인
    - id: cause:reversal_asymmetry
      cause: 정정 Reversal 이 원분개와 다른 회계일에 걸렸다
      check: reversal_count 와 해당 journals 의 accounting_date 대조
    - id: cause:fee_accrual_timing
      cause: 발생주의 수수료가 현금 지급일 기준으로 잡혔다
      check: 수수료 계정의 발생일 대 결제일 확인

# 1-c) 마감·주간 보고 스케줄 (close_scheduler.py)
#
# **거래소 캘린더가 아니다.** 휴장·반장 판정은 재일님 시세 파트 소관이고 우리는 만들지
# 않는다. 여기서 거르는 것은 주말뿐이며, 공휴일은 "그날 평가 스냅샷이 없다"로 드러나
# 보고 대신 사유 통지가 나간다. 시세 장애도 같은 모양으로 나가는데 그게 맞다 - 우리가
# 아는 사실은 스냅샷 유무뿐이고, 둘을 구분해 말하려면 없는 근거를 지어내야 한다.
close_schedule:
  # KRX 정규장 15:30 마감. 종가 봉이 확정돼 market-api 에 실릴 여유를 둔 값이며
  # 실측 후 재보정한다 - 너무 이르면 종가가 미확정(is_final=false)이라 quality_status 가
  # WARN 으로 남는다.
  daily_at: "15:40"
  weekly_on: FRI
  weekly_at: "16:00"
  timezone_offset_hours: 9      # KST. 회계일 판정도 이 시각 기준이다
  weekdays_only: true
  # 보고를 못 만들었을 때 사유를 채널에 알린다. false 로 두면 휴장·시세 장애·
  # 파이프라인 중단이 전부 같은 침묵이 된다.
  notify_on_no_data: true
  # 마감 평가에 쓸 봉. 비우면 장중 체결가라 quality_status 가 항상 WARN 이다.
  mark_interval: "1D"
  weekly_holdings_top_n: 10

# 2) 작업 Level 분류 - 회계 질의 비용·성능 최적화
#    질의를 난이도로 나눠 필요한 만큼만 태운다. **L0 는 LLM 을 아예 안 부른다.**
query_levels:
  # 레벨별 모델 등급. 실제 모델 id 가 아니라 등급이며, 매핑은 아래 model_tiers 에 있다.
  levels:
    L0:
      name: 결정론 조회
      tier: none
      why: 원장·스냅샷에서 그대로 읽으면 되는 질의. 모델을 부르면 비용만 늘고 오차만 생긴다
    L1:
      name: 단일 사실 서술
      tier: light
      why: 이미 확정된 수치 하나를 문장으로 옮기는 수준
    L2:
      name: 다중 홉 대조
      tier: standard
      why: 여러 원천을 연결해 설명해야 한다(대사 Break 원인, 기간 비교, 귀속 분해)
    L3:
      name: 마감·감사 서술
      tier: heavy
      why: 마감 판단 근거, 감사 대응, 규정 해석처럼 틀리면 되돌리기 어려운 서술

  # 등급 -> 실제 모델. **부서장 Hermes 질의 경로에만 적용된다.**
  # 직원 Worker 모델은 employee_runtime 이 소유하며 WORKER_MODEL_MATRIX.md 절차
  # (benchmark -> HR 제안 -> QA 검증 -> CEO 승인) 없이는 바꾸지 않는다.
  model_tiers:
    none: null                      # 모델 호출 없음
    light: gpt-5.6-luna
    standard: gpt-5.6-luna
    heavy: gpt-5.6-luna
  # 위 세 등급이 지금 같은 모델을 가리키는 것은 의도적이다. 등급 분리는 **배선이 먼저**이고
  # 실제 모델 분화는 비용·품질 실측과 승인 뒤에 이 표만 고쳐서 한다.
  tier_routing_approved: false

  # 분류 규칙. 키워드는 소문자로 비교하며, 높은 레벨이 먼저 맞으면 그 레벨로 확정한다.
  rules:
    L3:
      keywords: [마감, 확정, official, 공식, 감사, audit, 규정, 소명, 승인, 결산]
    L2:
      keywords: [왜, 원인, 차이, break, 대사, 불일치, 귀속, attribution, 비교, 추이, 증감, 분해]
    L1:
      keywords: [설명, 요약, 무엇, 어떤, 알려, summary, explain]
    # 위 어디에도 안 걸리고 아래 조회 의도가 보이면 L0.
    L0:
      keywords: [nav, 잔고, 포지션, 현금, 시재, position, cash, balance, 수량, 평가액, 스냅샷]

  # 지식 그래프 도입 판단 - **만들지 않는다.** 아래 조건이 실측될 때만 논의를 연다.
  # L2 질의 중 관계형(SQL/원장 조인)으로 답이 안 나온 비율이 이 값을 넘고, 표본이
  # min_samples 이상일 때. 그 전까지 이 필드는 계측 기준일 뿐이다.
  knowledge_graph_trigger:
    enabled: false
    relational_miss_ratio: 0.3
    min_samples: 50
    note: 조건 충족 전에 그래프를 만들지 않는다. 실측 근거 없이 저장소를 하나 더 늘리지 않는다.

# 3) Layered Memory - 마감 기억 (FinMem 계층 구조)
#    2026-08-07 개명: 옛 nav-close-worker 몫이며 지금은 exception-investigation-worker 의 근거다.
#    **기억은 비공식이다.** System of Record 는 execution.* / accounting.* 스키마다.
close_memory:
  # 계층별 반감기(일)와 검색 가중치. FinMem 의 shallow/intermediate/deep 에 대응한다.
  layers:
    shallow:
      half_life_days: 3
      note: 직전 며칠 마감에서 걸린 것. 빨리 잊혀도 되는 운영 잔여물
    intermediate:
      half_life_days: 30
      note: 이번 달 반복된 패턴. 월 마감 준비에서 다시 본다
    deep:
      half_life_days: 365
      note: 구조적 원인. 같은 계정·같은 브로커에서 반복되는 것
  # 점수 = relevance x recency_decay x importance. 가중은 아래.
  weights:
    relevance: 1.0
    recency: 1.0
    importance: 1.0
  max_recall: 5
  # 이 점수 아래는 회상하지 않는다 - 관련 없는 기억을 끌어오면 마감 서술이 흐려진다.
  min_score: 0.05
  # 접근될 때마다 deep 쪽으로 승격되는 임계(누적 접근 횟수). FinMem 의 강화 개념.
  promote_after_accesses: 3
