# Accounting/Portfolio Department Compose Fragment (도현 소유).
#
# 근거: docs/02-engineering/DEPARTMENT_BACKEND_INTEGRATION_DOCKER_PLAN.md 10절(Docker Compose
#       구조 - "본부가 자기 Compose Fragment를 소유하도록 한다"), 6.6절(회계/포트폴리오본부
#       Container 목록), 3.1절(Hermes는 Backend Image에 설치하지 않고 공식 Image를 별도
#       Container로 띄운다), docs/02-engineering/HERMES_DOCKER_RUNBOOK.md 4-2절
#
# 루트 docker-compose.yml이 `include:`로 이 파일을 끌어온다. 구조 설명은
# departments/02-trading/compose.yaml 상단 주석과 같다.
#
# ▶ 계획서 6.6의 portfolio-projector는 아직 별도 프로세스가 아니다 - Projection은
#   accounting-ledger-consumer가 분개와 같은 주기에 저장한다(fill_consumer.project).
#   accounting-api는 2026-08-04에 api/app.py가, accounting-ledger-consumer는
#   2026-08-10에 ledger/consumer.py가 생기면서 추가했다.
services:
  # accounting-api: 원장·평가·대사·기업행위·일일보고의 조회·명령면.
  # 계약은 docs/02-engineering/ACCOUNTING_PORTFOLIO_DOMAIN_API_SPEC.md.
  #
  # ▶ build.context가 이 폴더가 아니라 **저장소 루트(../..)** 다. trading-api와 다른
  #   점이며 이유는 Dockerfile 상단 주석에 있다 - ledger.py/reconciliation.py가 모듈
  #   최상위에서 departments/02-trading/contracts를 import해서 이미지 안에서도 같은
  #   상대 경로가 유지돼야 한다(03-risk와 같은 사정).
  #
  # ▶ DATABASE_URL이 원장의 위치를 정한다(설계서 4절, 2026-08-04 psycopg 구현).
  #   **없으면 조용히 인메모리로 뜬다** - 컨테이너를 지우면 분개가 사라지므로
  #   .env에 DATABASE_URL이 있는지 확인하고 띄운다. trading-api는 아직 안 쓴다.
  #
  # ▶ **복제하면 안 된다.** DB 모드에서 원장이 갈라지지는 않지만, 같은 장부에 동시에
  #   분개하면 로드 -> 계산 -> INSERT 사이에 경합 창이 생긴다. 이중 분개는 DB의
  #   unique (event_type, source_event_id)가 막고, 평균원가가 오래된 상태를 볼 수 있는
  #   것은 아직 안 막았다. 단일 인스턴스로 둔다.
  accounting-api:
    build:
      context: ../..
      dockerfile: departments/05-accounting-portfolio/Dockerfile
    container_name: hedgefund-accounting-api
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      # 기본은 durable Paper DB다. 인메모리는 ACCOUNTING_MODE=OFFLINE을
      # 명시한 로컬 테스트에서만 선택한다.
      ACCOUNTING_MODE: ${ACCOUNTING_MODE:-PAPER_DB}
      DATABASE_URL: ${DATABASE_URL:-}
    ports:
      - "127.0.0.1:8046:8000"   # 로컬 전용 - 외부 노출 금지 (8041~8045 사용 중)
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64

  # accounting-ledger-consumer: Relay가 SENT로 찍은 trading.fill.v1 봉투를 분개로
  # 만든다. 트레이딩 -> 회계 사이를 잇는 유일한 런타임 경로다.
  #
  # ▶ accounting-api와 **같은 Image에 command만 다르다**(계획서 3.1).
  #
  # ▶ **복제하면 안 된다.** accounting-api 주석과 같은 이유이고 여기가 더 직접적이다 -
  #   두 소비자가 같은 장부를 동시에 load -> 계산 -> INSERT 하면 평균원가가 오래된
  #   상태를 본다. 이중 분개 자체는 journals의 unique (event_type, source_event_id)와
  #   PostgresLedger.post의 경합 복구가 막는다.
  #
  # ▶ DATABASE_URL이 없으면 뜨지 않는다(consumer.py가 required=True로 연다). 인메모리로
  #   조용히 후퇴하면 "기록됐다고 믿은 분개"가 사라진다 - api와 다른 점이 아니라
  #   api도 durable mode에서 같게 동작해야 하는 쪽이다.
  #
  # ▶ trading-outbox-relay와 **같은 DATABASE_URL을 봐야 한다.** outbox는 execution
  #   스키마, 분개는 accounting 스키마이고 둘이 같은 Supabase DB에 있다.
  accounting-ledger-consumer:
    build:
      context: ../..
      dockerfile: departments/05-accounting-portfolio/Dockerfile
    container_name: hedgefund-accounting-ledger-consumer
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: ["python", "departments/05-accounting-portfolio/ledger/consumer.py", "--serve"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      ACCOUNTING_DATABASE_ROLE: ${ACCOUNTING_DATABASE_ROLE:-svc_accounting_ledger}
      LEDGER_CONSUMER_POLL_SECONDS: ${LEDGER_CONSUMER_POLL_SECONDS:-1.0}
      # 평가 시세. 컨테이너 안이라 127.0.0.1이 아니라 서비스 이름이다(market-api 주석과
      # 같은 사정). 못 붙으면 분개는 그대로 가고 NAV만 보류된다 - 시세가 없다고 체결
      # 기록까지 멈추지 않는다(consumer.poll).
      MARKET_API_URL: ${MARKET_API_URL:-http://market-api:8036}
      # 비우면 장중 체결가, `1D`면 종가 봉. 종가로 돌릴 때는 max_staleness도 넓혀야 한다.
      ACCOUNTING_MARK_INTERVAL: ${ACCOUNTING_MARK_INTERVAL:-}
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64

  # LS PAPER is the external account of record selected by the operator.  This
  # worker records drift as an immutable balanced Journal, then rebuilds the
  # normal position/cash projections.  It has no LS credential: broker reads
  # stay in portfolio-bff and only its masked, read-only projection is used.
  accounting-ls-paper-reconciler:
    build:
      context: ../..
      dockerfile: departments/05-accounting-portfolio/Dockerfile
    container_name: hedgefund-accounting-ls-paper-reconciler
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command:
      - python
      - departments/05-accounting-portfolio/reconciliation/ls_paper_alignment.py
    depends_on:
      portfolio-bff:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      ACCOUNTING_MODE: ${ACCOUNTING_MODE:-PAPER_DB}
      PAPER_DB: "true"
      ACCOUNTING_DATABASE_ROLE: ${ACCOUNTING_DATABASE_ROLE:-svc_accounting_ledger}
      ACCOUNTING_DEFAULT_BOOK_ID: ${ACCOUNTING_DEFAULT_BOOK_ID:-}
      PORTFOLIO_BFF_INTERNAL_URL: ${PORTFOLIO_BFF_INTERNAL_URL:-http://portfolio-bff:8000}
      LS_PAPER_RECONCILE_INTERVAL_SECONDS: ${LS_PAPER_RECONCILE_INTERVAL_SECONDS:-60}
      LS_PAPER_RECONCILE_GRACE_SECONDS: ${LS_PAPER_RECONCILE_GRACE_SECONDS:-10}
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64

  # accounting-close-scheduler: 장 마감 후 일일 마감 보고와 금요일 주간 포트폴리오
  # 보고를 만들어 Discord로 보낸다. 시각·요일은 accounting_ops.yaml close_schedule.
  #
  # ▶ **복제하면 안 된다.** 두 인스턴스가 같은 시각에 깨면 같은 보고가 두 번 나가고,
  #   중복 방지가 프로세스 메모리(`last`)에만 있어서 서로를 모른다. 중복이 원장을
  #   깨뜨리진 않지만(읽기 전용) 채널이 두 배로 시끄럽고 어느 쪽이 진짜인지 헷갈린다.
  #
  # ▶ DISCORD_WEBHOOK_URL이 없으면 계산은 다 하고 발송만 생략된다(discord_reporter가
  #   {"ok": false}로 흡수). 마감 자체는 안 막힌다 - Discord는 Projection이다.
  #
  # ▶ market-api가 있어야 종가 Mark를 받는다. 없으면 NAV가 보류되고 그 사유가
  #   보고 대신 통지로 나간다 - 침묵하지 않는다.
  accounting-close-scheduler:
    build:
      context: ../..
      dockerfile: departments/05-accounting-portfolio/Dockerfile
    container_name: hedgefund-accounting-close-scheduler
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: ["python", "departments/05-accounting-portfolio/close_scheduler.py", "--serve"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      MARKET_API_URL: ${MARKET_API_URL:-http://market-api:8036}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      # ACTIVE 장부가 둘 이상이면 이걸 지정해야 한다. 없으면 스케줄러가 아무거나
      # 고르지 않고 "장부를 고르지 못했다"로 통지한다.
      ACCOUNTING_DEFAULT_BOOK_ID: ${ACCOUNTING_DEFAULT_BOOK_ID:-}
      # 부서장 서술용. 없으면 결정론 문장으로 떨어지고 수치는 그대로 나간다.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64

  # 주의 사항은 departments/02-trading/compose.yaml과 동일하다 - 볼륨 이름 = Profile 이름,
  # 부서별 데이터 디렉터리 분리. Provider는 하드코딩하지 않는다 - /opt/data/config.yaml과
  # auth.json이 결정한다(Accounting은 Codex 배정, 2026-08-10 확정 매핑).
  accounting-hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hedgefund-accounting-hermes
    restart: unless-stopped
    command: ["sleep", "infinity"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - /home/ubuntu/.hermes/profiles/accounting-portfolio-department:/opt/data
      - ../../skills/finance:/opt/shared-skills/finance:ro
      - /home/ubuntu/.hermes/shared-kanban:/opt/kanban   # 공용 Kanban board, root docker-compose.yml research-hermes 주석 참고
    environment:
      HERMES_UID: 1000
      HERMES_GID: 1000
      HERMES_HOME: /opt/data
      HERMES_PROFILE: accounting-portfolio-department
      HERMES_KANBAN_HOME: /opt/kanban
      HERMES_KANBAN_DB: /opt/kanban/kanban.db
      HERMES_KANBAN_DISPATCH_IN_GATEWAY: "false"
      # Keep the department worker eligible for redacted LangSmith traces.
      LANGSMITH_HIDE_INPUTS: "true"
      LANGSMITH_HIDE_OUTPUTS: "true"
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-First}
    mem_limit: 1g
    mem_reservation: 192m
    cpus: 1.0
    pids_limit: 256
    stop_grace_period: 20s
