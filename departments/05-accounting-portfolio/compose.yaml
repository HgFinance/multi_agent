# Accounting/Portfolio Department Compose Fragment (도현 소유).
#
# 근거: docs/02-engineering/DEPARTMENT_BACKEND_INTEGRATION_DOCKER_PLAN.md 10절(Docker Compose
#       구조 - "본부가 자기 Compose Fragment를 소유하도록 한다"), 6.6절(회계/포트폴리오본부
#       Container 목록), 3.1절(Hermes는 Backend Image에 설치하지 않고 공식 Image를 별도
#       Container로 띄운다), docs/02-engineering/HERMES_DOCKER_RUNBOOK.md 4-2절
#
# 루트 docker-compose.yml이 `include:`로 이 파일을 끌어온다. 구조 설명은
# departments/02-trading/compose.yaml 상단 주석과 같다.
#
# ▶ 계획서 6.6의 ledger-worker / portfolio-projector는 아직 없다 - 코드가 없다.
#   코드 없는 역할을 컨테이너부터 만들지 않는다. accounting-api는 2026-08-04에
#   api/app.py가 생기면서 추가했다(trading-api가 2026-08-03에 그랬던 것과 같다).
services:
  # accounting-api: 원장·평가·대사·기업행위·일일보고의 조회·명령면.
  # 계약은 docs/02-engineering/ACCOUNTING_PORTFOLIO_DOMAIN_API_SPEC.md.
  #
  # ▶ build.context가 이 폴더가 아니라 **저장소 루트(../..)** 다. trading-api와 다른
  #   점이며 이유는 Dockerfile 상단 주석에 있다 - ledger.py/reconciliation.py가 모듈
  #   최상위에서 departments/02-trading/contracts를 import해서 이미지 안에서도 같은
  #   상대 경로가 유지돼야 한다(03-risk와 같은 사정).
  #
  # ▶ DATABASE_URL을 주지 않는다. trading-api와 같은 이유다 - 원장이 프로세스 메모리라
  #   아직 안 쓴다(설계서 4절). accounting.* 테이블은 Supabase에 이미 있고, psycopg
  #   구현이 들어오는 순간 여기에 DATABASE_URL을 추가한다. 안 쓰는 자격을 미리
  #   주입하지 않는다.
  #
  # ▶ 상태가 프로세스 메모리라 **복제하면 안 된다.** replica를 늘리면 원장이
  #   컨테이너별로 갈라지고, 그러면 대사할 내부 원천이 어느 쪽인지 알 수 없어진다.
  #   DB store가 들어오기 전까지 단일 인스턴스로 둔다.
  accounting-api:
    build:
      context: ../..
      dockerfile: departments/05-accounting-portfolio/Dockerfile
    container_name: hedgefund-accounting-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8046:8000"   # 로컬 전용 - 외부 노출 금지 (8041~8045 사용 중)
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64

  # 주의 사항은 departments/02-trading/compose.yaml과 동일하다 - 볼륨 이름 = Profile 이름,
  # 부서별 데이터 디렉터리 분리, CLAUDE.md 배정표대로 OPENAI_API_KEY만 주입.
  accounting-hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hedgefund-accounting-hermes
    restart: unless-stopped
    command: ["gateway", "run"]
    volumes:
      - ${USERPROFILE}/.hermes-accounting-portfolio-department:/opt/data
    environment:
      HERMES_UID: 10000
      HERMES_GID: 10000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Claude 구독 한도로 Sonnet 사용 (2026-08-03). 근거와 주의는
      # departments/02-trading/compose.yaml 같은 절 주석과 동일하다 -
      # 호스트 프록시(scripts/claude_code_proxy.py --serve)가 선행 조건이고,
      # ANTHROPIC_API_KEY는 일부러 주지 않는다(종량 과금으로 새지 않게).
      # 자리표시자인 이유는 02-trading/compose.yaml 주석 참고 - Hermes는 자격이
      # 비면 호출을 안 하는데 프록시는 그 값을 읽지 않는다. 진짜 구독 토큰을
      # 컨테이너에 넣지 않으면서, BASE_URL이 빠지면 막히는 쪽으로 동작한다.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-proxy-placeholder-not-a-credential}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-http://host.docker.internal:8787}

    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 1g
    mem_reservation: 192m
    cpus: 1.0
    pids_limit: 256
    stop_grace_period: 20s
