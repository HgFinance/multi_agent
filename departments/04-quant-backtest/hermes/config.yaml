# ▶ 부서장 기본 모델 (2026-08-15 Claude Code 한도 소진으로 Codex 복귀)
#   정본 계약대로 openai-codex/gpt-5.6-luna 를 기본으로 사용한다.
#   Claude Code는 한도가 복구되고 승인됐을 때만 docker-compose.claude.yml
#   오버레이로 사용하는 대체 경로이며 저장소 기본값으로 두지 않는다.
model:
  provider: openai-codex
  default: gpt-5.6-luna
env:
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
  DISCORD_COMMAND_SYNC_POLICY: off
  # 업무 원장. **이 프로필에만 둔다** - 에이전트는 kanban-dispatcher 한
  # 컨테이너에서 전부 뜨므로, 여기 말고 compose environment 에 두면 8개
  # 본부가 전부 갖게 된다. 지금은 공용 DSN 이고, svc_quant 롤
  # (supabase/migrations/20260812000100_quant_service_role.sql) 적용 후
  # 그 계정으로 좁힌다.
  QUANT_DATABASE_URL: ${QUANT_DATABASE_URL}
  DATABASE_URL: ${QUANT_DATABASE_URL}
  # ⚠ `.env` 의 TIMESCALE_DATABASE_URL 은 **호스트용**(localhost:5434)이다.
  #   에이전트는 컨테이너 안에서 도니 localhost 가 자기 자신이라 닿지 않는다
  #   (2026-08-12 실측: Connection refused). compose 서비스들이 쓰는 것과
  #   같은 **네트워크 이름**으로 적는다.
  TIMESCALE_DATABASE_URL: postgresql://postgres:${HEDGEFUND_TSDB_PASSWORD}@timescaledb:5432/market
agent:
  head_persona: quant-backtest-supervisor
  runtime_personalities_source: workers
  runtime_personalities:
  - strategy-author-worker
  - result-interpretation-worker
  # 2026-08-25: 연구 카드는 재고 고치고 다시 재는 왕복이 길다. 100 턴은
  #   측정 한 판도 다 못 돈다 - 300 으로 올린다.
  max_turns: 300
  # 측정 설계는 이 공장에서 가장 어려운 일이다. medium 으로 눌러둘 이유가 없다.
  reasoning_effort: high
  # 60초는 원천을 훑는 집계 쿼리 하나도 못 끝낸다.
  timeout_seconds: 900
  personalities:
    quant-backtest-supervisor: 'You are the Quant Validation Laboratory lead (QNT-00). Consume only a registered autonomous research plan and its immutable result artifact. Verify point-in-time data, realistic costs, out-of-sample separation, robustness, trade paths and failure modes through deterministic pipeline entrypoints. Never invent a hypothesis, accept an unregistered result, retune after seeing evidence, write an order, override a gate or promote a strategy. A robust result is reported as a candidate for separate QA, Risk and human review; incomplete evidence is BLOCKED and failed premises are retained as lessons for the research lab.'
    strategy-author-worker: 'You are the Strategy Signal Author (QNT-05). Your mission is to turn a methodology the firm has never run before into an executable signal despite a fixed execution surface. You write a single function, signal(view, params), that scores every symbol, and you write it from the proposal''s stated mechanism rather than from what you expect to score well. The view you are given exposes only data at or before the decision date, so you cannot look ahead even if you try; do not attempt to work around it, and if the mechanism genuinely needs data the view does not expose, say so and let the proposal be rejected as NEEDS_DATA rather than approximating with something else. Official outputs: Signal Code, Mechanism Mapping, Data Requirement, Untestable Verdict. Your code is hashed into the preregistration fingerprint before any result exists, which means editing it after seeing a result is not a fix - it is a new trial that will be counted against the family and will deflate the Sharpe accordingly. You never write code that reads files, imports modules, or reaches the network; you never fabricate a score for a symbol with insufficient data - you leave it out, because zero is a rank, not an absence.'
    result-interpretation-worker: 'You are the Result Interpretation Analyst (QNT-03). Your mission is to say in plain language what an ExperimentCardV1 means - what the deflated Sharpe implies given the number of trials, what a backtest-overfitting probability of this size says about the selection process rather than the strategy, and what the regime breakdown shows that the headline number hides. You never recompute or restate a number differently from the card, and you never call a result acceptable or unacceptable: the release gate has already decided, deterministically, and your text explains that decision rather than competing with it. Official outputs: Result Narrative, Overfitting Read, Regime Concern, Sample-Size Caveat. When a statistic was not run you report it as not run, never as a pass.'
  tool_allowlist:
    quant-backtest-supervisor:
    - case.read
    - quant.experiment.read
    strategy-author-worker:
    - quant.template_catalog.read
    - quant.vocabulary.read
    - quant.strategy_spec.propose
    result-interpretation-worker:
    - quant.experiment_card.read
    - quant.overfit_stats.read
    - quant.regime_breakdown.read
  forbidden_tools:
  - oms.submit
  - ledger.write
  - risk.decision.write
  - strategy.promote
  - quant.experiment.card.write
  - quant.outcome.write
  - quant.release_gate.override
  - quant.execution_surface.write
# Autonomous research owns hypothesis generation and proposal intake. This
# profile is a read-only validation desk for registered plans and immutable
# results; the research MCP surface exposes no legacy submission tools.
mcp_servers:
  research:
    url: http://research-liaison-mcp:8037/mcp
    headers:
      Authorization: Bearer ${MCP_RESEARCH_API_KEY}
    enabled: true
    skip_preflight: true
    keepalive_interval: 60
  # Valuation is a read-only LS projection. The credential remains isolated in
  # ls-mcp; this profile receives tools, never broker credentials.
  ls-securities:
    url: http://ls-mcp:8038/mcp
    headers:
      Authorization: Bearer ${MCP_RESEARCH_API_KEY}
    enabled: true
    skip_preflight: true
    keepalive_interval: 60

# ── Hermes 내장 도구 경계 ──────────────────────────────────────────────────
# Quant Hermes는 부서 오케스트레이션과 읽기 전용 MCP 결과의 종합만 담당한다.
# 기본 도구셋을 그대로 상속하면 browser·terminal·file·code_execution 같은
# 범용 실행 도구가 모델에 노출되어, 데이터 MCP를 사용할 수 있는데도 무관한
# 탐색이나 실행 경로를 선택할 수 있다.  시장·문헌·리서치 조회는 위의 MCP
# 서버가 소유하므로 여기서는 Hermes 내장 lifecycle 도구만 허용한다.
#
# `known_builtin_toolsets`는 Hermes가 새 내장 도구를 자동 활성화하지 않게
# 하는 완전 목록이다. profile sync 뒤에도 허용 목록 밖 도구가 되살아나지
# 않도록 Trading profile과 같은 런타임 계약을 명시한다.
platform_toolsets:
  # Standard/fast analysis is single-owner: the primary task must retain the
  # terminal handoff, so native delegate_task is intentionally not exposed.
  cli: [clarify, cronjob, kanban, memory, session_search, skills, todo]
known_builtin_toolsets:
  cli: [bfl, browser, clarify, code_execution, computer_use, context_engine, cronjob,
        delegation, discord, discord_admin, file, homeassistant, image_gen, memory,
        session_search, skills, spotify, stt, terminal, todo, tts, video, video_gen,
        vision, web, x_search, yuanbao]
known_plugin_toolsets:
  cli: [spotify]

hiring_priority:
  quant-backtest-supervisor:
    role_codes:
    - QNT-00
    tier: P0
  strategy-author-worker:
    role_codes:
    - QNT-05
    tier: P0
    registration: pending_hr
  result-interpretation-worker:
    role_codes:
    - QNT-03
    tier: P0
    registration: pending_hr
skills:
  external_dirs:
    - /opt/shared-skills
usage:
  run: quant-backtest-department chat -q 'Intake the research experiment proposal, preregister it and report the card'
  collaborate: quant-backtest-department chat -q 'Explain why this family was rejected and map the lesson codes for research'
head_runtime:
  runtime: hermes
  role: department_head
  provider_choices:
  - openai-codex
  - anthropic-claude-code
  active_provider: openai-codex
  active_model: gpt-5.6-luna
  model_source: model
  responsibility: synthesize_worker_context_and_escalate
  binding_decision: false
staff_registry:
  head_count: 1
  worker_count: 2
  default_execution_count: 1
  max_execution_count: 5
  active_worker_count: 0
  conditional_worker_count: 2
  runtime_persona_source: workers
employee_runtime:
  executor: langgraph
  topology: async_fan_out_fan_in_independent_graphs
  worker_graph_module: departments/04-quant-backtest/employee_workers.py
  provider: vllm-openai
  model_env: WORKER_MODEL_NAME
  model_default: qwen2.5-14b-instruct-awq
  base_url_env: WORKER_MODEL_BASE_URL
  model_profile: qwen-awq-v1
  adapter_registry: departments/01-research/config/worker_model_registry.json
  model_selection:
    active_model: qwen2.5-14b-instruct-awq
    candidate_source: worker_model_registry + qwen-awq-v1 benchmark artifacts
    selection_policy: fixed_until_worker_benchmark_and_quality_gate_approved
    quality_gate: FinanceBench_HOLD; serving_only
    matrix_document: docs/02-engineering/WORKER_MODEL_MATRIX.md
  output_contract: quant.worker-context.v1
  max_retries: 2
  max_attempts: 3
  binding_decision_owner: departments/04-quant-backtest/pipeline
  failure_action: HOLD_ESCALATE
workers:
  strategy-author-worker:
    role: Custom strategy signal authoring analyst
    status: conditional
    trigger: strategy_authoring
    tools:
    - quant.template_catalog.read
    - quant.vocabulary.read
    output: strategy_spec_candidate
  result-interpretation-worker:
    role: Backtest result, overfitting and regime interpretation analyst
    status: conditional
    trigger: experiment_card
    tools:
    - quant.experiment_card.read
    output: advisory_context
