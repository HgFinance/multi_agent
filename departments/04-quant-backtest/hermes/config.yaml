    role: Custom strategy signal authoring analyst
    status: conditional
    trigger: strategy_authoring
    tools:
    - quant.template_catalog.read
    - quant.vocabulary.read
    output: strategy_spec_candidate
  result-interpretation-worker:
    role: Backtest result, overfitting and regime interpretation analyst
    status: conditional
    trigger: experiment_card
    tools:
    - quant.experiment_card.read
    output: advisory_context
