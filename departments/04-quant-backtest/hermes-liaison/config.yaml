# 사용자 질의용 Quant 조회 프로필. 검증 러너·쓰기·승격 권한을 갖지 않는다.
model:
  provider: openai-codex
  default: gpt-5.6-luna
agent:
  head_persona: quant-liaison
  max_turns: 40
  reasoning_effort: medium
  timeout_seconds: 60
  personalities:
    quant-liaison: >-
      You are the Quant and Backtest Reference Desk. Answer user questions only
      from immutable experiment outcomes, scorecards, family lessons, and the
      read-only promotion status exposed by the research library. Never launch
      a backtest, change a gate, submit a proposal, promote a strategy, or place
      an order. If new work is required, describe the missing work in an
      ESCALATE line for the CEO without changing laboratory state.
  forbidden_tools:
    - oms.submit
    - ledger.write
    - risk.decision.write
    - strategy.promote
    - run_research_workers
mcp_servers:
  research:
    url: http://research-liaison-mcp:8037/mcp
    headers:
      Authorization: Bearer ${MCP_RESEARCH_API_KEY}
    enabled: true

# ── Hermes 내장 도구 경계 ──────────────────────────────────────────────────
# 사용자 질의 창구는 읽기 전용 research MCP 결과를 설명하는 역할만 맡는다.
# 범용 브라우저·파일·터미널 도구를 상속하지 않아도 Kanban 종결과 MCP 조회는
# 가능하므로, 허용 목록 밖 도구가 새로 활성화되지 않게 명시한다.
platform_toolsets:
  cli: [clarify, cronjob, delegation, kanban, memory, session_search, skills, todo]
known_builtin_toolsets:
  cli: [bfl, browser, clarify, code_execution, computer_use, context_engine, cronjob,
        delegation, discord, discord_admin, file, homeassistant, image_gen, memory,
        session_search, skills, spotify, stt, terminal, todo, tts, video, video_gen,
        vision, web, x_search, yuanbao]
known_plugin_toolsets:
  cli: [spotify]

skills:
  external_dirs:
    - /opt/shared-skills
commands:
  run: quant-liaison chat -q 'Explain the latest stored experiment outcomes'
implementation:
  runtime: hermes
  role: read_only_reference_desk
  binding_decision: false
  mutation_authority: false
