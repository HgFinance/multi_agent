# Agent Workforce 인사팀 Compose Fragment (영주 소유).
#
# 근거: docs/02-engineering/DEPARTMENT_BACKEND_INTEGRATION_DOCKER_PLAN.md 10절(Docker Compose
#       구조 - "Docker Compose 2.20.3 이상의 include를 사용해 본부가 자기 Compose Fragment를
#       소유하도록 한다"), 6.8절(Agent Workforce Container 목록).
#
# 루트 docker-compose.yml이 `include:`로 이 파일을 끌어온다. build.context는 이 파일 자신의
# 디렉터리 기준 상대 경로다("." = departments/07-agent-workforce).
services:
  workforce-api:
    build:
      context: .
    container_name: hedgefund-workforce-api
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      DATABASE_URL: ${GOVERNANCE_WORKFORCE_DATABASE_URL:-${DATABASE_URL:-}}
      # Langfuse(2026-08-10 도입, 993682f). 이 컨테이너는 **읽는** 쪽이다 -
      # GET /workforce/v1/departments/idle-agents 가 6개 투자본부 Worker의
      # 마지막 관측 시각만 조회한다(scorecard/observability.py). Trace 원문
      # (input/output)은 절대 읽지 않는다(.env.example 3-2절).
      # 비어 있으면 501이 아니라 전원 UNAVAILABLE로 정직하게 응답한다.
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      # 아래 마운트 경로와 코드 기본값(observability.py DEFAULT_PROFILE_MOUNT_ROOT)이
      # 따로 놀지 않도록 명시한다.
      WORKFORCE_PROFILE_ROOT: /app/profiles
    volumes:
      # 6개 투자본부 Hermes Profile을 **read-only 데이터로만** 읽는다(2026-08-20 영주
      # 결정, 계획서 3.2의 미결 해소). 유휴 판정에 필요한 값은 config.yaml `workers:`의
      # worker_id·trigger 둘뿐이고 그 파일이 편제의 정본이다(CLAUDE.md) - 남의 본부
      # 파이썬 모듈을 import해 HR 프로세스에서 실행하던 이전 방식을 대체한다.
      # `:ro` 는 필수다. HR은 남의 본부 편제를 읽을 뿐 고칠 권한이 없다.
      - ../01-research/hermes/config.yaml:/app/profiles/research/config.yaml:ro
      - ../02-trading/hermes/config.yaml:/app/profiles/trading/config.yaml:ro
      - ../03-risk/hermes/config.yaml:/app/profiles/risk/config.yaml:ro
      - ../04-quant-backtest/hermes/config.yaml:/app/profiles/quant-backtest/config.yaml:ro
      - ../05-accounting-portfolio/hermes/config.yaml:/app/profiles/accounting-portfolio/config.yaml:ro
      - ../06-ai-qa-audit/hermes/config.yaml:/app/profiles/qa/config.yaml:ro
    ports:
      - "127.0.0.1:8044:8000"   # 로컬 전용 - 외부 노출 금지
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64

  # improvement-worker: workforce-api와 같은 Image, command만 다르다(qa-worker와 같은 패턴).
  # hf:workforce Stream을 소비해 workforce.eval.v1(QA Eval 결과)을 개선 후보의
  # EVALUATING -> SHADOW/REJECTED 전이로 바꾼다(workforce_events/worker.py). QA가 이
  # 이벤트를 아직 발행하지 않아(2026-08-03) Payload Contract는 잠정안이다 - 다른
  # Consumer Group용 Event(workforce.access_request.v1 등)는 조용히 넘긴다.
  improvement-worker:
    build:
      context: .
    container_name: hedgefund-improvement-worker
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: ["python", "workforce_events/worker.py"]
    working_dir: /app/departments/07-agent-workforce
    depends_on:
      - redis
    environment:
      DATABASE_URL: ${GOVERNANCE_WORKFORCE_DATABASE_URL:-${DATABASE_URL:-}}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      WORKFORCE_EVENT_POLL_INTERVAL_SECONDS: ${WORKFORCE_EVENT_POLL_INTERVAL_SECONDS:-1}
    mem_limit: 256m
    cpus: 0.3
    pids_limit: 64
    stop_grace_period: 20s

  # workforce-hermes: research-hermes/risk-hermes와 같은 패턴 - Hermes는 Backend Image에 안
  # 넣고 공식 Image를 별도 Container로 띄운다(계획서 3.1). Provider는 하드코딩하지 않는다 -
  # /opt/data/config.yaml(provider:)과 auth.json이 결정한다(HR은 Codex 배정, 2026-08-10
  # 확정 매핑). 프로필 디렉터리 이름은 scripts/sync_hermes_profiles.sh의 매핑("hr-department")과
  # 일치해야 한다.
  workforce-hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hedgefund-workforce-hermes
    restart: unless-stopped
    command: ["sleep", "infinity"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - /home/ubuntu/.hermes/profiles/hr-department:/opt/data
      - /home/ubuntu/.hermes/shared-kanban:/opt/kanban   # 공용 Kanban board, root docker-compose.yml research-hermes 주석 참고
    environment:
      HERMES_UID: 1000
      HERMES_GID: 1000
      HERMES_HOME: /opt/data
      HERMES_PROFILE: hr-department
      HERMES_KANBAN_HOME: /opt/kanban
      HERMES_KANBAN_DB: /opt/kanban/kanban.db
      HERMES_KANBAN_DISPATCH_IN_GATEWAY: "false"
    mem_limit: 1g
    mem_reservation: 192m
    cpus: 1.0
    pids_limit: 256
    stop_grace_period: 20s
