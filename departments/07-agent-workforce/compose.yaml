# Agent Workforce 인사팀 Compose Fragment (영주 소유).
#
# 근거: docs/02-engineering/DEPARTMENT_BACKEND_INTEGRATION_DOCKER_PLAN.md 10절(Docker Compose
#       구조 - "Docker Compose 2.20.3 이상의 include를 사용해 본부가 자기 Compose Fragment를
#       소유하도록 한다"), 6.8절(Agent Workforce Container 목록).
#
# 루트 docker-compose.yml이 `include:`로 이 파일을 끌어온다. build.context는 이 파일 자신의
# 디렉터리 기준 상대 경로다("." = departments/07-agent-workforce).
services:
  workforce-api:
    build:
      context: ../..
      dockerfile: departments/07-agent-workforce/Dockerfile
    container_name: hedgefund-workforce-api
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      DATABASE_URL: ${GOVERNANCE_WORKFORCE_DATABASE_URL:-${DATABASE_URL:-}}
      # Langfuse(2026-08-10 도입, 993682f). 이 컨테이너는 **읽는** 쪽이다 -
      # GET /workforce/v1/departments/idle-agents 가 6개 투자본부 Worker의
      # 마지막 관측 시각만 조회한다(scorecard/observability.py). Trace 원문
      # (input/output)은 절대 읽지 않는다(.env.example 3-2절).
      # 비어 있으면 501이 아니라 전원 UNAVAILABLE로 정직하게 응답한다.
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
    ports:
      - "127.0.0.1:8044:8000"   # 로컬 전용 - 외부 노출 금지
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; payload=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)); assert payload.get('status') == 'ready' and payload.get('authoritative') is True"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64

  # workforce-snapshot-writer: workforce-api와 **같은 Image**를 command만 바꿔 돌린다
  # (Dockerfile 머리말의 "하나의 Image, command만 바꿔" 원칙).
  #
  # 무엇을 하나: Langfuse 관측을 읽어 workforce.capacity_snapshots /
  # cost_snapshots 에 적는다. 이 producer 가 없던 동안 두 테이블이 0행이었고
  # Scorecard 브리프의 처리량·비용이 영구 NO_SNAPSHOT 이었다 - 정작 같은 수치가
  # Langfuse 쪽에는 있었다(scorecard/snapshot_writer.py 머리말).
  #
  # ▶ 정시 정렬 1시간 버킷만 적는다. 이동 창으로 적으면 24시간 Scorecard 질의가
  #   겹치는 행을 전부 합산해 비용이 실행 횟수만큼 부풀고 예산 판정이 뒤집힌다
  #   (list_cost_snapshots_by_department + assess_budget). 같은 버킷 재보고는
  #   멱등 갱신이라, 주기(10분)를 버킷(1시간)보다 짧게 잡아 재시작에 강하게 둔다.
  #
  # ▶ 읽기 전용 관측 + Snapshot 기록만 한다. 인사 판정·권한·승인은 여기 없다
  #   (CLAUDE.md 권한 경계 - HR은 자기 후보를 스스로 승인할 수 없다).
  workforce-snapshot-writer:
    build:
      context: ../..
      dockerfile: departments/07-agent-workforce/Dockerfile
    container_name: hedgefund-workforce-snapshot-writer
    restart: unless-stopped
    init: true
    command:
      - python
      - scorecard/snapshot_writer.py
    working_dir: /app/departments/07-agent-workforce
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      DATABASE_URL: ${GOVERNANCE_WORKFORCE_DATABASE_URL:-${DATABASE_URL:-}}
      # workforce-api와 같은 자격증명·같은 read 경계다(Trace 원문은 안 읽는다).
      # 비어 있으면 관측이 전원 UNAVAILABLE 이고, writer 는 그것을 0 으로 적지 않고
      # 사유와 함께 건너뛴다(snapshot_writer.py "적지 않는 것").
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      WORKFORCE_SNAPSHOT_INTERVAL_SECONDS: ${WORKFORCE_SNAPSHOT_INTERVAL_SECONDS:-600}
      WORKFORCE_SNAPSHOT_HEALTH_PATH: /tmp/workforce-snapshot-writer.health
      # Langfuse 관측 창에 이상 신호가 있을 때만 HR 채널에 요약 카드를
      # 발행한다. shadow/off 는 카드와 승인 원장을 만들지 않는 안전한 기본값이다.
      HR_LANGFUSE_REVIEW_MODE: ${HR_LANGFUSE_REVIEW_MODE:-shadow}
      HR_LANGFUSE_CHANNEL_ID: ${HR_LANGFUSE_CHANNEL_ID:-1542405626531942432}
      DISCORD_BOT_TOKEN_HR: ${DISCORD_BOT_TOKEN_HR:-}
      LANGSMITH_FEEDBACK_LATENCY_WARN_MS: ${LANGSMITH_FEEDBACK_LATENCY_WARN_MS:-60000}
      LANGSMITH_FEEDBACK_STATE_PATH: /var/lib/portfolio/langsmith-feedback.sqlite3
      PYTHONPATH: /app:/app/departments/07-agent-workforce
    volumes:
      # audit-api and HR review share this SQLite coordination ledger. It is
      # used for artifact/decision/delivery idempotency only; no secrets live here.
      - portfolio_runtime_data:/var/lib/portfolio
    healthcheck:
      # heartbeat 는 기록 0건에도 찍힌다 - Worker 가 한 시간 동안 아무것도 안 한
      # 정상 상태(arrivals=0)로 컨테이너를 재시작시키면 진짜 장애만 가려진다.
      test: ["CMD", "python", "scorecard/snapshot_writer.py", "--healthcheck"]
      interval: 300s
      timeout: 10s
      retries: 3
      start_period: 60s
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64

  # workforce-hermes: research-hermes/risk-hermes와 같은 패턴 - Hermes는 Backend Image에 안
  # 넣고 공식 Image를 별도 Container로 띄운다(계획서 3.1). Provider는 하드코딩하지 않는다 -
  # /opt/data/config.yaml(provider:)과 auth.json이 결정한다(HR은 Codex 배정, 2026-08-10
  # 확정 매핑). 프로필 디렉터리 이름은 scripts/sync_hermes_profiles.sh의 매핑("hr-department")과
  # 일치해야 한다.
  workforce-hermes:
    build:
      context: ../..
      dockerfile: Dockerfile.hermes-discord
    image: hedgefund-hermes-discord:hr-langfuse-v1
    container_name: hedgefund-workforce-hermes
    restart: unless-stopped
    command: ["sleep", "infinity"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - /home/ubuntu/.hermes/profiles/hr-department:/opt/data
      - /home/ubuntu/.hermes/shared-kanban:/opt/kanban   # 공용 Kanban board, root docker-compose.yml research-hermes 주석 참고
      - ../../skills:/opt/shared-skills:ro
      - ../../scripts:/opt/hgfinance/scripts:ro
    environment:
      HERMES_UID: 1000
      HERMES_GID: 1000
      HERMES_HOME: /opt/data
      HERMES_PROFILE: hr-department
      HERMES_KANBAN_HOME: /opt/kanban
      HERMES_KANBAN_DB: /opt/kanban/kanban.db
      HERMES_KANBAN_DISPATCH_IN_GATEWAY: "false"
      LANGSMITH_HIDE_INPUTS: "true"
      LANGSMITH_HIDE_OUTPUTS: "true"
      LANGSMITH_TRACING: ${HR_LANGSMITH_TRACING:-false}
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      HGFINANCE_LANGSMITH_PUBLISH_ENABLED: ${HGFINANCE_LANGSMITH_PUBLISH_ENABLED:-false}
      LANGCHAIN_TRACING_SAMPLING_RATE: ${LANGCHAIN_TRACING_SAMPLING_RATE:-0.05}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-First}
      LANGSMITH_TRACE_SAMPLE_RATE: ${LANGSMITH_TRACE_SAMPLE_RATE:-0.05}
      LANGSMITH_TRACE_SLOW_MS: ${LANGSMITH_TRACE_SLOW_MS:-45000}
      LANGSMITH_TOOL_TRACE_MODE: ${LANGSMITH_TOOL_TRACE_MODE:-aggregate}
      DISCORD_IDEMPOTENCY_HOME: /opt/kanban
      DISCORD_IDEMPOTENCY_SCOPE: global
      # Avoid repeated Discord command-management calls on worker restarts.
      # The HR message path remains available; slash commands are not its
      # execution boundary.
      DISCORD_COMMAND_SYNC_POLICY: ${DISCORD_COMMAND_SYNC_POLICY:-off}
      DISCORD_ALLOWED_CHANNELS: ${HR_DISCORD_ALLOWED_CHANNELS:-1542405626531942432}
      HR_LANGFUSE_CHANNEL_ID: ${HR_LANGFUSE_CHANNEL_ID:-1542405626531942432}
      DISCORD_FREE_RESPONSE_CHANNELS: ${HR_DISCORD_FREE_RESPONSE_CHANNELS:-1542405626531942432}
      HR_LANGFUSE_APPROVER_USER_IDS: ${HR_LANGFUSE_APPROVER_USER_IDS:-}
      HR_LANGFUSE_APPROVER_ROLE_IDS: ${HR_LANGFUSE_APPROVER_ROLE_IDS:-}
      QA_FEEDBACK_API_URL: http://audit-api:8000
      QA_API_AUTH_TOKEN: ${QA_API_AUTH_TOKEN:-}
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 && test -r /opt/data/config.yaml && test -d /opt/kanban && test -r /opt/kanban/kanban.db"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 1g
    mem_reservation: 192m
    cpus: 1.0
    pids_limit: 256
    stop_grace_period: 20s

volumes:
  portfolio_runtime_data:
