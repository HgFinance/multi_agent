# Agent Workforce 인사팀 Compose Fragment (영주 소유).
#
# 근거: docs/02-engineering/DEPARTMENT_BACKEND_INTEGRATION_DOCKER_PLAN.md 10절(Docker Compose
#       구조 - "Docker Compose 2.20.3 이상의 include를 사용해 본부가 자기 Compose Fragment를
#       소유하도록 한다"), 6.8절(Agent Workforce Container 목록).
#
# 루트 docker-compose.yml이 `include:`로 이 파일을 끌어온다. build.context는 이 파일 자신의
# 디렉터리 기준 상대 경로다("." = departments/07-agent-workforce).
services:
  workforce-api:
    build:
      context: .
    container_name: hedgefund-workforce-api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${GOVERNANCE_WORKFORCE_DATABASE_URL:-${DATABASE_URL:-}}
    ports:
      - "127.0.0.1:8044:8000"   # 로컬 전용 - 외부 노출 금지
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64

  # improvement-worker: workforce-api와 같은 Image, command만 다르다(qa-worker와 같은 패턴).
  # hf:workforce Stream을 소비해 workforce.eval.v1(QA Eval 결과)을 개선 후보의
  # EVALUATING -> SHADOW/REJECTED 전이로 바꾼다(workforce_events/worker.py). QA가 이
  # 이벤트를 아직 발행하지 않아(2026-08-03) Payload Contract는 잠정안이다 - 다른
  # Consumer Group용 Event(workforce.access_request.v1 등)는 조용히 넘긴다.
  improvement-worker:
    build:
      context: .
    container_name: hedgefund-improvement-worker
    restart: unless-stopped
    command: ["python", "workforce_events/worker.py"]
    working_dir: /app/departments/07-agent-workforce
    depends_on:
      - redis
    environment:
      DATABASE_URL: ${GOVERNANCE_WORKFORCE_DATABASE_URL:-${DATABASE_URL:-}}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      WORKFORCE_EVENT_POLL_INTERVAL_SECONDS: ${WORKFORCE_EVENT_POLL_INTERVAL_SECONDS:-1}
    mem_limit: 256m
    cpus: 0.3
    pids_limit: 64
    stop_grace_period: 20s

  # workforce-hermes: research-hermes/risk-hermes와 같은 패턴 - Hermes는 Backend Image에 안
  # 넣고 공식 Image를 별도 Container로 띄운다(계획서 3.1). Provider는 하드코딩하지 않는다 -
  # /opt/data/config.yaml(provider:)과 auth.json이 결정한다(HR은 Codex 배정, 2026-08-10
  # 확정 매핑). 프로필 디렉터리 이름은 scripts/sync_hermes_profiles.sh의 매핑("hr-department")과
  # 일치해야 한다.
  workforce-hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hedgefund-workforce-hermes
    restart: unless-stopped
    command: ["gateway", "run"]
    volumes:
      - /home/ubuntu/.hermes/profiles/hr-department:/opt/data
    environment:
      HERMES_UID: 1000
      HERMES_GID: 1000
    mem_limit: 1g
    mem_reservation: 192m
    cpus: 1.0
    pids_limit: 256
    stop_grace_period: 20s
