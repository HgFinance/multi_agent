  profile-architect: {role_codes: ["HR-02"], tier: "P1"}
  selection-performance-agent: {role_codes: ["HR-03"], tier: "P1"}
  lifecycle-coordinator: {role_codes: ["HR-04"], tier: "P0"}
  # HR은 5명 전부 존재 — 격차 없음

skills:
  - hermes-agent

usage:
  run: "hr-department chat -q 'Build the weekly workforce plan from department Queue/SLA/cost signals'"
  collaborate: "hr-department chat -q 'Design a Job Profile for a new risk-management analyst, then route it to qa-department for permission verification and ceo-agent for budget approval'"
head_runtime:
  runtime: hermes
  role: department_head
  provider_choices: [openai-codex, anthropic-claude-code]
  active_provider: openai-codex
  active_model: gpt-5.6-luna
  model_source: model
  responsibility: synthesize_worker_context_and_escalate
  binding_decision: false
staff_registry:
  head_count: 1
  worker_count: 5
  default_execution_count: 2
  max_execution_count: 5
  active_worker_count: 2
  conditional_worker_count: 3
  runtime_persona_source: workers
  legacy_personas_are_aliases: true
  legacy_personas:
    source: agent.personalities
    runtime: compatibility_only
    excluded_from_worker_count: true
employee_runtime:
  executor: langgraph
  topology: independent_graph_per_worker
  worker_graph_module: departments/07-agent-workforce/employee_workers.py
  provider: ollama
  model_env: OLLAMA_CHAT_MODEL
  model_default: qwen3:1.7b
  base_url_env: OLLAMA_BASE_URL
  model_selection:
    active_model: qwen3:1.7b
    candidate_source: ollama list
    selection_policy: fixed_until_worker_benchmark_approved
    matrix_document: docs/02-engineering/WORKER_MODEL_MATRIX.md
  output_contract: workforce.worker-context.v1
  max_retries: 2
  max_attempts: 3
  binding_decision_owner: departments/07-agent-workforce/lifecycle
  failure_action: ESCALATE
workers:
  workforce-planning-worker:
    role: Queue, SLA, cost and staffing-gap analyst
    status: active
    trigger: always
    tools: [workforce.queue.read, workforce.sla.read]
    output: advisory_context
  profile-architecture-worker:
    role: Agent profile and role-boundary architect
    status: active
    trigger: always
    tools: [workforce.profile.read]
    output: advisory_context
  selection-performance-worker:
    role: Candidate selection and performance-evaluation analyst
    status: conditional
    trigger: performance_signal
    tools: [workforce.evaluation.read]
    output: advisory_context
  lifecycle-coordination-worker:
    role: Joiner, mover and leaver lifecycle coordinator
    status: conditional
    trigger: lifecycle_event
    tools: [workforce.lifecycle.read]
    output: advisory_context
  workforce-governance-worker:
    role: Workforce approval routing and segregation-of-duties analyst
    status: conditional
    trigger: governance_request
    tools: [workforce.governance.read]
    output: advisory_context
