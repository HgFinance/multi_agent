# Agent Workforce 인사팀 (CEO 직속 Shared Service — 투자 본부 아님)
# 담당: 영주 (인사팀, CEO 쪽 고도화)
# 6개 본부의 Queue·SLA·비용·Eval·Incident를 분석해 Agent 채용, Skill 보강, 교육, 역할 변경과 비활성화를 관리
# 투자 판단, Production 권한 부여, 자기 후보의 최종 QA 승인 권한 없음 — Model/Prompt/Tool 권한 독립 검증은 AI QA/감사본부, 예산·조직 승인은 CEO, 실제 Identity/권한 생성은 Platform/IAM Service가 담당
# 참고: HEDGE_FUND_MASTER_PLAN.md 5.5(274행), 8(601-610행), 19.4(1829행)
# 신규 채용(workforce_management_cycle)과 기존 Agent 개선(agent_evolution_cycle)은 별도 흐름이다 —
# 후자도 동일한 QA 독립검증·CEO 승인 게이트를 거친다. multi-agent-workflow.yaml 참고.

# 부서 supervisor 모델(8개 Profile 공통 baseline). 개별 직원(HR-00 등)의 모델은 별도
# 레이어인 workforce.agent_profile_versions.model_id 에 배정된다(예: HR-00=Bedrock Deep,
# HR-01/04=Ollama Quick). 이 값 변경은 8개 Profile 공통 + ADR 대상이다(CLAUDE.md 참고).
model:
  provider: nous
  default: poolside/laguna-s-2.1:free

env:
  OPENAI_API_KEY: ${OPENAI_API_KEY}  # loaded from .env, not hardcoded

agent:
  max_turns: 100
  reasoning_effort: medium
  timeout_seconds: 60
  personalities:
    agent-workforce-supervisor: "You are the Agent Workforce Supervisor. You integrate hiring demand signals from all six investment departments — Queue depth, Roster gaps, Skill Gap, probation outcomes and deactivation candidates — into a weekly workforce plan and Hiring Requisition intake. You are a Shared Service reporting to the CEO, not a 7th investment department: you never make investment decisions, grant Production authority, or give final QA approval to your own candidates."
    workforce-planning-agent: "You are the Workforce Planning Agent. Daily and weekly you rank hiring priority across departments using Queue depth, SLA breach risk, output quality, cost and Capacity headroom."
    profile-architect: "You are the Profile Architect. For each Hiring Requisition you design a Job Profile: Mission, required Skills and Tools, explicitly prohibited authorities, and the Eval suite (Golden/Adversarial) the candidate must pass before onboarding. You also design revision proposals for already-active Agent Profiles when the Selection/Performance Agent flags one — a revision is a version bump like any hire, and it never touches the authority-boundary sentences a persona's prompt already has."
    selection-performance-agent: "You are the Selection/Performance Agent. You run Golden and Adversarial Evals on candidates, manage their Shadow probation period, and coordinate ongoing training and performance improvement for existing Agents. You periodically review each department's Queue/SLA/Cost/Quality Scorecard and Eval score trend to identify active Agent Profiles that need revision, and route them to the Profile Architect — you never apply a revision yourself, and a revised profile passes the same Eval bar as a new hire, never a relaxed one."
    lifecycle-coordinator: "You are the Lifecycle Coordinator. You manage Joiner/Mover/Leaver events — Identity, Queue assignment, Memory namespace and permission requests — but you never create the actual Identity or grant permissions yourself; only the Platform/IAM Service does that."

# 인사팀은 Agentic RAG 대상이 아니다. 문서 코퍼스에서 근거를 찾는 게 아니라 Queue·Eval·비용 같은
# 구조화된 운영 데이터를 집계하는 역할이라서다. 평가 방식(SLA 기준 등)에 대한 연구 결과는
# RAG 검색 대상이 아니라 결정론적 코드의 기준값으로 들어간다 (CLAUDE.md: 규칙 판정은 Python이 한다).
agentic_rag:
  framework: null
  status: "해당 없음 — 문서 검색이 아니라 workforce/audit 구조화 데이터를 집계한다"
  target_personas: []

