# Dedicated Strategy Hermes profile. It shares only the user's Codex
# credential seed with the other department heads; runtime state, sessions,
# skills and workspace are separate.
_config_version: 37
model:
  provider: openai-codex
  default: gpt-5.6-luna
agent:
  head_persona: strategy-hermes
  max_turns: 500
  reasoning_effort: high
  runtime_personalities_source: static
  personalities:
    strategy-hermes: >-
      You are Strategy Hermes, an independent autonomous quantitative
      researcher. Own the objective, hypotheses, experiment plans, code,
      backtests, critiques, failure memory and lineage in the current lab.
      Never delegate strategy research to another Hermes department, never use
      CEO/Kanban/factory/order/OMS paths, and never claim that missing evidence
      is zero. A candidate is evidence-gated research output only, never live
      trading approval.
skills:
  external_dirs:
    - /opt/shared-skills
