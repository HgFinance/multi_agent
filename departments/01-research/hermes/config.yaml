mcp_servers:
  research:
    url: http://research-mcp:8037/mcp
    headers:
      Authorization: Bearer ${MCP_RESEARCH_API_KEY}
    enabled: true
    # 이 주소는 배포된 Streamable HTTP MCP 정본이다. Hermes의 HEAD/GET
    # 사전 점검은 서버에 불필요한 세션을 만든 뒤 버려, 재연결 때 세션
    # 누수와 Session not found를 키웠다. 실제 MCP 핸드셰이크가 정본이므로
    # 중복 왕복은 생략하고, 세션이 오래 유휴 상태가 되지 않게 60초마다
    # 가볍게 확인한다.
    skip_preflight: true
    keepalive_interval: 60
  # LS 증권 조회면 (2026-08-13) - TR 카탈로그 검색 + 수급 큐레이션.
  # 키는 ls-mcp 컨테이너에만 있다(2026-08-02 자격 격리 결정 유지).
  ls-securities:
    url: http://ls-mcp:8038/mcp
    headers:
      Authorization: Bearer ${MCP_RESEARCH_API_KEY}
    enabled: true
    skip_preflight: true
    keepalive_interval: 60
  # OpenBB 도구 200+ - ⚠ 2026-08-13 비활성: OpenBB 의 get_prompt/list_resources
  # 등 도구명이 Hermes 생성 유틸리티와 충돌, 에이전트 spawn 크래시 실측(x2).
  # 백로그: 이름 prefix 설정 또는 Hermes 측 회피 확인 후 재활성.
  openbb:
    url: http://openbb-mcp:8039/mcp
    enabled: false
  # 2026-08-13 가동 시도 -> 의존성 부패로 기동 실패 (youtube: mcp 라이브러리
  # FastMCP import 깨짐, paper: 재시작 루프). 죽은 서버를 켜두면 에이전트마다
  # 연결 대기가 생기므로 끈다. 백로그: uvx 버전 고정 후 재시도.
  # 2026-08-25 재일: HTTP 컨테이너는 존재한 적이 없고, 띄워도 크래시 루프다
  # (이 패키지는 stdio 서버라 transport/port 인자를 무시하고 즉시 끝난다).
  # uvx stdio 로 물리고 켠다. 실측: search_crossref 정확, read_arxiv_paper 는
  # 본문 전체를 준다. search_arxiv 와 search_semantic 은 쓰지 않는다.
  # 일반 웹 검색. 부서 정본 research.web.search 는 구현이 Tavily 인데 키가
  # 빈 값이라 죽어 있다(2026-08-25 실측). Exa 는 키가 필요 없고, 키워드가
  # 아니라 찾는 페이지를 서술하면 된다.
  exa:
    url: https://mcp.exa.ai/mcp
    enabled: true
  paper-search:
    command: uvx
    args: [paper-search-mcp]
    enabled: true
  # YouTube transcript remains disabled until its upstream package is
  # compatible with the pinned MCP runtime. Do not point a profile at a
  # resident HTTP container: the package is stdio-only and the old service
  # definition exited or crashed during startup.
scout_operations:
  mode: resident_scheduled
  cadence:
    methodology-scout-academic:
      per_day: 1
      note: arXiv·저널 발행 주기가 하루 1회
    methodology-scout-practitioner:
      per_day: 1
      note: 서한·운용사 코멘터리는 더 느리다
    methodology-scout-community:
      per_day: 3
      note: 포럼·영상은 빠르게 돈다(8시간 간격)
    methodology-scout-crossdomain:
      per_week: 2
      note: 물량이 적고 탐색적이다
  budget_per_call:
    queries: 3
    hits_per_query: 15
  funnel_targets:
    snippet_screen_pass_rate: 0.15
    fulltext_screen_pass_rate: 0.2
    evidence_to_plan_rate: 0.1
    editor_reads_per_day: 5
    plans_per_week: 3
throughput_controls:
  editor_queue_max: 20
  quant_queue_max: 10
  query_cooldown_hours: 72
  dry_rounds_before_rotation: 3
  topic_cooldown_hours: 24
worker_model_tier_research:
  local:
  - methodology-scout-academic
  - methodology-scout-practitioner
  - methodology-scout-community
  - methodology-scout-crossdomain
  - market-context-worker
  head:
  - experiment-planner-worker
  - competing-explanation-worker
  - holdings-analyst-worker
  daily_head_token_cap: 300000
skills:
  external_dirs:
    - /opt/shared-skills
  # Strategy objectives are owned by the separate strategy-hermes profile.
  # This Research HQ profile must not expose autonomous/runner.py as an
  # executable strategy-research surface.
head_runtime:
  runtime: hermes
  role: department_head
  provider_choices:
  - openai-codex
  - anthropic-claude-code
  active_provider: openai-codex
  active_model: gpt-5.6-luna
  model_source: model
  responsibility: synthesize_worker_context_and_escalate
  binding_decision: false
staff_registry:
  head_count: 1
  # 검증 준비 자리 1(competing-explanation) + 서비스 자리 1(holdings-analyst).
  # 방법론 스카우트는 본부장이 겸한다 - 웹 도구가 본부장에만 있어서 워커로는
  # 조사가 성립하지 않는다.
  worker_count: 2
  default_execution_count: 1
  max_execution_count: 8
  active_worker_count: 2
  conditional_worker_count: 7
  runtime_persona_source: workers
  legacy_personas_are_aliases: false
  legacy_personas:
    source: agent.personalities
    runtime: compatibility_only
    excluded_from_worker_count: true
employee_runtime:
  executor: langgraph
  topology: async_fan_out_fan_in_independent_graphs
  worker_graph_module: departments/01-research/employee_workers.py
  provider: vllm-openai
  model_env: WORKER_MODEL_NAME
  model_default: qwen2.5-14b-instruct-awq
  base_url_env: WORKER_MODEL_BASE_URL
  model_profile: qwen-awq-v1
  adapter_registry: departments/01-research/config/worker_model_registry.json
  model_selection:
    active_model: qwen2.5-14b-instruct-awq
    candidate_source: worker_model_registry + qwen-awq-v1 benchmark artifacts
    selection_policy: fixed_until_worker_benchmark_and_quality_gate_approved
    quality_gate: FinanceBench_HOLD; serving_only
    matrix_document: docs/02-engineering/WORKER_MODEL_MATRIX.md
  output_contract: research.worker-context.v1
  max_retries: 2
  max_attempts: 3
  # Strategy Hermes owns the independent strategy lab; Research HQ has no
  # binding-decision or strategy-runner ownership here.
  binding_decision_owner: null
  failure_action: HOLD_ESCALATE
workers:
  competing-explanation-worker:
    role: Competing explanation and falsification analyst
    status: conditional
    trigger: proposal_draft
    tools:
    - research.outcomes.read
    - research.evidence.search
    output: competing_explanation
  # 공장 흐름이 아니라 **서비스 흐름**의 자리다. 포트폴리오 자문 화면
  # (`/ui/portfolio-recommendations`)이 부르는 유일한 리서치 워커라, 빼면 그
  # 화면의 리서치 구간이 "0개 Worker 결과"로 조용히 빈다. 도구가 읽기 API 라
  # 로컬 모델로도 성립한다 - 방법론 스카우트를 본부장에 올린 근거(웹 도구가
  # 본부장에만 있음)가 이 워커에는 해당하지 않는다.
  holdings-analyst-worker:
    role: Portfolio holdings question-answering analyst
    status: conditional
    trigger: holding_question
    tools:
    - research.evidence.search
    - research.news.read
    - research.market_snapshot.read
    output: holding_brief
