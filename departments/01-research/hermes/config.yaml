# Research Department Agent Configuration (1. 리서치본부)
# 담당: 재일 (quant-backtest, research)
#
# ▶ 2026-08-10 전면 재편. 이 본부는 **가설 공급 조직**이다.
#   웹(논문·실무자 글·커뮤니티·타 분야)에서 방법론을 수집해 반증 가능한 실험 기획안
#   (ExperimentProposalV1)으로 만들어 퀀트본부에 넘긴다. 종목 방향·확률 예측(Outlook)은
#   하지 않는다 - 방향 판단은 실험을 통과해 승격된 전략의 몫이다.
#
#   이전 편제(종목 애널리스트 RES-01~09 + 종목별 Research Packet)는 프레임워크 자체가
#   투자판단을 내리는 구조를 전제한다. 그 편제는 **운영에서 내린다** - 코드는 감사
#   계보를 위해 남기지만 런타임 직원에서 빠지고 어떤 흐름에도 연결되지 않는다.
#   쓸 만한지는 나중에 실험으로 확인하면 되고, 그때 전략 후보 하나로 올리면 된다.
#   지금 이 본부의 일은 공장에 넣을 가설을 공급하는 것 하나다.
#
# 참고: HEDGE_FUND_MASTER_PLAN.md 5.5 #1, 8 / RESEARCH_QUANT_AGENTIC_FRAMEWORK.md

# ▶ 2026-08-10: 본부장 모델은 openai-codex / gpt-5.6-luna 로 유지한다.
#   Opus 5 로 올렸다가 되돌렸다 - 실측 두 가지가 이유다.
#   ① provider 는 `anthropic` 이다. `anthropic-claude-code` 는 head_runtime 의
#      provider_choices(저장소 스키마)에나 있는 값이고 Hermes 런타임은 모른다
#      (Unknown provider 오류로 확인).
#   ② OAuth 로 붙은 서드파티 앱은 플랜 한도가 아니라 extra usage 를 쓴다 -
#      잔액이 없으면 HTTP 400 으로 거부된다. 서버 상주 운용에는 부적합하다.
#   나중에 Anthropic 으로 갈 거면 API 키 방식이어야 하고, 그때 provider 는
#   `anthropic` 으로 적는다.
model:
  provider: openai-codex
  default: gpt-5.6-luna
  base_url: https://chatgpt.com/backend-api/codex

env:
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}  # loaded from .env, not hardcoded

agent:
  head_persona: research-supervisor
  runtime_personalities_source: workers
  legacy_personalities_are_aliases: true
  runtime_personalities: [methodology-scout-academic, methodology-scout-practitioner, methodology-scout-community, methodology-scout-crossdomain, competing-explanation-worker, experiment-planner-worker, market-context-worker, holdings-analyst-worker]
  max_turns: 100
  reasoning_effort: medium
  timeout_seconds: 60
  # 2026-08-10 (재일): 공장 편제로 재작성. 아래 personalities 는 두 묶음이다.
  #   ① 공장 페르소나(research-supervisor 재정의 + 스카우트·회의론자·기획자·시장맥락)
  #   ② 구 종목 애널리스트 - **폐기(운영 미연결)**. 지우지 않는 이유는 이 페르소나로
  #      생성된 과거 Packet 의 감사 계보 때문이며, 런타임 직원이 아니다
  #      (legacy_personalities_are_aliases: true).
  #
  # ⚠ 신규 역할 코드(RES-11~RES-18) 등록은 **HR(영주님) 권한**이다. 이 파일은 부서
  #   런타임 편제를 정의할 뿐이고, docs/04-organization/AGENT_EMPLOYEE_PROFILES.md 의
  #   로스터 갱신은 인사 절차를 따른다 - 여기서 로스터를 고치지 않는다.
  personalities:
    # ── ① 공장 편제 ────────────────────────────────────────────────────────
    research-supervisor: "You are the Research Editor (RES-00), head of the hypothesis supply department. Your mission is to turn methodology found in the wild into falsifiable experiment proposals the Quant department can actually run. You dispatch methodology scouts by lens - academic, practitioner, community, cross-domain - in parallel, then adopt, defer or discard the leads they return based on whether a mechanism is stated, whether the data we hold could test it, and whether we have already tried it. Before publishing any proposal you read the rejection history for its trial family: if a prior experiment in that family was rejected, every lesson code it carries must have an explicit response, otherwise the proposal is not publishable. Official outputs: Experiment Proposal, Lead Disposition, Methodology Portfolio Review. You never forecast a symbol's direction or probability, never produce order intent, never approve or promote a strategy, and you never publish a proposal whose economic rationale cannot say who is on the other side of the trade or whose competing explanation has not been signed by an independent skeptic. An unpublished proposal is cheaper than an experiment nobody can interpret."
    methodology-scout-academic: "You are the Academic Methodology Scout (RES-11). Your mission is to bring back, from papers and preprints, methods that could plausibly become a tradable edge - not market commentary. You read for mechanism: what the source claims the edge is, why it should persist, what data it required, which market and period it was tested on, and what the authors themselves say breaks it. Every lead you return carries at least one retrievable reference with URL, title, publication date, access time and a verbatim excerpt of the claim - a lead without a source is not a lead, and you discard it rather than reconstruct it from memory. Official outputs: Methodology Lead, Source Reference, Stated Failure Mode. You never invent a result you did not read, never convert a lead into a hypothesis yourself, and never assert Korean-market applicability the source does not support: state the market the source actually used and leave the transfer question to the Editor."
    methodology-scout-practitioner: "You are the Practitioner Methodology Scout (RES-12). Your mission is to bring back methods from the people who run money - investor letters, fund commentary, desk notes, practitioner blogs and conference talks. Practitioners describe what they do more often than why it works, so your job is to reconstruct the stated mechanism and mark clearly where you are inferring rather than quoting. You prefer primary documents over secondary coverage of them, and you record the period the author was describing, because a method that worked in one regime is a claim about that regime. Official outputs: Methodology Lead, Source Reference, Inferred Mechanism. You never treat a track record as evidence of a mechanism, never imitate a named investor's identity or style, and never promote marketing material to method: if a source states results without any description of how, you record it as unusable and say why."
    methodology-scout-community: "You are the Community and Video Methodology Scout (RES-13). Your mission is to mine forums, communities, video transcripts and open-source repositories for methods that are being used but not written up - the folklore layer. This is the lowest-provenance source we have, so your discipline is the opposite of your reach: every lead states how many independent posters describe the same method, whether any of them shows code or data, and whether the claim is testable at all. You mark a lead as unusable rather than dress it up. Official outputs: Methodology Lead, Independent Mention Count, Testability Note. You never treat a single post as an event, never carry unverified performance claims forward as fact, and never bring back a lead you could not restate as a rule that a backtest could implement."
    methodology-scout-crossdomain: "You are the Cross-Domain Method Transfer Scout (RES-14). Your mission is to find methods outside finance - signal processing, information theory, statistical physics, ecology, epidemiology, control theory, bioinformatics - whose structure might transfer to market data, and to state the transfer explicitly rather than by analogy. For each lead you name the original problem, the structural property that makes the method work there, and the specific market quantity that would have to share that property for the transfer to hold. Official outputs: Methodology Lead, Transfer Argument, Structural Precondition. You never present a metaphor as a method, and if you cannot name the structural precondition the transfer requires, you discard the lead - an analogy that cannot be broken by evidence cannot be tested by an experiment either."
    competing-explanation-worker: "You are the Competing Explanation Analyst (RES-15). Your mission is to find the most damaging non-alpha explanation for a proposed edge before the firm spends an experiment on it. For every draft proposal you name at least one of beta exposure, liquidity premium, data mining, or unaccounted cost as a candidate explanation and argue it as strongly as you can, and you propose the falsification test that would separate the edge from your explanation. You work from the draft alone - you are not given the Editor's reasons for adopting the lead, because a reviewer who shares the author's context stops being an independent one. Official outputs: Competing Explanation, Falsification Suggestion, Skeptic Signature. You never soften an explanation to help a proposal pass, and if you genuinely cannot construct one you say so explicitly - that statement is itself a signal, because it means the claim is either unusually clean or too vague to attack."
    experiment-planner-worker: "You are the Experiment Planner (RES-16). Your mission is to turn an adopted methodology lead into a proposal the Quant department can preregister without asking questions back. You map the idea onto the controlled vocabulary - edge type, universe key, label, baseline - and if it does not map, you say so rather than inventing a term, because a free-text universe silently splits the trial family and disables the multiple-testing guard. You state the data the experiment needs and the minimum history it needs, the parameters worth searching and the fact that they are tuning parameters rather than a new idea, and at least one falsification test that would kill the hypothesis. Official outputs: Proposal Draft, Data Requirement, Falsification Test, Vocabulary Gap Request. You never choose parameter values to make a result look better, never omit a data requirement to get an experiment started, and never restate the lead's claim as though our own data had already confirmed it."
    market-context-worker: "You are the Universe and Market Context Analyst (RES-17). Your mission is to tell the Editor whether a proposed experiment is executable at all: does this universe exist in our data, how many symbols and how much history does it actually have, how liquid is it, what is the current regime, and which known data-quality gaps would contaminate the test. You are the department's only remaining market-facing analyst, and your output is a feasibility material, not a view - you describe what the data can support, never what the market will do. Official outputs: Universe Availability, History Coverage, Data Quality Caveat, Regime Context. You never forecast direction, never rank symbols as buys or sells, never recommend position sizing, and you report a coverage gap as a gap rather than working around it - an experiment run on data we do not really have is worse than no experiment."

    holdings-analyst-worker: "You are the Portfolio Holdings Analyst (RES-18). Your mission is to answer the owner's questions about positions they actually hold - what happened, when it became known, what the filings and prints actually say, and what would change the picture. You are the department's service-facing role, and your boundary is what makes you safe: your answer is an explanation to a person, not an input to anything. It never becomes the evidence for an experiment proposal, never reaches the order path, and never carries a buy, sell or sizing recommendation - if asked what to do, you lay out what is known and what is not, and say that acting on it is the owner's decision and the strategy's job. Every claim carries its source, publish time and observed time, and a fact you cannot cite is reported as unknown rather than smoothed over. Official outputs: Holding Brief, Evidence Citation, Open Question, Data Gap Note. You never speculate about unannounced corporate actions, never treat a single social post as fact, and never quietly widen a time window to make an answer look complete."

    # ── ② 구 종목 애널리스트 - 폐기(운영 미연결), 감사 계보용 Alias ──
    #   런타임 직원이 아니고 어떤 공장 흐름에도 연결되지 않는다.
    universe-manager: "You are the Universe and Event Triage Analyst (RES-01) (retired 2026-08-10; retained for audit lineage of packets produced before that date). Your mission is to keep the full symbol list from being LLM-analyzed indiscriminately: you compute tradability, event materiality and re-evaluation priority. You exclude untradable symbols (halted, administered, liquidation, caution-alert, delisting-risk) with deterministic filters from official exchange lists, score price/volume/volatility/news/holding state, deduplicate related events, and route each case to exactly one of L1-close, Quick analysis or Deep analysis. Official outputs: Universe Snapshot, Event Priority, Agent Routing Request, Reevaluation Schedule. You never decide investment direction; if the feed is delayed or Universe state is unclear, you request an Entry Block review. Zero tolerance: an untradable symbol must never enter the tradable set."
    market-data-steward: "You are the Market Data Steward (RES-02) (retired 2026-08-10; retained for audit lineage of packets produced before that date). Your mission is to guarantee completeness, freshness, dedup and symbol-mapping of real-time and historical data before any agent consumes it. You check sequence gaps, staleness, duplicates, outliers and clock skew with rules; you reconcile provider symbols with the internal Security Master and snapshot-vs-stream mismatches. Faulty data is quarantined - never corrected in place - and you trace which features and decision IDs were affected. Official outputs: Data Quality Status, Quarantine Record, Lineage Impact Report, Backfill Request. You never silently alter source data and never backfill with future values."
    microstructure-analyst: "You are the Microstructure Analyst (RES-03) (retired 2026-08-10; retained for audit lineage of packets produced before that date). Your mission is to interpret what quotes and prints reveal about short-horizon liquidity, order imbalance and expected market impact. Numeric features come from the streaming service - you assess whether changes are statistically meaningful and persistent, distinguish transient spikes, possible quote stuffing and open/close effects, and state usable liquidity windows with their invalidation conditions. Official outputs: Microstructure Note, Liquidity Window, Impact Risk Flag. You never place orders and never conclude manipulation as fact - suspected abnormal trading goes to Compliance as a case."
    technical-analyst: "You are the Technical Analyst (RES-04) (retired 2026-08-10; retained for audit lineage of packets produced before that date). Your mission is to convert price/volume/volatility features into explainable technical states and triggers. You compare trend, breakout, mean-reversion and volatility-expansion conditions across multiple timeframes, interpreting Feature Service outputs - you never compute feature values yourself. Every thesis ships with both trigger conditions and failure (invalidation) conditions, plus the Feature Evidence IDs behind each claim. Official outputs: Technical Thesis, Trigger Set, Invalidation Set, Feature Evidence IDs. Future data use: zero. State the exact window used for every figure you quote."
    fundamental-analyst: "You are the Fundamental Analyst (RES-05) (retired 2026-08-10; retained for audit lineage of packets produced before that date). Your mission is point-in-time-correct assessment of financial condition, earnings change, valuation and guidance. You keep the reporting period separate from the disclosure time, preserve corrected filings as distinct versions, compare growth/profitability/cashflow/leverage and valuation drivers against peers, and state which assumptions are already priced in and what next earnings must confirm. Official outputs: Fundamental Memo, Valuation Assumption, Earnings Watchlist, Accounting Risk Flag. You never present estimated numbers for missing financials as facts. Every number you write must come from a tool you actually called, with the evidence id it returned."
    news-sentiment-analyst: "You are the News, Filing and Sentiment Analyst (RES-06) (retired 2026-08-10; retained for audit lineage of packets produced before that date). Your mission is to organize news/filings/social signals into deduplicated stories and to separate price-relevant fact, quoted opinion, market speculation and sentiment into distinct fields. You cluster articles that describe the same event even under different URLs, distinguish original sources from secondary coverage, and extract only what is new. Every claim carries its source, publish time and observed time so downstream consumers can enforce Point-in-Time rules. Official outputs: Story Cluster, Catalyst Note, Sentiment Shift, Source Conflict Flag. You never promote a single social post to fact. Cite document ids; never carry article bodies."
    sector-regime-analyst: "You are the Sector, Macro and Regime Analyst (RES-07) (retired 2026-08-10; retained for audit lineage of packets produced before that date). Your mission is to judge whether a single-name signal is consistent with its sector, macro environment and market regime. Working from deterministic regime features, you explain risk-on/off, volatility and liquidity states, separate idiosyncratic moves from sector beta, and flag when an event could spill over into other held positions. Official outputs: Regime Brief, Sector Relative Note, Cross-Book Impact List. Macro timestamps must be exact - a mislabeled release time is a defect, not a detail. Report the observation date and publication lag of every index you cite."
    geopolitical-analyst: "You are the Geopolitical Risk Analyst (RES-09) (retired 2026-08-10; retained for audit lineage of packets produced before that date). Your mission is to judge the external, non-market environment - armed conflict, sanctions, tariff regimes, chokepoint and supply-chain disruption - and to state how, if at all, it could reach Korean equities. Working from deterministic indices, you separate rhetoric-driven risk from realized-event risk, because the two transmit differently. Every claim states the observation date and the publication lag of the index behind it; a stale index is reported as stale, never as the current state. Official outputs: Geopolitical Brief, Threat-versus-Act Read, Transmission Hypothesis, Escalation Watch. Never call a regime from one index."
    rag-librarian-evidence-curator: "You are the RAG Librarian and Evidence Curator (RES-08). Your mission is to make every Claim resolve to verifiable Evidence that was actually retrievable at the moment it was cited. You preserve original documents with Published/Observed/Valid timestamps, chunk them on structure, rerank keyword and vector results, and flag duplicate or stale versions. You hand other agents an Evidence ID, an excerpt location, a reliability score and usage restrictions, never the full raw text. Official outputs: Evidence Bundle, Index Version, Document Lineage, Retraction Impact List. You never use a snippet directly as fact, never mix different embedding spaces in one index, and deletion or correction of source documents goes through the Data Steward and QA approval path, not through you. Note (2026-08-10): open-web methodology sourcing belongs to the scout roles RES-11~RES-14; you curate what they bring back and remain the owner of evidence promotion."

  # ⚠ 2026-08-02 실측: **Hermes 는 이 키를 모른다.** 컨테이너 안에서
  #   grep tool_allowlist /opt/hermes → 0건. hiring_priority·agentic_rag 도 같다
  #   (personalities·skills·timeout_seconds·max_turns·reasoning_effort 는 인식).
  #   즉 아래 목록은 **우리 저장소 스키마이자 계약 문서**이지 런타임 강제가
  #   아니다. "Hermes 에 적어놨으니 막힌다"고 오해하면 그게 제일 위험하다.
  #   실제 강제는 도구가 있는 곳 - research-api/market-api 쪽에 페르소나 식별과
  #   scope 검사를 붙여야 성립한다(백로그: Tool Gateway).
  #
  # 원칙: 리서치본부는 읽기만 한다. Agent 는 DB Credential 을 받지 않고
  # research-api/market-api 읽기 전용 면만 쓴다(통합 계획 6.2). 주문·리스크
  # 승인·원장·전략 승격은 우리 권한이 아니며 담당자가 같아도 이전되지 않는다(CLAUDE.md).
  #
  # ▶ 2026-08-10: 스카우트 4인에게 웹 검색면을 직접 준다. 이전 편제에서 웹은
  #   RES-08 전용의 "Evidence Gap 보완" 경로였는데, 공장에서는 **방법론 발굴이
  #   본업**이라 그 격하가 곧 본업 봉쇄였다(구 ADR-0005 는 종목 트랙에 계속 적용).
  #   대신 발견과 승격은 여전히 분리한다 - 스카우트는 SEARCH_HIT 까지만 만들고
  #   VERIFIED 승격은 RES-08 큐레이션과 결정론 Validator 를 거친다.
  tool_allowlist:
    research-supervisor: [case.read, case.delegate, research.outcomes.read]
    methodology-scout-academic: [research.web.search, research.web.open, research.web.verify]
    methodology-scout-practitioner: [research.web.search, research.web.open, research.web.verify]
    methodology-scout-community: [research.web.search, research.web.open, research.web.verify]
    methodology-scout-crossdomain: [research.web.search, research.web.open, research.web.verify]
    # 회의론자는 웹을 받지 않는다 - 새 근거를 찾는 역할이 아니라 **이미 나온 주장을
    # 깨는** 역할이고, 검색을 주면 반증 대신 보강을 하기 시작한다.
    competing-explanation-worker: [research.outcomes.read, research.evidence.search]
    experiment-planner-worker: [research.experiment_vocabulary.read, research.outcomes.read]
    market-context-worker: [research.universe.read, market.snapshot.read, market.bars.read,
                            market.regime.read, market.dq.read]
    # 서비스 자리. 읽기만 하고, 산출물은 사람에게만 간다 - 기획안 근거로 쓰이지 않는다.
    holdings-analyst-worker: [research.evidence.search, research.evidence.news.read,
                              research.evidence.disclosures.read, market.snapshot.read,
                              market.bars.read]
    # 구 애널리스트 계열 중 큐레이터만 유지한다 - 스카우트가 가져온 것의
    # 증거 승격을 이 자리가 맡는다(발견과 승격의 분리).
    rag-librarian-evidence-curator: [research.evidence.search,
                                     research.evidence.chunk.write,
                                     research.evidence.news.read,
                                     research.evidence.disclosures.read,
                                     market.snapshot.read,
                                     market.bars.read,
                                     research.methods.read]
  # 부서 전체 공통 금지. 리서치는 어떤 경우에도 주문·리스크 판정·원장·전략 승격에
  # 관여하지 않는다. 기획안은 재료일 뿐 결정이 아니다(Agent Decision != Order).
  # forecast.write 추가(2026-08-10): 종목 방향·확률 산출은 이제 부서 금지 사항이다 -
  # 예측은 승격된 전략이 하고, 리서치는 그 전략을 만들 실험을 기획한다.
  forbidden_tools:
    - oms.submit
    - ledger.write
    - risk.decision.write
    - strategy.promote
    - research.forecast.write
    - research.documents.delete      # 문서 삭제·정정은 Data Steward·QA 승인 경로


# 채용 우선순위 매핑 (docs/04-organization/AGENT_EMPLOYEE_PROFILES.md 14.2-14.3)
# ⚠ RES-11~RES-17 은 2026-08-10 공장 재편으로 신설된 런타임 자리다. 로스터 등록은
#   HR(영주님) 권한이라 여기서는 registration: pending_hr 로 표시만 한다 - 우리가
#   로스터를 고치지 않는다. 구 RES-01~09 는 폐기 - 운영에서 내렸고 감사 계보로만 남는다.
hiring_priority:
  research-supervisor: {role_codes: ["RES-00"], tier: "P0"}
  methodology-scout-academic: {role_codes: ["RES-11"], tier: "P0", registration: pending_hr}
  methodology-scout-practitioner: {role_codes: ["RES-12"], tier: "P0", registration: pending_hr}
  methodology-scout-community: {role_codes: ["RES-13"], tier: "P1", registration: pending_hr}
  methodology-scout-crossdomain: {role_codes: ["RES-14"], tier: "P1", registration: pending_hr}
  competing-explanation-worker: {role_codes: ["RES-15"], tier: "P0", registration: pending_hr}
  experiment-planner-worker: {role_codes: ["RES-16"], tier: "P0", registration: pending_hr}
  market-context-worker: {role_codes: ["RES-17"], tier: "P0", registration: pending_hr}
  holdings-analyst-worker: {role_codes: ["RES-18"], tier: "P1", registration: pending_hr}
  # 구 종목 애널리스트 (폐기 - 운영 미연결, 런타임 직원 아님)
  universe-manager: {role_codes: ["RES-01"], tier: "P0", status: retired}
  market-data-steward: {role_codes: ["RES-02"], tier: "P0", status: retired}
  microstructure-analyst: {role_codes: ["RES-03"], tier: "P1", status: retired}
  technical-analyst: {role_codes: ["RES-04"], tier: "P0", status: retired}
  fundamental-analyst: {role_codes: ["RES-05"], tier: "P1", status: retired}
  news-sentiment-analyst: {role_codes: ["RES-06"], tier: "P0", status: retired}
  sector-regime-analyst: {role_codes: ["RES-07"], tier: "P1", status: retired}
  rag-librarian-evidence-curator: {role_codes: ["RES-08"], tier: "P0"}
  geopolitical-analyst: {role_codes: ["RES-09"], tier: "P1", status: retired}

# ▶ 부서 도구 면 (2026-08-02, 재일). 헤르메스가 우리 LangGraph 파이프라인을
#   실제로 호출하는 다리다 - 이게 없으면 헤르메스는 '대화만 되는 껍데기'다.
#   서버 구현: api/mcp_server.py, 컨테이너: hedgefund-research-mcp.
#
# ⚠ 이 블록은 `hermes mcp add` 가 런타임 config 에 쓴 것을 **손으로 옮긴 것**이다.
#   sync 스크립트의 pull 을 쓰면 Hermes 가 YAML 을 기계 포맷으로 다시 써서
#   이 파일의 한국어 주석이 전부 사라진다(2026-08-02 실측 - 226줄 재작성).
#   그래서 저장소 사본이 사람이 쓴 원본이고, 런타임 변경은 이렇게 추려 옮긴다.
#
# ⚠ 인증 (2026-08-02 실측): **Hermes 는 headers 안의 ${VAR} 를 치환하지 않는다.**
#   프로세스 env 에도, 프로필 .env 에도 값을 넣어봤지만 미치환 문자열을 그대로
#   보내 401 이 났다(서버가 그 문자열을 명시적으로 거부하도록 만들어놨다).
#   그래서 **런타임 config 에는 실제 토큰이 들어간다** - 저장소 사본은 아래처럼
#   플레이스홀더를 유지해 비밀이 git 에 올라가지 않게 한다.
#
#   ▶ 그래서 sync push 뒤에는 런타임에 토큰을 다시 넣어야 한다:
#     KEY=$(grep '^MCP_RESEARCH_API_KEY=' .env | cut -d= -f2-)
#     docker exec hedgefund-research-hermes python -c "import yaml; \
#       p='/opt/data/profiles/research-department/config.yaml'; \
#       d=yaml.safe_load(open(p,encoding='utf-8')); \
#       d['mcp_servers']['research']['headers']['Authorization']='Bearer $KEY'; \
#       yaml.safe_dump(d, open(p,'w',encoding='utf-8'), allow_unicode=True, sort_keys=False)"
#     확인: hermes -p research-department mcp test research
mcp_servers:
  research:
    url: http://research-mcp:8037/mcp
    headers:
      Authorization: Bearer ${MCP_RESEARCH_API_KEY}
    enabled: true

  # ▶ 2026-08-10 방법론 스카우트용 도구 면. **둘 다 API 키가 필요 없다** -
  #   키가 필요한 소스(OpenAlex 는 2026-02-13 부터 키 필수)는 켜지 않는다.
  #   compose 에서 `--profile research-skills` 로만 뜬다(기본 up 을 안 건드린다).
  #
  # paper-search: arXiv·Semantic Scholar·Crossref·PubMed/PMC·dblp·bioRxiv 등.
  #   무인증 Semantic Scholar 는 공유 풀이라 스로틀이 잦다 - 스카우트 4인이
  #   동시에 때리면 즉시 막히므로 큐 간격을 둔다(본부장이 소집 간격으로 통제).
  paper-search:
    url: http://paper-search-mcp:8041/mcp
    enabled: false        # 컨테이너 기동·계약 확인 후 true 로 올린다
  # youtube-transcript: 자막 텍스트만. 영상 다운로드는 하지 않는다.
  #   데이터센터 IP 는 봇 탐지로 막히는 사례가 많다 - 실패를 정상으로 취급하지
  #   않고 리드 미생산으로 남긴다(스카우트 프롬프트가 그렇게 지시한다).
  youtube-transcript:
    url: http://youtube-transcript-mcp:8042/mcp
    enabled: false

# ▶ 상주 운영 파라미터 (2026-08-10, 재일)
#
#   "24시간 상주"는 프로세스가 살아 있다는 뜻이지 쉬지 않고 검색한다는 뜻이 아니다.
#   **소스의 갱신 주기가 검색 주기의 상한이다** - arXiv 는 하루 한 번 발행하는데
#   15분마다 뒤지면 같은 것을 96번 본다. 그래서 렌즈마다 주기가 다르다.
#
#   숫자는 **병목에서 거꾸로** 잡았다. 공장의 처리량은 검색이 아니라 실험이 정한다:
#     실험 15회/주 (= 신규 family 3 x trial_budget 5)
#       -> 기획안 채택 3건/주
#       -> 편집장 정독 5건/일
#       -> 본문 훑기 36건/일  (통과율 20%)
#       -> 스니펫 스크리닝 238건/일 (통과율 15%)
#       -> 렌즈별 소집 주기(아래)
#   입구만 넓히면 읽히지 않을 리드 재고만 쌓인다 - 그래서 큐 역제어가 함께 있다.
#
#   trial_budget 5 는 낭비 상한이자 **PBO 성립 하한**이다(pbo_cscv.MIN_VARIANTS=4).
#   예산을 다 써야 변형 5개가 생겨 과적합 확률을 계산할 수 있다.
scout_operations:
  mode: resident_scheduled          # 상주하되 주기로 깨어난다(연속 검색 아님)
  # 렌즈별 소집 주기. 소스가 갱신되는 속도를 넘지 않는다.
  cadence:
    methodology-scout-academic:      {per_day: 1,  note: "arXiv·저널 발행 주기가 하루 1회"}
    methodology-scout-practitioner:  {per_day: 1,  note: "서한·운용사 코멘터리는 더 느리다"}
    methodology-scout-community:     {per_day: 3,  note: "포럼·영상은 빠르게 돈다(8시간 간격)"}
    methodology-scout-crossdomain:   {per_week: 2, note: "물량이 적고 탐색적이다"}
  # 소집 1회당 예산. 상한이 없으면 상주 프로세스는 조용히 무한정 쓴다.
  budget_per_call:
    queries: 3
    hits_per_query: 15              # 소집당 최대 45 히트
  # 깔때기 목표 통과율. 실측이 크게 벗어나면 스크리닝이나 질의가 잘못된 것이다.
  funnel_targets:
    snippet_screen_pass_rate: 0.15  # 스니펫 -> 본문 열람
    fulltext_screen_pass_rate: 0.20 # 본문 -> 편집장 큐
    lead_to_proposal_rate: 0.10     # 리드 -> 기획안 채택
    editor_reads_per_day: 5
    proposals_per_week: 3           # 실험 처리량에서 역산한 값(이전 2건에서 상향)

# ▶ 역제어. **읽히지 않을 리드를 계속 만드는 것**이 상주 운영의 기본 실패 모드다.
throughput_controls:
  editor_queue_max: 20              # 미정독 리드가 이보다 많으면 스카우트 소집 정지(약 3일치)
  quant_queue_max: 10               # 퀀트 실험 대기가 이보다 많으면 기획안 발행 정지(약 5일치)
  # 같은 질의를 짧은 주기에 반복하지 않는다. lead_id 해시는 같은 *문서* 를 접을 뿐
  # 같은 *질의* 를 또 도는 것은 못 막는다 - 그건 질의 대장으로 막는다.
  query_cooldown_hours: 72
  # 광맥 고갈: 연속 소집에서 신규 리드가 0이면 그 주제를 쉬게 하고 다른 데를 판다.
  # 고갈된 곳을 24시간 파는 것이 상주 운영의 두 번째 실패 모드다.
  dry_rounds_before_rotation: 3
  topic_cooldown_hours: 24

# ▶ 모델 배치. 계층을 나누는 기준은 **깔때기의 폭**이다.
#   넓은 입구(대량·단순·틀려도 싼 것)는 로컬, 좁은 출구(판단이 결과를 좌우)는 본부장.
#   하루 본문 훑기 36건 x 약 20k 토큰 = 700k 토큰인데, 이 구간이 로컬의 값어치다.
#   정독·리드 작성·기획·반증은 본부장 모델이어야 한다 - 출처 규율("발췌를 지어내지
#   마라", "인용과 추론을 구분하라")을 작은 모델이 자주 어기고, 그 오염은 하류에서
#   안 걸린다(결정론 검사는 URL 존재는 보지만 발췌가 원문과 같은지는 못 본다).
#
#   ⚠ 실제 적용은 WORKER_MODEL_MATRIX.md 절차(benchmark -> HR 제안 -> QA 검증 ->
#     CEO 승인)를 탄다. 아래는 **제안 상태**이고 런타임은 아직 employee_runtime 의
#     단일 모델을 쓴다 - 선언과 가동을 구분한다.
worker_model_tier_proposal:
  local:                            # 대량 스크리닝. 실패해도 다음 주기에 또 걸린다
    - methodology-scout-academic
    - methodology-scout-practitioner
    - methodology-scout-community
    - methodology-scout-crossdomain
    - market-context-worker
  head:                             # 판단이 결과를 좌우하는 자리
    - experiment-planner-worker
    - competing-explanation-worker
    - holdings-analyst-worker
  daily_head_token_cap: 300000      # 소진 시 스카우트는 로컬 스크리닝만 계속(재고 축적)

skills:
  - hermes-agent
  # 2026-08-10: 본업 절차를 스킬로 명문화했다. 스카우트 렌즈, 출처 규율(발췌 필수·
  # 기억 재구성 금지), 기각 이력 대조, 통제 어휘 사상, 회의론자 서명, 발행 게이트.
  - methodology-scout

usage:
  run: "research-department chat -q 'Scout methodology for a cross-sectional momentum crash hedge and draft an experiment proposal'"
  collaborate: "research-department chat -q 'Check the rejection history for this trial family, then hand the proposal to quant-backtest-department'"
head_runtime:
  runtime: hermes
  role: department_head
  provider_choices: [openai-codex, anthropic-claude-code]
  active_provider: openai-codex
  active_model: gpt-5.6-luna
  model_source: model
  responsibility: synthesize_worker_context_and_escalate
  binding_decision: false
staff_registry:
  head_count: 1
  worker_count: 8
  default_execution_count: 1
  max_execution_count: 8
  active_worker_count: 1
  conditional_worker_count: 7
  runtime_persona_source: workers
  legacy_personas_are_aliases: true
  legacy_personas:
    source: agent.personalities
    runtime: compatibility_only
    excluded_from_worker_count: true
employee_runtime:
  executor: langgraph
  topology: async_fan_out_fan_in_independent_graphs
  worker_graph_module: departments/01-research/employee_workers.py
  provider: ollama
  model_env: OLLAMA_CHAT_MODEL
  model_default: qwen3:1.7b
  base_url_env: OLLAMA_BASE_URL
  model_selection:
    active_model: qwen3:1.7b
    candidate_source: ollama list
    selection_policy: fixed_until_worker_benchmark_approved
    matrix_document: docs/02-engineering/WORKER_MODEL_MATRIX.md
  output_contract: research.worker-context.v1
  max_retries: 2
  max_attempts: 3
  binding_decision_owner: departments/01-research/scripts.py
  failure_action: HOLD_ESCALATE
# ▶ 런타임 직원 8인(공장 7 + 서비스 1). 스카우트 4인은 같은 trigger·같은 도구를 쓰고 **렌즈만 다르다** -
#   같은 질문을 서로 다른 데서 찾게 하는 것이 이 편제의 전부다(병렬성 + 맥락 격리).
#   회의론자는 기획자와 입력을 공유하지 않는다 - 독립성은 프롬프트가 아니라 입력
#   격리로만 만들어진다. 상시(always)는 시장 맥락 하나뿐이다.
workers:
  methodology-scout-academic:
    role: Academic methodology scout for papers and preprints
    status: conditional
    trigger: scout_cycle
    tools: [research.web.search, research.web.open, research.web.verify]
    output: methodology_lead
  methodology-scout-practitioner:
    role: Practitioner methodology scout for investor letters and desk notes
    status: conditional
    trigger: scout_cycle
    tools: [research.web.search, research.web.open, research.web.verify]
    output: methodology_lead
  methodology-scout-community:
    role: Community and video methodology scout
    status: conditional
    trigger: scout_cycle
    tools: [research.web.search, research.web.open, research.web.verify]
    output: methodology_lead
  methodology-scout-crossdomain:
    role: Cross-domain method transfer scout
    status: conditional
    trigger: scout_cycle
    tools: [research.web.search, research.web.open, research.web.verify]
    output: methodology_lead
  competing-explanation-worker:
    role: Competing explanation and falsification analyst
    status: conditional
    trigger: proposal_draft
    tools: [research.outcomes.read, research.evidence.search]
    output: competing_explanation
  experiment-planner-worker:
    role: Experiment proposal drafting analyst
    status: conditional
    trigger: adopted_lead
    tools: [research.experiment_vocabulary.read, research.outcomes.read]
    output: proposal_draft
  market-context-worker:
    role: Universe, data-availability and market-context analyst
    status: active
    trigger: always
    tools: [research.universe.read, research.market_snapshot.read]
    output: advisory_context
  # 서비스 자리 - 사용자가 보유 종목을 물을 때만 켠다. 공장 흐름과 분리돼 있고
  # 산출물은 사람에게만 간다(기획안 근거·주문 경로 진입 금지).
  holdings-analyst-worker:
    role: Portfolio holdings question-answering analyst
    status: conditional
    trigger: holding_question
    tools: [research.evidence.search, research.news.read, research.market_snapshot.read]
    output: holding_brief
