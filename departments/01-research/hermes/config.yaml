    tier: P1
    registration: pending_hr
  universe-manager:
    role_codes:
    - RES-01
    tier: P0
    status: retired
  market-data-steward:
    role_codes:
    - RES-02
    tier: P0
    status: retired
  microstructure-analyst:
    role_codes:
    - RES-03
    tier: P1
    status: retired
