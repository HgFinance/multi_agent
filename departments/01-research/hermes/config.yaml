mcp_servers:
  research:
    url: http://research-mcp:8037/mcp
    headers:
      Authorization: Bearer ${MCP_RESEARCH_API_KEY}
    enabled: true
  paper-search:
    url: http://paper-search-mcp:8041/mcp
    enabled: false
  youtube-transcript:
    url: http://youtube-transcript-mcp:8042/mcp
    enabled: false
scout_operations:
  mode: resident_scheduled
  cadence:
    methodology-scout-academic:
      per_day: 1
      note: arXiv·저널 발행 주기가 하루 1회
    methodology-scout-practitioner:
      per_day: 1
      note: 서한·운용사 코멘터리는 더 느리다
    methodology-scout-community:
      per_day: 3
      note: 포럼·영상은 빠르게 돈다(8시간 간격)
    methodology-scout-crossdomain:
      per_week: 2
      note: 물량이 적고 탐색적이다
  budget_per_call:
    queries: 3
    hits_per_query: 15
  funnel_targets:
    snippet_screen_pass_rate: 0.15
    fulltext_screen_pass_rate: 0.2
    lead_to_proposal_rate: 0.1
    editor_reads_per_day: 5
    proposals_per_week: 3
throughput_controls:
  editor_queue_max: 20
  quant_queue_max: 10
  query_cooldown_hours: 72
  dry_rounds_before_rotation: 3
  topic_cooldown_hours: 24
worker_model_tier_proposal:
  local:
  - methodology-scout-academic
  - methodology-scout-practitioner
  - methodology-scout-community
  - methodology-scout-crossdomain
  - market-context-worker
  head:
  - experiment-planner-worker
  - competing-explanation-worker
  - holdings-analyst-worker
  daily_head_token_cap: 300000
skills:
- hermes-agent
- methodology-scout
usage:
  run: research-department chat -q 'Scout methodology for a cross-sectional momentum crash hedge and draft an experiment proposal'
  collaborate: research-department chat -q 'Check the rejection history for this trial family, then hand the proposal to quant-backtest-department'
head_runtime:
  runtime: hermes
  role: department_head
  provider_choices:
  - openai-codex
  - anthropic-claude-code
  active_provider: openai-codex
  active_model: gpt-5.6-luna
  model_source: model
  responsibility: synthesize_worker_context_and_escalate
  binding_decision: false
staff_registry:
  head_count: 1
  worker_count: 4
  default_execution_count: 1
  max_execution_count: 8
  active_worker_count: 1
  conditional_worker_count: 7
  runtime_persona_source: workers
  legacy_personas_are_aliases: true
  legacy_personas:
    source: agent.personalities
    runtime: compatibility_only
    excluded_from_worker_count: true
employee_runtime:
  executor: langgraph
  topology: async_fan_out_fan_in_independent_graphs
  worker_graph_module: departments/01-research/employee_workers.py
  provider: ollama
  model_env: OLLAMA_CHAT_MODEL
  model_default: qwen3:1.7b
  base_url_env: OLLAMA_BASE_URL
  model_selection:
    active_model: qwen3:1.7b
    candidate_source: ollama list
    selection_policy: fixed_until_worker_benchmark_approved
    matrix_document: docs/02-engineering/WORKER_MODEL_MATRIX.md
  output_contract: research.worker-context.v1
  max_retries: 2
  max_attempts: 3
  binding_decision_owner: departments/01-research/scripts.py
  failure_action: HOLD_ESCALATE
workers:
  methodology-scout-academic:
    role: Academic methodology scout for papers and preprints
    status: conditional
    trigger: scout_cycle
    tools:
    - research.web.search
    - research.web.open
    - research.web.verify
    output: methodology_lead
  methodology-scout-practitioner:
    role: Practitioner methodology scout for investor letters and desk notes
    status: conditional
    trigger: scout_cycle
    tools:
    - research.web.search
    - research.web.open
    - research.web.verify
    output: methodology_lead
  competing-explanation-worker:
    role: Competing explanation and falsification analyst
    status: conditional
    trigger: proposal_draft
    tools:
    - research.outcomes.read
    - research.evidence.search
    output: competing_explanation
  holdings-analyst-worker:
    role: Portfolio holdings question-answering analyst
    status: conditional
    trigger: holding_question
    tools:
    - research.evidence.search
    - research.news.read
    - research.market_snapshot.read
    output: holding_brief
