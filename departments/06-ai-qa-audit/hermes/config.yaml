    - "Incident Timeline/Corrective Action (DoD 10번) — FACT/INFERENCE 분리 기록, Timeline은 occurred_at 순 재현. Corrective Action은 OPEN→IN_PROGRESS→VERIFYING→COMPLETED만 허용하고 담당자 본인이 스스로 검증·종료 못 함(QA 검증 후 Close 불변식)"
