# QA Department Agent Configuration (6. AI QA/감사본부)
# 담당: 동규 (risk, qa)
# LLM 환각·근거 검증, 전략/모델 재현성, 권한분리·Audit Finding 추적, Agent/Feed 운영 모니터링을 담당하는 6개 본부 전체 대상 독립 감사 부서
# 참고: HEDGE_FUND_MASTER_PLAN.md 5.5 #6, 5.6, 8, 9.1
# 타임아웃 문제 해결: 로컬 데이터 우선 사용
# 현재 역할 경계(2026-08-03): QA는 Evidence QA, Hallucination, Model/Internal Audit,
# Ops/Permission, Incident 검증을 소유한다. Policy RAG와 Risk 개인 DB는 Risk 범위다.
# PIKE-RAG/Light-RAG는 전사 적용 완료가 아니라 corpus·평가셋 준비 후 검토할 후보 기술이다.

model:
  provider: openai-codex
  default: gpt-5.6-luna
  base_url: https://chatgpt.com/backend-api/codex

# 부서장은 Hermes가 담당하며 Codex를 기본으로 사용하고 Claude Code를 승인된 대체 경로로 둔다.
# 부서장 서술은 Worker Context를 종합·에스컬레이션할 뿐 결정론적 QA Engine을 대체하지 않는다.
head_runtime:
  runtime: hermes
  role: department_head
  provider_choices: [openai-codex, anthropic-claude-code]
  active_provider: openai-codex
  active_model: gpt-5.6-luna
  model_source: model
  responsibility: synthesize_worker_context_and_escalate
  binding_decision: false

env:
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}  # loaded from .env, not hardcoded

agent:
  head_persona: qa-audit-supervisor
  runtime_personalities_source: workers
  legacy_personalities_are_aliases: true
  runtime_personalities: [evidence-qa-worker, hallucination-critic-worker, model-and-internal-audit-worker, ops-and-permission-worker, incident-postmortem-worker]
  max_turns: 100
  reasoning_effort: high
  timeout_seconds: 60  # 개별 명령어 타임아웃
  personalities:
    qa-audit-supervisor: "You are the Chief AI Quality and Audit Officer. Based on Case severity you call the Evidence QA, Hallucination Critic, Permission, Model Risk or Internal Audit specialists, and you set each Finding's severity, impact, owner, due date and block condition. The deterministic Evidence QA Engine (departments/06-ai-qa-audit/evidence/evidence_qa_engine.py) holds the actual gate — your job is interpreting and escalating its PASS/WARN/FAIL decisions, not producing them yourself. You hold the gate regardless of pressure from the department whose output is under review, and you integrate the department's specialists into one QA position for the CEO. You never modify operational data, submit orders, change Risk Limits, or close your own Finding unilaterally; any material Finding goes to the CEO and the responsible control owner at the same time."
    evidence-qa-agent: "You are the Evidence QA Agent. For every critical decision you link each claim in a decision or report to its source document, verify publish and observed timestamps against Point-in-Time rules, check citation accuracy, and flag any claim that lacks complete, traceable evidence. The 8-step check order and PASS/WARN/FAIL decision are computed by departments/06-ai-qa-audit/evidence/evidence_qa_engine.py — you interpret and explain its ClaimCheck results, you do not judge citations from memory."
    hallucination-critic: "You are the Hallucination Critic. On every agent output you detect hallucination, hidden uncertainty presented as fact, internal contradictions and tool misuse, by comparing each claim against the evidence the originating agent actually retrieved. Prefer already-available data over new external API calls, and do not block on an external call that could time out. UNSUPPORTED and CONTRADICTED claim results (departments/06-ai-qa-audit/evidence/evidence_qa_engine.py) are your primary signal — treat them as findings to escalate, not as something you second-guess with your own judgment."
    model-risk-agent: "You are the Model Risk Agent. During research and deployment cycles you independently verify the reproducibility of model, prompt, dataset and Strategy Release versions, and confirm a Challenger strategy's backtest results can be reproduced from its declared inputs before it is allowed toward Production."
    internal-audit-agent: "You are the Internal Audit Agent. On an ongoing and periodic basis you track separation-of-duties violations, risk overrides, ledger corrections and Audit Finding status across all six departments, and escalate anything left unresolved."
    agent-ops-monitor: "You are the Agent Ops Monitor. At all times you monitor error rate, latency and cost across agents, feeds, queues and model servers, and raise Incident Evidence when a department's operational health degrades. Threshold breaches and Incident severity (SEV4-SEV1) are computed by departments/06-ai-qa-audit/audit/ops_health_monitor.py — you narrate and route its output, you do not decide severity yourself."
    tool-permission-security-reviewer: "You are the Tool Permission and Security Reviewer. You check that each Agent's Tool, data, Fund and environment permissions match its Job Profile and that separation of duties holds — detecting out-of-allowlist Tool calls, cross-department Memory access, Production credential use, and anyone holding both approval and execution authority for the same action. You periodically verify that role changes and deactivated Agents have had their permissions revoked. You never expand your own permissions or print a Secret value; a suspicious call gets that Identity isolated and reported to the department head, not quietly logged."
    incident-postmortem-agent: "You are the Incident and Postmortem Analyst. You reconstruct the factual timeline of outages, bad decisions, bad trades and data incidents, separating what was actually observed from what is inferred. You classify root causes as technical, data, model, procedural or authorization-related, and you propose guardrails and tests rather than relying on human attentiveness alone. You never attribute blame to one Agent or person without evidence, and any incident with capital or regulatory impact goes to the CEO, Risk and Compliance immediately."

  # docs/04-organization/AGENT_EMPLOYEE_PROFILES.md 2.2절 <domain>.<resource>.<verb> 표기를 따른다.
  # 경로-Tool 매핑과 "누가 무엇을 호출하는지"는 RISK_QA_DOMAIN_API_SPEC.md 3.9절을 그대로 옮긴 것 —
  # 새로 지어낸 권한이 아니다. departments/06-ai-qa-audit/api/app.py가 실제로 감싸는 엔드포인트만 대상.
  # `/qa/v1/runs/*`(3.3절 Trace 기록)는 QA 자신이 아니라 6개 본부 Supervisor 전원이 호출하는 부서간
  # 공통 진입점이라 이 부서 tool_allowlist엔 없다 — 각 호출 부서 config.yaml에 넣을 몫이라 범위 밖.
  tool_allowlist:
    qa-audit-supervisor: [case.read, case.delegate]  # risk-supervisor와 같은 패턴 — 하위 결과 종합·해석만
    evidence-qa-agent: [case.read, qa.case.check, qa.evidence.check]
      # qa.case.check(POST qa-check)는 3.1절 [제안] — MINIMUM_SERVICE_UNIT_SPEC.md §8/§11에 아직 미등록,
      # 팀 승인 전까지 그 상위 문서는 안 고친다. 엔진 코드·API는 이미 동작하고 self-check도 통과함.
    hallucination-critic: [case.read]  # 3.9절: qa-check 결과(UNSUPPORTED/CONTRADICTED) 재사용, 자체 호출 없음
    model-risk-agent: [case.read, qa.model_risk.evaluate]
      # model_risk.py(ModelRiskEngine)·API(/qa/v1/model-risk/evaluate)·harness/manifest.py SkillSpec 전부 존재,
      # 단위·계약 테스트(tests/test_p1_reviews.py, tests/test_p1_api.py) 통과함(2026-08-03 확인). scripts.py
      # Legacy persona note: current execution is the independent Worker registry below.
    internal-audit-agent: [case.read, qa.internal_audit.evaluate]
      # internal_audit.py(InternalAuditEngine)·API(/qa/v1/internal-audit/evaluate)도 동일하게 이미 존재·테스트
      # Legacy persona note: current execution is the independent Worker registry below.
    agent-ops-monitor: [case.read, qa.ops.evaluate]
    tool-permission-security-reviewer: [case.read, qa.tool_permission.check, qa.tool_permission.unauthorized_count.read]
    incident-postmortem-agent:
      [case.read, qa.incident.event.write, qa.incident.timeline.read, qa.corrective_action.open,
       qa.corrective_action.start, qa.corrective_action.submit_for_verification,
       qa.corrective_action.verify_and_close, qa.corrective_action.cancel]
      # extract-hypergraph(3.8절)는 [제안]·미구현이라 제외
  # 부서 전체 공통 금지 — 주문 제출/원장 기록/Risk Limit·Kill Switch 실행은 QA의 권한이 아니다
  # (CLAUDE.md: QA는 근거 검증·감사만, 바인딩 집행은 절대 대신하지 않는다).
  forbidden_tools: [oms.submit, ledger.write, risk.limit.write, risk.trading_state.write, risk.trading_state.clear]

# 검색-평가-생성-환각검증-재검색 루프가 필요한 페르소나만 LangGraph 기반 Agentic RAG 적용 대상
# baseline은 risk-management의 compliance-policy-agent부터 구현됨 (skills/agentic-rag/, 코드는 risk/qa 공용)
# evidence-qa-agent는 corpus/evidence/ 추가 + main.py PERSONA_CORPUS 등록으로 확장 완료(2026-07-30, 샘플
# placeholder 데이터로 grounded 검증). hallucination-critic도 evidence-qa-agent의 corpus/evidence/를
# 그대로 재사용해 확장 완료(2026-08-02, scripts.py의 조건부 노드 hallucination_review - UNSUPPORTED/
# CONTRADICTED로 이미 플래그된 claim만 대상, 판정을 뒤집지 않고 유형 분류·인용 근거만 덧붙인다).
agentic_rag:
  framework: langgraph
  status: "hallucination-critic까지 확장됨 (skills/agentic-rag/, corpus/evidence/ SAMPLE_PLACEHOLDER)"
  target_personas:
    - evidence-qa-agent      # 구현됨 — Document RAG / Fact Store 근거를 검색해 주장-출처를 연결
    - hallucination-critic   # 구현됨 — evidence-qa-agent 코퍼스 재사용, UNSUPPORTED/CONTRADICTED claim만 대조해 환각 유형 분류

# 2026-07-30 기법 배정 결정 (동규님, "내 부서에 한해서만" 범위) — 아직 미구현인 항목도 기록만 해둔다.
# 판단 기준: 검색-근거-생성 루프면 Agentic RAG(+LightRAG 백엔드 후보), 관계/계보가 그래프 형태로 이미
# 존재하면 Neo4j, N항(n-ary) 원인-결과 관계처럼 이항 그래프로 못 담는 구조면 Hypergraph.
rag_technique_assignment:
  evidence-qa-agent:
    technique: agentic_rag
    status: implemented
    note: "skills/agentic-rag/ --persona evidence-qa-agent. corpus/evidence/ 검색 -> grade -> generate -> hallucination_check. 최종 PASS/WARN/FAIL은 evidence_qa_engine.py가 결정, 이 RAG는 근거 인용용 보조 도구."
    # 2026-07-30 GraphRAG 계열(PIKE-RAG/LightRAG/Hyper-RAG/Cog-RAG) 검토 — corpus/evidence/가
    # SAMPLE_PLACEHOLDER 3건뿐인 지금은 전부 오버엔지니어링(CLAUDE.md 개발원칙 8번: 기존 스택으로
    # 못 푸는 문제가 있어야 새 Library 도입). 실 데이터가 들어왔을 때만 아래 단계를 순서대로 검토한다 —
    # 단계를 건너뛰고 바로 상위 단계로 가지 않는다.
    upgrade_path:
      - stage: "1단계 — PIKE-RAG L1 기법 부분 도입 (그래프 DB 불필요, retriever.py만 확장)"
        techniques: "Enhanced Chunking(청크 경계 넘어 앞 청크 요약 이어붙이기), Auto-tagging(구어체 질의 <-> 전문용어 corpus 격차 메우기), Multi-Granularity Retrieval(문서 전체 층 + 청크 층 동시 검색)"
        trigger: "corpus/evidence/가 실제 Research Packet Evidence Store로 교체되고(종목당 여러 문서 x 다수 종목), 청크 경계 손실이나 전문용어-질의 불일치로 인한 grounded=false 재시도가 실측으로 늘어날 때"
      - stage: "2단계 — LightRAG Dual-level(Entity-level + Summary-level) 백엔드 전면 교체"
        techniques: "retriever.py의 search() 인터페이스(DocumentChunk in, list[ScoredChunk] out)만 유지하면 nodes.py는 무수정 교체 가능"
        trigger: "1단계로도 recall이 부족하고, 기업-경영진-딜-공급망-규제기관처럼 여러 문서를 가로지르는 실제 엔티티 관계가 반복적으로 나타나 벡터 검색만으로 놓치는 사례가 실측으로 확인될 때"
      - stage: "3단계 — Hyper-RAG(N-ary Hypergraph) 검토"
        techniques: "1개 이벤트가 3개 이상 엔티티에 동시에 걸리는 경우(예: 인수합병 - 인수자/피인수자/규제기관/대주단)를 이항 그래프로 못 담을 때"
        trigger: "2단계까지 반영한 뒤에도 N항 관계 손실로 인한 오탐/누락이 실측으로 확인될 때 — 지금은 근거 없음, 셋 중 가장 검증 안 된 기법이라 최후순위"
  hallucination-critic:
    technique: agentic_rag
    status: implemented
    note: "skills/agentic-rag/ --persona hallucination-critic, corpus/evidence/ 재사용(신규 코퍼스 없음). departments/06-ai-qa-audit/scripts.py의 hallucination_review 노드 - evidence_qa_engine.py가 UNSUPPORTED/CONTRADICTED로 이미 플래그한 claim만 대상으로 호출, 판정 자체는 못 바꾸고 유형 분류(HALLUCINATION/OVERCONFIDENT_CLAIM/CONTRADICTION/TOOL_MISUSE)·인용 근거만 덧붙인다."
  model-risk-agent:
    technique: neo4j_knowledge_graph
    status: not_started
    note: "가장 적합 — audit.artifact_lineage(parent/child/relation_type)가 이미 그래프 형 스키마라 변환 비용이 낮음. Strategy/Model/Prompt/Dataset Version 간 재현성 계보 추적에 그래프 순회(Cypher)가 벡터 검색보다 자연스럽다."
  internal-audit-agent:
    technique: neo4j_knowledge_graph
    status: not_started
    note: "권한 분리 위반·Risk Override·원장 수정·Finding 간 관계도 그래프 형(누가-무엇을-언제-어떤 권한으로)이라 model-risk-agent와 같은 그래프 인프라를 공유할 수 있다. model-risk-agent 것이 검증된 뒤 스키마를 확장."
  incident-postmortem-agent:
    technique: hypergraph_hyper_extract
    status: not_started
    note: "장애 근본 원인은 보통 2개 이상 요인의 동시 조합(예: Feed 지연 + Threshold 오설정 + 승인 지연)이라 이항 관계(Neo4j edge)로는 정보 손실이 생긴다. Hyper-Extract 계열의 n-ary 관계 추출이 더 맞는 표현이지만 셋 중 가장 검증 안 된 기법이라 우선순위 최하."
    trigger: "incident_timeline.py로 기록된 실제 Incident/Corrective Action이 다년치 쌓이고(2026-07-30 기준 이번 세션 기록 몇 건뿐), 단일 원인이 아니라 2개 이상 요인이 동시에 겹치는 장애 패턴이 반복적으로 나타날 때만 검토. 그 전까지는 코드화하지 않는다 — baseline은 incident_timeline.py의 결정론적 FACT/INFERENCE 분리 기록으로 유지."
  # 나머지 QA 페르소나(qa-audit-supervisor, agent-ops-monitor, tool-permission-security-reviewer)는
  # 검색-근거 루프가 아니라 이미 구현된 결정론적 서비스의 해석/라우팅 역할이라 RAG 배정 대상이 아니다.

# 결정론적 서비스. LLM은 관련성 판단과 서술 작성에만 쓴다 - Schema, Citation, PIT, Threshold
# 판정은 이 두 모듈이 한다 (CLAUDE.md, 팀 가이드 7절 "LLM-as-a-Judge는 보조 신호다").
deterministic_services:
  harness_manifest: departments/06-ai-qa-audit/harness/manifest.py
  harness_preflight: departments/06-ai-qa-audit/harness/core.py
  harness_log_contract: departments/06-ai-qa-audit/harness/journal.py
  harness_replay: "RunJournal.replay(run_id, executor)"
  harness_review: "RunJournal.review(run_id)"
  orchestrator: "Hermes department profile: qa-department"
  employee_executor: "LangGraph employee node"
  harness_retry_policy: "all_skills_max_retries=2; max_attempts=3; final_failure=ESCALATE"
  harness_fallback: "ESCALATE + manual_review_required + trace_id + reason_code"
  evidence_qa_engine: departments/06-ai-qa-audit/evidence/evidence_qa_engine.py    # P0 Evidence QA Gate — 8단계 검사, PASS/WARN/FAIL, input_hash 재현성
  ops_health_monitor: departments/06-ai-qa-audit/audit/ops_health_monitor.py       # P0 Ops Threshold — HEALTHY/DEGRADED/CRITICAL, Incident 초안
  trace_recorder: departments/06-ai-qa-audit/audit/trace_recorder.py              # P0 Agent/Tool Trace 기록 — audit.agent_runs/tool_calls
  tool_permission_check: departments/06-ai-qa-audit/audit/tool_permission_check.py # Tool Allowlist 위반 탐지 — 결정론적 집합 소속 검사, LLM 없음
  incident_timeline: departments/06-ai-qa-audit/audit/incident_timeline.py        # Incident Fact/Inference Timeline, Corrective Action(QA 검증 후 Close)
  model_risk: departments/06-ai-qa-audit/model_risk.py                           # P1 Model/Prompt/Dataset 재현성 Threshold Gate — PASS/WARN/FAIL/ESCALATE
  internal_audit: departments/06-ai-qa-audit/internal_audit.py                   # P1 권한분리·금지 교차본부 행동(FORBIDDEN_CROSS_DOMAIN_ACTIONS) 탐지 — PASS/ESCALATE

implementation:
  runtime_activation:
    as_of: "2026-08-04"
    worker_registry: "5 canonical LangGraph workers seeded as ACTIVE by 20260804000400"
    qa_check_contract: "approved_v1; RISK_QA_RUNTIME is fail-closed when unset; production still requires QA_CHECK_CONTRACT_APPROVED=true"
    policy_corpus: "corpus status endpoint and pgvector retriever implemented; SAMPLE_PLACEHOLDER remains fail-closed"
    operational_trace: "QA_TRACE_PERSIST=true enables ACTIVE-profile agent_runs/tool_calls bridge"
    production_readiness: "real policy documents, embeddings, DATABASE_URL and applied migrations remain deployment prerequisites"
    current_status: "code_and_unit_tests_ready_external_runtime_activation_pending; scope_and_command_auth_regressions_verified_2026-08-05"
  # The historical implementation notes below are retained for audit context.
  # Current runtime status is defined by implementation.runtime_activation above.
  status: "Sprint K2 P0 완료. P1 결정론적 Model-Risk·Internal-Audit 검사기/API·QA 운영 Trace RLS baseline 구현. scripts.py LangGraph 배선은 agent-ops-monitor·incident-postmortem-agent·tool-permission-security-reviewer까지 완료(2026-08-03, run_ops_incident_review/run_tool_permission_review); model-risk-agent·internal-audit-agent는 엔진/API/테스트만 있고 배선은 in_progress. 실제 정책 Corpus/pgvector 적재, qa-check 상위 계약 승인, ACTIVE Profile·운영 agent_runs/tool_calls·E2E 활성화는 외부 조건 대기"
  done:
    - "8단계 순서 검사 (Schema, Evidence 존재·권한, PIT, 숫자·단위 인용 일치, Fact/Inference 구분, 상충 근거, Tool 요약 변형, Unsupported Block)"
    - "Claim/Artifact/EvidenceChunk를 Pydantic으로 검증 — LLM 출력 신뢰 경계는 트레이딩본부 contracts.py와 같은 원칙 (CLAUDE.md 개발 원칙 2번)"
    - "근거 일부만 무효하면 PARTIAL(WARN), 전부 무효하거나 상충/변형이면 FAIL — 결과가 항상 판정을 낮추는 방향"
    - "UNSUPPORTED/CONTRADICTED Claim마다 Finding 자동 초안 생성 (원 작성 본부가 못 닫음)"
    - "QaAssessment에 calculation_version/input_hash 추가 — risk_engine.py와 같은 재현성 원칙 (DoD 2번)"
    - "Agent Ops Health Threshold (에러율/지연/비용) — Soft는 DEGRADED(SEV3), Critical은 CRITICAL(SEV2), 동시 Critical은 SEV1"
    - "Agent/Tool Trace 기록 (audit.agent_runs/tool_calls) — Run 멱등 시작, 미해결 Tool Call 있으면 Run 종료 차단(fail-closed), TIMED_OUT을 FAILED로 추정하지 않음"
