# 채용 우선순위 매핑 (docs/04-organization/AGENT_EMPLOYEE_PROFILES.md 14.2-14.3, 2026-07-29)
hiring_priority:
  evidence-qa-agent: {role_codes: ["QAA-01"], tier: "P0"}
  hallucination-critic: {role_codes: ["QAA-02"], tier: "P0"}
  model-risk-agent: {role_codes: ["QAA-04"], tier: "P1"}
  internal-audit-agent: {role_codes: ["QAA-06"], tier: "P1"}
  agent-ops-monitor: {role_codes: ["QAA-05"], tier: "P0"}
  qa-audit-supervisor: {role_codes: ["QAA-00"], tier: "P0"}
  tool-permission-security-reviewer: {role_codes: ["QAA-03"], tier: "P1"}
  incident-postmortem-agent: {role_codes: ["QAA-07"], tier: "P1"}
 # 2026-07-29 Profile 채용 기록은 감사·FK 호환용으로 보존한다. 현재 실행 직원은 아래 Worker Registry의 5개 Worker다.

skills:
  - hermes-agent
  - dogfood

usage:
  run: "qa-department chat -q 'Validate this trading signal'"
  collaborate: "qa-department chat -q 'Validate the signal and its cited evidence, then delegate risk assessment to risk-management'"

# 직원 실행 계층 v2. Hermes의 model은 부서장 전용이며 직원은 독립 LangGraph
# Worker Graph에서 Ollama Qwen을 사용한다.
staff_registry:
  head_count: 1
  worker_count: 5
  default_execution_count: 1
  max_execution_count: 5
  active_worker_count: 1
  conditional_worker_count: 4
  runtime_persona_source: workers
  legacy_personas_are_aliases: true
  runtime_personalities: [evidence-qa-worker, hallucination-critic-worker, model-and-internal-audit-worker, ops-and-permission-worker, incident-postmortem-worker]
  legacy_personas:
    source: agent.personalities
    runtime: compatibility_only
    excluded_from_worker_count: true

employee_runtime:
  executor: langgraph
  topology: async_fan_out_fan_in_independent_graphs
  worker_graph_module: departments/06-ai-qa-audit/qa_employee_workers.py
  provider: ollama
  model_env: OLLAMA_CHAT_MODEL
  model_default: qwen3:1.7b
  base_url_env: OLLAMA_BASE_URL
  model_selection:
    active_model: qwen3:1.7b
    candidate_source: ollama list
    selection_policy: fixed_until_worker_benchmark_approved
    matrix_document: docs/02-engineering/WORKER_MODEL_MATRIX.md
    change_control: benchmark_then_hr_and_qa_approval
  output_contract: qa.worker-context.v1
  max_retries: 2
  max_attempts: 3
  binding_decision_owner: departments/06-ai-qa-audit/evidence/evidence_qa_engine.py
  failure_action: ESCALATE

workers:
  evidence-qa-worker:
    role: Evidence and citation QA analyst
    status: active
    trigger: always
    replaces: [evidence-qa-agent]
    tools: [qa.evidence.check]
    output: advisory_context
  hallucination-critic-worker:
    role: Hallucination and contradiction critic
    status: conditional
    replaces: [hallucination-critic]
    trigger: when_unsupported_claim_exists
    tools: [qa.evidence.rag]
    output: advisory_context
  model-and-internal-audit-worker:
    role: Model risk and internal audit analyst
    status: conditional
    replaces: [model-risk-agent, internal-audit-agent]
    trigger: when_audit_input_exists
    tools: [qa.model_risk.evaluate, qa.internal_audit.evaluate]
    output: advisory_context
  ops-and-permission-worker:
    role: Agent operations and tool permission analyst
    status: conditional
    replaces: [agent-ops-monitor, tool-permission-security-reviewer]
    trigger: when_ops_input_exists
    tools: [qa.ops.evaluate, qa.tool_permission.check]
    output: advisory_context
  incident-postmortem-worker:
    role: Incident timeline and postmortem analyst
    status: conditional
    replaces: [incident-postmortem-agent]
    trigger: when_incident_exists
    tools: [qa.incident.record]
    output: advisory_context

